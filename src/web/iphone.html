      player.removeEventListener("loadedmetadata", onLoadedMetadata);
      player.removeEventListener("timeupdate", onTimeUpdate);
      // 注意：不暫停 `player`——音樂繼續在背景播放（見模組層級那段的
      // 說明）。畫面欄位清成 `null`，讓 `playByName` 等函式在分頁沒開著時
      // 正確跳過畫面更新。
      musicUi.fileList = null;
      musicUi.fileCount = null;
      musicUi.cover = null;
      musicUi.trackName = null;
      musicUi.nowPlayingFavBtn = null;
      musicUi.seekBar = null;
      musicUi.timeLabel = null;
      musicUi.lyricsEl = null;
      musicUi.updateNowPlaying = null;
    };
  }

  // 建立 ereader 分頁：跟 `player` 分頁一樣借用 `createListDetailView`
  // （書架用 `ld.listEl`，閱讀畫面用 `ld.detailBody`，返回按鈕直接用 `ld`
  // 內建那顆，不用自己另外做）。閱讀畫面是 `<iframe>` 直接指向 `GET
  // /api/ereader/book/{name}/resource/{章節內部路徑}`——這個端點的 URL
  // 路徑刻意跟 epub 內部路徑一樣（見 `src/plugins/ereader.rs` 的說明），
  // 章節 XHTML 裡原有的相對路徑（圖片/CSS/字型）瀏覽器會自動解析到對應的
  // `/resource/...` URL，完全不需要改寫 HTML 內容，直式書的
  // `writing-mode: vertical-rl` 因此也天然就會生效。跟桌面版/tablet 版的
  // `startEreader`/`startEreaderTab` 是同一套邏輯（各自一份程式碼，不共用
  // 模組）。
  function startEreaderTab(container) {
    const ld = createListDetailView(container);

    // `ld.listEl` 本身是 `flex:1; overflow:auto`（見 `.ld-list`），如果把
    // toolbar 跟書架清單直接兩個都當它的子元素、各自 overflow，會有兩層
    // 各自滾動的風險；跟 storage 分頁同一套做法：包一層 `height:100%` 的
    // flex column（`shelfWrap`）塞進 `ld.listEl`，裡面 toolbar 固定高度、
    // 書架清單 `flex:1` 自己滾動，`ld.listEl` 本身因為 `shelfWrap` 剛好
    // 填滿而不會再產生第二層卷軸。`renderShelf` 只清空 `shelf`（書架清單
    // 本身），toolbar 不會被重繪動作一起清掉。
    //
    // 「好讀下載」借用 `ld.detailBody`（本來給看書用的那個「詳細畫面」
    // 插槽）顯示一個內嵌 `<iframe>` 連到 haodoo.net（該站沒有擋
    // X-Frame-Options/CSP frame-ancestors，實測可以內嵌），返回鍵直接用
    // `ld` 內建那顆，跟看書畫面共用同一套返回邏輯。但好讀的下載按鈕是
    // `<input onClick="DownloadEpub(...)">`，不是普通連結，而且是跨網域
    // iframe，same-origin policy 完全不允許我們的 JS 讀取或監聽 iframe
    // 內部的點擊/網址變化，沒辦法做到「使用者在 iframe 裡按下載、我們自動
    // 攔截」。折衷做法：使用者在好讀裡找到書後把該書「詳細頁」的網址複製
    // 貼上到下面欄位（一般 `<a href>` 連結，iframe 裡右鍵一樣能複製連結
    // 網址），按下「下載」由後端（`crate::plugins::haodoo_import`）直接
    // 抓 epub 存進 `storage/ebooks/`，不用自己先存到本機再手動上傳一輪。
    // 「上傳電子書」保留給不是從好讀來的檔案，走本機檔案選擇 + fetch，跟
    // storage 分頁的上傳是同一套模式。
    const shelfWrap = document.createElement("div");
    shelfWrap.className = "ereader-shelf-wrap";
    const toolbar = document.createElement("div");
    toolbar.className = "ereader-shelf-toolbar";
    const haodooBtn = document.createElement("button");
    haodooBtn.textContent = "🌐 好讀下載";
    haodooBtn.title = "瀏覽好讀（haodoo.net），貼上書籍網址直接下載進書架";
    const uploadBtn = document.createElement("button");
    uploadBtn.textContent = "⬆ 上傳電子書";
    const uploadInput = document.createElement("input");
    uploadInput.type = "file";
    uploadInput.accept = ".epub";
    uploadInput.style.display = "none";
    uploadBtn.addEventListener("click", () => uploadInput.click());
    uploadInput.addEventListener("change", async () => {
      const file = uploadInput.files[0];
      if (!file) return;
      await fetch(`/api/ereader/upload/${encodeURIComponent(file.name)}`, { method: "POST", body: file });
      uploadInput.value = "";
      refreshShelf();
    });
    toolbar.appendChild(haodooBtn);
    toolbar.appendChild(uploadBtn);
    toolbar.appendChild(uploadInput);
    const shelf = document.createElement("div");
    shelf.className = "ereader-shelf";
    shelfWrap.appendChild(toolbar);
    shelfWrap.appendChild(shelf);
    ld.listEl.appendChild(shelfWrap);

    let stopped = false;
    let current = null; // { name, meta }

    function renderHaodoo() {
      ld.detailBody.innerHTML = "";
      const wrap = document.createElement("div");
      wrap.className = "ereader-haodoo";
      const bar = document.createElement("div");
      bar.className = "ereader-shelf-toolbar";
      const urlInput = document.createElement("input");
      urlInput.type = "text";
      urlInput.placeholder = "貼上好讀書籍詳細頁網址（https://haodoo.net/?M=book&P=...）";
      const verticalLabel = document.createElement("label");
      const verticalCheckbox = document.createElement("input");
      verticalCheckbox.type = "checkbox";
      verticalLabel.appendChild(verticalCheckbox);
      verticalLabel.appendChild(document.createTextNode(" 直式"));
      const downloadBtn = document.createElement("button");
      downloadBtn.textContent = "下載";
      const status = document.createElement("span");
      status.className = "ereader-haodoo-status";
      bar.appendChild(urlInput);
      bar.appendChild(verticalLabel);
      bar.appendChild(downloadBtn);
      bar.appendChild(status);
      const frameWrap = document.createElement("div");
      frameWrap.className = "ereader-haodoo-frame-wrap";
      const frame = document.createElement("iframe");
      frame.className = "ereader-haodoo-frame";
      frame.src = "https://haodoo.net/";
      frameWrap.appendChild(frame);
      wrap.appendChild(bar);
      wrap.appendChild(frameWrap);
      ld.detailBody.appendChild(wrap);

      downloadBtn.addEventListener("click", async () => {
        const url = urlInput.value.trim();
        if (!url) return;
        downloadBtn.disabled = true;
        status.textContent = "下載中…";
        try {
          const res = await fetch("/api/ereader/haodoo-import", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, vertical: verticalCheckbox.checked }),
          });
          if (res.ok) {
            const data = await res.json();
            status.textContent = `已加入書架：${data.name}`;
            urlInput.value = "";
            refreshShelf();
          } else {
            status.textContent = await res.text();
          }
        } catch (_err) {
          status.textContent = "下載失敗，確認網路連線後再試一次";
        } finally {
          downloadBtn.disabled = false;
        }
      });
    }

    haodooBtn.addEventListener("click", () => {
      current = null;
      renderHaodoo();
      ld.showDetail();
    });

    function renderShelf(books) {
      shelf.innerHTML = "";
      if (books.length === 0) {
        const empty = document.createElement("div");
        empty.className = "ereader-empty";
        empty.textContent = "(storage/ebooks/ 底下還沒有任何 .epub 檔案，用上面的「上傳電子書」加一本進來)";
        shelf.appendChild(empty);
        return;
      }
      for (const b of books) {
        const row = document.createElement("div");
        row.className = "ereader-book-row";
        const cover = document.createElement("img");
        cover.className = "ereader-book-cover";
        cover.src = `/api/ereader/book/${encodeURIComponent(b.name)}/cover`;
        cover.addEventListener("error", () => {
          cover.style.visibility = "hidden";
        });
        const info = document.createElement("div");
        info.className = "ereader-book-info";
        const title = document.createElement("div");
        title.className = "ereader-book-title";
        title.textContent = b.title;
        const author = document.createElement("div");
        author.className = "ereader-book-author";
        author.textContent = b.author || "";
        const progress = document.createElement("div");
        progress.className = "ereader-book-progress";
        progress.textContent = `${b.progress_percent}%`;
        info.appendChild(title);
        info.appendChild(author);
        info.appendChild(progress);
        row.appendChild(cover);
        row.appendChild(info);
        row.addEventListener("click", () => openBook(b.name));
        shelf.appendChild(row);
      }
    }

    async function refreshShelf() {
      if (stopped) return;
      try {
        const res = await fetch("/api/ereader/books");
        renderShelf(await res.json());
      } catch (_err) {
        // 這次沒抓到就算了，下一輪 poll 再試。
      }
    }

    function resourceUrl(name, href) {
      const encodedPath = href.split("/").map(encodeURIComponent).join("/");
      return `/api/ereader/book/${encodeURIComponent(name)}/resource/${encodedPath}`;
    }

    async function openBook(name) {
      try {
        const res = await fetch(`/api/ereader/book/${encodeURIComponent(name)}/meta`);
        if (!res.ok) return;
        current = { name, meta: await res.json() };
        renderReader();
        ld.showDetail();
      } catch (_err) {
        // 打不開就留在書架，不用特別報錯干擾畫面。
      }
    }

    // 章節內的分頁狀態：後端的章節內容已經被 `inject_pagination_style`
    // （見 `src/plugins/ereader.rs`）插入多欄排版 CSS，瀏覽器會自動把整章
    // 內容依視窗大小切成一頁一頁；這裡只負責「捲到第幾頁」跟「量出這一章
    // 總共幾頁」，不用自己計算怎麼分頁。跟桌面版/tablet 版的
    // `startEreader`/`startEreaderTab` 是同一套邏輯（各自一份程式碼，不
    // 共用模組）。
    let pageIndex = 0;
    let pageCount = 1;
    let pageStep = 1;
    let chapterVertical = false;
    let pageMarkers = null;
    let verticalPageTarget = null;
    let measurementToken = 0;
    let chapterLoadInFlight = false;
    let frameEl = null;
    let titleEl = null;
    let resizeObserver = null;
    let touchStartX = null;
    let suppressNextClick = false;

    // 字級調整：存在 `localStorage`（不是伺服器端），關掉分頁/重新整理
    // 瀏覽器都還記得上次調到多大，跟這本書、這一章都無關，是使用者對這個
    // 瀏覽器/裝置的個人偏好。
    const FONT_SCALE_STORAGE_KEY = "cng5-ereader-font-scale";
    const FONT_SCALE_MIN = 0.7;
    const FONT_SCALE_MAX = 2;
    const FONT_SCALE_STEP = 0.1;
    let fontScale = (() => {
      const stored = parseFloat(localStorage.getItem(FONT_SCALE_STORAGE_KEY));
      return Number.isFinite(stored) && stored >= FONT_SCALE_MIN && stored <= FONT_SCALE_MAX ? stored : 1;
    })();

    function pageWidth() {
      return (frameEl && frameEl.contentWindow && frameEl.contentWindow.innerWidth) || frameEl.clientWidth || 1;
    }

    // 章節每次都是全新的 iframe 文件（換章節等於整份文件重新載入），這裡
    // 先把「這份文件原本、還沒被我們動過」的字級記在 `body` 的
    // `data-` 屬性上（只在文件第一次套用時量一次），之後不管字級調整幾次
    // 都是以這個原始值為基準乘上目前的縮放倍率，不會因為連續調整而複合
    // 疊加（例如放大兩次不會變成 1.1 x 1.1，而是單純的 1 + 2 * 0.1）。
    function applyFontScale(doc) {
      const body = doc.body;
      if (!body) return;
      if (!body.dataset.cng5BaseFontSize) {
        const natural = parseFloat(doc.defaultView.getComputedStyle(body).fontSize);
        body.dataset.cng5BaseFontSize = String(Number.isFinite(natural) && natural > 0 ? natural : 16);
      }
      const base = parseFloat(body.dataset.cng5BaseFontSize);
      body.style.setProperty("font-size", `${base * fontScale}px`, "important");
    }

    // 字級改變會動到每行能放幾個字/欄裡能塞幾行，分頁邊界整個要重算——跟
    // 面板拖拉縮放大小是同一種情況，直接借用 `recomputeAfterResize`
    // 「保留目前讀到大概幾成的位置、重新分頁」那套邏輯，不用重複寫一次。
    function changeFontScale(delta) {
      const next = Math.min(FONT_SCALE_MAX, Math.max(FONT_SCALE_MIN, Math.round((fontScale + delta) * 10) / 10));
      if (next === fontScale) return;
      fontScale = next;
      localStorage.setItem(FONT_SCALE_STORAGE_KEY, String(fontScale));
      const doc = frameEl && frameEl.contentDocument;
      if (!doc || !doc.body) return;
      applyFontScale(doc);
      recomputeAfterResize();
    }

    function updateToolbarText() {
      if (!titleEl || !current) return;
      const { meta } = current;
      titleEl.textContent =
        `${meta.title} · 第 ${meta.current_chapter + 1}/${meta.spine.length} 章 · ` +
        `第 ${pageIndex + 1}/${pageCount} 頁 · ${meta.progress_percent}%`;
    }

    // 依 `writing-mode` 判斷這一章是橫式還是直式，套用完全不同的量測方式
    // （見 `measureHorizontalChapter`/`measureVerticalChapter` 各自的說明，
    // 兩者不能共用同一套邏輯——`inject_pagination_style` 對兩種書套用的
    // CSS 完全不同）。回傳 `{ pageStep, pageCount }`：`pageStep` 是捲一頁要
    // 移動多少像素，`pageCount` 是這一章總共幾頁。
    function measureChapter(doc) {
      const cs = doc.defaultView.getComputedStyle(doc.body);
      const writingMode = cs.writingMode || "";
      const vertical = writingMode.indexOf("vertical") === 0;
      const result = vertical ? measureVerticalChapter(doc) : measureHorizontalChapter(doc, cs);
      return Object.assign({ vertical }, result);
    }

    // 換頁/換章節/resize 之後捲到指定頁的共用邏輯：直式書不能用
    // `window.scrollTo()`/`scrollIntoView`——這兩個都是在操作
    // `document.scrollingElement`（通常是 `<html>`），但直式書真正溢位的
    // 元素是 `body`（`body` 自己被設成 `overflow:hidden`，它自己的內容比
    // 自己的版面寬，這個溢位是 `body` 自己局部的捲動範圍，不是傳到最外層
    // 視窗），橫式書能用 `window.scrollTo()` 是因為那是多欄排版
    // （`column-width`）的溢位，多欄排版的欄位溢位規則本來就會傳到最外層
    // 視窗，跟這裡的一般區塊排版溢位是不同機制——這是實測畫面截圖才抓到
    // 的：console 印出來的 `scrollX`／算出來的頁碼都對，畫面卻還是停在
    // 第一頁沒有動，代表 `window.scrollTo()` 根本沒捲到真正在溢位、真正
    // 決定畫面顯示什麼的那個元素。改成直接設 `body.scrollLeft`（順便也設
    // `documentElement.scrollLeft`，兩個都設，不用猜到底哪一個才是真正
    // 生效的那個）。量出標記目前實際顯示在畫面的哪個位置
    // （`getBoundingClientRect()`，這一定準，不受任何捲動座標系正負號慣例
    // 影響），量出「應該對齊到視窗右邊」（這是量出來的——整章一開始完全
    // 沒捲動過的預設狀態，內容右邊界本來就跟視窗右邊界切齊，見
    // `measureVerticalChapter` 的討論）的距離，套用那個差值；如果套用後
    // 方向反了（不同瀏覽器對 `scrollLeft` 正負號的慣例本來就不統一），再
    // 往反方向修正一次——全部基於量出來的相對距離，不假設任何特定瀏覽器的
    // 正負號慣例。橫式書維持原本用 `window.scrollTo()`（CSS 多欄排版本身
    // 保證欄界對齊整行，見 `measureHorizontalChapter` 的說明，而且已經
    // 確認橫式書這樣做是正確的）。
    function scrollToPage(doc, index) {
      if (chapterVertical) {
        const marker = pageMarkers && pageMarkers[index];
        if (marker) {
          const html = doc.documentElement;
          const body = doc.body;
          const setScroll = (value) => {
            html.scrollLeft = value;
            body.scrollLeft = value;
          };
          // 最後一頁不能比照其他頁「把標記對齊到 target」：實測過，這一頁
          // 剩下的內容常常不到一整頁寬，硬要把標記對齊到跟其他頁一樣的
          // 位置，會逼近（甚至超過）瀏覽器真正可以捲動的最大範圍，捲動
          // 幅度卡在半路就不再前進，導致這一章最後一小段內容整個露在畫面
          // 外看不到（不是分頁算錯，是捲動幅度不夠遠）。改成直接把
          // `body` 自己的左邊界（也就是整章真正結尾的位置）貼齊畫面左邊
          // （目標 0），這樣最後一頁永遠看得到整章結尾，代價最多是跟前一
          // 頁多疊一點點內容——寧可多看幾行重複，也不要漏掉結尾。
          const isLastPage = index === pageCount - 1;
          const target = isLastPage ? 0 : verticalPageTarget !== null ? verticalPageTarget : pageWidth();
          const readPos = () => (isLastPage ? body.getBoundingClientRect().left : marker.getBoundingClientRect().right);
          // 一次量測、套用就結束不夠準——實測連續兩頁之間會殘留幾行重複
          // 內容，代表捲動落點跟量出來的目標差了一點點（可能是瀏覽器剛
          // 套用捲動位置那一刻，geometry 還沒完全跟捲動同步）。改成反覆
          // 量測、修正最多幾次，每次都重新讀當下實際位置，直到誤差小到
          // 可以接受、或是已經修正到位置不再變化為止。
          for (let i = 0; i < 6; i++) {
            const before = readPos();
            const diff = before - target;
            if (Math.abs(diff) < 1) break;
            const startX = html.scrollLeft || body.scrollLeft || 0;
            setScroll(startX + diff);
            const after = readPos();
            if (Math.abs(after - before) < 0.5) {
              // 完全沒反應：這個正負號被夾住了（不同瀏覽器對 scrollLeft
              // 正負號慣例不一致），換相反方向再試一次。
              setScroll(startX - diff);
            }
          }
        }
        return;
      }
      doc.defaultView.scrollTo({ left: index * pageStep, top: 0 });
      // 防禦性補強：`window.scrollTo()` 操作的是 `document.scrollingElement`
      // （通常是 `<html>`），但實測抓到有些書的 `<html>` 自己完全沒有可
      // 捲動範圍（`scrollWidth` 等於 `clientWidth`），真正因為多欄排版而
      // 溢位、需要捲動的其實是 `body` 自己（`body` 自己就有
      // `overflow:hidden`，形成獨立、局部的捲動範圍，不會往外傳給
      // `<html>`）——這種情況下 `window.scrollTo()` 完全捲不動（陷面碼
      // 照樣往前算，畫面卻停在原地不動，翻到下一章才會變）。直接設
      // `body.scrollLeft`（同時也設 `html.scrollLeft`，以防某些書是後者
      // 才有效）。這裡驗證要讀 `body.scrollLeft` 本身，不能像量直式書那樣
      // 讀某個子元素的 `getBoundingClientRect()`——`body` 自己的
      // `getBoundingClientRect()` 反映的是它在外層（`<html>`）裡的位置，
      // 捲動 `body` 自己內部的內容並不會改變這個位置，之前這裡量錯元素，
      // 才會誤判成「怎麼設都沒反應」。
      const html = doc.documentElement;
      const body = doc.body;
      const target = index * pageStep;
      if (Math.abs(body.scrollLeft - target) > 0.5) {
        body.scrollLeft = target;
      }
      if (Math.abs(html.scrollLeft - target) > 0.5) {
        html.scrollLeft = target;
      }
    }

    // 橫式書：`inject_pagination_style` 插入的多欄排版 CSS 讓每一欄本來就
    // 剛好是一個畫面寬（`column-width: 100vw`），欄與欄的邊界一定落在整行
    // 文字的邊界上（多欄排版的換行機制保證），捲一頁固定是整個畫面寬
    // （`pageWidth()`），不需要額外取整。但「一欄裡塞了幾行」不保證剛好
    // 用滿整個畫面高，這裡要另外算出往下取整到整數倍行高的 `pageHeight`，
    // 設回 `<html>`/`<body>`（inline style 加 `!important`，蓋過
    // `inject_pagination_style` 插入的 `height: 100vh !important`，同源
    // `!important` inline style 的優先度比外部/內嵌樣式表高），不然版面
    // 最下面會卡進一行只露出上半截的文字。
    //
    // 算總共幾頁不能直接量已經分欄後的 `body.scrollWidth`：多欄排版遇到
    // 內容比一個畫面高時要「長」出額外欄位才能繼續往下排，這件事依賴
    // body 自己的寬度不能被釘死（見 `inject_pagination_style` 的說明），
    // 一旦欄位長不出來，`scrollWidth` 量到的永遠是「只有一頁」。改成暫時
    // 關掉多欄排版，量攤平單欄版面的 `scrollHeight`——這是最基本的區塊
    // 排版，不牽涉任何多欄溢位的實作細節，各瀏覽器算出來的數字完全一致，
    // 可靠得多；量完立刻把多欄排版接回來（`removeProperty` 讓
    // `inject_pagination_style` 插入的 stylesheet 規則重新生效），中間
    // 量測那一瞬間畫面會閃過一次單欄版面，但只有一個畫面更新週期，肉眼
    // 看不出來。
    // `line-height` 沒被書本身的 CSS 明確設成數字時（很多 epub 根本沒設這
    // 個屬性），`getComputedStyle` 回傳的是字面上的 `"normal"` 字串，不是
    // 解析過的像素數字，`parseFloat("normal")` 會得到 `NaN`，導致量測整個
    // 失敗、退回「當作只有一頁」——這正是直式書明明 `scrollWidth` 量得到
    // 一大堆內容、卻還是判斷成只有一頁的真正原因。用一個隱藏的探測元素撐
    // 出「一行文字」實際佔用的像素間接量出來：`writing-mode` 是會繼承的
    // 屬性，探測元素接在 `body` 底下自然套用同一份樣式，量橫式書要看它的
    // 高度、量直式書要看它的寬度（直式書的行進方向是垂直，一行文字佔用的
    // 是水平方向的寬度）。
    function resolveLineHeightPx(doc, cs, vertical) {
      const raw = parseFloat(cs.lineHeight);
      if (!Number.isNaN(raw) && raw > 0) {
        return raw;
      }
      const probe = doc.createElement("span");
      probe.textContent = "永";
      probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;margin:0;padding:0;border:0;";
      doc.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      probe.remove();
      return vertical ? rect.width : rect.height;
    }

    function measureHorizontalChapter(doc, cs) {
      const body = doc.body;
      const lineHeight = resolveLineHeightPx(doc, cs, false);
      const paddingTop = parseFloat(cs.paddingTop) || 0;
      const paddingBottom = parseFloat(cs.paddingBottom) || 0;
      const paddingLeft = parseFloat(cs.paddingLeft) || 0;
      const paddingRight = parseFloat(cs.paddingRight) || 0;
      const columnGap = parseFloat(cs.columnGap) || 0;
      const totalHeight = frameEl.clientHeight || 1;
      const usable = totalHeight - paddingTop - paddingBottom;
      // `column-width` 是 `box-sizing: border-box` 底下算的，`body` 自己
      // 又有左右 padding，實際能塞欄位內容的寬度比整個視窗窄（padding
      // 兩側的量）。`column-width` 設的是「理想」欄寬，比實際可用寬度還寬
      // 時，瀏覽器只能生出一欄剛好填滿實際可用寬度——也就是說每一欄真正
      // 的寬度其實是「視窗寬 - 左右 padding」，不是整個視窗寬。`padding`
      // 只加在整段欄位排版的最前/最後，不會每一欄之間重複出現，所以下一欄
      // 緊接著這一欄開始，若 `column-gap` 沒補上這段間距，下一欄的內容會
      // 提早露出來、疊在畫面右邊，造成「跑字」現象（CSS 端已把 `column-gap`
      // 設成跟 padding 一樣寬來擋住這個縫隙，這裡捲頁距離要一併算上這段
      // 間距，不然每次捲動的距離會少了這一截，翻頁會對不準）。
      const step = Math.max(1, pageWidth() - paddingLeft - paddingRight + columnGap);
      if (!lineHeight || Number.isNaN(lineHeight) || lineHeight <= 0 || usable <= 0) {
        return { pageStep: step, pageCount: 1 };
      }
      const linesPerPage = Math.max(1, Math.floor(usable / lineHeight));
      const pageHeight = linesPerPage * lineHeight + paddingTop + paddingBottom;

      body.style.setProperty("column-width", "auto", "important");
      body.style.setProperty("height", "auto", "important");
      const naturalHeight = body.scrollHeight;
      body.style.removeProperty("column-width");

      body.style.setProperty("height", `${pageHeight}px`, "important");
      doc.documentElement.style.setProperty("height", `${pageHeight}px`, "important");

      // 減一點點是為了吸收次像素等級的誤差，不會讓剛好整除的內容被誤判多
      // 算一頁空白頁；用 `ceil` 不是 `round`，多出來的一小段內容一定要算成
      // 獨立一頁，不能被捨去。
      const pageCount = Math.max(1, Math.ceil((naturalHeight - 0.5) / pageHeight));
      return { pageStep: step, pageCount };
    }

    // 捲一頁的距離不能靠「假設全章每一行等寬」去猜：章節內文常常混雜標題
    // （字比較大）跟內文（字比較小），統一行寬只是概算，跟瀏覽器實際排出
    // 來的行界有落差，而且這個落差是累加的——愈後面的頁面誤差愈大，最後
    // 甚至會整行、整段文字被跳過去（頁面邊界算得比實際內容還遠，捲動位置
    // 直接超過去，中間內容看不到）。改成直接用 `Range.getClientRects()`
    // 量出瀏覽器真正排出來的每一行（每個文字節點可能跨好幾個 rect，一個
    // rect 就是一行），依可用寬度把連續的行分組成一頁一頁，在每一頁的
    // 起點插入一個看不見的標記元素，翻頁時呼叫該標記的
    // `scrollIntoView()`——完全用瀏覽器自己量出來的真實幾何跟原生捲動
    // 邏輯，不會累積誤差，也不用另外處理 `scrollLeft` 方向慣例的問題（見
    // `scrollToPage` 的說明）。
    function clearPageMarkers() {
      if (!pageMarkers) return;
      for (const marker of pageMarkers) {
        const parent = marker && marker.parentNode;
        if (parent) {
          parent.removeChild(marker);
          parent.normalize();
        }
      }
      pageMarkers = null;
    }

    function collectVerticalLineSegments(doc) {
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => (n.nodeValue && n.nodeValue.trim().length > 0 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP),
      });
      const segments = [];
      const range = doc.createRange();
      let node = walker.nextNode();
      while (node) {
        range.selectNodeContents(node);
        const rects = range.getClientRects();
        for (let i = 0; i < rects.length; i++) {
          const r = rects[i];
          if (r.width > 0 && r.height > 0) {
            segments.push({ node, rect: r });
          }
        }
        node = walker.nextNode();
      }
      // 由大到小：vertical-rl 的行進方向是由右到左，右邊界比較大的行在
      // 閱讀順序上比較前面。
      segments.sort((a, b) => b.rect.right - a.rect.right);
      return segments;
    }

    // 在指定文字節點裡二分搜尋，找出目標 rect（某一行）實際從第幾個字元
    // 開始——`getClientRects()` 只給幾何位置，不會直接告訴我們字元位移。
    // 不能用 caret 的 `top` 座標判斷：`top` 每次換行都會重置回接近 0，
    // 一個文字節點如果橫跨好幾行，`top` 不是全域單調遞增，二分搜尋依它
    // 找會找錯位置（這是這次翻頁「同一頁按下一頁卻幾乎沒動、後來又漏掉
    // 最後一頁」的真正原因）。直式書的行進方向是由右到左，`right` 座標
    // 才是全域單調遞減（同一行內不變，換到下一行才會變小），改用這個當
    // 比較依據。
    function findLineStartOffset(doc, node, rect) {
      const length = node.nodeValue.length;
      const probe = doc.createRange();
      const rectAt = (offset) => {
        probe.setStart(node, offset);
        probe.setEnd(node, offset);
        return probe.getClientRects()[0] || null;
      };
      const startRect = rectAt(0);
      if (startRect && Math.abs(startRect.right - rect.right) < 1) {
        return 0;
      }
      let lo = 0;
      let hi = length;
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        const r = rectAt(mid);
        if (!r) {
          hi = mid;
          continue;
        }
        if (r.right <= rect.right + 0.5) {
          hi = mid;
        } else {
          lo = mid + 1;
        }
      }
      return lo;
    }

    function computeVerticalPageBoundaries(doc, budget) {
      const segments = collectVerticalLineSegments(doc);
      if (segments.length === 0) return [];
      const boundarySegments = [segments[0]];
      let pageStartRight = segments[0].rect.right;
      for (let i = 1; i < segments.length; i++) {
        if (pageStartRight - segments[i].rect.right > budget) {
          boundarySegments.push(segments[i]);
          pageStartRight = segments[i].rect.right;
        }
      }
      // 先把每個邊界的字元位移都算好，再「從最後一頁往回」插標記：同一個
      // 文字節點如果橫跨好幾個頁面邊界（沒有段落分隔的長段落），
      // `Range.insertNode` 會把文字節點從插入點切成兩半，只影響插入點
      // 之後的部分，從比較後面的位移開始插，前面算好的位移才不會因為節點
      // 被切開而錯位。
      const offsets = boundarySegments.map((seg) => findLineStartOffset(doc, seg.node, seg.rect));
      const markers = new Array(boundarySegments.length);
      for (let i = boundarySegments.length - 1; i >= 0; i--) {
        const seg = boundarySegments[i];
        const marker = doc.createElement("span");
        marker.style.cssText = "display:inline-block;width:0;height:0;overflow:hidden;";
        const markerRange = doc.createRange();
        markerRange.setStart(seg.node, offsets[i]);
        markerRange.collapse(true);
        markerRange.insertNode(marker);
        markers[i] = marker;
      }
      return markers;
    }

    function measureVerticalChapter(doc) {
      clearPageMarkers();
      const cs = doc.defaultView.getComputedStyle(doc.body);
      const paddingLeft = parseFloat(cs.paddingLeft) || 0;
      const paddingRight = parseFloat(cs.paddingRight) || 0;
      const totalWidth = pageWidth();
      // 分組門檻不能直接用整個畫面寬：`body` 自己有 `padding`，內容真正能
      // 用的寬度要扣掉左右 padding，另外再扣一點點安全邊界（次像素捨入、
      // `scrollIntoView` 對齊時的些微誤差）——寧可讓某幾頁最後多留一點點
      // 空白，也不要讓分組塞進比畫面裝得下還多的內容，那樣會變成「翻頁
      // 翻到一半」還要再翻一次才是真的下一頁，最後一頁也會因為多出來的
      // 內容沒有下一個標記可以顯示，直接被跳過去。
      const budget = Math.max(1, totalWidth - paddingLeft - paddingRight - 4);
      pageMarkers = computeVerticalPageBoundaries(doc, budget);
      // 每一頁該對齊到畫面的哪個位置，不能直接用 `pageWidth()`（整個視窗
      // 寬）：章節一開始完全沒捲動過的預設狀態，第一行文字（含標題本身的
      // 字級/margin）本來就不是剛好切齊在視窗最右邊，而是內縮一段距離
      // （padding、標題自己的樣式）。這個「原本第一頁自然停在哪裡」的
      // 位置，才是其他每一頁都該對齊過去的目標——這裡趁章節剛載入、還沒
      // 被捲動過的這一刻量下來，直接用 `pageWidth()` 當目標，每一頁都會
      // 比正確位置多幾行的落差（少對齊到 padding／標題造成的內縮量）。
      verticalPageTarget = pageMarkers.length > 0 ? pageMarkers[0].getBoundingClientRect().right : pageWidth();
      return { pageCount: Math.max(1, pageMarkers.length) };
    }

    // iframe 換了新章節、真正排版完成之後才量得到正確的尺寸（`load` 事件
    // 本身可能早於樣式套用完成），用 `requestAnimationFrame` 保險等一個
    // 畫面週期；`measureHorizontalChapter` 改高度本身又會觸發一次新的
    // layout，所以再等一個畫面週期才捲到指定頁，不然捲動用的還是改高度
    // 之前的舊版面。`landing` 是這次要停在第幾頁：數字就直接用，`"last"`
    // 表示停在這章的最後一頁（從下一章往回翻的情境）。
    // 有些 epub 的 CSS 會用 app 專用的 `res://` 字型路徑（例如
    // `url(res:///system/fonts/...)`），瀏覽器根本讀不到，會先等一段字型
    // 載入逾時的時間才 fallback 回下一個字型；這段時間內量到的文字幾何
    // （`getClientRects()`）可能是還沒套用最終字型前的暫時排版，算出來的
    // 分頁邊界會不準——這正是「第一次開某一章分頁算錯，但重複測過的章節
    // 又正常」的原因（重複測過的章節，字型 fallback 早就穩定了）。用
    // `document.fonts.ready`（所有字型不管成功或失敗都確定下來才 resolve）
    // 卡住量測，等字型狀態穩定再排版，不能只靠 `requestAnimationFrame`
    // （那只保證畫面更新週期，不保證字型已經 fallback 完成）。
    //
    // `fonts.ready` 可能要等很久（`res://` 這種讀不到的字型，瀏覽器要等到
    // 逾時才 fallback，可能好幾秒），這段等待期間使用者很可能已經翻頁/換
    // 章節了——用 `measurementToken` 幫每一次呼叫編號，等到 promise/rAF
    // resolve 時如果編號已經跟目前最新的不一樣，就代表章節換過了，這次
    // 量測結果作廢，不能再拿舊章節（甚至已經被瀏覽器拆掉的舊 document）
    // 量出來的錯誤數字去蓋掉新章節剛設好的正確狀態，這正是「回上一章
    // 卻卡在只有一頁」的真正原因。
    function onFrameLoaded(landing) {
      const doc = frameEl.contentDocument;
      if (!doc || !doc.body) return;
      // 新章節是全新文件，套用目前的字級偏好，不然每換一章字級都會被
      // book 自己的原始 CSS 重設回去。
      applyFontScale(doc);
      const myToken = ++measurementToken;
      // 換章節這段期間（等字型穩定為止）標記起來，`recomputeAfterResize`
      // 看到這個標記就整個跳過，不會拿 `loadChapterAtPage` 剛重置、還沒被
      // 這裡填回正確答案的 `pageIndex=0`／`pageCount=1` 去算出錯誤的目標
      // 頁碼、搶著把捲動位置改回第一頁——這正是「回上一章卻卡在第一頁，
      // 不是最後一頁」的真正原因：`ResizeObserver` 觀察的容器（工具列文字
      // 長度改變、`updateToolbarText` 造成的版面微調）在換章節的過程中很
      // 容易被觸發，這個 resize 事件如果在字型穩定前就搶著跑完，就會用
      // 還沒設好的暫存值把正確結果蓋掉。
      chapterLoadInFlight = true;
      const fontsReady = (doc.fonts && doc.fonts.ready) || Promise.resolve();
      fontsReady.then(() => {
        if (myToken !== measurementToken) return;
        requestAnimationFrame(() => {
          if (myToken !== measurementToken) return;
          const measured = measureChapter(doc);
          requestAnimationFrame(async () => {
            if (myToken !== measurementToken) return;
            pageCount = measured.pageCount;
            pageStep = measured.pageStep || 1;
            chapterVertical = measured.vertical;
            pageIndex = landing === "last" ? pageCount - 1 : Math.min(Math.max(0, landing), pageCount - 1);
            // 實測過：剛載入章節直接跳到後面的頁碼（例如從下一章往回翻，
            // 落在這一章最後一頁）畫面會卡在第一頁不動，但同一章節內
            // 循序漸進按下一頁完全正常——代表問題不是分頁算錯或捲動方向
            // 錯，是瀏覽器對「剛載入的文件」的可捲動範圍判斷還沒跟上一次
            // 大跳躍的捲動（即使 `getBoundingClientRect()`/`scrollWidth`
            // 當下已經回報正確數字）。改成模擬使用者實際翻頁的路徑：先
            // 真的停在第一頁，一頁一頁循序捲到目標頁，讓瀏覽器逐步跟上。
            if (chapterVertical && pageIndex > 0) {
              scrollToPage(doc, 0);
              for (let i = 1; i <= pageIndex; i++) {
                await new Promise((resolve) => requestAnimationFrame(resolve));
                if (myToken !== measurementToken) return;
                scrollToPage(doc, i);
              }
            } else {
              scrollToPage(doc, pageIndex);
            }
            updateToolbarText();
            chapterLoadInFlight = false;
          });
        });
      });
    }

    // 螢幕轉向（橫/直）時，`vw`/`vh` 單位讓瀏覽器自己重新排版（不需要我們
    // 插入任何新 CSS），但 `pageStep`／分頁數量／目前頁碼都是我們自己
    // 快取、依舊尺寸算出來的，要跟著重新算一次（`measureChapter`），並
    // 盡量停在同一個「讀到大概幾成」的位置（用比例換算到新的頁數，不是
    // 每次都跳回第一頁）。
    function recomputeAfterResize() {
      if (chapterLoadInFlight) return;
      const doc = frameEl && frameEl.contentDocument;
      if (!doc || !doc.body) return;
      const fraction = pageCount > 0 ? pageIndex / pageCount : 0;
      const measured = measureChapter(doc);
      requestAnimationFrame(() => {
        pageCount = measured.pageCount;
        pageStep = measured.pageStep || 1;
        chapterVertical = measured.vertical;
        pageIndex = Math.min(Math.round(fraction * pageCount), pageCount - 1);
        scrollToPage(doc, pageIndex);
        updateToolbarText();
      });
    }

    async function saveProgress(chapterIndex) {
      try {
        await fetch(`/api/ereader/book/${encodeURIComponent(current.name)}/progress`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chapter: chapterIndex }),
        });
      } catch (_err) {
        // 存進度失敗不影響當下閱讀，最多下次重開這本書時進度沒更新到最新。
      }
    }

    // `landing` 同 `onFrameLoaded` 的說明：換章節時要停在第幾頁。
    function loadChapterAtPage(chapterIndex, landing) {
      const { meta } = current;
      if (chapterIndex < 0 || chapterIndex >= meta.spine.length) return;
      meta.current_chapter = chapterIndex;
      meta.progress_percent = Math.round(((chapterIndex + 1) / meta.spine.length) * 100);
      pageIndex = 0;
      pageCount = 1;
      pageMarkers = null;
      verticalPageTarget = null;
      frameEl.dataset.landing = landing;
      frameEl.src = resourceUrl(current.name, meta.spine[chapterIndex].href);
      updateToolbarText();
      saveProgress(chapterIndex);
    }

    // 換頁：`direction` 是 +1（往後一頁）或 -1（往前一頁），絕對方向（跟畫面
    // 上哪顆按鈕/哪一側對應到這個方向是分開的兩件事，見 `renderReader`／
    // 分頁 tap zone 的說明）。超出這一章的頁面範圍就換到下一章／上一章，
    // 分別停在該章的第一頁／最後一頁，翻頁翻到章節邊界時感覺是連續的。
    function turnPage(direction) {
      if (!current) return;
      const next = pageIndex + direction;
      if (next >= 0 && next < pageCount) {
        pageIndex = next;
        const doc = frameEl.contentDocument;
        if (doc && doc.defaultView) {
          scrollToPage(doc, pageIndex);
        }
        updateToolbarText();
        return;
      }
      const nextChapter = current.meta.current_chapter + direction;
      loadChapterAtPage(nextChapter, direction > 0 ? 0 : "last");
    }

    function handleZoneClick(direction) {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }
      turnPage(direction);
    }

    function renderReader() {
      ld.detailBody.innerHTML = "";
      const { name, meta } = current;
      const wrap = document.createElement("div");
      wrap.className = "ereader-reader";
      const toolbar = document.createElement("div");
      toolbar.className = "ereader-toolbar";
      titleEl = document.createElement("span");
      titleEl.className = "ereader-toolbar-title";
      const fontMinusBtn = document.createElement("button");
      fontMinusBtn.textContent = "A-";
      fontMinusBtn.title = "縮小字體";
      fontMinusBtn.addEventListener("click", () => changeFontScale(-FONT_SCALE_STEP));
      const fontPlusBtn = document.createElement("button");
      fontPlusBtn.textContent = "A+";
      fontPlusBtn.title = "放大字體";
      fontPlusBtn.addEventListener("click", () => changeFontScale(FONT_SCALE_STEP));
      const prevBtn = document.createElement("button");
      prevBtn.title = "上一頁";
      prevBtn.addEventListener("click", () => turnPage(-1));
      const nextBtn = document.createElement("button");
      nextBtn.title = "下一頁";
      nextBtn.addEventListener("click", () => turnPage(1));
      toolbar.appendChild(titleEl);
      toolbar.appendChild(fontMinusBtn);
      toolbar.appendChild(fontPlusBtn);
      // 直式（rtl）書翻頁習慣是從右到左，上一頁/下一頁按鈕的左右順序跟著
      // 對調（語意不變，還是「往前一頁」/「往後一頁」，只是哪個按鈕畫在
      // 左邊變了，符合直式書讀者的翻頁直覺）。符號故意不跟著「往前/往後」
      // 的語意走，而是跟著「畫面位置」走：不管橫式直式，畫在左邊的按鈕都
      // 用 `‹`、畫在右邊的都用 `›`，使用者單純憑左右位置操作，不用去記
      // 哪個符號對應哪個功能。
      if (meta.direction === "rtl") {
        nextBtn.textContent = "‹";
        prevBtn.textContent = "›";
        toolbar.appendChild(nextBtn);
        toolbar.appendChild(prevBtn);
      } else {
        prevBtn.textContent = "‹";
        nextBtn.textContent = "›";
        toolbar.appendChild(prevBtn);
        toolbar.appendChild(nextBtn);
      }

      const frameWrap = document.createElement("div");
      frameWrap.className = "ereader-frame-wrap";
      frameEl = document.createElement("iframe");
      frameEl.className = "ereader-frame";
      frameEl.setAttribute("sandbox", "allow-same-origin");
      frameEl.addEventListener("load", () => {
        const landing = frameEl.dataset.landing;
        onFrameLoaded(landing === "last" ? "last" : Number(landing) || 0);
      });
      // 點兩側翻頁：不用伸進 iframe 內部掛事件（每次換章節文件都會重來，
      // 而且 iframe 沒開 `allow-scripts`），疊在 iframe 上面兩塊透明區塊接
      // click 就好。方向跟按鈕一樣依 `direction` 對調，靠右/靠左要對應到
      // 「往後一頁」還是「往前一頁」。
      const leftZone = document.createElement("div");
      leftZone.className = "ereader-tap-zone ereader-tap-left";
      const rightZone = document.createElement("div");
      rightZone.className = "ereader-tap-zone ereader-tap-right";
      const forwardOnRight = meta.direction !== "rtl";
      leftZone.addEventListener("click", () => handleZoneClick(forwardOnRight ? -1 : 1));
      rightZone.addEventListener("click", () => handleZoneClick(forwardOnRight ? 1 : -1));
      frameWrap.appendChild(frameEl);
      frameWrap.appendChild(leftZone);
      frameWrap.appendChild(rightZone);

      // 滑動翻頁（手機上主要靠這個）：往左滑＝往後一頁（LTR 書），跟 tap
      // zone 同一套方向對調邏輯。滑動距離太短當成點擊，交給上面兩塊 tap
      // zone 的 click 處理，不要兩邊都觸發翻頁。
      frameWrap.addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.touches[0].clientX;
        },
        { passive: true }
      );
      frameWrap.addEventListener(
        "touchend",
        (e) => {
          if (touchStartX === null) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          touchStartX = null;
          if (Math.abs(dx) < 40) return;
          suppressNextClick = true;
          const forward = forwardOnRight ? dx < 0 : dx > 0;
          turnPage(forward ? 1 : -1);
        },
        { passive: true }
      );

      wrap.appendChild(toolbar);
      wrap.appendChild(frameWrap);
      ld.detailBody.appendChild(wrap);

      // `renderReader` 不只換章節會呼叫（回書架再開別本書也會再呼叫一次），
      // 每次都要先把上一次的 observer 斷開，不然會一直疊加、觀察著已經被
      // `ld.detailBody.innerHTML = ""` 移除的舊 `frameWrap`。
      if (resizeObserver) resizeObserver.disconnect();
      resizeObserver = new ResizeObserver(recomputeAfterResize);
      resizeObserver.observe(frameWrap);

      const entry = meta.spine[meta.current_chapter];
      frameEl.dataset.landing = "0";
      frameEl.src = entry ? resourceUrl(name, entry.href) : "about:blank";
      updateToolbarText();
    }

    refreshShelf();
    const intervalId = setInterval(refreshShelf, 15000);

    return function stop() {
      stopped = true;
      clearInterval(intervalId);
      if (resizeObserver) resizeObserver.disconnect();
    };
  }

  // storage 分頁點 `notepad/` 資料夾底下的檔名要切去 notepad 分頁並顯示
  // 那個檔案：跟 tablet 版一樣，用一個模組層級變數記住「下次開 notepad
  // 分頁要先載入哪個檔案」。
  let notepadInitialFile = "notepad.md";
  function openNotepadFile(name) {
    notepadInitialFile = name;
    switchTo("notepad");
  }

  // 建立 storage 分頁：跟桌面版/tablet 版同一套功能（瀏覽資料夾／上傳／
  // 新資料夾／下載／刪除／重新命名）。資料夾點了直接往下瀏覽（跟改之前
  // 一樣）；檔案點了進詳細畫面（見 `showFileDetail`），不在列表裡塞小圖示
  // 按鈕。
  function startStorageTab(container) {
    const ld = createListDetailView(container);
    const wrap = document.createElement("div");
    wrap.className = "storage-body";

    const toolbar = document.createElement("div");
    toolbar.className = "storage-toolbar";
    const breadcrumb = document.createElement("span");
    breadcrumb.className = "storage-breadcrumb";
    const uploadBtn = document.createElement("button");
    uploadBtn.textContent = "⬆ 上傳";
    const uploadInput = document.createElement("input");
    uploadInput.type = "file";
    uploadInput.style.display = "none";
    const mkdirBtn = document.createElement("button");
    mkdirBtn.textContent = "＋新資料夾";
    toolbar.appendChild(breadcrumb);
    toolbar.appendChild(uploadBtn);
    toolbar.appendChild(uploadInput);
    toolbar.appendChild(mkdirBtn);

    const table = document.createElement("table");
    table.className = "storage-table";
    const tbody = document.createElement("tbody");
    table.appendChild(tbody);
    const tableScroll = document.createElement("div");
    tableScroll.className = "storage-table-scroll";
    tableScroll.appendChild(table);

    wrap.appendChild(toolbar);
    wrap.appendChild(tableScroll);
    ld.listEl.appendChild(wrap);

    const state = { currentPath: "" };

    const joinPath = (base, name2) => (base ? `${base}/${name2}` : name2);

    function formatSize(bytes) {
      if (bytes === 0) return "—";
      const units = ["B", "K", "M", "G", "T"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
      }
      return unit === 0 ? `${bytes}${units[0]}` : `${value.toFixed(1)}${units[unit]}`;
    }

    function renderBreadcrumb() {
      breadcrumb.innerHTML = "";
      const rootSeg = document.createElement("a");
      rootSeg.href = "#";
      rootSeg.textContent = "/";
      rootSeg.addEventListener("click", (e) => {
        e.preventDefault();
        navigate("");
      });
      breadcrumb.appendChild(rootSeg);
      if (!state.currentPath) return;
      const parts = state.currentPath.split("/");
      let acc = "";
      for (const part of parts) {
        acc = acc ? `${acc}/${part}` : part;
        const seg = document.createElement("a");
        seg.href = "#";
        seg.textContent = ` ${part}`;
        const target = acc;
        seg.addEventListener("click", (e) => {
          e.preventDefault();
          navigate(target);
        });
        breadcrumb.appendChild(seg);
      }
    }

    function showFileDetail(entry) {
      const full = joinPath(state.currentPath, entry.name);
      const wrap2 = document.createElement("div");
      wrap2.className = "storage-detail-content";
      const name = document.createElement("div");
      name.className = "storage-detail-name";
      name.textContent = entry.name;
      const meta = document.createElement("div");
      meta.className = "storage-detail-meta";
      meta.textContent = `${formatSize(entry.size)} · ${new Date(entry.modified * 1000).toLocaleString()}`;
      const actions = document.createElement("div");
      actions.className = "storage-detail-actions";

      const dlBtn = document.createElement("a");
      dlBtn.href = `/api/storage/download?path=${encodeURIComponent(full)}`;
      dlBtn.textContent = "⬇ 下載";
      actions.appendChild(dlBtn);

      // notepad 分頁的 `/api/notepad/content` 只接單一裸檔名（見 `web.rs`
      // 的 `safe_notepad_path`，不能帶路徑），只有目前瀏覽到
      // `storage/notepad/` 這一層時，`entry.name` 才剛好對應 notepad 能開
      // 的同一個檔案。
      if (state.currentPath === "notepad") {
        const openBtn = document.createElement("button");
        openBtn.textContent = "📝 在 notepad 開啟";
        openBtn.addEventListener("click", () => openNotepadFile(entry.name));
        actions.appendChild(openBtn);
      }

      const renameBtn = document.createElement("button");
      renameBtn.textContent = "✎ 重新命名";
      renameBtn.addEventListener("click", async () => {
        const newName = window.prompt("新名稱", entry.name);
        if (!newName || newName === entry.name) return;
        const to = joinPath(state.currentPath, newName);
        await fetch(`/api/storage/rename?from=${encodeURIComponent(full)}&to=${encodeURIComponent(to)}`, {
          method: "POST",
        });
        ld.showList();
        refresh();
      });
      actions.appendChild(renameBtn);

      const delBtn = document.createElement("button");
      delBtn.className = "danger";
      delBtn.textContent = "🗑 刪除";
      delBtn.addEventListener("click", async () => {
        if (!window.confirm(`確定要刪除「${entry.name}」嗎？`)) return;
        await fetch(`/api/storage/delete?path=${encodeURIComponent(full)}`, { method: "POST" });
        ld.showList();
        refresh();
      });
      actions.appendChild(delBtn);

      wrap2.appendChild(name);
      wrap2.appendChild(meta);
      wrap2.appendChild(actions);
      ld.detailBody.innerHTML = "";
      ld.detailBody.appendChild(wrap2);
      ld.showDetail();
    }

    async function refresh() {
      const path = state.currentPath;
      let entries;
      try {
        const res = await fetch(`/api/storage/list?path=${encodeURIComponent(path)}`);
        entries = await res.json();
      } catch (_err) {
        return; // 這次沒抓到就算了，使用者可以再手動切換一次路徑重試。
      }
      if (path !== state.currentPath) return; // 等待期間使用者又切了路徑，這次回應過期了，不要蓋掉新畫面。
      renderBreadcrumb();
      tbody.innerHTML = "";
      for (const entry of entries) {
        const row = document.createElement("tr");
        const nameCell = document.createElement("td");
        const link = document.createElement("a");
        link.href = "#";
        if (entry.is_dir) {
          link.textContent = `📁 ${entry.name}`;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            navigate(joinPath(state.currentPath, entry.name));
          });
        } else {
          link.textContent = `📄 ${entry.name}`;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            showFileDetail(entry);
          });
        }
        nameCell.appendChild(link);
        const sizeCell = document.createElement("td");
        sizeCell.textContent = entry.is_dir ? "—" : formatSize(entry.size);
        const actionsCell = document.createElement("td");
        if (entry.is_dir) {
          const delBtn = document.createElement("button");
          delBtn.textContent = "🗑";
          delBtn.addEventListener("click", async () => {
            const full = joinPath(state.currentPath, entry.name);
            let itemCount = 0;
            try {
              const res = await fetch(`/api/storage/list?path=${encodeURIComponent(full)}`);
              const children = await res.json();
              itemCount = children.length;
            } catch (_err) {
              // 查不到子項目數量就當作非空、用比較保守的措辭，不影響後面還是照樣送
              // recursive=true 的刪除請求。
            }
            const message = itemCount > 0
              ? `確定要刪除「${entry.name}」嗎？裡面還有 ${itemCount} 個項目，會一併刪除`
              : `確定要刪除「${entry.name}」（空資料夾）嗎？`;
            if (!window.confirm(message)) return;
            await fetch(`/api/storage/delete?path=${encodeURIComponent(full)}&recursive=true`, { method: "POST" });
            refresh();
          });
          const renameBtn = document.createElement("button");
          renameBtn.textContent = "✎";
          renameBtn.addEventListener("click", async () => {
            const newName = window.prompt("新名稱", entry.name);
            if (!newName || newName === entry.name) return;
            const from = joinPath(state.currentPath, entry.name);
            const to = joinPath(state.currentPath, newName);
            await fetch(`/api/storage/rename?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`, {
              method: "POST",
            });
            refresh();
          });
          actionsCell.appendChild(delBtn);
          actionsCell.appendChild(renameBtn);
        }
        row.appendChild(nameCell);
        row.appendChild(sizeCell);
        row.appendChild(actionsCell);
        tbody.appendChild(row);
      }
    }

    function navigate(path) {
      state.currentPath = path;
      refresh();
    }

    uploadBtn.addEventListener("click", () => uploadInput.click());
    uploadInput.addEventListener("change", async () => {
      const file = uploadInput.files[0];
      if (!file) return;
      const dest = joinPath(state.currentPath, file.name);
      await fetch(`/api/storage/upload?path=${encodeURIComponent(dest)}`, { method: "POST", body: file });
      uploadInput.value = "";
      refresh();
    });

    mkdirBtn.addEventListener("click", async () => {
      const dirName = window.prompt("新資料夾名稱");
      if (!dirName) return;
      const dest = joinPath(state.currentPath, dirName);
      await fetch(`/api/storage/mkdir?path=${encodeURIComponent(dest)}`, { method: "POST" });
      refresh();
    });

    refresh();

    return function stop() {};
  }

  // 建立 todo 分頁：toolbar 一個輸入框＋新增按鈕，下面是可捲動的待辦清單，
  // 每列勾選框切換完成/未完成、右邊垃圾桶刪除。新增/勾選/刪除都是打完
  // API 就整份 `refresh()` 重新抓，不用自己維護本地 state 跟伺服器對不對得上。
  function startTodoTab(container) {
    const wrap = document.createElement("div");
    wrap.className = "todo-body";

    const toolbar = document.createElement("div");
    toolbar.className = "todo-toolbar";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "新增待辦事項...";
    const addBtn = document.createElement("button");
    addBtn.textContent = "＋新增";
    toolbar.appendChild(input);
    toolbar.appendChild(addBtn);

    const list = document.createElement("div");
    list.className = "todo-list";

    wrap.appendChild(toolbar);
    wrap.appendChild(list);
    container.appendChild(wrap);

    async function refresh() {
      let items;
      try {
        const res = await fetch("/api/todo/list");
        items = await res.json();
      } catch (_err) {
        return; // 這次沒抓到就算了，使用者下一次操作會再觸發一次 refresh。
      }
      list.innerHTML = "";
      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "todo-empty";
        empty.textContent = "（沒有待辦事項）";
        list.appendChild(empty);
        return;
      }
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "todo-row" + (item.done ? " done" : "");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.done;
        checkbox.addEventListener("change", async () => {
          await fetch(`/api/todo/toggle?id=${item.id}`, { method: "POST" });
          refresh();
        });
        const text = document.createElement("span");
        text.className = "todo-text";
        text.textContent = item.text;
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑";
        delBtn.addEventListener("click", async () => {
          await fetch(`/api/todo/remove?id=${item.id}`, { method: "POST" });
          refresh();
        });
        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(delBtn);
        list.appendChild(row);
      }
    }

    async function addItem() {
      const text = input.value.trim();
      if (!text) return;
      await fetch(`/api/todo/add?text=${encodeURIComponent(text)}`, { method: "POST" });
      input.value = "";
      refresh();
    }

    addBtn.addEventListener("click", addItem);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addItem();
    });

    refresh();

    return function stop() {};
  }

  // notepad 分頁的即時 markdown 預覽用，跟桌面版 frontend.html 的
  // `renderMarkdown` 是同一套規則（各自一份，理由見 topology 那段的說明）：
  // 不是完整的 CommonMark 剖析器，只涵蓋標題/引言/清單/table/code fence/
  // 分隔線/段落跟行內強調語法，足夠「盡量還原排版好的樣子」。文字先跳脫過
  // HTML 特殊字元，使用者打的原始內容不會被當成標籤解讀。
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // code fence 的語法上色規則：關鍵字清單、單行註解開頭符號、區塊註解頭尾
  // 符號——跟 `gui.rs` 的 `language_spec` 是同一套規則（維持兩邊一致），不是
  // 完整的詞法分析器，但字串/註解/數字/關鍵字這幾類最常見、最有用的分類
  // 已經涵蓋。
  const CODE_LANGUAGES = {
    rust: {
      keywords: ["fn","let","mut","pub","struct","enum","impl","trait","use","mod","if","else","match","for","while","loop","return","break","continue","const","static","self","Self","super","crate","as","in","move","ref","where","async","await","dyn","unsafe","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    python: {
      keywords: ["def","class","if","elif","else","for","while","return","import","from","as","with","try","except","finally","raise","pass","break","continue","lambda","yield","in","is","not","and","or","None","True","False","self","global","nonlocal","async","await"],
      lineComment: "#",
      blockComment: null,
    },
    javascript: {
      keywords: ["function","const","let","var","if","else","for","while","return","class","extends","new","this","import","export","from","as","try","catch","finally","throw","break","continue","switch","case","default","typeof","instanceof","in","of","async","await","yield","null","undefined","true","false","super"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    c: {
      keywords: ["int","char","float","double","void","if","else","for","while","return","struct","typedef","enum","union","static","const","unsigned","signed","long","short","sizeof","switch","case","default","break","continue","class","public","private","protected","namespace","template","new","delete","this","virtual","override","nullptr","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    java: {
      keywords: ["public","private","protected","class","interface","extends","implements","static","final","void","int","long","float","double","boolean","char","String","if","else","for","while","return","new","this","super","try","catch","finally","throw","throws","import","package","break","continue","switch","case","default","true","false","null"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    go: {
      keywords: ["func","package","import","var","const","type","struct","interface","if","else","for","range","return","go","chan","select","case","default","switch","break","continue","defer","map","nil","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    bash: {
      keywords: ["if","then","else","elif","fi","for","while","do","done","case","esac","function","return","exit","export","local","echo","break","continue","in"],
      lineComment: "#",
      blockComment: null,
    },
    json: { keywords: ["true", "false", "null"], lineComment: null, blockComment: null },
    sql: {
      keywords: ["SELECT","FROM","WHERE","INSERT","INTO","VALUES","UPDATE","SET","DELETE","JOIN","LEFT","RIGHT","INNER","OUTER","ON","GROUP","BY","ORDER","HAVING","AS","AND","OR","NOT","NULL","IS","IN","LIKE","LIMIT","CREATE","TABLE","DROP","ALTER","PRIMARY","KEY","FOREIGN","REFERENCES","DEFAULT","DISTINCT"],
      lineComment: "--",
      blockComment: ["/*", "*/"],
    },
    ruby: {
      keywords: ["def","end","class","module","if","elsif","else","unless","while","until","for","in","do","return","break","next","yield","begin","rescue","ensure","raise","require","true","false","nil","self"],
      lineComment: "#",
      blockComment: null,
    },
    yaml: { keywords: ["true", "false", "null"], lineComment: "#", blockComment: null },
  };
  const CODE_LANG_ALIASES = {
    rs: "rust", py: "python",
    js: "javascript", ts: "javascript", jsx: "javascript", tsx: "javascript", typescript: "javascript",
    cpp: "c", "c++": "c", h: "c", hpp: "c",
    golang: "go",
    sh: "bash", shell: "bash", zsh: "bash",
    rb: "ruby",
    yml: "yaml", toml: "yaml",
  };

  // 依 code fence 開頭標注的語言名稱（例如 ` ```rust ` 的 `rust`）查對應的
  // 語法上色規則；沒標語言或標了但不認得的語言都回傳 `null`，呼叫端在這種
  // 情況下維持原本單一顏色的樣子，不強行套用錯誤的規則。
  function getLanguageSpec(lang) {
    const key = (lang || "").toLowerCase();
    return CODE_LANGUAGES[CODE_LANG_ALIASES[key] || key] || null;
  }

  // 把一行程式碼掃成字串/註解/數字/關鍵字/其餘（plain）幾類，各自包一層
  // `<span class="tok-...">`；不是完整的詞法分析器（不處理跳脫字元、原始
  // 字串、巢狀區塊註解），跟 `gui.rs` 的 `highlight_code_line` 是同一套簡化
  // 規則。`state.inBlockComment` 是跨行狀態（區塊註解可能橫跨好幾行），
  // 呼叫端每個 code block 開頭要重設成 `{ inBlockComment: false }`，同一個
  // code block 內逐行往下傳同一個物件（靠物件參考模擬「傳址」，JS 沒有
  // 像 Rust `&mut bool` 那樣的東西）。
  function highlightCodeLine(line, spec, state) {
    let html = "";
    let plainStart = 0;
    let i = 0;
    const flushPlain = (end) => {
      if (plainStart < end) html += escapeHtml(line.slice(plainStart, end));
    };

    if (state.inBlockComment && spec.blockComment) {
      const idx = line.indexOf(spec.blockComment[1]);
      if (idx === -1) {
        return line ? `<span class="tok-comment">${escapeHtml(line)}</span>` : "";
      }
      const end = idx + spec.blockComment[1].length;
      html += `<span class="tok-comment">${escapeHtml(line.slice(0, end))}</span>`;
      i = end;
      plainStart = end;
      state.inBlockComment = false;
    }

    while (i < line.length) {
      if (spec.blockComment && line.startsWith(spec.blockComment[0], i)) {
        flushPlain(i);
        const idx = line.indexOf(spec.blockComment[1], i + spec.blockComment[0].length);
        if (idx === -1) {
          html += `<span class="tok-comment">${escapeHtml(line.slice(i))}</span>`;
          state.inBlockComment = true;
          i = line.length;
        } else {
          const end = idx + spec.blockComment[1].length;
          html += `<span class="tok-comment">${escapeHtml(line.slice(i, end))}</span>`;
          i = end;
        }
        plainStart = i;
        continue;
      }
      if (spec.lineComment && line.startsWith(spec.lineComment, i)) {
        flushPlain(i);
        html += `<span class="tok-comment">${escapeHtml(line.slice(i))}</span>`;
        plainStart = line.length;
        break;
      }
      const ch = line[i];
      if (ch === '"' || ch === "'") {
        const end = line.indexOf(ch, i + 1);
        if (end !== -1) {
          flushPlain(i);
          html += `<span class="tok-string">${escapeHtml(line.slice(i, end + 1))}</span>`;
          i = end + 1;
          plainStart = i;
          continue;
        }
      }
      if (/[A-Za-z_]/.test(ch)) {
        const word = line.slice(i).match(/^[A-Za-z0-9_]+/)[0];
        if (spec.keywords.includes(word)) {
          flushPlain(i);
          html += `<span class="tok-keyword">${escapeHtml(word)}</span>`;
          i += word.length;
          plainStart = i;
          continue;
        }
        i += word.length;
        continue;
      }
      if (/[0-9]/.test(ch)) {
        const num = line.slice(i).match(/^[0-9.]+/)[0];
        flushPlain(i);
        html += `<span class="tok-number">${escapeHtml(num)}</span>`;
        i += num.length;
        plainStart = i;
        continue;
      }
      i++;
    }
    flushPlain(line.length);
    return html;
  }

  function renderInlineMarkdown(text) {
    let s = escapeHtml(text);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    // `***文字***`（粗體兼斜體）要在 `**` 規則之前處理，不然會被 `**` 先
    // 吃掉、多出來的一個 `*` 變成殘留字元。
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`);
    s = s.replace(/~~([^~]+)~~/g, "<s>$1</s>");
    s = s.replace(/\+\+([^+]+)\+\+/g, '<span class="notepad-underline">$1</span>');
    s = s.replace(/==([^=]+)==/g, '<span class="notepad-highlight">$1</span>');
    s = s.replace(/\*([^*]+)\*|_([^_]+)_/g, (_, a, b) => `<em>${a ?? b}</em>`);
    // 圖片語法 `![替代文字](網址)`：不是每個 panel 都需要真的顯示圖片，這裡
    // 只當成連結對待——有些論壇（例如 Discourse）的替代文字會夾帶
    // `|690x460, 50%` 這種縮放/尺寸提示，只取 `|` 前面那段當作顯示文字。
    // 要先處理過圖片語法，才不會被底下的一般連結規則吃到剩一個孤立的 `!`。
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => {
      const label = alt.split("|")[0].trim();
      return `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
    });
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
    // `<br>` 換行標記：原始文字先被 `escapeHtml` 跳脫成 `&lt;br&gt;`，這裡
    // 換回真正的 `<br>` 標籤才會讓瀏覽器實際換行，而不是顯示成字面文字。
    s = s.replace(/&lt;br&gt;/g, "<br>");
    return s;
  }

  function isTableRow(line) {
    return line.includes("|") && line.trim() !== "";
  }

  // table 的分隔列（header 底下那一行，例如 `| --- | :---: | ---: |`）：只由
  // `-`、`:`、`|`、空白組成，且至少要有一個 `-`。
  function isTableSeparator(line) {
    const t = line.trim();
    return t.includes("-") && /^[-:|\s]+$/.test(t);
  }

  // 把一行 table 資料列拆成每一欄內容（已 trim 過前後空白）；行首/行尾的
  // `|` 是可有可無的分隔符號，不當作多一欄空白內容。
  function splitTableRow(line) {
    let t = line.trim();
    if (t.startsWith("|")) t = t.slice(1);
    if (t.endsWith("|")) t = t.slice(0, -1);
    return t.split("|").map((cell) => cell.trim());
  }

  // 逐行處理區塊層級語法（標題/引言/清單/table/code fence/分隔線/段落），
  // 行內語法交給 `renderInlineMarkdown`。清單/code fence 需要跨行的「目前在
  // 哪個區塊裡」狀態，用 `listType`/`inCodeBlock` 這兩個區域變數追蹤；table
  // 則需要往下看一行才能判斷是不是 table（含 `|` 的下一行是不是分隔列），
  // 所以這裡用索引迴圈而不是 `for...of`，才能在判斷完 table 之後直接把
  // 迴圈游標跳到 table 結束的下一行。
  function renderMarkdown(source) {
    const lines = source.split("\n");
    let html = "";
    let inCodeBlock = false;
    let codeSpec = null;
    let codeState = null;
    let codeShowLineNumbers = false;
    let codeLineCounter = 0;
    let listType = null; // "ul" | "ol" | null
    const closeList = () => {
      if (listType) {
        html += `</${listType}>`;
        listType = null;
      }
    };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (line.trim().startsWith("```")) {
        if (!inCodeBlock) {
          closeList();
          // 開頭 fence 標注的語言（例如 ` ```rust ` 的 `rust`）決定語法上色
          // 規則；語言名稱後面接一個 `=`（例如 ` ```rust= `）表示要加行號，
          // 兩者是各自獨立的標注，`=` 拿掉之後剩下的部分才是真正的語言
          // 名稱。`codeState` 是這個 code block 專屬的跨行狀態，每個 code
          // block 都要重新從 `false` 開始，不能沿用上一個 code block 剩下
          // 的狀態。
          const rawLang = line.trim().slice(3).trim();
          codeShowLineNumbers = rawLang.endsWith("=");
          codeSpec = getLanguageSpec(codeShowLineNumbers ? rawLang.slice(0, -1) : rawLang);
          codeState = { inBlockComment: false };
          codeLineCounter = 0;
          html += `<pre data-line="${i}"><code>`;
          inCodeBlock = true;
        } else {
          html += "</code></pre>";
          inCodeBlock = false;
          codeSpec = null;
        }
        continue;
      }
      if (inCodeBlock) {
        if (codeShowLineNumbers) {
          codeLineCounter++;
          html += `<span class="line-no">${codeLineCounter}</span>`;
        }
        html += codeSpec ? highlightCodeLine(line, codeSpec, codeState) : escapeHtml(line);
        html += "\n";
        continue;
      }

      // table：一行含 `|` 的資料列，緊接著一行分隔列，就當作 table 的開頭；
      // 後面連續含 `|` 的行都算資料列，直到遇到不符合的行或內容結尾為止。
      if (isTableRow(line) && !isTableSeparator(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
        closeList();
        const headerCells = splitTableRow(line);
        let j = i + 2;
        const dataRows = [];
        while (j < lines.length && isTableRow(lines[j])) {
          dataRows.push(splitTableRow(lines[j]));
          j++;
        }
        html += `<table data-line="${i}"><thead><tr>`;
        for (const cell of headerCells) html += `<th>${renderInlineMarkdown(cell)}</th>`;
        html += "</tr></thead><tbody>";
        for (const [rowOffset, row] of dataRows.entries()) {
          // 每一列各自帶自己的來源行號（`i + 2` 是資料列的起點，跳過 header
          // 跟分隔列），捲動同步時才能精準對到你正在編輯的那一列，不是整個
          // table 一起跳。
          html += `<tr data-line="${i + 2 + rowOffset}">`;
          for (const cell of row) html += `<td>${renderInlineMarkdown(cell)}</td>`;
          html += "</tr>";
        }
        html += "</tbody></table>";
        i = j - 1; // for 迴圈本身還會再 +1
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        closeList();
        const level = heading[1].length;
        html += `<h${level} data-line="${i}">${renderInlineMarkdown(heading[2])}</h${level}>`;
        continue;
      }
      if (/^\s*>\s?/.test(line)) {
        closeList();
        html += `<blockquote data-line="${i}">${renderInlineMarkdown(line.replace(/^\s*>\s?/, ""))}</blockquote>`;
        continue;
      }
      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul) {
        if (listType !== "ul") {
          closeList();
          html += "<ul>";
          listType = "ul";
        }
        // GFM 風格的 checklist 項目（`- [ ] 內容`／`- [x] 內容`）：畫成一個
        // 唯讀的 checkbox，`disabled` 是因為這裡只是把目前的 markdown 內容
        // 呈現出來，不是要讓使用者直接點擊改變原始檔案。
        const checkbox = ul[1].match(/^\[( |x|X)\]\s+(.*)$/);
        if (checkbox) {
          const checked = checkbox[1].toLowerCase() === "x";
          html += `<li class="notepad-task" data-line="${i}"><input type="checkbox" disabled${checked ? " checked" : ""}> ${renderInlineMarkdown(checkbox[2])}</li>`;
        } else {
          html += `<li data-line="${i}">${renderInlineMarkdown(ul[1])}</li>`;
        }
        continue;
      }
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ol) {
        if (listType !== "ol") {
          closeList();
          html += "<ol>";
          listType = "ol";
        }
        html += `<li data-line="${i}">${renderInlineMarkdown(ol[1])}</li>`;
        continue;
      }
      if (/^\s*(---|\*\*\*)\s*$/.test(line)) {
        closeList();
        html += `<hr data-line="${i}">`;
        continue;
      }
      closeList();
      if (line.trim() !== "") {
        html += `<p data-line="${i}">${renderInlineMarkdown(line)}</p>`;
      }
    }
    closeList();
    if (inCodeBlock) html += "</code></pre>";
    return html;
  }

  // 建立 notepad 分頁：跟桌面版同一套檢視/編輯/切換檔案功能，Ctrl-E/Ctrl-F/
  // Ctrl-S/Ctrl-X 全部改成按鈕。切換檔案的輸入框保留 Enter/Esc（純文字輸入
  // 框用 Enter/Esc 很自然，跟「組合鍵」不是同一個問題），但另外補上「確認」/
  // 「取消」兩顆按鈕，觸控操作更直覺。
  function startNotepadTab(container) {
    const wrap = document.createElement("div");
    wrap.className = "notepad-body";

    const viewEl = document.createElement("div");
    viewEl.className = "notepad-view";

    const editEl = document.createElement("div");
    editEl.className = "notepad-edit";
    editEl.style.display = "none";
    const textarea = document.createElement("textarea");
    textarea.className = "notepad-textarea";
    textarea.spellcheck = false;
    const previewEl = document.createElement("div");
    previewEl.className = "notepad-preview";
    editEl.appendChild(textarea);
    editEl.appendChild(previewEl);

    const hint = document.createElement("div");
    hint.className = "notepad-hint";
    const hintActions = document.createElement("div");
    hintActions.className = "notepad-hint-actions";
    const editBtn = document.createElement("button");
    editBtn.textContent = "編輯";
    const switchBtn = document.createElement("button");
    switchBtn.textContent = "切換檔案";
    const saveBtn = document.createElement("button");
    saveBtn.textContent = "儲存";
    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = "取消";
    hintActions.appendChild(editBtn);
    hintActions.appendChild(switchBtn);
    hintActions.appendChild(saveBtn);
    hintActions.appendChild(cancelBtn);
    const hintName = document.createElement("span");
    hintName.className = "notepad-hint-name";
    hint.appendChild(hintActions);
    hint.appendChild(hintName);

    const filenameRow = document.createElement("div");
    filenameRow.className = "notepad-filename-row";
    filenameRow.style.display = "none";
    const filenameInput = document.createElement("input");
    filenameInput.type = "text";
    filenameInput.className = "notepad-filename-input";
    filenameInput.spellcheck = false;
    const filenameConfirmBtn = document.createElement("button");
    filenameConfirmBtn.textContent = "確認";
    const filenameCancelBtn = document.createElement("button");
    filenameCancelBtn.textContent = "取消";
    filenameRow.appendChild(filenameInput);
    filenameRow.appendChild(filenameConfirmBtn);
    filenameRow.appendChild(filenameCancelBtn);

    wrap.appendChild(viewEl);
    wrap.appendChild(editEl);
    wrap.appendChild(hint);
    wrap.appendChild(filenameRow);
    container.appendChild(wrap);

    const state = { savedContent: "", editing: false, promptingFile: false, name: notepadInitialFile };

    function updateHint() {
      hintName.textContent = state.name;
      editBtn.style.display = state.editing ? "none" : "";
      switchBtn.style.display = state.editing ? "none" : "";
      saveBtn.style.display = state.editing ? "" : "none";
      cancelBtn.style.display = state.editing ? "" : "none";
    }

    function renderView() {
      viewEl.innerHTML = state.savedContent.trim()
        ? renderMarkdown(state.savedContent)
        : '<span class="notepad-empty">(空白，按「編輯」開始輸入)</span>';
      updateHint();
    }

    function enterEdit() {
      state.editing = true;
      textarea.value = state.savedContent;
      previewEl.innerHTML = renderMarkdown(state.savedContent);
      viewEl.style.display = "none";
      editEl.style.display = "flex";
      updateHint();
      textarea.focus();
    }

    function exitEdit() {
      state.editing = false;
      viewEl.style.display = "";
      editEl.style.display = "none";
      renderView();
    }

    async function save() {
      await fetch("/api/notepad/content", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: state.name, content: textarea.value }),
      });
      state.savedContent = textarea.value;
      exitEdit();
    }

    async function loadFile(fileName) {
      const res = await fetch(`/api/notepad/content?name=${encodeURIComponent(fileName)}`);
      const d = await res.json();
      state.name = d.name;
      state.savedContent = d.content;
      notepadInitialFile = d.name;
      renderView();
    }

    function startFilePrompt() {
      state.promptingFile = true;
      filenameInput.value = state.name;
      hint.style.display = "none";
      filenameRow.style.display = "flex";
      filenameInput.focus();
      filenameInput.select();
    }

    function endFilePrompt() {
      state.promptingFile = false;
      filenameRow.style.display = "none";
      hint.style.display = "";
    }

    function confirmFilePrompt() {
      const fileName = filenameInput.value.trim();
      endFilePrompt();
      if (fileName) loadFile(fileName);
    }

    filenameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        confirmFilePrompt();
      } else if (e.key === "Escape") {
        e.preventDefault();
        endFilePrompt();
      }
    });
    filenameConfirmBtn.addEventListener("click", confirmFilePrompt);
    filenameCancelBtn.addEventListener("click", endFilePrompt);

    function scrollPreviewToCursor() {
      const currentLine = textarea.value.slice(0, textarea.selectionStart).split("\n").length - 1;
      const marks = previewEl.querySelectorAll("[data-line]");
      let target = null;
      for (const el of marks) {
        if (Number(el.dataset.line) <= currentLine) {
          target = el;
        } else {
          break;
        }
      }
      if (target) {
        target.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    textarea.addEventListener("input", () => {
      previewEl.innerHTML = renderMarkdown(textarea.value);
      scrollPreviewToCursor();
    });
    textarea.addEventListener("keyup", scrollPreviewToCursor);
    textarea.addEventListener("click", scrollPreviewToCursor);

    editBtn.addEventListener("click", enterEdit);
    switchBtn.addEventListener("click", startFilePrompt);
    saveBtn.addEventListener("click", save);
    cancelBtn.addEventListener("click", exitEdit);

    loadFile(state.name);

    return function stop() {};
  }

  // 底下分頁列螢幕太窄，9 個分頁塞不下——只留最常用的 4 個
  // （topology/weather/player/todo）直接放分頁列，其餘（device/global/
  // system/storage/notepad）收進最右邊「⋯ 更多」按鈕點開的清單，跟 iOS
  // 常見的「More」分頁模式一樣。`TAB_MODULES` 兩邊共用，不管從分頁列還是
  // 「更多」清單點進來，都是同一個 `switchTo`。
  const PRIMARY_TABS = [
    { name: "topology", icon: "🌐", label: "topology" },
    { name: "weather", icon: "🌤️", label: "weather" },
    { name: "player", icon: "🎵", label: "player" },
    { name: "todo", icon: "✅", label: "todo" },
  ];
  const SECONDARY_TABS = [
    { name: "device", icon: "📟", label: "device" },
    { name: "global", icon: "🌍", label: "global" },
    { name: "system", icon: "⚙️", label: "system" },
    { name: "ereader", icon: "📖", label: "ereader" },
    { name: "storage", icon: "🗂️", label: "storage" },
    { name: "notepad", icon: "📝", label: "notepad" },
  ];

  // `TAB_MODULES` 把每個分頁名稱對應到一個模組：`start(container)` 掛上
  // 內容並回傳 `stopFn`，切分頁時呼叫該 `stopFn` 清掉 interval／EventSource
  // ／animation frame，不留背景在跑。
  const TAB_MODULES = {
    device: { start: makeSnapshotTab("device") },
    global: { start: makeSnapshotTab("global") },
    topology: { start: startTopologyTab },
    weather: { start: startWeatherTab },
    system: { start: makePlainPanelTab("system") },
    player: { start: startPlayerTab },
    ereader: { start: startEreaderTab },
    storage: { start: startStorageTab },
    notepad: { start: startNotepadTab },
    todo: { start: startTodoTab },
  };

  const content = document.getElementById("content");
  const tabbar = document.getElementById("tabbar");
  let activeName = null;
  let activeStop = null;

  // 「更多」清單用一個蓋滿全螢幕的 overlay + 從底部滑出的 sheet，跟
  // topology 分頁的節點詳細資訊 modal 是同一種「觸控裝置點擊開合」模式。
  // 掛在 `document.body`（不是 `#content`），這樣才能蓋住整個畫面（包含
  // 分頁列本身），不受 `#content` 的 `overflow: auto` 影響。
  const moreOverlay = document.createElement("div");
  moreOverlay.className = "more-sheet-overlay";
  const moreSheet = document.createElement("div");
  moreSheet.className = "more-sheet";
  moreOverlay.appendChild(moreSheet);
  document.body.appendChild(moreOverlay);

  function closeMoreSheet() {
    moreOverlay.classList.remove("open");
  }
  function openMoreSheet() {
    moreOverlay.classList.add("open");
  }
  moreOverlay.addEventListener("click", (e) => {
    if (e.target === moreOverlay) closeMoreSheet();
  });

  const moreItemEls = new Map();
  for (const t of SECONDARY_TABS) {
    const item = document.createElement("div");
    item.className = "more-sheet-item";
    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent = t.icon;
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = t.label;
    item.appendChild(icon);
    item.appendChild(label);
    item.addEventListener("click", () => {
      closeMoreSheet();
      switchTo(t.name);
    });
    moreSheet.appendChild(item);
    moreItemEls.set(t.name, item);
  }

  function switchTo(name) {
    if (activeName === name) return;
    if (activeStop) {
      activeStop();
      activeStop = null;
    }
    content.innerHTML = "";
    activeStop = TAB_MODULES[name].start(content);
    activeName = name;
    for (const btn of tabbar.querySelectorAll("button[data-name]")) {
      btn.classList.toggle("active", btn.dataset.name === name);
    }
    // 目前分頁是「更多」清單裡的其中一個時，分頁列上顯示 active 的是
    // 「⋯ 更多」這顆按鈕本身（表示目前所在的分頁藏在裡面），清單裡對應的
    // 那一項也標成 active，下次點開「更多」能看出目前在哪個分頁。
    const isSecondary = SECONDARY_TABS.some((t) => t.name === name);
    moreBtn.classList.toggle("active", isSecondary);
    for (const [tname, el] of moreItemEls) {
      el.classList.toggle("active", tname === name);
    }
  }

  for (const t of PRIMARY_TABS) {
    const btn = document.createElement("button");
    btn.dataset.name = t.name;
    const icon = document.createElement("div");
    icon.className = "tab-icon";
    icon.textContent = t.icon;
    const label = document.createElement("div");
    label.className = "tab-label";
    label.textContent = t.label;
    btn.appendChild(icon);
    btn.appendChild(label);
    btn.addEventListener("click", () => switchTo(t.name));
    tabbar.appendChild(btn);
  }

  const moreBtn = document.createElement("button");
  const moreIcon = document.createElement("div");
  moreIcon.className = "tab-icon";
  moreIcon.textContent = "⋯";
  const moreLabel = document.createElement("div");
  moreLabel.className = "tab-label";
  moreLabel.textContent = "更多";
  moreBtn.appendChild(moreIcon);
  moreBtn.appendChild(moreLabel);
  moreBtn.addEventListener("click", openMoreSheet);
  tabbar.appendChild(moreBtn);

  switchTo("topology");
})();
</script>
</body>
</html>
