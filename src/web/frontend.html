    // 點就等於消失了，看不出地圖上那個位置也有一個城市。點本身很小，用
    // `dotR` 當半徑直接算一個正方形外框，跟標籤外框用同一套
    // `worldclockBoxesOverlap` 比對。
    function worldclockCollides(box, placedBoxes, dotBoxes, pad) {
      return placedBoxes.some((pb) => worldclockBoxesOverlap(pb, box, pad)) || dotBoxes.some((db) => worldclockBoxesOverlap(db, box, pad));
    }

    function renderMarkers(cities) {
      cityLayer.innerHTML = "";
      markers = [];
      const dotR = 3;
      const points = cities.map((c) => worldclockProject(c.lon, c.lat));
      const dotBoxes = points.map(([px, py]) => ({ x: px - dotR, y: py - dotR, right: px + dotR, bottom: py + dotR }));

      // 已經放定位的標籤外框，後面每個城市的標籤都要跟這些比對——地理位置
      // 相近的城市（例如台北市跟清邁）預設都貼著自己的點，文字會疊在一起。
      const placedBoxes = [];
      for (let i = 0; i < cities.length; i++) {
        const c = cities[i];

        // 自己的點本來就緊貼著自己的標籤（`worldclockPlacements` 留的
        // `gap` 就是量給自己這個點的），只擋「別的城市」的點。
        const otherDotBoxes = dotBoxes.filter((_, j) => j !== i);

        const dot = document.createElementNS(SVGNS, "circle");
        dot.setAttribute("cx", x);
        dot.setAttribute("cy", y);
        dot.setAttribute("r", dotR);
        dot.setAttribute("class", "worldclock-city-dot");

        const nameEl = document.createElementNS(SVGNS, "text");
        nameEl.setAttribute("class", "worldclock-city-name");
        nameEl.textContent = c.city;

        const timeEl = document.createElementNS(SVGNS, "text");
        timeEl.setAttribute("class", "worldclock-city-time");
        timeEl.textContent = formatLocalTime(c.offset_secs);

        cityLayer.appendChild(dot);
        cityLayer.appendChild(nameEl);
        cityLayer.appendChild(timeEl);

        // 依序試右／上／左／下，第一個「沒有跟其他城市的標籤或點重疊、也
        // 沒有超出地圖範圍」的位置就用；四個都不行的話，退回原本的作法：
        // 預設貼右邊（超出地圖右邊界才改貼左邊），再往下一段一段挪，直到
        // 不撞任何已放好的標籤／點為止——這個 fallback 不要求完全不超出
        // 地圖範圍，保證一定會有個地方可以放，不會因為四個候選位置都不合
        // 就沒畫出來。
        let box = null;
        let placed = false;
        for (const p of worldclockPlacements(x, y)) {
          worldclockApplyPlacement(nameEl, timeEl, p.anchor, p.textX, p.nameY, p.timeY);
          box = worldclockLabelBox(nameEl, timeEl);
          if (worldclockWithinMap(box) && !worldclockCollides(box, placedBoxes, otherDotBoxes, 2)) {
            placed = true;
            break;
          }
        }
        if (!placed) {
          worldclockApplyPlacement(nameEl, timeEl, "start", x + 6, y - 4, y + 9);
          box = worldclockLabelBox(nameEl, timeEl);
          if (box.right > WORLDCLOCK_MAP_W) {
            worldclockApplyPlacement(nameEl, timeEl, "end", x - 6, y - 4, y + 9);
          }
          let offsetY = 0;
          for (let attempt = 0; attempt < 20; attempt++) {
            nameEl.setAttribute("y", y - 4 + offsetY);
            timeEl.setAttribute("y", y + 9 + offsetY);
            box = worldclockLabelBox(nameEl, timeEl);
            if (!worldclockCollides(box, placedBoxes, otherDotBoxes, 2)) break;
            offsetY += 13;
          }
        }
        placedBoxes.push(box);
        markers.push({ offsetSecs: c.offset_secs, timeEl });
      }
    }

    function updateNight() {
      nightPath.setAttribute("d", worldclockNightPath(new Date()));
    }

    async function pollCities() {
      if (stopped) return;
      try {
        const res = await fetch("/api/worldclock/list");
        renderMarkers(await res.json());
      } catch (_err) {
        // 忽略：下一輪 poll 再試，畫面維持上一次成功抓到的內容。
      }
    }

    updateNight();
    pollCities();
    const nightIntervalId = setInterval(updateNight, 30000);
    const tickIntervalId = setInterval(tickClocks, 1000);
    const pollIntervalId = setInterval(pollCities, WORLDCLOCK_POLL_MS);

    return {
      container,
      stop() {
        stopped = true;
        clearInterval(nightIntervalId);
        clearInterval(tickIntervalId);
        clearInterval(pollIntervalId);
      },
    };
  }

  // 建立一個獨立運作的 ereader 面板：書架（`GET /api/ereader/books`）跟
  // 閱讀畫面（`<iframe>` 直接指向 `GET /api/ereader/book/{name}/resource/
  // {章節內部路徑}`）用同一個容器裡的兩個 div 切換顯示/隱藏，不是像
  // `weather` 那樣側欄＋主畫面並排——閱讀需要的是全部寬度，側欄常駐反而
  // 浪費空間。章節 XHTML 裡原有的相對路徑（圖片/CSS/字型）瀏覽器會自動
  // 解析到對應的 `/resource/...` URL（因為這個端點的 URL 路徑刻意跟 epub
  // 內部路徑一樣，見 `src/plugins/ereader.rs` 的說明），完全不需要改寫
  // HTML 內容，直式書的 `writing-mode: vertical-rl` 因此也天然就會生效。
  // `<iframe>` 只給 `allow-same-origin`（能抓同源的 `/resource/...`），不給
  // `allow-scripts`——epub 內容來源不明，沒必要讓它能跑任何 JavaScript。
  function startEreader(container) {
    // 「好讀下載」開一個內嵌 `<iframe>` 連到 haodoo.net（該站沒有擋
    // X-Frame-Options/CSP frame-ancestors，實測可以內嵌），使用者可以在
    // 這個 panel 裡直接瀏覽/搜尋書籍；但好讀的下載按鈕是
    // `<input onClick="DownloadEpub(...)">`，不是普通連結，而且它是跨
    // 網域的 iframe，瀏覽器的 same-origin policy 完全不允許我們的 JS 讀取
    // 或監聽 iframe 內部的任何點擊/網址變化，所以沒辦法真的做到「使用者在
    // iframe 裡按下載、我們自動攔截」。折衷做法：使用者在好讀裡找到書籍後
    // 把該書「詳細頁」的網址複製貼上到下面的欄位（那是一般 `<a href>`
    // 連結，iframe 裡右鍵一樣能複製連結網址），按下「下載」由後端
    // （`crate::plugins::haodoo_import`）直接抓 epub 存進
    // `storage/ebooks/`，不用自己先存到本機再手動上傳一輪。「上傳電子書」
    // 保留給不是從好讀來的檔案（例如其他來源的 epub），走本機檔案選擇 +
    // fetch，跟 storage 分頁的上傳是同一套模式。
    const toolbar = document.createElement("div");
    toolbar.className = "ereader-shelf-toolbar";
    const haodooBtn = document.createElement("button");
    haodooBtn.textContent = "🌐 好讀下載";
    haodooBtn.title = "在這個 panel 裡瀏覽好讀（haodoo.net），貼上書籍網址直接下載進書架";
    const uploadBtn = document.createElement("button");
    uploadBtn.textContent = "⬆ 上傳電子書";
    const uploadInput = document.createElement("input");
    uploadInput.type = "file";
    uploadInput.accept = ".epub";
    uploadInput.style.display = "none";
    uploadBtn.addEventListener("click", () => uploadInput.click());
    uploadInput.addEventListener("change", async () => {
      const file = uploadInput.files[0];
      if (!file) return;
      await fetch(`/api/ereader/upload/${encodeURIComponent(file.name)}`, { method: "POST", body: file });
      uploadInput.value = "";
      refreshShelf();
    });
    toolbar.appendChild(haodooBtn);
    toolbar.appendChild(uploadBtn);
    toolbar.appendChild(uploadInput);

    const shelf = document.createElement("div");
    shelf.className = "ereader-shelf";
    const readerView = document.createElement("div");
    readerView.className = "ereader-reader";
    readerView.style.display = "none";

    const haodooView = document.createElement("div");
    haodooView.className = "ereader-haodoo";
    haodooView.style.display = "none";
    const haodooBar = document.createElement("div");
    haodooBar.className = "ereader-shelf-toolbar";
    const haodooBackBtn = document.createElement("button");
    haodooBackBtn.textContent = "‹ 返回書架";
    const haodooUrlInput = document.createElement("input");
    haodooUrlInput.type = "text";
    haodooUrlInput.placeholder = "貼上好讀書籍詳細頁網址（https://haodoo.net/?M=book&P=...）";
    const haodooVerticalLabel = document.createElement("label");
    const haodooVerticalCheckbox = document.createElement("input");
    haodooVerticalCheckbox.type = "checkbox";
    haodooVerticalLabel.appendChild(haodooVerticalCheckbox);
    haodooVerticalLabel.appendChild(document.createTextNode(" 直式"));
    const haodooDownloadBtn = document.createElement("button");
    haodooDownloadBtn.textContent = "下載";
    const haodooStatus = document.createElement("span");
    haodooStatus.className = "ereader-haodoo-status";
    haodooBar.appendChild(haodooBackBtn);
    haodooBar.appendChild(haodooUrlInput);
    haodooBar.appendChild(haodooVerticalLabel);
    haodooBar.appendChild(haodooDownloadBtn);
    haodooBar.appendChild(haodooStatus);
    const haodooFrameWrap = document.createElement("div");
    haodooFrameWrap.className = "ereader-haodoo-frame-wrap";
    const haodooFrame = document.createElement("iframe");
    haodooFrame.className = "ereader-haodoo-frame";
    haodooFrameWrap.appendChild(haodooFrame);
    haodooView.appendChild(haodooBar);
    haodooView.appendChild(haodooFrameWrap);

    container.appendChild(toolbar);
    container.appendChild(shelf);
    container.appendChild(readerView);
    container.appendChild(haodooView);

    let stopped = false;
    let current = null; // { name, meta }

    function showShelf() {
      current = null;
      readerView.style.display = "none";
      haodooView.style.display = "none";
      shelf.style.display = "";
    }

    function showReader() {
      shelf.style.display = "none";
      haodooView.style.display = "none";
      readerView.style.display = "flex";
    }

    function showHaodoo() {
      shelf.style.display = "none";
      readerView.style.display = "none";
      haodooView.style.display = "flex";
      // 第一次點才真的載入 iframe，不然使用者從沒用過這個功能也要背景載入
      // haodoo.net（拖慢 ereader panel 開啟速度、浪費對方頻寬）。
      if (!haodooFrame.src) {
        haodooFrame.src = "https://haodoo.net/";
      }
    }

    haodooBtn.addEventListener("click", showHaodoo);
    haodooBackBtn.addEventListener("click", showShelf);
    haodooDownloadBtn.addEventListener("click", async () => {
      const url = haodooUrlInput.value.trim();
      if (!url) return;
      haodooDownloadBtn.disabled = true;
      haodooStatus.textContent = "下載中…";
      try {
        const res = await fetch("/api/ereader/haodoo-import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, vertical: haodooVerticalCheckbox.checked }),
        });
        if (res.ok) {
          const data = await res.json();
          haodooStatus.textContent = `已加入書架：${data.name}`;
          haodooUrlInput.value = "";
          refreshShelf();
        } else {
          haodooStatus.textContent = await res.text();
        }
      } catch (_err) {
        haodooStatus.textContent = "下載失敗，確認網路連線後再試一次";
      } finally {
        haodooDownloadBtn.disabled = false;
      }
    });

    function renderShelf(books) {
      shelf.innerHTML = "";
      if (books.length === 0) {
        const empty = document.createElement("div");
        empty.className = "ereader-empty";
        empty.textContent = "(storage/ebooks/ 底下還沒有任何 .epub 檔案，用上面的「上傳電子書」加一本進來)";
        shelf.appendChild(empty);
        return;
      }
      for (const b of books) {
        const row = document.createElement("div");
        row.className = "ereader-book-row";
        const cover = document.createElement("img");
        cover.className = "ereader-book-cover";
        cover.src = `/api/ereader/book/${encodeURIComponent(b.name)}/cover`;
        cover.addEventListener("error", () => {
          cover.style.visibility = "hidden";
        });
        const info = document.createElement("div");
        info.className = "ereader-book-info";
        const title = document.createElement("div");
        title.className = "ereader-book-title";
        title.textContent = b.title;
        const author = document.createElement("div");
        author.className = "ereader-book-author";
        author.textContent = b.author || "";
        const progress = document.createElement("div");
        progress.className = "ereader-book-progress";
        progress.textContent = `${b.progress_percent}%`;
        info.appendChild(title);
        info.appendChild(author);
        info.appendChild(progress);
        row.appendChild(cover);
        row.appendChild(info);
        row.addEventListener("click", () => openBook(b.name));
        shelf.appendChild(row);
      }
    }

    async function refreshShelf() {
      if (stopped) return;
      try {
        const res = await fetch("/api/ereader/books");
        renderShelf(await res.json());
      } catch (_err) {
        // 這次沒抓到就算了，下一輪 poll 再試。
      }
    }

    function resourceUrl(name, href) {
      const encodedPath = href.split("/").map(encodeURIComponent).join("/");
      return `/api/ereader/book/${encodeURIComponent(name)}/resource/${encodedPath}`;
    }

    async function openBook(name) {
      try {
        const res = await fetch(`/api/ereader/book/${encodeURIComponent(name)}/meta`);
        if (!res.ok) return;
        current = { name, meta: await res.json() };
        renderReader();
        showReader();
      } catch (_err) {
        // 打不開就留在書架，不用特別報錯干擾畫面。
      }
    }

    // 章節內的分頁狀態：後端的章節內容已經被 `inject_pagination_style`
    // （見 `src/plugins/ereader.rs`）插入分頁 CSS，瀏覽器會自動把整章內容
    // 依視窗大小切成一頁一頁；這裡只負責「捲到第幾頁」跟「量出這一章總共
    // 幾頁／捲一頁要移動多少像素（`pageStep`）」，不用自己計算怎麼分頁。
    let pageIndex = 0;
    let pageCount = 1;
    let pageStep = 1;
    let chapterVertical = false;
    let pageMarkers = null;
    let verticalPageTarget = null;
    let measurementToken = 0;
    let chapterLoadInFlight = false;
    let frameEl = null;
    let titleEl = null;
    let resizeObserver = null;
    let touchStartX = null;
    let suppressNextClick = false;

    // 字級調整：存在 `localStorage`（不是伺服器端），關掉分頁/重新整理
    // 瀏覽器都還記得上次調到多大，跟這本書、這一章都無關，是使用者對這個
    // 瀏覽器/裝置的個人偏好。
    const FONT_SCALE_STORAGE_KEY = "cng5-ereader-font-scale";
    const FONT_SCALE_MIN = 0.7;
    const FONT_SCALE_MAX = 2;
    const FONT_SCALE_STEP = 0.1;
    let fontScale = (() => {
      const stored = parseFloat(localStorage.getItem(FONT_SCALE_STORAGE_KEY));
      return Number.isFinite(stored) && stored >= FONT_SCALE_MIN && stored <= FONT_SCALE_MAX ? stored : 1;
    })();

    function pageWidth() {
      return (frameEl && frameEl.contentWindow && frameEl.contentWindow.innerWidth) || frameEl.clientWidth || 1;
    }

    // 章節每次都是全新的 iframe 文件（換章節等於整份文件重新載入），這裡
    // 先把「這份文件原本、還沒被我們動過」的字級記在 `body` 的
    // `data-` 屬性上（只在文件第一次套用時量一次），之後不管字級調整幾次
    // 都是以這個原始值為基準乘上目前的縮放倍率，不會因為連續調整而複合
    // 疊加（例如放大兩次不會變成 1.1 x 1.1，而是單純的 1 + 2 * 0.1）。
    function applyFontScale(doc) {
      const body = doc.body;
      if (!body) return;
      if (!body.dataset.cng5BaseFontSize) {
        const natural = parseFloat(doc.defaultView.getComputedStyle(body).fontSize);
        body.dataset.cng5BaseFontSize = String(Number.isFinite(natural) && natural > 0 ? natural : 16);
      }
      const base = parseFloat(body.dataset.cng5BaseFontSize);
      body.style.setProperty("font-size", `${base * fontScale}px`, "important");
    }

    // 字級改變會動到每行能放幾個字/欄裡能塞幾行，分頁邊界整個要重算——跟
    // 面板拖拉縮放大小是同一種情況，直接借用 `recomputeAfterResize`
    // 「保留目前讀到大概幾成的位置、重新分頁」那套邏輯，不用重複寫一次。
    function changeFontScale(delta) {
      const next = Math.min(FONT_SCALE_MAX, Math.max(FONT_SCALE_MIN, Math.round((fontScale + delta) * 10) / 10));
      if (next === fontScale) return;
      fontScale = next;
      localStorage.setItem(FONT_SCALE_STORAGE_KEY, String(fontScale));
      const doc = frameEl && frameEl.contentDocument;
      if (!doc || !doc.body) return;
      applyFontScale(doc);
      recomputeAfterResize();
    }

    function updateToolbarText() {
      if (!titleEl || !current) return;
      const { meta } = current;
      titleEl.textContent =
        `${meta.title} · 第 ${meta.current_chapter + 1}/${meta.spine.length} 章 · ` +
        `第 ${pageIndex + 1}/${pageCount} 頁 · ${meta.progress_percent}%`;
    }

    // 依 `writing-mode` 判斷這一章是橫式還是直式，套用完全不同的量測方式
    // （見 `measureHorizontalChapter`/`measureVerticalChapter` 各自的說明，
    // 兩者不能共用同一套邏輯——`inject_pagination_style` 對兩種書套用的
    // CSS 完全不同）。回傳 `{ pageStep, pageCount }`：`pageStep` 是捲一頁要
    // 移動多少像素，`pageCount` 是這一章總共幾頁。
    function measureChapter(doc) {
      const cs = doc.defaultView.getComputedStyle(doc.body);
      const writingMode = cs.writingMode || "";
      const vertical = writingMode.indexOf("vertical") === 0;
      const result = vertical ? measureVerticalChapter(doc) : measureHorizontalChapter(doc, cs);
      return Object.assign({ vertical }, result);
    }

    // 換頁/換章節/resize 之後捲到指定頁的共用邏輯：直式書不能用
    // `window.scrollTo()`/`scrollIntoView`——這兩個都是在操作
    // `document.scrollingElement`（通常是 `<html>`），但直式書真正溢位的
    // 元素是 `body`（`body` 自己被設成 `overflow:hidden`，它自己的內容比
    // 自己的版面寬，這個溢位是 `body` 自己局部的捲動範圍，不是傳到最外層
    // 視窗），橫式書能用 `window.scrollTo()` 是因為那是多欄排版
    // （`column-width`）的溢位，多欄排版的欄位溢位規則本來就會傳到最外層
    // 視窗，跟這裡的一般區塊排版溢位是不同機制——這是實測畫面截圖才抓到
    // 的：console 印出來的 `scrollX`／算出來的頁碼都對，畫面卻還是停在
    // 第一頁沒有動，代表 `window.scrollTo()` 根本沒捲到真正在溢位、真正
    // 決定畫面顯示什麼的那個元素。改成直接設 `body.scrollLeft`（順便也設
    // `documentElement.scrollLeft`，兩個都設，不用猜到底哪一個才是真正
    // 生效的那個）。量出標記目前實際顯示在畫面的哪個位置
    // （`getBoundingClientRect()`，這一定準，不受任何捲動座標系正負號慣例
    // 影響），量出「應該對齊到視窗右邊」（這是量出來的——整章一開始完全
    // 沒捲動過的預設狀態，內容右邊界本來就跟視窗右邊界切齊，見
    // `measureVerticalChapter` 的討論）的距離，套用那個差值；如果套用後
    // 方向反了（不同瀏覽器對 `scrollLeft` 正負號的慣例本來就不統一），再
    // 往反方向修正一次——全部基於量出來的相對距離，不假設任何特定瀏覽器的
    // 正負號慣例。橫式書維持原本用 `window.scrollTo()`（CSS 多欄排版本身
    // 保證欄界對齊整行，見 `measureHorizontalChapter` 的說明，而且已經
    // 確認橫式書這樣做是正確的）。
    function scrollToPage(doc, index) {
      if (chapterVertical) {
        const marker = pageMarkers && pageMarkers[index];
        if (marker) {
          const html = doc.documentElement;
          const body = doc.body;
          const setScroll = (value) => {
            html.scrollLeft = value;
            body.scrollLeft = value;
          };
          // 最後一頁不能比照其他頁「把標記對齊到 target」：實測過，這一頁
          // 剩下的內容常常不到一整頁寬，硬要把標記對齊到跟其他頁一樣的
          // 位置，會逼近（甚至超過）瀏覽器真正可以捲動的最大範圍，捲動
          // 幅度卡在半路就不再前進，導致這一章最後一小段內容整個露在畫面
          // 外看不到（不是分頁算錯，是捲動幅度不夠遠）。改成直接把
          // `body` 自己的左邊界（也就是整章真正結尾的位置）貼齊畫面左邊
          // （目標 0），這樣最後一頁永遠看得到整章結尾，代價最多是跟前一
          // 頁多疊一點點內容——寧可多看幾行重複，也不要漏掉結尾。
          const isLastPage = index === pageCount - 1;
          const target = isLastPage ? 0 : verticalPageTarget !== null ? verticalPageTarget : pageWidth();
          const readPos = () => (isLastPage ? body.getBoundingClientRect().left : marker.getBoundingClientRect().right);
          // 一次量測、套用就結束不夠準——實測連續兩頁之間會殘留幾行重複
          // 內容，代表捲動落點跟量出來的目標差了一點點（可能是瀏覽器剛
          // 套用捲動位置那一刻，geometry 還沒完全跟捲動同步）。改成反覆
          // 量測、修正最多幾次，每次都重新讀當下實際位置，直到誤差小到
          // 可以接受、或是已經修正到位置不再變化為止。
          for (let i = 0; i < 6; i++) {
            const before = readPos();
            const diff = before - target;
            if (Math.abs(diff) < 1) break;
            const startX = html.scrollLeft || body.scrollLeft || 0;
            setScroll(startX + diff);
            const after = readPos();
            if (Math.abs(after - before) < 0.5) {
              // 完全沒反應：這個正負號被夾住了（不同瀏覽器對 scrollLeft
              // 正負號慣例不一致），換相反方向再試一次。
              setScroll(startX - diff);
            }
          }
        }
        return;
      }
      doc.defaultView.scrollTo({ left: index * pageStep, top: 0 });
      // 防禦性補強：`window.scrollTo()` 操作的是 `document.scrollingElement`
      // （通常是 `<html>`），但實測抓到有些書的 `<html>` 自己完全沒有可
      // 捲動範圍（`scrollWidth` 等於 `clientWidth`），真正因為多欄排版而
      // 溢位、需要捲動的其實是 `body` 自己（`body` 自己就有
      // `overflow:hidden`，形成獨立、局部的捲動範圍，不會往外傳給
      // `<html>`）——這種情況下 `window.scrollTo()` 完全捲不動（陷面碼
      // 照樣往前算，畫面卻停在原地不動，翻到下一章才會變）。直接設
      // `body.scrollLeft`（同時也設 `html.scrollLeft`，以防某些書是後者
      // 才有效）。這裡驗證要讀 `body.scrollLeft` 本身，不能像量直式書那樣
      // 讀某個子元素的 `getBoundingClientRect()`——`body` 自己的
      // `getBoundingClientRect()` 反映的是它在外層（`<html>`）裡的位置，
      // 捲動 `body` 自己內部的內容並不會改變這個位置，之前這裡量錯元素，
      // 才會誤判成「怎麼設都沒反應」。
      const html = doc.documentElement;
      const body = doc.body;
      const target = index * pageStep;
      if (Math.abs(body.scrollLeft - target) > 0.5) {
        body.scrollLeft = target;
      }
      if (Math.abs(html.scrollLeft - target) > 0.5) {
        html.scrollLeft = target;
      }
    }

    // 橫式書：`inject_pagination_style` 插入的多欄排版 CSS 讓每一欄本來就
    // 剛好是一個畫面寬（`column-width: 100vw`），欄與欄的邊界一定落在整行
    // 文字的邊界上（多欄排版的換行機制保證），捲一頁固定是整個畫面寬
    // （`pageWidth()`），不需要額外取整。但「一欄裡塞了幾行」不保證剛好
    // 用滿整個畫面高，這裡要另外算出往下取整到整數倍行高的 `pageHeight`，
    // 設回 `<html>`/`<body>`（inline style 加 `!important`，蓋過
    // `inject_pagination_style` 插入的 `height: 100vh !important`，同源
    // `!important` inline style 的優先度比外部/內嵌樣式表高），不然版面
    // 最下面會卡進一行只露出上半截的文字。
    //
    // 算總共幾頁不能直接量已經分欄後的 `body.scrollWidth`：多欄排版遇到
    // 內容比一個畫面高時要「長」出額外欄位才能繼續往下排，這件事依賴
    // body 自己的寬度不能被釘死（見 `inject_pagination_style` 的說明），
    // 一旦欄位長不出來，`scrollWidth` 量到的永遠是「只有一頁」。改成暫時
    // 關掉多欄排版，量攤平單欄版面的 `scrollHeight`——這是最基本的區塊
    // 排版，不牽涉任何多欄溢位的實作細節，各瀏覽器算出來的數字完全一致，
    // 可靠得多；量完立刻把多欄排版接回來（`removeProperty` 讓
    // `inject_pagination_style` 插入的 stylesheet 規則重新生效），中間
    // 量測那一瞬間畫面會閃過一次單欄版面，但只有一個畫面更新週期，肉眼
    // 看不出來。
    // `line-height` 沒被書本身的 CSS 明確設成數字時（很多 epub 根本沒設這
    // 個屬性），`getComputedStyle` 回傳的是字面上的 `"normal"` 字串，不是
    // 解析過的像素數字，`parseFloat("normal")` 會得到 `NaN`，導致量測整個
    // 失敗、退回「當作只有一頁」——這正是直式書明明 `scrollWidth` 量得到
    // 一大堆內容、卻還是判斷成只有一頁的真正原因。用一個隱藏的探測元素撐
    // 出「一行文字」實際佔用的像素間接量出來：`writing-mode` 是會繼承的
    // 屬性，探測元素接在 `body` 底下自然套用同一份樣式，量橫式書要看它的
    // 高度、量直式書要看它的寬度（直式書的行進方向是垂直，一行文字佔用的
    // 是水平方向的寬度）。
    function resolveLineHeightPx(doc, cs, vertical) {
      const raw = parseFloat(cs.lineHeight);
      if (!Number.isNaN(raw) && raw > 0) {
        return raw;
      }
      const probe = doc.createElement("span");
      probe.textContent = "永";
      probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;margin:0;padding:0;border:0;";
      doc.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      probe.remove();
      return vertical ? rect.width : rect.height;
    }

    function measureHorizontalChapter(doc, cs) {
      const body = doc.body;
      const lineHeight = resolveLineHeightPx(doc, cs, false);
      const paddingTop = parseFloat(cs.paddingTop) || 0;
      const paddingBottom = parseFloat(cs.paddingBottom) || 0;
      const paddingLeft = parseFloat(cs.paddingLeft) || 0;
      const paddingRight = parseFloat(cs.paddingRight) || 0;
      const columnGap = parseFloat(cs.columnGap) || 0;
      const totalHeight = frameEl.clientHeight || 1;
      const usable = totalHeight - paddingTop - paddingBottom;
      // `column-width` 是 `box-sizing: border-box` 底下算的，`body` 自己
      // 又有左右 padding，實際能塞欄位內容的寬度比整個視窗窄（padding
      // 兩側的量）。`column-width` 設的是「理想」欄寬，比實際可用寬度還寬
      // 時，瀏覽器只能生出一欄剛好填滿實際可用寬度——也就是說每一欄真正
      // 的寬度其實是「視窗寬 - 左右 padding」，不是整個視窗寬。`padding`
      // 只加在整段欄位排版的最前/最後，不會每一欄之間重複出現，所以下一欄
      // 緊接著這一欄開始，若 `column-gap` 沒補上這段間距，下一欄的內容會
      // 提早露出來、疊在畫面右邊，造成「跑字」現象（CSS 端已把 `column-gap`
      // 設成跟 padding 一樣寬來擋住這個縫隙，這裡捲頁距離要一併算上這段
      // 間距，不然每次捲動的距離會少了這一截，翻頁會對不準）。
      const step = Math.max(1, pageWidth() - paddingLeft - paddingRight + columnGap);
      if (!lineHeight || Number.isNaN(lineHeight) || lineHeight <= 0 || usable <= 0) {
        return { pageStep: step, pageCount: 1 };
      }
      const linesPerPage = Math.max(1, Math.floor(usable / lineHeight));
      const pageHeight = linesPerPage * lineHeight + paddingTop + paddingBottom;

      body.style.setProperty("column-width", "auto", "important");
      body.style.setProperty("height", "auto", "important");
      const naturalHeight = body.scrollHeight;
      body.style.removeProperty("column-width");

      body.style.setProperty("height", `${pageHeight}px`, "important");
      doc.documentElement.style.setProperty("height", `${pageHeight}px`, "important");

      // 減一點點是為了吸收次像素等級的誤差，不會讓剛好整除的內容被誤判多
      // 算一頁空白頁；用 `ceil` 不是 `round`，多出來的一小段內容一定要算成
      // 獨立一頁，不能被捨去。
      const pageCount = Math.max(1, Math.ceil((naturalHeight - 0.5) / pageHeight));
      return { pageStep: step, pageCount };
    }

    // 直式書（`writing-mode: vertical-rl`）：`inject_pagination_style`
    // 完全不會對直式書套用多欄排版 CSS（原因見該函式的說明——多欄排版是
    // 依「行進方向」定義寬度的，直式書的行進方向是垂直，套了反而會把每一
    // 行文字拆成獨立一欄，跟「一頁一個畫面」完全對不上，這正是之前「直式
    // 書最左邊那一行被截斷」的原因）。直式書天生就是「文字寫滿一個畫面
    // 高，自動往左換下一行」，這個換行行為本身就會把內容往寬度方向延伸，
    // 效果跟橫式書靠多欄排版做到的事一樣，不需要套用任何 `column-*`
    // 屬性，`scrollWidth` 直接就是可信的，不用像橫式書那樣暫時關掉什麼
    // 才能量到準確的數字。
    //
    // 捲一頁的距離不能靠「假設全章每一行等寬」去猜：章節內文常常混雜標題
    // （字比較大）跟內文（字比較小），統一行寬只是概算，跟瀏覽器實際排出
    // 來的行界有落差，而且這個落差是累加的——愈後面的頁面誤差愈大，最後
    // 甚至會整行、整段文字被跳過去（頁面邊界算得比實際內容還遠，捲動位置
    // 直接超過去，中間內容看不到）。改成直接用 `Range.getClientRects()`
    // 量出瀏覽器真正排出來的每一行（每個文字節點可能跨好幾個 rect，一個
    // rect 就是一行），依可用寬度把連續的行分組成一頁一頁，在每一頁的
    // 起點插入一個看不見的標記元素，翻頁時呼叫該標記的
    // `scrollIntoView()`——完全用瀏覽器自己量出來的真實幾何跟原生捲動
    // 邏輯，不會累積誤差，也不用另外處理 `scrollLeft` 方向慣例的問題（見
    // `scrollToPage` 的說明）。
    function clearPageMarkers() {
      if (!pageMarkers) return;
      for (const marker of pageMarkers) {
        const parent = marker && marker.parentNode;
        if (parent) {
          parent.removeChild(marker);
          parent.normalize();
        }
      }
      pageMarkers = null;
    }

    function collectVerticalLineSegments(doc) {
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => (n.nodeValue && n.nodeValue.trim().length > 0 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP),
      });
      const segments = [];
      const range = doc.createRange();
      let node = walker.nextNode();
      while (node) {
        range.selectNodeContents(node);
        const rects = range.getClientRects();
        for (let i = 0; i < rects.length; i++) {
          const r = rects[i];
          if (r.width > 0 && r.height > 0) {
            segments.push({ node, rect: r });
          }
        }
        node = walker.nextNode();
      }
      // 由大到小：vertical-rl 的行進方向是由右到左，右邊界比較大的行在
      // 閱讀順序上比較前面。
      segments.sort((a, b) => b.rect.right - a.rect.right);
      return segments;
    }

    // 在指定文字節點裡二分搜尋，找出目標 rect（某一行）實際從第幾個字元
    // 開始——`getClientRects()` 只給幾何位置，不會直接告訴我們字元位移。
    // 不能用 caret 的 `top` 座標判斷：`top` 每次換行都會重置回接近 0，
    // 一個文字節點如果橫跨好幾行，`top` 不是全域單調遞增，二分搜尋依它
    // 找會找錯位置（這是這次翻頁「同一頁按下一頁卻幾乎沒動、後來又漏掉
    // 最後一頁」的真正原因）。直式書的行進方向是由右到左，`right` 座標
    // 才是全域單調遞減（同一行內不變，換到下一行才會變小），改用這個當
    // 比較依據。
    function findLineStartOffset(doc, node, rect) {
      const length = node.nodeValue.length;
      const probe = doc.createRange();
      const rectAt = (offset) => {
        probe.setStart(node, offset);
        probe.setEnd(node, offset);
        return probe.getClientRects()[0] || null;
      };
      const startRect = rectAt(0);
      if (startRect && Math.abs(startRect.right - rect.right) < 1) {
        return 0;
      }
      let lo = 0;
      let hi = length;
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        const r = rectAt(mid);
        if (!r) {
          hi = mid;
          continue;
        }
        if (r.right <= rect.right + 0.5) {
          hi = mid;
        } else {
          lo = mid + 1;
        }
      }
      return lo;
    }

    function computeVerticalPageBoundaries(doc, budget) {
      const segments = collectVerticalLineSegments(doc);
      if (segments.length === 0) return [];
      const boundarySegments = [segments[0]];
      let pageStartRight = segments[0].rect.right;
      for (let i = 1; i < segments.length; i++) {
        if (pageStartRight - segments[i].rect.right > budget) {
          boundarySegments.push(segments[i]);
          pageStartRight = segments[i].rect.right;
        }
      }
      // 先把每個邊界的字元位移都算好，再「從最後一頁往回」插標記：同一個
      // 文字節點如果橫跨好幾個頁面邊界（沒有段落分隔的長段落），
      // `Range.insertNode` 會把文字節點從插入點切成兩半，只影響插入點
      // 之後的部分，從比較後面的位移開始插，前面算好的位移才不會因為節點
      // 被切開而錯位。
      const offsets = boundarySegments.map((seg) => findLineStartOffset(doc, seg.node, seg.rect));
      const markers = new Array(boundarySegments.length);
      for (let i = boundarySegments.length - 1; i >= 0; i--) {
        const seg = boundarySegments[i];
        const marker = doc.createElement("span");
        marker.style.cssText = "display:inline-block;width:0;height:0;overflow:hidden;";
        const markerRange = doc.createRange();
        markerRange.setStart(seg.node, offsets[i]);
        markerRange.collapse(true);
        markerRange.insertNode(marker);
        markers[i] = marker;
      }
      return markers;
    }

    function measureVerticalChapter(doc) {
      clearPageMarkers();
      const cs = doc.defaultView.getComputedStyle(doc.body);
      const paddingLeft = parseFloat(cs.paddingLeft) || 0;
      const paddingRight = parseFloat(cs.paddingRight) || 0;
      const totalWidth = pageWidth();
      // 分組門檻不能直接用整個畫面寬：`body` 自己有 `padding`，內容真正能
      // 用的寬度要扣掉左右 padding，另外再扣一點點安全邊界（次像素捨入、
      // `scrollIntoView` 對齊時的些微誤差）——寧可讓某幾頁最後多留一點點
      // 空白，也不要讓分組塞進比畫面裝得下還多的內容，那樣會變成「翻頁
      // 翻到一半」還要再翻一次才是真的下一頁，最後一頁也會因為多出來的
      // 內容沒有下一個標記可以顯示，直接被跳過去。
      const budget = Math.max(1, totalWidth - paddingLeft - paddingRight - 4);
      pageMarkers = computeVerticalPageBoundaries(doc, budget);
      // 每一頁該對齊到畫面的哪個位置，不能直接用 `pageWidth()`（整個視窗
      // 寬）：章節一開始完全沒捲動過的預設狀態，第一行文字（含標題本身的
      // 字級/margin）本來就不是剛好切齊在視窗最右邊，而是內縮一段距離
      // （padding、標題自己的樣式）。這個「原本第一頁自然停在哪裡」的
      // 位置，才是其他每一頁都該對齊過去的目標——這裡趁章節剛載入、還沒
      // 被捲動過的這一刻量下來，直接用 `pageWidth()` 當目標，每一頁都會
      // 比正確位置多幾行的落差（少對齊到 padding／標題造成的內縮量）。
      verticalPageTarget = pageMarkers.length > 0 ? pageMarkers[0].getBoundingClientRect().right : pageWidth();
      return { pageCount: Math.max(1, pageMarkers.length) };
    }

    // iframe 換了新章節、真正排版完成之後才量得到正確的尺寸（`load` 事件
    // 本身可能早於樣式套用完成），用 `requestAnimationFrame` 保險等一個
    // 畫面週期；`measureHorizontalChapter` 改高度本身又會觸發一次新的
    // layout，所以再等一個畫面週期才捲到指定頁，不然捲動用的還是改高度
    // 之前的舊版面。`landing` 是這次要停在第幾頁：數字就直接用，`"last"`
    // 表示停在這章的最後一頁（從下一章往回翻的情境）。
    // 有些 epub 的 CSS 會用 app 專用的 `res://` 字型路徑（例如
    // `url(res:///system/fonts/...)`），瀏覽器根本讀不到，會先等一段字型
    // 載入逾時的時間才 fallback 回下一個字型；這段時間內量到的文字幾何
    // （`getClientRects()`）可能是還沒套用最終字型前的暫時排版，算出來的
    // 分頁邊界會不準——這正是「第一次開某一章分頁算錯，但重複測過的章節
    // 又正常」的原因（重複測過的章節，字型 fallback 早就穩定了）。用
    // `document.fonts.ready`（所有字型不管成功或失敗都確定下來才 resolve）
    // 卡住量測，等字型狀態穩定再排版，不能只靠 `requestAnimationFrame`
    // （那只保證畫面更新週期，不保證字型已經 fallback 完成）。
    //
    // `fonts.ready` 可能要等很久（`res://` 這種讀不到的字型，瀏覽器要等到
    // 逾時才 fallback，可能好幾秒），這段等待期間使用者很可能已經翻頁/換
    // 章節了——用 `measurementToken` 幫每一次呼叫編號，等到 promise/rAF
    // resolve 時如果編號已經跟目前最新的不一樣，就代表章節換過了，這次
    // 量測結果作廢，不能再拿舊章節（甚至已經被瀏覽器拆掉的舊 document）
    // 量出來的錯誤數字去蓋掉新章節剛設好的正確狀態，這正是「回上一章
    // 卻卡在只有一頁」的真正原因。
    function onFrameLoaded(landing) {
      const doc = frameEl.contentDocument;
      if (!doc || !doc.body) return;
      // 新章節是全新文件，套用目前的字級偏好，不然每換一章字級都會被
      // book 自己的原始 CSS 重設回去。
      applyFontScale(doc);
      const myToken = ++measurementToken;
      // 換章節這段期間（等字型穩定為止）標記起來，`recomputeAfterResize`
      // 看到這個標記就整個跳過，不會拿 `loadChapterAtPage` 剛重置、還沒被
      // 這裡填回正確答案的 `pageIndex=0`／`pageCount=1` 去算出錯誤的目標
      // 頁碼、搶著把捲動位置改回第一頁——這正是「回上一章卻卡在第一頁，
      // 不是最後一頁」的真正原因：`ResizeObserver` 觀察的容器（工具列文字
      // 長度改變、`updateToolbarText` 造成的版面微調）在換章節的過程中很
      // 容易被觸發，這個 resize 事件如果在字型穩定前就搶著跑完，就會用
      // 還沒設好的暫存值把正確結果蓋掉。
      chapterLoadInFlight = true;
      const fontsReady = (doc.fonts && doc.fonts.ready) || Promise.resolve();
      fontsReady.then(() => {
        if (myToken !== measurementToken) return;
        requestAnimationFrame(() => {
          if (myToken !== measurementToken) return;
          const measured = measureChapter(doc);
          requestAnimationFrame(async () => {
            if (myToken !== measurementToken) return;
            pageCount = measured.pageCount;
            pageStep = measured.pageStep || 1;
            chapterVertical = measured.vertical;
            pageIndex = landing === "last" ? pageCount - 1 : Math.min(Math.max(0, landing), pageCount - 1);
            // 實測過：剛載入章節直接跳到後面的頁碼（例如從下一章往回翻，
            // 落在這一章最後一頁）畫面會卡在第一頁不動，但同一章節內
            // 循序漸進按下一頁完全正常——代表問題不是分頁算錯或捲動方向
            // 錯，是瀏覽器對「剛載入的文件」的可捲動範圍判斷還沒跟上一次
            // 大跳躍的捲動（即使 `getBoundingClientRect()`/`scrollWidth`
            // 當下已經回報正確數字）。改成模擬使用者實際翻頁的路徑：先
            // 真的停在第一頁，一頁一頁循序捲到目標頁，讓瀏覽器逐步跟上。
            if (chapterVertical && pageIndex > 0) {
              scrollToPage(doc, 0);
              for (let i = 1; i <= pageIndex; i++) {
                await new Promise((resolve) => requestAnimationFrame(resolve));
                if (myToken !== measurementToken) return;
                scrollToPage(doc, i);
              }
            } else {
              scrollToPage(doc, pageIndex);
            }
            updateToolbarText();
            chapterLoadInFlight = false;
          });
        });
      });
    }

    // 面板被拖拉縮放時，`vw`/`vh` 單位讓瀏覽器自己重新排版（不需要我們
    // 插入任何新 CSS），但 `pageStep`／分頁數量／目前頁碼都是我們自己
    // 快取、依舊尺寸算出來的，要跟著重新算一次（`measureChapter`），並
    // 盡量停在同一個「讀到大概幾成」的位置（用比例換算到新的頁數，不是
    // 每次都跳回第一頁）。
    function recomputeAfterResize() {
      if (chapterLoadInFlight) return;
      const doc = frameEl && frameEl.contentDocument;
      if (!doc || !doc.body) return;
      const fraction = pageCount > 0 ? pageIndex / pageCount : 0;
      const measured = measureChapter(doc);
      requestAnimationFrame(() => {
        pageCount = measured.pageCount;
        pageStep = measured.pageStep || 1;
        chapterVertical = measured.vertical;
        pageIndex = Math.min(Math.round(fraction * pageCount), pageCount - 1);
        scrollToPage(doc, pageIndex);
        updateToolbarText();
      });
    }

    async function saveProgress(chapterIndex) {
      try {
        await fetch(`/api/ereader/book/${encodeURIComponent(current.name)}/progress`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chapter: chapterIndex }),
        });
      } catch (_err) {
        // 存進度失敗不影響當下閱讀，最多下次重開這本書時進度沒更新到最新。
      }
    }

    // `landing` 同 `onFrameLoaded` 的說明：換章節時要停在第幾頁。
    function loadChapterAtPage(chapterIndex, landing) {
      const { meta } = current;
      if (chapterIndex < 0 || chapterIndex >= meta.spine.length) return;
      meta.current_chapter = chapterIndex;
      meta.progress_percent = Math.round(((chapterIndex + 1) / meta.spine.length) * 100);
      pageIndex = 0;
      pageCount = 1;
      pageMarkers = null;
      verticalPageTarget = null;
      frameEl.dataset.landing = landing;
      frameEl.src = resourceUrl(current.name, meta.spine[chapterIndex].href);
      updateToolbarText();
      saveProgress(chapterIndex);
    }

    // 換頁：`direction` 是 +1（往後一頁）或 -1（往前一頁），絕對方向（跟畫面
    // 上哪顆按鈕/哪一側對應到這個方向是分開的兩件事，見 `renderReader`／
    // 分頁 tap zone 的說明）。超出這一章的頁面範圍就換到下一章／上一章，
    // 分別停在該章的第一頁／最後一頁，翻頁翻到章節邊界時感覺是連續的。
    function turnPage(direction) {
      if (!current) return;
      const next = pageIndex + direction;
      if (next >= 0 && next < pageCount) {
        pageIndex = next;
        const doc = frameEl.contentDocument;
        if (doc && doc.defaultView) {
          scrollToPage(doc, pageIndex);
        }
        updateToolbarText();
        return;
      }
      const nextChapter = current.meta.current_chapter + direction;
      loadChapterAtPage(nextChapter, direction > 0 ? 0 : "last");
    }

    function renderReader() {
      readerView.innerHTML = "";
      const { name, meta } = current;
      const toolbar = document.createElement("div");
      toolbar.className = "ereader-toolbar";
      const backBtn = document.createElement("button");
      backBtn.textContent = "← 書架";
      backBtn.addEventListener("click", showShelf);
      titleEl = document.createElement("span");
      titleEl.className = "ereader-toolbar-title";
      const fontMinusBtn = document.createElement("button");
      fontMinusBtn.textContent = "A-";
      fontMinusBtn.title = "縮小字體";
      fontMinusBtn.addEventListener("click", () => changeFontScale(-FONT_SCALE_STEP));
      const fontPlusBtn = document.createElement("button");
      fontPlusBtn.textContent = "A+";
      fontPlusBtn.title = "放大字體";
      fontPlusBtn.addEventListener("click", () => changeFontScale(FONT_SCALE_STEP));
      const prevBtn = document.createElement("button");
      prevBtn.title = "上一頁";
      prevBtn.addEventListener("click", () => turnPage(-1));
      const nextBtn = document.createElement("button");
      nextBtn.title = "下一頁";
      nextBtn.addEventListener("click", () => turnPage(1));
      toolbar.appendChild(backBtn);
      toolbar.appendChild(titleEl);
      toolbar.appendChild(fontMinusBtn);
      toolbar.appendChild(fontPlusBtn);
      // 直式（rtl）書翻頁習慣是從右到左，上一頁/下一頁按鈕的左右順序跟著
      // 對調（語意不變，還是「往前一頁」/「往後一頁」，只是哪個按鈕畫在
      // 左邊變了，符合直式書讀者的翻頁直覺）。符號故意不跟著「往前/往後」
      // 的語意走，而是跟著「畫面位置」走：不管橫式直式，畫在左邊的按鈕都
      // 用 `‹`、畫在右邊的都用 `›`，使用者單純憑左右位置操作，不用去記
      // 哪個符號對應哪個功能。
      if (meta.direction === "rtl") {
        nextBtn.textContent = "‹";
        prevBtn.textContent = "›";
        toolbar.appendChild(nextBtn);
        toolbar.appendChild(prevBtn);
      } else {
        prevBtn.textContent = "‹";
        nextBtn.textContent = "›";
        toolbar.appendChild(prevBtn);
        toolbar.appendChild(nextBtn);
      }

      const frameWrap = document.createElement("div");
      frameWrap.className = "ereader-frame-wrap";
      frameEl = document.createElement("iframe");
      frameEl.className = "ereader-frame";
      frameEl.setAttribute("sandbox", "allow-same-origin");
      frameEl.addEventListener("load", () => {
        const landing = frameEl.dataset.landing;
        onFrameLoaded(landing === "last" ? "last" : Number(landing) || 0);
      });
      // 點兩側翻頁：不用伸進 iframe 內部掛事件（每次換章節文件都會重來，
      // 而且 iframe 沒開 `allow-scripts`），疊在 iframe 上面兩塊透明區塊接
      // click 就好。方向跟按鈕一樣依 `direction` 對調，靠右/靠左要對應到
      // 「往後一頁」還是「往前一頁」。
      const leftZone = document.createElement("div");
      leftZone.className = "ereader-tap-zone ereader-tap-left";
      const rightZone = document.createElement("div");
      rightZone.className = "ereader-tap-zone ereader-tap-right";
      const forwardOnRight = meta.direction !== "rtl";
      leftZone.addEventListener("click", () => handleZoneClick(forwardOnRight ? -1 : 1));
      rightZone.addEventListener("click", () => handleZoneClick(forwardOnRight ? 1 : -1));
      frameWrap.appendChild(frameEl);
      frameWrap.appendChild(leftZone);
      frameWrap.appendChild(rightZone);

      // 滑動翻頁：往左滑＝往後一頁（LTR 書），跟 tap zone 同一套方向對調
      // 邏輯。滑動距離太短當成點擊，交給上面兩塊 tap zone 的 click 處理，
      // 不要兩邊都觸發翻頁。
      frameWrap.addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.touches[0].clientX;
        },
        { passive: true }
      );
      frameWrap.addEventListener(
        "touchend",
        (e) => {
          if (touchStartX === null) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          touchStartX = null;
          if (Math.abs(dx) < 40) return;
          suppressNextClick = true;
          // 手指往左滑（`dx < 0`）在 LTR 書等同「點右側」＝往後一頁，RTL 書
          // 方向相反，跟 tap zone 同一套 `forwardOnRight` 判斷。
          const forward = forwardOnRight ? dx < 0 : dx > 0;
          turnPage(forward ? 1 : -1);
        },
        { passive: true }
      );

      readerView.appendChild(toolbar);
      readerView.appendChild(frameWrap);

      // `renderReader` 不只換章節會呼叫（回書架再開別本書也會再呼叫一次），
      // 每次都要先把上一次的 observer 斷開，不然會一直疊加、觀察著已經被
      // `readerView.innerHTML = ""` 移除的舊 `frameWrap`。
      if (resizeObserver) resizeObserver.disconnect();
      resizeObserver = new ResizeObserver(recomputeAfterResize);
      resizeObserver.observe(frameWrap);

      const entry = meta.spine[meta.current_chapter];
      frameEl.dataset.landing = "0";
      frameEl.src = entry ? resourceUrl(name, entry.href) : "about:blank";
      updateToolbarText();
    }

    function handleZoneClick(direction) {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }
      turnPage(direction);
    }

    showShelf();
    refreshShelf();
    // 書架清單不需要像 worldclock/weather 那樣頻繁更新，這個間隔純粹是
    // 「用 storage 分頁上傳新書之後，書架多久能自動看到」，不用很短。
    const intervalId = setInterval(refreshShelf, 15000);

    return {
      container,
      stop() {
        stopped = true;
        clearInterval(intervalId);
        if (resizeObserver) resizeObserver.disconnect();
      },
    };
  }

  // 建立一個獨立運作的 topology 面板：定期 poll 上面兩個端點合併節點、依
  // 角色（broker/server/client）＋ domain 直接算出固定座標（見
  // `computeLayout`），不再跑力導向模擬，也不支援拖曳節點——固定佈局下手動
  // 拖曳沒有意義，下一次 poll 座標就會被算出來的固定值蓋掉。用 SVG 更新
  // 座標（不是整個重建 DOM，因為節點身分在兩次 poll 之間通常不變）。回傳
  // `{ container, stop }`，`stop()` 給 `closePanel` 呼叫，清掉 interval，
  // 不留背景在跑。
  function startTopology(container, svg, domainLayer, edgeLayer, nodeLayer, tooltip) {
    const sim = { nodes: new Map(), edges: [] };
    const domainEls = new Map();
    const edgeEls = new Map();
    const nodeEls = new Map();

    function panelSize() {
      const rect = svg.getBoundingClientRect();
      return { width: rect.width || 400, height: rect.height || 300 };
    }

    // 依角色＋domain 算出每個節點的固定座標：broker 置中最上排；具名 domain
    // 依名稱排序由左到右各佔一欄，不知道 domain 名稱的節點（`local/${id}`）
    // 另成一欄排在最後；欄內 server 排在上、client（含 standalone）排在下，
    // 同排多個節點在欄寬內水平等距展開。回傳 `Map<key, {x, y}>`（`key` 是
    // 節點 key 或 `"broker"`）。
    function computeLayout(nodesData, hasServer, width, height) {
      const domainOrder = [];
      const domainMembers = new Map();
      const localMembers = [];
      for (const n of nodesData.values()) {
        if (n.domain) {
          if (!domainMembers.has(n.domain)) {
            domainMembers.set(n.domain, []);
            domainOrder.push(n.domain);
          }
          domainMembers.get(n.domain).push(n);
        } else {
          localMembers.push(n);
        }
      }
      domainOrder.sort();
      const columns = domainOrder.map((d) => domainMembers.get(d));
      if (localMembers.length > 0) columns.push(localMembers);

      const positions = new Map();
      const brokerY = height * 0.2;
      const serverRowY = height * 0.5;
      const clientRowY = height * 0.8;

      if (hasServer) positions.set("broker", { x: width / 2, y: brokerY });

      const colWidth = columns.length > 0 ? width / columns.length : width;
      columns.forEach((members, colIndex) => {
        const colCenterX = colWidth * (colIndex + 0.5);
        const servers = members.filter((n) => n.report.mode === "server");
        const clients = members.filter((n) => n.report.mode !== "server");
        const spread = (list, y) => {
          const step = list.length > 1 ? Math.min(70, (colWidth - 44) / (list.length - 1)) : 0;
          list.forEach((n, i) => {
            const offset = (i - (list.length - 1) / 2) * step;
            positions.set(n.key, { x: colCenterX + offset, y });
          });
        };
        spread(servers, serverRowY);
        spread(clients, clientRowY);
      });

      return positions;
    }

    // 把 poll 拿到的節點集合套進 `sim.nodes`：消失的節點移除，新出現的節點
    // 用 `computeLayout` 算出的座標建立，本來就有的節點座標也用最新算出的
    // 值覆蓋（固定佈局每次 poll 都是同一套規則重算，不保留舊座標）。
    function applyPoll(nodesData, hasServer, width, height) {
      const layout = computeLayout(nodesData, hasServer, width, height);
      const wanted = new Set(nodesData.keys());
      if (hasServer) wanted.add("broker");
      for (const key of [...sim.nodes.keys()]) {
        if (!wanted.has(key)) sim.nodes.delete(key);
      }
      for (const key of wanted) {
        const pos = layout.get(key) || { x: width / 2, y: height / 2 };
        let n = sim.nodes.get(key);
        if (!n) {
          n = { x: pos.x, y: pos.y, isBroker: key === "broker", data: null };
          sim.nodes.set(key, n);
        } else {
          n.x = pos.x;
          n.y = pos.y;
        }
        if (key !== "broker") n.data = nodesData.get(key);
      }
    }

    function isAlive(n) {
      return !!n.data && n.data.ageSecs * 1000 < TOPOLOGY_ALIVE_TTL_MS;
    }

    function roleColor(mode) {
      if (mode === "server") return "#6f9dff";
      if (mode === "client") return "#4caf7d";
      return "#5a6272";
    }

    function showTooltip(key) {
      const n = sim.nodes.get(key);
      if (!n || n.isBroker || !n.data) {
        tooltip.style.display = "none";
        return;
      }
      const r = n.data.report;
      const alive = isAlive(n) ? "是" : "否";
      tooltip.textContent =
        `id: ${r.id}\nip: ${r.ip}\nos: ${r.os}\nversion: ${r.version}\nmode: ${r.mode}\n` +
        `device uptime: ${formatUptimeJs(r.device_uptime_secs)}\napp uptime: ${formatUptimeJs(r.app_uptime_secs)}\n` +
        `disk: ${formatDiskJs(r.disk_free_bytes, r.disk_total_bytes)}\nalive: ${alive}`;
      tooltip.style.display = "block";
    }

    function positionTooltip(e) {
      if (tooltip.style.display !== "block") return;
      const rect = container.getBoundingClientRect();
      tooltip.style.left = `${e.clientX - rect.left + 12}px`;
      tooltip.style.top = `${e.clientY - rect.top + 12}px`;
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    function buildNodeEl(key, n) {
      const group = document.createElementNS(SVGNS, "g");
      group.setAttribute("class", "topology-node");
      let shape;
      if (n.isBroker) {
        shape = document.createElementNS(SVGNS, "polygon");
        shape.setAttribute("class", "topology-broker");
        shape.setAttribute("points", "0,-20 17,-10 17,10 0,20 -17,10 -17,-10");
      } else {
        shape = document.createElementNS(SVGNS, "circle");
        shape.setAttribute("r", "18");
      }
      group.appendChild(shape);
      const label = document.createElementNS(SVGNS, "text");
      label.setAttribute("class", "topology-node-label");
      label.setAttribute("y", "32");
      group.appendChild(label);
      nodeLayer.appendChild(group);
      group.addEventListener("mouseenter", () => showTooltip(key));
      group.addEventListener("mousemove", positionTooltip);
      group.addEventListener("mouseleave", hideTooltip);
      return { group, shape, label };
    }

    function render() {
      // domain 外框：只框 `data.domain` 有值的節點（`local/${id}` 那種
      // domain 名稱不明的節點不畫框）。
      const groups = new Map();
      for (const [, n] of sim.nodes) {
        if (n.isBroker || !n.data || !n.data.domain) continue;
        if (!groups.has(n.data.domain)) groups.set(n.data.domain, []);
        groups.get(n.data.domain).push(n);
      }
      const seenDomains = new Set();
      for (const [domain, members] of groups) {
        seenDomains.add(domain);
        const pad = 30;
        const xs = members.map((m) => m.x);
        const ys = members.map((m) => m.y);
        const x = Math.min(...xs) - pad;
        const y = Math.min(...ys) - pad;
        const w = Math.max(...xs) - Math.min(...xs) + pad * 2;
        const h = Math.max(...ys) - Math.min(...ys) + pad * 2;
        let box = domainEls.get(domain);
        if (!box) {
          box = { rect: document.createElementNS(SVGNS, "rect"), label: document.createElementNS(SVGNS, "text") };
          box.rect.setAttribute("class", "topology-domain-box");
          box.label.setAttribute("class", "topology-domain-label");
          domainLayer.appendChild(box.rect);
          domainLayer.appendChild(box.label);
          domainEls.set(domain, box);
        }
        box.rect.setAttribute("x", x);
        box.rect.setAttribute("y", y);
        box.rect.setAttribute("width", w);
        box.rect.setAttribute("height", h);
        box.rect.setAttribute("rx", 12);
        box.label.setAttribute("x", x + 8);
        box.label.setAttribute("y", y + 16);
        box.label.textContent = domain;
      }
      for (const [domain, box] of [...domainEls]) {
        if (!seenDomains.has(domain)) {
          box.rect.remove();
          box.label.remove();
          domainEls.delete(domain);
        }
      }

      // 邊
      const seenEdges = new Set();
      for (const edge of sim.edges) {
        const a = sim.nodes.get(edge.from);
        const b = sim.nodes.get(edge.to);
        if (!a || !b) continue;
        const ekey = `${edge.from}|${edge.to}`;
        seenEdges.add(ekey);
        let line = edgeEls.get(ekey);
        if (!line) {
          line = document.createElementNS(SVGNS, "line");
          line.setAttribute("class", "topology-edge");
          edgeLayer.appendChild(line);
          edgeEls.set(ekey, line);
        }
        line.setAttribute("x1", a.x);
        line.setAttribute("y1", a.y);
        line.setAttribute("x2", b.x);
        line.setAttribute("y2", b.y);
      }
      for (const [ekey, line] of [...edgeEls]) {
        if (!seenEdges.has(ekey)) {
          line.remove();
          edgeEls.delete(ekey);
        }
      }

      // 節點
      const seenNodes = new Set();
      for (const [key, n] of sim.nodes) {
        seenNodes.add(key);
        let el = nodeEls.get(key);
        if (!el) {
          el = buildNodeEl(key, n);
          nodeEls.set(key, el);
        }
        el.group.setAttribute("transform", `translate(${n.x},${n.y})`);
        if (n.isBroker) {
          el.label.textContent = "MQTT broker";
        } else if (n.data) {
          const alive = isAlive(n);
          el.shape.setAttribute("fill", alive ? roleColor(n.data.report.mode) : "#3a4150");
          el.shape.setAttribute("stroke", alive ? "none" : "#6b7280");
          el.shape.setAttribute("stroke-width", alive ? "0" : "2");
          el.shape.setAttribute("stroke-dasharray", alive ? "0" : "3,3");
          el.label.textContent = n.data.report.id;
        }
      }
      for (const [key, el] of [...nodeEls]) {
        if (!seenNodes.has(key)) {
          el.group.remove();
          nodeEls.delete(key);
        }
      }
    }

    // 上一次 poll 拿到的節點資料，給 `onResize` 在不打網路請求的情況下
    // 重算佈局用（見下面 `onResize` 的說明）。
    let lastNodesData = null;
    let lastHasServer = false;

    async function pollOnce() {
      const nodesData = await fetchTopologyNodes();
      const { edges, hasServer } = computeTopologyEdges(nodesData);
      lastNodesData = nodesData;
      lastHasServer = hasServer;
      const { width, height } = panelSize();
      applyPoll(nodesData, hasServer, width, height);
      sim.edges = edges;
      render();
    }

    // panel 大小改變的原因很多（拖拉縮放、最小化、最大化、瀏覽器視窗本身
    // 縮放……），固定式佈局是依面板目前尺寸算出來的，尺寸一變就該立刻重新
    // 排版，不用等到下一次 poll（最長 `TOPOLOGY_POLL_MS`，約 2.5 秒）才
    // 跟上——用上一次 poll 拿到的節點資料重算座標、重繪即可，不需要（也
    // 不應該）為了單純的版面調整重新打一次網路請求。跟 shell 面板的
    // `fitAddon.fit()` 用同一套 ResizeObserver 模式（見上面 shell 面板
    // 那段）。
    function onResize() {
      if (!lastNodesData) return;
      const { width, height } = panelSize();
      applyPoll(lastNodesData, lastHasServer, width, height);
      render();
    }
    const resizeObserver = new ResizeObserver(onResize);
    resizeObserver.observe(svg);

    pollOnce();
    const intervalId = setInterval(pollOnce, TOPOLOGY_POLL_MS);

    return {
      container,
      stop() {
        clearInterval(intervalId);
        resizeObserver.disconnect();
      },
    };
  }

  // `opts.file` 目前只有 storage panel 點 `notepad/` 資料夾底下的檔名時會
  // 帶——panel 已經開著就直接切換它顯示的檔案（`notepadUi.loadFile`），不用
  // 使用者自己按 Ctrl-F 再選一次；panel 還沒開的話，見下面 notepad 分支怎麼
  // 用這個值決定初次載入哪個檔案。
  function openPanel(name, opts) {
    if (open.has(name)) {
      const entry = open.get(name);
      bringToFront(entry.el);
      if (opts && opts.file && entry.notepadUi) {
        entry.notepadUi.loadFile(opts.file);
      }
      return;
    }
    const panel = document.createElement("div");
    panel.className = "panel";
    const offset = 24 * (cascade++ % 8);
    panel.style.left = `${40 + offset}px`;
    panel.style.top = `${40 + offset}px`;
    panel.style.width = "360px";
    panel.style.height = "220px";

    const title = document.createElement("div");
    title.className = "panel-title";
    const label = document.createElement("span");
    label.textContent = name;

    const buttons = document.createElement("div");
    buttons.className = "panel-buttons";
    const minimizeBtn = document.createElement("button");
    minimizeBtn.className = "minimize";
    minimizeBtn.textContent = "_";
    const maximizeBtn = document.createElement("button");
    maximizeBtn.className = "maximize";
    maximizeBtn.textContent = "□";
    const close = document.createElement("button");
    close.className = "close";
    close.textContent = "×";
    close.addEventListener("click", () => closePanel(name));
    buttons.appendChild(minimizeBtn);
    buttons.appendChild(maximizeBtn);
    buttons.appendChild(close);

    title.appendChild(label);
    title.appendChild(buttons);
    title.addEventListener("mousedown", (e) => {
      if (buttons.contains(e.target) || layoutState === "maximized" || layoutState === "minimized") return;
      startDrag(panel, e);
    });

    // `player`（獨立的播放器面板，見下面）以外的 panel 都用同一份純文字 body，
    // 訂閱 `/api/panel/<name>/stream`——`music` 現在也是其中之一：播放/檔案
    // 管理都搬去 `player` panel 了，這裡就只是照一般 plugin 顯示 `list_text()`
    // 的純文字內容。
    let body;
    let musicUi = null;
    let shellUi = null;
    let notepadUi = null;
    let storageUi = null;
    let dataTableUi = null;
    let topologyUi = null;
    let weatherUi = null;
    let worldclockUi = null;
    let ereaderUi = null;
    let todoUi = null;
    if (name === "player") {
      // 跟任何 plugin 都無關的獨立播放器：不訂閱 SSE（`body` 保持 `undefined`），
      // 左邊檔案清單＋下載列，右邊封面＋播放控制。
      panel.style.width = "480px";
      panel.style.height = "340px";

      const container = document.createElement("div");
      container.className = "player-body";

      const left = document.createElement("div");
      left.className = "player-left";
      const fileList = document.createElement("div");
      fileList.className = "music-files";
      const downloadRow = document.createElement("div");
      downloadRow.className = "player-download-row";
      const fileCount = document.createElement("span");
      fileCount.className = "player-file-count";
      const urlInput = document.createElement("input");
      urlInput.type = "text";
      urlInput.placeholder = "YouTube 連結...";
      urlInput.className = "player-url-input";
      const downloadBtn = document.createElement("button");
      downloadBtn.textContent = "Download";
      downloadRow.appendChild(fileCount);
      downloadRow.appendChild(urlInput);
      downloadRow.appendChild(downloadBtn);
      left.appendChild(fileList);
      left.appendChild(downloadRow);

      const right = document.createElement("div");
      right.className = "player-right";
      // 只留封面（不做歌詞/頻譜/放射狀頻譜循環切換）：聲音品質優先，這個
      // panel 不碰 Web Audio API，只用普通 `<audio>` 元素播放（見下面
      // `playPauseBtn`/Media Session 那段的說明）。
      const cover = document.createElement("img");
      cover.className = "player-cover-slot player-cover";
      cover.alt = "";
      // 這首歌沒有封面（`404`）就讓圖片直接空著，不要顯示瀏覽器預設的
      // 破圖示。
      cover.addEventListener("error", () => cover.removeAttribute("src"));
      const seekRow = document.createElement("div");
      seekRow.className = "player-seek-row";
      const seekBar = document.createElement("input");
      seekBar.type = "range";
      seekBar.className = "player-seek";
      seekBar.min = "0";
      seekBar.max = "0";
      seekBar.value = "0";
      seekBar.step = "0.1";
      const timeLabel = document.createElement("span");
      timeLabel.className = "player-time";
      timeLabel.textContent = "0:00/0:00";
      seekRow.appendChild(seekBar);
      seekRow.appendChild(timeLabel);
      const trackName = document.createElement("div");
      trackName.className = "player-track-name";
      trackName.textContent = "(尚未播放)";
      // 目前播放這首歌旁邊也放一顆收藏按鈕（跟檔案清單那顆是同一個開關，
      // 見 `updateNowPlayingFavButton`），不用特地捲到清單裡找到那一列才能
      // 標記——聽到喜歡的歌、當下就能標記。還沒開始播放（`musicUi.currentName`
      // 是 `null`）時沒有目標可以標記，直接停用。
      const trackNameRow = document.createElement("div");
      trackNameRow.className = "player-track-name-row";
      const nowPlayingFavBtn = document.createElement("button");
      nowPlayingFavBtn.className = "player-now-playing-fav-btn";
      nowPlayingFavBtn.disabled = true;
      nowPlayingFavBtn.textContent = "☆";
      nowPlayingFavBtn.addEventListener("click", async () => {
        if (!musicUi.currentName) return;
        const res = await fetch(`/api/music/file/${encodeURIComponent(musicUi.currentName)}/favorite`, { method: "POST" });
        const body = await res.json();
        if (body.favorite) {
          musicUi.favorites.add(musicUi.currentName);
        } else {
          musicUi.favorites.delete(musicUi.currentName);
        }
        updateNowPlayingFavButton(musicUi);
      });
      trackNameRow.appendChild(nowPlayingFavBtn);
      trackNameRow.appendChild(trackName);
      const rightControls = document.createElement("div");
      rightControls.className = "player-controls";
      // 播放模式按鈕：依序播放 -> 隨機播放 -> 播放單首，循環切換，只影響
      // 一首歌自然播完（`ended` 事件）之後接下來要做什麼；手動按上一首/
      // 下一首永遠照清單順序走，不受這個模式影響（跟大部分播放器的習慣
      // 一致：模式只管「自動接下一首」的行為，手動操作永遠照使用者按的）。
      // 圖示都要單色，不要用 🔁🔀🔂 這種全彩 emoji——那幾個在大部分系統的
      // emoji 字型裡本身就帶顏色/色底，跟其他單色按鈕擺在一起風格不一致。
      // 三個狀態的圖示也要各自不同、一眼就能分辨：依序是兩個並排、都指向右邊
      // 的箭頭，單曲是繞一圈回原地的箭頭；隨機播放要畫成「兩條路徑交叉而過」
      // 的樣子（不是一般打叉的直線 X），Unicode 沒有現成的純文字字元長這樣，
      // 所以這個圖示改成一小段內嵌 SVG（`stroke="currentColor"`，顏色自動
      // 跟著按鈕的文字顏色走，不會額外帶自己的顏色/底色）。
      // 兩條路徑左邊、右邊都各自是一小段水平的平行線（左邊上下各一條、右邊
      // 上下各一條，同一條路徑左右兩段互相平行），只有中間那段用曲線彎過去
      // 交叉、換到另一邊，右邊收尾接一個「>」形的箭頭。這樣才會是「兩側平行、
      // 只有中間交叉」的樣子，不是頭尾都直通、看起來像打叉的一整條斜線。
      const SHUFFLE_ICON =
        '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em">' +
        '<path d="M4 7 L9 7 C12 7 12 17 15 17 L17 17"></path>' +
        '<path d="M17 14 L21 17 L17 20"></path>' +
        '<path d="M4 17 L9 17 C12 17 12 7 15 7 L17 7"></path>' +
        '<path d="M17 4 L21 7 L17 10"></path>' +
        "</svg>";
      const PLAY_MODES = [
        { mode: "sequential", icon: "⇉", title: "依序播放" },
        { mode: "shuffle", icon: SHUFFLE_ICON, title: "隨機播放" },
        { mode: "single", icon: "↻", title: "播放單首" },
      ];
      const modeBtn = document.createElement("button");
      modeBtn.className = "player-mode-btn";
      modeBtn.innerHTML = PLAY_MODES[0].icon;
      modeBtn.title = PLAY_MODES[0].title;
      modeBtn.addEventListener("click", () => {
        const idx = PLAY_MODES.findIndex((m) => m.mode === musicUi.playMode);
        const next = PLAY_MODES[(idx + 1) % PLAY_MODES.length];
        musicUi.playMode = next.mode;
        modeBtn.innerHTML = next.icon;
        modeBtn.title = next.title;
      });
      // 這幾個媒體控制符號（⏮ ▶ ⏸ ⏭）在 Unicode 裡同時有純文字／全彩 emoji
      // 兩種畫法，不少系統的 emoji 字型預設會畫成帶色底的圖示——跟 modeBtn
      // 那幾個圖示同樣的毛病（見上面 PLAY_MODES 的說明）。在字元後面加上
      // `︎`（文字呈現的 variation selector）明確要求瀏覽器用純文字/單色
      // 畫法，不要套用 emoji 那份帶顏色的畫法。
      const TEXT_STYLE = "︎";
      const prevBtn = document.createElement("button");
      prevBtn.textContent = "⏮" + TEXT_STYLE;
      prevBtn.title = "上一首";
      const playPauseBtn = document.createElement("button");
      playPauseBtn.className = "player-playpause-btn";
      function setPlayPauseIcon(paused) {
        playPauseBtn.textContent = (paused ? "▶" : "⏸") + TEXT_STYLE;
        playPauseBtn.classList.toggle("is-play-icon", paused);
      }
      setPlayPauseIcon(true);
      playPauseBtn.title = "播放/暫停";
      const nextBtn = document.createElement("button");
      nextBtn.textContent = "⏭" + TEXT_STYLE;
      nextBtn.title = "下一首";
      const transport = document.createElement("div");
      transport.className = "player-transport";
      transport.appendChild(prevBtn);
      transport.appendChild(playPauseBtn);
      transport.appendChild(nextBtn);
      // 播放模式自己一排，放在上一首/播放/下一首那排下面，兩排都置中。
      const modeRow = document.createElement("div");
      modeRow.className = "player-mode-row";
      modeRow.appendChild(modeBtn);
      rightControls.appendChild(transport);
      rightControls.appendChild(modeRow);
      // 迷你歌詞：放在播放模式按鈕下面，只留幾行高度，自動捲動讓目前唱到
      // 的那一行維持在可視範圍內。
      const lyricsMini = document.createElement("div");
      lyricsMini.className = "player-lyrics-mini";
      right.appendChild(cover);
      right.appendChild(seekRow);
      right.appendChild(trackNameRow);
      right.appendChild(rightControls);
      right.appendChild(lyricsMini);

      container.appendChild(left);
      container.appendChild(right);

      const player = document.createElement("audio");
      container.appendChild(player);

      musicUi = {
        container,
        fileList,
        fileCount,
        player,
        cover,
        trackName,
        nowPlayingFavBtn,
        seekBar,
        timeLabel,
        lyricsEl: lyricsMini,
        lyricsLines: [],
        lyricsActiveIndex: -1,
        playlist: [],
        favorites: new Set(),
        currentName: null,
        playMode: PLAY_MODES[0].mode,
        stopPolling: () => {},
      };

      // 上一首永遠照清單順序走（隨機播放模式下沒有「上一首」的歷史紀錄可以
      // 回溯，照順序走是最直覺的退回方式）；下一首在隨機播放模式下則是真的
      // 隨機換一首，跟「隨機播放模式下一首歌自然播完」的行為一致。
      prevBtn.addEventListener("click", () => offsetTrack(musicUi, -1));
      nextBtn.addEventListener("click", () => goToNextTrack(musicUi));
      playPauseBtn.addEventListener("click", () => {
        if (player.paused) {
          if (!musicUi.currentName && musicUi.playlist.length > 0) {
            playByName(musicUi, musicUi.playlist[0]);
          } else {
            player.play();
          }
        } else {
          player.pause();
        }
      });
      player.addEventListener("play", () => { setPlayPauseIcon(false); });
      player.addEventListener("pause", () => { setPlayPauseIcon(true); });
      player.addEventListener("ended", () => advanceOnEnded(musicUi));

      // 註冊 Media Session：手機瀏覽器鎖螢幕/切到背景時，有註冊 Media Session
      // 的分頁會被系統當成正在做媒體播放，鎖屏畫面/通知列會出現歌名＋播放控制
      // 卡片，也比較不會被系統的省電機制當成一般背景分頁砍掉。歌名/封面則是
      // 每次換歌時（見 `playByName`）另外更新、也重新呼叫一次這裡（見
      // `setMediaSessionActionHandlers` 模組層級的說明）。
      setMediaSessionActionHandlers(musicUi);

      // 進度條：`loadedmetadata` 才拿得到這首歌的總長度（`duration`），拖拉中
      // （`input` 事件，每移動一點就會觸發）直接即時 seek，同時標記 `seeking`，
      // 讓 `timeupdate` 暫時不要去覆蓋使用者正在拖的位置——不然拖到一半畫面
      // 又被播放進度跳回去，會覺得拖不動。
      let seeking = false;
      player.addEventListener("loadedmetadata", () => {
        seekBar.max = String(player.duration || 0);
        updateTimeLabel(musicUi);
      });
      player.addEventListener("timeupdate", () => {
        if (!seeking) seekBar.value = String(player.currentTime);
        updateLyricsHighlight(musicUi);
        updateTimeLabel(musicUi);
      });
      seekBar.addEventListener("input", () => {
        seeking = true;
        player.currentTime = Number(seekBar.value);
        updateTimeLabel(musicUi);
      });
      seekBar.addEventListener("change", () => {
        seeking = false;
      });

      // 下載跟終端機打 `plugin enter music` -> `download <url>` -> `~` 是同一件
      // 事，只是自動連續送出三行指令——`download` 只在 `music` plugin mode 底下
      // 才認得，送完照樣退回 root，不留著佔用共用的 Shell mode。
      downloadBtn.addEventListener("click", async () => {
        const url = urlInput.value.trim();
        if (!url) return;
        urlInput.value = "";
        await execLine("~");
        await execLine("plugin enter music");
        const result = await execLine(`download "${url}"`);
        await execLine("~");
        if (result.error) {
          window.alert(`下載失敗: ${result.error}`);
        }
      });
    } else if (name === "shell") {
      // 跟 `player` 一樣完全獨立於任何 plugin、不透過 `Shell`：每次開這個
      // panel 都跟後端要一個全新的 PTY + 真正的 host shell（`/api/shell/ws`，
      // 見 `web.rs` 的 `shell_ws`），關掉 panel 後端就會把對應的子行程清掉。
      panel.style.width = "640px";
      panel.style.height = "400px";

      const container = document.createElement("div");
      container.className = "shell-body";

      const term = new Terminal({
        convertEol: false,
        cursorBlink: true,
        theme: { background: "#1b1e26", foreground: "#d8dee9" },
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(container);

      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${wsProtocol}//${location.host}/api/shell/ws`);
      ws.binaryType = "arraybuffer";

      // 鍵盤輸入固定用 binary frame 送原始位元組；resize 控制訊息固定用
      // text frame 送 JSON——兩種訊息用 WebSocket 本來就有的 text/binary
      // 分類分開，後端才能明確分辨，不用另外設計一套包裝格式（見 `web.rs`
      // 的 `shell_ws`／`ShellControlMessage` 說明）。
      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) ws.send(new TextEncoder().encode(data));
      });
      term.onResize(({ cols, rows }) => {
        if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ resize: { cols, rows } }));
      });
      ws.addEventListener("open", () => {
        fitAddon.fit();
        term.focus();
      });
      ws.addEventListener("message", (e) => {
        if (e.data instanceof ArrayBuffer) term.write(new Uint8Array(e.data));
      });
      ws.addEventListener("close", () => {
        term.write("\r\n\x1b[90m[連線已關閉]\x1b[0m\r\n");
      });

      // panel 大小改變的原因很多（拖拉縮放、最小化、最大化、瀏覽器視窗
      // 本身縮放…），與其在每個會改變大小的地方個別呼叫 `fitAddon.fit()`，
      // 用 ResizeObserver 直接看容器實際尺寸有沒有變，統一處理、不會漏掉。
      const resizeObserver = new ResizeObserver(() => fitAddon.fit());
      resizeObserver.observe(container);

      shellUi = { container, term, ws, resizeObserver };
    } else if (name === "topology") {
      panel.style.width = "640px";
      panel.style.height = "420px";

      const container = document.createElement("div");
      container.className = "topology-body";
      const svg = document.createElementNS(SVGNS, "svg");
      svg.setAttribute("class", "topology-svg");
      const domainLayer = document.createElementNS(SVGNS, "g");
      const edgeLayer = document.createElementNS(SVGNS, "g");
      const nodeLayer = document.createElementNS(SVGNS, "g");
      svg.appendChild(domainLayer);
      svg.appendChild(edgeLayer);
      svg.appendChild(nodeLayer);
      const tooltip = document.createElement("div");
      tooltip.className = "topology-tooltip";
      container.appendChild(svg);
      container.appendChild(tooltip);

      topologyUi = startTopology(container, svg, domainLayer, edgeLayer, nodeLayer, tooltip);
    } else if (name === "weather") {
      // 跟 `topology` 一樣完全獨立於一般 plugin 的純文字 SSE 顯示，改成
      // 左側地區清單＋右側大圖，見 `startWeather` 的說明。
      panel.style.width = "560px";
      panel.style.height = "400px";

      const container = document.createElement("div");
      container.className = "weather-body";
      const sidebar = document.createElement("div");
      sidebar.className = "weather-sidebar";
      const main = document.createElement("div");
      main.className = "weather-main";
      container.appendChild(sidebar);
      container.appendChild(main);

      weatherUi = startWeather(container, sidebar, main);
    } else if (name === "worldclock") {
      // 跟 `topology`/`weather` 一樣完全獨立於一般 plugin 的純文字 SSE 顯示，
      // 世界地圖 + 晨昏線 + 城市點，見 `startWorldClock` 的說明。
      panel.style.width = "640px";
      panel.style.height = "420px";

      const container = document.createElement("div");
      container.className = "worldclock-body";
      const svg = document.createElementNS(SVGNS, "svg");
      svg.setAttribute("class", "worldclock-svg");
      svg.setAttribute("viewBox", `0 0 ${WORLDCLOCK_MAP_W} ${WORLDCLOCK_MAP_H}`);
      const landLayer = document.createElementNS(SVGNS, "g");
      const nightPath = document.createElementNS(SVGNS, "path");
      nightPath.setAttribute("class", "worldclock-night");
      const cityLayer = document.createElementNS(SVGNS, "g");
      svg.appendChild(landLayer);
      svg.appendChild(nightPath);
      svg.appendChild(cityLayer);
      container.appendChild(svg);

      worldclockUi = startWorldClock(container, svg, landLayer, nightPath, cityLayer);
    } else if (name === "ereader") {
      // 跟 `worldclock`/`weather` 一樣完全獨立於一般 plugin 的純文字 SSE
      // 顯示，書架＋閱讀畫面，見 `startEreader` 的說明。
      panel.style.width = "560px";
      panel.style.height = "440px";

      const container = document.createElement("div");
      container.className = "ereader-body";

      ereaderUi = startEreader(container);
    } else if (name === "notepad") {
      // 跟 `player`/`shell` 一樣完全獨立於一般 plugin 的純文字 SSE 顯示：
      // 讀寫後端的筆記檔案（`/api/notepad/content`，見 `web.rs`），跟終端機
      // 那邊各自讀寫同一批檔案，不即時同步彼此的編輯狀態（見 `web.rs` 的
      // `notepad_get_content`/`notepad_save_content` 說明）。檢視模式
      // （`viewEl`）顯示渲染好的 markdown；按 Ctrl-E 切到編輯模式
      // （`editEl`）：左邊是原始文字的 `<textarea>`、右邊即時渲染預覽；
      // Ctrl-F 切換要顯示/編輯的檔案。跟終端機用同一套 Ctrl-E/Ctrl-F/
      // Ctrl-S/Ctrl-X 快速鍵語意（見 `gui.rs` 的 `notepad_editing`/
      // `notepad_prompting` 那段），只是終端機沒有並排預覽的畫面空間，
      // 這裡有。
      panel.style.width = "640px";
      panel.style.height = "440px";

      const container = document.createElement("div");
      container.className = "notepad-body";

      const viewEl = document.createElement("div");
      viewEl.className = "notepad-view";
      viewEl.tabIndex = 0;

      const editEl = document.createElement("div");
      editEl.className = "notepad-edit";
      editEl.style.display = "none";
      const textarea = document.createElement("textarea");
      textarea.className = "notepad-textarea";
      textarea.spellcheck = false;
      const previewEl = document.createElement("div");
      previewEl.className = "notepad-preview";
      editEl.appendChild(textarea);
      editEl.appendChild(previewEl);

      // 快速鍵提示（左）＋目前檔名（右），用 flex 兩端對齊，不用像終端機
      // 那樣手動算空白補齊——網頁字型不是等寬網格，補空白對不齊。
      const hint = document.createElement("div");
      hint.className = "notepad-hint";
      const hintText = document.createElement("span");
      const hintName = document.createElement("span");
      hintName.className = "notepad-hint-name";
      hint.appendChild(hintText);
      hint.appendChild(hintName);

      // Ctrl-F 按下後取代 `hint` 顯示的檔名輸入框，位置/樣式跟 `hint` 一致
      // （兩者互斥切換 `display`），輸入完按 Enter 確認、Esc 放棄。
      const filenameInput = document.createElement("input");
      filenameInput.type = "text";
      filenameInput.className = "notepad-filename-input";
      filenameInput.style.display = "none";
      filenameInput.spellcheck = false;

      container.appendChild(viewEl);
      container.appendChild(editEl);
      container.appendChild(hint);
      container.appendChild(filenameInput);

      // `opts.file`：storage panel 點 `notepad/` 資料夾底下的檔名開這個
      // panel 時，第一次載入直接顯示那個檔案，不是永遠固定顯示
      // `notepad.md`。
      const state = { savedContent: "", editing: false, promptingFile: false, name: (opts && opts.file) || "notepad.md" };

      function updateHint() {
        hintName.textContent = state.name;
        hintText.textContent = state.editing ? "Ctrl-S 儲存並離開　Ctrl-X 放棄修改" : "Ctrl-E 編輯　Ctrl-F 切換檔案";
      }

      function renderView() {
        viewEl.innerHTML = state.savedContent.trim()
          ? renderMarkdown(state.savedContent)
          : '<span class="notepad-empty">(空白，按 Ctrl-E 開始編輯)</span>';
        updateHint();
      }

      function enterEdit() {
        state.editing = true;
        textarea.value = state.savedContent;
        previewEl.innerHTML = renderMarkdown(state.savedContent);
        viewEl.style.display = "none";
        editEl.style.display = "flex";
        updateHint();
        textarea.focus();
      }

      function exitEdit() {
        state.editing = false;
        viewEl.style.display = "";
        editEl.style.display = "none";
        renderView();
        viewEl.focus();
      }

      async function save() {
        await fetch("/api/notepad/content", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: state.name, content: textarea.value }),
        });
        state.savedContent = textarea.value;
        exitEdit();
      }

      async function loadFile(fileName) {
        const res = await fetch(`/api/notepad/content?name=${encodeURIComponent(fileName)}`);
        const d = await res.json();
        state.name = d.name;
        state.savedContent = d.content;
        renderView();
      }

      function startFilePrompt() {
        state.promptingFile = true;
        filenameInput.value = state.name;
        hint.style.display = "none";
        filenameInput.style.display = "";
        filenameInput.focus();
        filenameInput.select();
      }

      function endFilePrompt() {
        state.promptingFile = false;
        filenameInput.style.display = "none";
        hint.style.display = "";
        viewEl.focus();
      }

      filenameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const fileName = filenameInput.value.trim();
          endFilePrompt();
          if (fileName) loadFile(fileName);
        } else if (e.key === "Escape") {
          e.preventDefault();
          endFilePrompt();
        }
      });

      // 依游標所在的原始行號，在預覽區找出對應（或最接近之前）的區塊元素並
      // 捲到那裡——`renderMarkdown` 幫每個區塊標了 `data-line`（原始行號，
      // 依文件順序遞增排列），只要找「行號 <= 目前游標行號」裡最大的那個，
      // 就是游標目前對應到的區塊。
      function scrollPreviewToCursor() {
        const currentLine = textarea.value.slice(0, textarea.selectionStart).split("\n").length - 1;
        const marks = previewEl.querySelectorAll("[data-line]");
        let target = null;
        for (const el of marks) {
          if (Number(el.dataset.line) <= currentLine) {
            target = el;
          } else {
            break;
          }
        }
        if (target) {
          target.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
      }

      textarea.addEventListener("input", () => {
        previewEl.innerHTML = renderMarkdown(textarea.value);
        scrollPreviewToCursor();
      });
      // 輸入文字之外，純粹移動游標（方向鍵、Home/End、滑鼠點擊）不會觸發
      // `input`，另外用 `keyup`/`click` 補上，這樣單純瀏覽、沒在打字時預覽
      // 也會跟著捲動。
      textarea.addEventListener("keyup", scrollPreviewToCursor);
      textarea.addEventListener("click", scrollPreviewToCursor);

      const keyHandler = (e) => {
        if (!state.editing && !state.promptingFile && e.ctrlKey && e.key.toLowerCase() === "e") {
          e.preventDefault();
          enterEdit();
        } else if (!state.editing && !state.promptingFile && e.ctrlKey && e.key.toLowerCase() === "f") {
          e.preventDefault();
          startFilePrompt();
        } else if (state.editing && e.ctrlKey && e.key.toLowerCase() === "s") {
          e.preventDefault();
          save();
        } else if (state.editing && e.ctrlKey && e.key.toLowerCase() === "x") {
          e.preventDefault();
          exitEdit();
        }
      };
      viewEl.addEventListener("keydown", keyHandler);
      textarea.addEventListener("keydown", keyHandler);

      loadFile(state.name).then(() => viewEl.focus());

      // `loadFile` 掛出去給 `openPanel` 用：panel 已經開著時再點另一個
      // 檔名，靠這個直接切換顯示的檔案，不用透過 Ctrl-F 手動選。
      notepadUi = { container, loadFile };
    } else if (name === "storage") {
      panel.style.width = "560px";
      panel.style.height = "420px";

      const container = document.createElement("div");
      container.className = "storage-body";

      const toolbar = document.createElement("div");
      toolbar.className = "storage-toolbar";
      const breadcrumb = document.createElement("span");
      breadcrumb.className = "storage-breadcrumb";
      const uploadBtn = document.createElement("button");
      uploadBtn.textContent = "⬆ 上傳";
      const uploadInput = document.createElement("input");
      uploadInput.type = "file";
      uploadInput.style.display = "none";
      const mkdirBtn = document.createElement("button");
      mkdirBtn.textContent = "＋ 新資料夾";
      toolbar.appendChild(breadcrumb);
      toolbar.appendChild(uploadBtn);
      toolbar.appendChild(uploadInput);
      toolbar.appendChild(mkdirBtn);

      const table = document.createElement("table");
      table.className = "storage-table";
      const tbody = document.createElement("tbody");
      table.appendChild(tbody);
      const tableScroll = document.createElement("div");
      tableScroll.className = "storage-table-scroll";
      tableScroll.appendChild(table);

      container.appendChild(toolbar);
      container.appendChild(tableScroll);

      const state = { currentPath: "" };

      const joinPath = (base, name2) => (base ? `${base}/${name2}` : name2);

      function formatSize(bytes) {
        if (bytes === 0) return "—";
        const units = ["B", "K", "M", "G", "T"];
        let value = bytes;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) {
          value /= 1024;
          unit++;
        }
        return unit === 0 ? `${bytes}${units[0]}` : `${value.toFixed(1)}${units[unit]}`;
      }

      function renderBreadcrumb() {
        breadcrumb.innerHTML = "";
        const rootSeg = document.createElement("a");
        rootSeg.href = "#";
        rootSeg.textContent = "/";
        rootSeg.addEventListener("click", (e) => {
          e.preventDefault();
          navigate("");
        });
        breadcrumb.appendChild(rootSeg);
        if (!state.currentPath) return;
        const parts = state.currentPath.split("/");
        let acc = "";
        for (const part of parts) {
          acc = acc ? `${acc}/${part}` : part;
          const seg = document.createElement("a");
          seg.href = "#";
          seg.textContent = ` ${part}`;
          const target = acc;
          seg.addEventListener("click", (e) => {
            e.preventDefault();
            navigate(target);
          });
          breadcrumb.appendChild(seg);
        }
      }

      async function refresh() {
        const path = state.currentPath;
        let entries;
        try {
          const res = await fetch(`/api/storage/list?path=${encodeURIComponent(path)}`);
          entries = await res.json();
        } catch (_err) {
          return; // 這次沒抓到就算了，使用者可以再手動切換一次路徑重試。
        }
        if (path !== state.currentPath) return; // 等待期間使用者又切了路徑，這次回應過期了，不要蓋掉新畫面。
        renderBreadcrumb();
        tbody.innerHTML = "";
        for (const entry of entries) {
          const row = document.createElement("tr");
          const nameCell = document.createElement("td");
          if (entry.is_dir) {
            const link = document.createElement("a");
            link.href = "#";
            link.textContent = `📁 ${entry.name}`;
            link.addEventListener("click", (e) => {
              e.preventDefault();
              navigate(joinPath(state.currentPath, entry.name));
            });
            nameCell.appendChild(link);
          } else if (state.currentPath === "notepad") {
            // notepad panel 的 `/api/notepad/content` 只接單一裸檔名（見
            // `web.rs` 的 `safe_notepad_path`，不能帶路徑），只有目前瀏覽
            // 到 `storage/notepad/` 這一層時，`entry.name` 才剛好對應
            // notepad 能開的同一個檔案——其他路徑下的檔案沒有對應的 notepad
            // 檔名，不能這樣接，維持純文字不可點。
            const link = document.createElement("a");
            link.href = "#";
            link.textContent = `📄 ${entry.name}`;
            link.addEventListener("click", (e) => {
              e.preventDefault();
              openPanel("notepad", { file: entry.name });
            });
            nameCell.appendChild(link);
          } else {
            nameCell.textContent = `📄 ${entry.name}`;
          }
          const sizeCell = document.createElement("td");
          sizeCell.textContent = entry.is_dir ? "—" : formatSize(entry.size);
          const modifiedCell = document.createElement("td");
          modifiedCell.textContent = new Date(entry.modified * 1000).toLocaleString();
          const actionsCell = document.createElement("td");
          if (!entry.is_dir) {
            const dlBtn = document.createElement("a");
            dlBtn.href = `/api/storage/download?path=${encodeURIComponent(joinPath(state.currentPath, entry.name))}`;
            dlBtn.textContent = "⬇";
            actionsCell.appendChild(dlBtn);
          }
          const delBtn = document.createElement("button");
          delBtn.textContent = "🗑";
          delBtn.addEventListener("click", async () => {
            const full = joinPath(state.currentPath, entry.name);
            if (entry.is_dir) {
              let itemCount = 0;
              try {
                const res = await fetch(`/api/storage/list?path=${encodeURIComponent(full)}`);
