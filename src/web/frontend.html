                const children = await res.json();
                itemCount = children.length;
              } catch (_err) {
                // 查不到子項目數量就當作非空、用比較保守的措辭，不影響後面還是照樣送
                // recursive=true 的刪除請求。
              }
              const message = itemCount > 0
                ? `確定要刪除「${entry.name}」嗎？裡面還有 ${itemCount} 個項目，會一併刪除`
                : `確定要刪除「${entry.name}」（空資料夾）嗎？`;
              if (!window.confirm(message)) return;
              await fetch(`/api/storage/delete?path=${encodeURIComponent(full)}&recursive=true`, { method: "POST" });
            } else {
              if (!window.confirm(`確定要刪除「${entry.name}」嗎？`)) return;
              await fetch(`/api/storage/delete?path=${encodeURIComponent(full)}`, { method: "POST" });
            }
            refresh();
          });
          const renameBtn = document.createElement("button");
          renameBtn.textContent = "✎";
          renameBtn.addEventListener("click", async () => {
            const newName = window.prompt("新名稱", entry.name);
            if (!newName || newName === entry.name) return;
            const from = joinPath(state.currentPath, entry.name);
            const to = joinPath(state.currentPath, newName);
            await fetch(`/api/storage/rename?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`, {
              method: "POST",
            });
            refresh();
          });
          actionsCell.appendChild(delBtn);
          actionsCell.appendChild(renameBtn);
          row.appendChild(nameCell);
          row.appendChild(sizeCell);
          row.appendChild(modifiedCell);
          row.appendChild(actionsCell);
          tbody.appendChild(row);
        }
      }

      function navigate(path) {
        state.currentPath = path;
        refresh();
      }

      uploadBtn.addEventListener("click", () => uploadInput.click());
      uploadInput.addEventListener("change", async () => {
        const file = uploadInput.files[0];
        if (!file) return;
        const dest = joinPath(state.currentPath, file.name);
        await fetch(`/api/storage/upload?path=${encodeURIComponent(dest)}`, { method: "POST", body: file });
        uploadInput.value = "";
        refresh();
      });

      mkdirBtn.addEventListener("click", async () => {
        const dirName = window.prompt("新資料夾名稱");
        if (!dirName) return;
        const dest = joinPath(state.currentPath, dirName);
        await fetch(`/api/storage/mkdir?path=${encodeURIComponent(dest)}`, { method: "POST" });
        refresh();
      });

      refresh();

      storageUi = { container };
    } else if (name === "todo") {
      panel.style.width = "320px";
      panel.style.height = "380px";

      const container = document.createElement("div");
      container.className = "todo-body";

      const toolbar = document.createElement("div");
      toolbar.className = "todo-toolbar";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "新增待辦事項...";
      const addBtn = document.createElement("button");
      addBtn.textContent = "＋ 新增";
      toolbar.appendChild(input);
      toolbar.appendChild(addBtn);

      const list = document.createElement("div");
      list.className = "todo-list";

      container.appendChild(toolbar);
      container.appendChild(list);

      async function refresh() {
        let items;
        try {
          const res = await fetch("/api/todo/list");
          items = await res.json();
        } catch (_err) {
          return; // 這次沒抓到就算了，使用者下一次操作會再觸發一次 refresh。
        }
        list.innerHTML = "";
        if (items.length === 0) {
          const empty = document.createElement("div");
          empty.className = "todo-empty";
          empty.textContent = "（沒有待辦事項）";
          list.appendChild(empty);
          return;
        }
        for (const item of items) {
          const row = document.createElement("div");
          row.className = "todo-row" + (item.done ? " done" : "");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = item.done;
          checkbox.addEventListener("change", async () => {
            await fetch(`/api/todo/toggle?id=${item.id}`, { method: "POST" });
            refresh();
          });
          const text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = item.text;
          const delBtn = document.createElement("button");
          delBtn.textContent = "🗑";
          delBtn.addEventListener("click", async () => {
            await fetch(`/api/todo/remove?id=${item.id}`, { method: "POST" });
            refresh();
          });
          row.appendChild(checkbox);
          row.appendChild(text);
          row.appendChild(delBtn);
          list.appendChild(row);
        }
      }

      async function addItem() {
        const text = input.value.trim();
        if (!text) return;
        await fetch(`/api/todo/add?text=${encodeURIComponent(text)}`, { method: "POST" });
        input.value = "";
        refresh();
      }

      addBtn.addEventListener("click", addItem);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addItem();
      });

      refresh();

      todoUi = { container };
    } else if (name === "global" || name === "device") {
      panel.style.width = "640px";
      panel.style.height = "320px";

      const container = document.createElement("div");
      container.className = "data-table-body";
      const scroll = document.createElement("div");
      scroll.className = "data-table-scroll";
      scroll.style.display = "none";
      const table = document.createElement("table");
      table.className = "data-table";
      const thead = document.createElement("thead");
      const tbody = document.createElement("tbody");
      table.appendChild(thead);
      table.appendChild(tbody);
      scroll.appendChild(table);
      const empty = document.createElement("div");
      empty.className = "data-table-empty";
      empty.textContent = "(等待資料...)";
      container.appendChild(scroll);
      container.appendChild(empty);

      dataTableUi = { container, scroll, table, thead, tbody, empty };
    } else {
      body = document.createElement("pre");
      body.className = "panel-body";
      body.textContent = "(等待資料...)";
    }

    // 四邊 + 四角，8 個方向都能拉：見 `startResize` 對 `dir` 的說明。
    const resizeHandles = ["n", "s", "e", "w", "ne", "nw", "se", "sw"].map((dir) => {
      const h = document.createElement("div");
      h.className = `resize-handle resize-${dir}`;
      h.addEventListener("mousedown", (e) => startResize(panel, e, dir));
      return h;
    });

    panel.appendChild(title);
    panel.appendChild(
      musicUi
        ? musicUi.container
        : shellUi
        ? shellUi.container
        : notepadUi
        ? notepadUi.container
        : storageUi
        ? storageUi.container
        : dataTableUi
        ? dataTableUi.container
        : topologyUi
        ? topologyUi.container
        : weatherUi
        ? weatherUi.container
        : worldclockUi
        ? worldclockUi.container
        : ereaderUi
        ? ereaderUi.container
        : todoUi
        ? todoUi.container
        : body
    );
    resizeHandles.forEach((h) => panel.appendChild(h));
    panel.addEventListener("mousedown", () => bringToFront(panel));
    desk.appendChild(panel);
    bringToFront(panel);

    // 「原本大小」只在離開 normal 狀態的當下存一次，不管接下來是先最小化再
    // 最大化、還是反過來，回到 normal 時都還原成同一組數字，不會被中間狀態
    // 覆蓋掉。再按一次同一顆按鈕（已經是那個狀態）就是切回 normal。
    let layoutState = "normal";
    let savedRect = null;

    // 最小化不再像以前那樣在 #desk 左下角留一個只剩 title bar 高度的小
    // 視窗——直接整個 panel 隱藏（`display: none`），dock 那顆 icon 上的
    // 小點就是唯一的「這個 panel 還在」的提示，見 `setDockOpen` 的說明。
    function applyLayoutState() {
      // `player` panel 沒有獨立的 `body`（不訂閱 SSE，見下面），用 `?.` 讓這幾行
      // 對它來說直接跳過，不會因為 `body` 是 `undefined` 而整個 throw 出去。
      if (layoutState === "normal") {
        panel.style.display = "";
        if (savedRect) {
          panel.style.left = savedRect.left;
          panel.style.top = savedRect.top;
          panel.style.width = savedRect.width;
          panel.style.height = savedRect.height;
        }
        if (body) body.style.display = "";
        resizeHandles.forEach((h) => { h.style.display = ""; });
      } else if (layoutState === "minimized") {
        panel.style.display = "none";
      } else if (layoutState === "maximized") {
        panel.style.display = "";
        if (body) body.style.display = "";
        resizeHandles.forEach((h) => { h.style.display = "none"; });
        panel.style.left = "0px";
        panel.style.top = "0px";
        panel.style.width = "100%";
        panel.style.height = "100%";
      }
      maximizeBtn.textContent = layoutState === "maximized" ? "❐" : "□";
    }

    function toggleLayoutState(next) {
      if (layoutState === "normal") {
        savedRect = {
          left: panel.style.left,
          top: panel.style.top,
          width: panel.style.width,
          height: panel.style.height,
        };
      }
      layoutState = layoutState === next ? "normal" : next;
      applyLayoutState();
      if (layoutState === "minimized") {
        // 最小化之後這個 panel 不算在前景了，把它 dock icon 上的前景方框
        // 拿掉——不呼叫 `bringToFront`（那是給「正在顯示的 panel」用的，
        // 這裡整個隱藏起來了，見 `applyLayoutState`），小點（`open`）還是
        // 留著，只是不再是「前景」。
        const item = dockItems.get(name);
        if (item) item.classList.remove("active");
      } else {
        bringToFront(panel);
      }
    }

    minimizeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleLayoutState("minimized");
    });
    maximizeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleLayoutState("maximized");
    });

    // `player`／`shell` 這兩個 panel 都跟任何 plugin 無關，沒有對應的
    // `/api/panel/<name>/stream` 可以訂閱（後端會回 404），所以直接跳過，
    // 不用白白開一條會一直重連失敗的 EventSource。`notepad` 雖然是真的
    // plugin（後端這條 SSE 確實存在，給終端機/GUI 那邊即時反映內容用），但
    // 前端這裡已經用專屬的 `notepadUi`（`/api/notepad/content`）處理檢視/
    // 編輯，不需要也訂閱一份純文字版本。`weather`／`worldclock`／`ereader`／
    // `todo` 一樣改用專屬的 `/api/weather/list`／`/api/worldclock/list`／
    // `/api/ereader/*`／`/api/todo/list`（結構化 JSON），不訂閱純文字 SSE。
    // EventSource 斷線會自動重連，其餘 panel 不用自己寫 retry。
    let es = null;
    if (
      name !== "player" &&
      name !== "shell" &&
      name !== "notepad" &&
      name !== "storage" &&
      name !== "topology" &&
      name !== "weather" &&
      name !== "worldclock" &&
      name !== "ereader" &&
      name !== "todo"
    ) {
      // `global`／`device` 走專屬的 `/snapshot-stream`（結構化 JSON，給逐格
      // 閃爍表格用），其餘 panel 走原本的 `/stream`（純文字）——兩條路後端
      // 各自獨立比對/快取，見 `web.rs` 的 `snapshot_broadcast_ticker`。
      const streamPath = dataTableUi ? "snapshot-stream" : "stream";
      es = new EventSource(`/api/panel/${encodeURIComponent(name)}/${streamPath}`);
      es.onmessage = (e) => {
        if (dataTableUi) {
          // `web.rs` 的 `table_snapshot_json` 送的是「JSON 物件字串」，經過
          // `sse_frame` 又整個包了一層 JSON 字串編碼，所以要解兩層。
          let snapshot;
          try {
            snapshot = JSON.parse(JSON.parse(e.data));
          } catch (_err) {
            return;
          }
          renderTableSnapshot(dataTableUi, snapshot);
          return;
        }
        // 使用者如果往上捲去看舊內容，不要硬把它拉回底部；只有原本就在（或接近）
        // 最底下時，新內容進來才跟著捲到最新，跟終端機 tail 的習慣一致。
        const wasNearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 24;
        try {
          body.textContent = JSON.parse(e.data);
        } catch (_err) {
          body.textContent = e.data;
        }
        if (wasNearBottom) {
          body.scrollTop = body.scrollHeight;
        }
      };
    }

    if (musicUi) {
      startMusicFileBrowser(musicUi);
    }
    open.set(name, {
      el: panel,
      es,
      musicUi,
      shellUi,
      notepadUi,
      storageUi,
      topologyUi,
      weatherUi,
      worldclockUi,
      ereaderUi,
      todoUi,
      // dock icon 點下去要能「切換最小化」，重複用跟 title bar 上那顆 `_`
      // 按鈕完全同一套邏輯（見上面 `toggleLayoutState`）——不是關閉，關閉
      // 是 title bar 上的 `×`（`closePanel`），兩者對 dock 小點的影響不同，
      // 見 `setDockOpen` 的說明。
      toggleMinimize: () => toggleLayoutState("minimized"),
    });
    setDockOpen(name, true);
    // 剛剛第一次 `bringToFront(panel)`（開頭那次）發生在 `open.set` 之前，
    // 這個 name 那時候還查不到，`bringToFront` 裡的前景方框反查會找不到
    // 對應的 entry——這裡 `open` 已經有這筆了，再呼叫一次補上前景方框。
    bringToFront(panel);
  }

  fetch("/api/version")
    .then((r) => r.json())
    .then((d) => {
      hostnameLabel.textContent = d.id;
      versionLabel.textContent = d.version;
    });

  // name -> dock item 的 DOM 元素，`setDockOpen` 用來找到對應的 icon 補上/
  // 拿掉小點。
  const dockItems = new Map();

  // 小點代表「這個 panel 目前存在」（`open` 這個 Map 裡有它），不管它現在是
  // 顯示中還是被最小化——跟 title bar 的 `×`（`closePanel`，真的整個關掉、
  // 小點才會消失）是兩件事：dock icon 本身點下去（`toggleFromDock`）只是
  // 開啟／切換最小化，不會讓小點消失。
  function setDockOpen(name, isOpen) {
    const item = dockItems.get(name);
    if (!item) return;
    item.classList.toggle("open", isOpen);
    // 真的關掉了（不是最小化）就不可能還是前景，順手把前景方框也拿掉，
    // 不用等下一次別的 panel bringToFront 才間接清掉。
    if (!isOpen) item.classList.remove("active");
  }

  // dock icon 點下去：panel 還沒開就開一個（`openPanel` 自己會把小點點亮，
  // 見該函式最後的 `setDockOpen`）；已經開著就切換最小化/還原（跟 title
  // bar 上那顆 `_` 按鈕完全同一套邏輯，見 `entry.toggleMinimize` 的說明）。
  function toggleFromDock(name) {
    const entry = open.get(name);
    if (!entry) {
      openPanel(name);
      return;
    }
    entry.toggleMinimize();
  }

  function addDockItem(name, icon) {
    const item = document.createElement("div");
    item.className = "dock-item";
    const dot = document.createElement("span");
    dot.className = "dock-dot";
    const btn = document.createElement("button");
    btn.className = "dock-icon";
    // `icon` 大部分是純文字（emoji），但 gitrepo 那顆是手繪 SVG 字串（見
    // `GITBRANCH_ICON`），用 `innerHTML` 才能吃兩種——這裡的值全部是自己
    // 寫的常數，不是使用者輸入，用 `innerHTML` 不會有 XSS 風險。
    btn.innerHTML = icon;
    btn.title = name;
    btn.addEventListener("click", () => toggleFromDock(name));
    item.appendChild(dot);
    item.appendChild(btn);
    dockbar.appendChild(item);
    dockItems.set(name, item);
  }

  // player/shell/topology 立刻加進 dock，不用等 `/api/plugins` 回來——跟以前
  // 那兩顆固定按鈕一樣，一開始就能點，不會因為 plugin 清單還沒抓回來就暫時
  // 消失。
  addDockItem("player", "🎵");
  addDockItem("shell", "❯_");
  addDockItem("topology", "🌐");

  // 每個 plugin 依功能給一個對應的圖示（跟 tablet/iphone 分頁列共用的
  // icon 盡量一致，例如 device/global/storage/notepad/system/todo/weather）
  // ——`/api/plugins` 本身只回傳名字字串，沒有圖示可用，這份對照表寫在
  // 前端這裡。清單裡沒列到的名字（以後新增的 plugin）退回一個代表「這會
  // 開一個 panel」的通用圖示，不會整個掛掉。
  // gitrepo/qr 兩個沒有現成的 emoji 長得像，手繪成跟 player 的 shuffle 圖示
  // 同一套風格的內嵌 SVG（`stroke="currentColor"`/`fill="currentColor"`，
  // 顏色自動跟著按鈕文字色走）：gitrepo 是常見的「git branch」圖示（三個
  // 節點、一條分支線），不是 git-scm.com 官方 logo 本身（那是別人的商標，
  // 也需要另外拉一份外部圖片資源進來，跟這個專案「所有前端資源都自足、
  // 不連外」的慣例不合）；qr 是簡化版的 QR code 圖案（三個角的定位框 + 一
  // 些隨意排列的資料格子，不是真的能掃的 QR code，純粹視覺上像）。
  const GITBRANCH_ICON =
    '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="6" cy="6" r="2.5"></circle>' +
    '<circle cx="6" cy="18" r="2.5"></circle>' +
    '<circle cx="18" cy="6" r="2.5"></circle>' +
    '<path d="M6 8.5 L6 15.5"></path>' +
    '<path d="M18 8.5 C18 13, 8.5 13, 8.5 13"></path>' +
    "</svg>";
  const QR_ICON =
    '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor">' +
    '<rect x="2" y="2" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"></rect>' +
    '<rect x="4.5" y="4.5" width="2" height="2"></rect>' +
    '<rect x="15" y="2" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"></rect>' +
    '<rect x="17.5" y="4.5" width="2" height="2"></rect>' +
    '<rect x="2" y="15" width="7" height="7" fill="none" stroke="currentColor" stroke-width="2"></rect>' +
    '<rect x="4.5" y="17.5" width="2" height="2"></rect>' +
    '<rect x="12" y="2" width="2" height="2"></rect>' +
    '<rect x="12" y="6" width="2" height="2"></rect>' +
    '<rect x="10" y="10" width="2" height="2"></rect>' +
    '<rect x="14" y="10" width="2" height="2"></rect>' +
    '<rect x="18" y="12" width="2" height="2"></rect>' +
    '<rect x="10" y="14" width="2" height="2"></rect>' +
    '<rect x="14" y="16" width="2" height="2"></rect>' +
    '<rect x="18" y="18" width="2" height="2"></rect>' +
    '<rect x="14" y="20" width="2" height="2"></rect>' +
    "</svg>";
  const PLUGIN_ICONS = {
    wol: "⏻",
    activities: "📶",
    clock: "🕐",
    device: "📟",
    ereader: "📖",
    gitrepo: GITBRANCH_ICON,
    global: "🌍",
    music: "🎶",
    notepad: "📝",
    output: "🧾",
    remote: "📡",
    "remote-output": "🛰️",
    storage: "🗂️",
    sync: "🔄",
    system: "ℹ️",
    todo: "✅",
    weather: "🌤️",
    qr: QR_ICON,
    worldclock: "🗺️",
  };

  fetch("/api/plugins")
    .then((r) => r.json())
    .then((names) => {
      for (const name of names) {
        addDockItem(name, PLUGIN_ICONS[name] || "🪟");
      }
    });

  // 指令輸入列：跟終端機共用同一個 Shell，所以這裡打的指令（包含
  // `mode`/`plugin enter` 之類會換 mode 的）會直接影響後端狀態，Enter 送出、
  // Up/Down 在這個分頁自己的輸入紀錄裡瀏覽（純前端，不是後端的 history）。
  const cmdPromptEl = document.getElementById("cmd-prompt");
  const cmdInput = document.getElementById("cmd-input");
  const cmdStatus = document.getElementById("cmd-status");
  const cmdHistory = [];
  let historyIndex = -1;
  let draft = "";

  function refreshPrompt() {
    fetch("/api/prompt")
      .then((r) => r.json())
      .then((d) => { cmdPromptEl.textContent = d.prompt; });
  }
  refreshPrompt();

  cmdInput.addEventListener("keydown", (evt) => {
    if (evt.key === "Enter") {
      const line = cmdInput.value;
      cmdInput.value = "";
      historyIndex = -1;
      if (line.trim()) cmdHistory.push(line);
      execLine(line).then((d) => {
        cmdPromptEl.textContent = d.prompt;
        cmdStatus.textContent = d.error ? `錯誤: ${d.error}` : "";
      });
    } else if (evt.key === "ArrowUp") {
      if (cmdHistory.length === 0) return;
      evt.preventDefault();
      if (historyIndex === -1) {
        draft = cmdInput.value;
        historyIndex = cmdHistory.length - 1;
      } else if (historyIndex > 0) {
        historyIndex--;
      }
      cmdInput.value = cmdHistory[historyIndex];
    } else if (evt.key === "ArrowDown") {
      if (historyIndex === -1) return;
      evt.preventDefault();
      if (historyIndex < cmdHistory.length - 1) {
        historyIndex++;
        cmdInput.value = cmdHistory[historyIndex];
      } else {
        historyIndex = -1;
        cmdInput.value = draft;
      }
    }
  });
})();
</script>
</body>
</html>
