<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    /* 純西文等寬字型（Consolas/Menlo…）沒有中文字型，瀏覽器排到中文字時會換去
       「系統隨便挑的中文字型」，那個字型的中文字寬度不保證剛好是西文字寬的兩倍
       ——這才是欄位對不齊的根本原因，不是我們自己排版算錯。把設計成中西文寬度
       成比例（中文剛好是西文兩倍寬）的等寬字型排在前面，能大幅改善這個問題，
       但仍要那個字型真的有裝在瀏覽器所在的系統上才有效，不是萬用解。 */
    font-family: "Sarasa Term SC", "Sarasa Term TC", "Sarasa Mono SC", "Sarasa Mono TC", "Noto Sans Mono CJK SC",
      "Noto Sans Mono CJK TC", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    background: #111318;
    color: #d8dee9;
    /* Android Chrome（其他行動瀏覽器也一樣）的網址列會依捲動狀態顯示/隱藏，
       `100vh` 算的是網址列完全收起時的最大高度，網址列還顯示著的時候實際可見
       範圍比 `100vh` 矮一截——這個 flex 排版的頭尾（toolbar/cmdbar）就有一邊會
       被排到可見範圍外面（`overflow: hidden` 又不能捲動看到），才會出現「重新
       整理後上面那列不見、換成下面那列不見」這種看渲染當下網址列狀態決定的
       不一致現象。`100dvh`（dynamic viewport height）是專門解決這個問題的新
       單位，永遠對應「現在」實際看得到的範圍；瀏覽器不支援 `100dvh` 的話這行
       會被整條忽略，留著上面的 `100vh` 當退回方案。 */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #toolbar {
    position: relative;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    background: #1b1e26;
    border-bottom: 1px solid #333a46;
  }
  #hostname-label {
    color: #d8dee9;
    white-space: nowrap;
    font-size: 15px;
    font-weight: 600;
  }
  #version-label {
    color: #6b7280;
    white-space: nowrap;
    font-size: 12px;
  }
  #desk {
    position: relative;
    width: 100%;
    flex: 1;
    overflow: hidden;
  }
  /* mac OS Dock 風格的啟動列：每個 plugin/panel 各一顆固定的 icon，取代原本
     左上角的下拉選單——所有功能永遠列在這裡，不用先點開選單才看得到有哪些
     可以開。位置在 `#desk` 跟 `#cmdbar` 之間（畫面最下面，指令輸入列上面）。 */
  #dockbar {
    flex: none;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0;
    padding: 4px 10px;
    background: #1b1e26;
    border-top: 1px solid #333a46;
    overflow-x: auto;
  }
  .dock-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex: none;
  }
  /* 小點代表「這個 panel 目前存在」（開著或被最小化都算，見
     `setDockOpen`），跟是否正顯示在畫面上是兩件事——用 `visibility` 不是
     `display`，這樣點出現/消失時 icon 不會跟著上下跳動。 */
  .dock-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #6f9dff;
    visibility: hidden;
  }
  .dock-item.open .dock-dot { visibility: visible; }
  /* 平時純 icon，不畫外框/底色；滑過去才浮出一個圓角方框（半透明淺色疊
     一層，不是純色底），參考 Windows 11 taskbar 那種「hover 才出現一個
     圓角高亮」的效果，比原本只是 icon 變淡（`opacity`）明顯很多。按下去
     再疊深一點顏色，跟滑過去的高亮明顯有層次差。 */
  .dock-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: #d8dee9;
    border: none;
    border-radius: 8px;
    /* `font: inherit` 先蓋掉 `<button>` 內建的字型設定（家族/粗細等），
       `font-size`/`line-height` 一定要寫在它後面才會生效——寫在前面會被
       這個 shorthand 一起重置回繼承值，字級調再大都不會有效果，這正是
       前幾次調大都「看起來沒變」的原因。 */
    font: inherit;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    transition: background-color 0.12s ease;
  }
  /* 前景中（目前 focus）的 panel，對應的 icon 常駐一個方框，顏色跟單純
     滑過去（下面 `:hover`，白色系）不一樣，用跟 `.panel.active` 邊框同一個
     藍色調（`#6f9dff`），一眼就能分開「這個 panel 正在前景」跟「滑鼠正
     滑過去」兩種狀態。故意寫在 `:hover`/`:active` 前面：CSS specificity
     打平時看規則先後順序，這樣滑過去/按下的回饋才會蓋過常駐的前景方框，
     不會被蓋住看不出滑鼠有沒有真的滑上去。 */
  .dock-item.active .dock-icon { background: rgba(111, 157, 255, 0.22); }
  .dock-icon:hover { background: rgba(255, 255, 255, 0.12); }
  .dock-icon:active { background: rgba(255, 255, 255, 0.2); }
  #cmdbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: #1b1e26;
    border-top: 1px solid #333a46;
    font-size: 13px;
  }
  #cmd-prompt {
    white-space: pre;
    color: #6f9dff;
  }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #d8dee9;
    font: inherit;
  }
  #cmd-status {
    color: #ff6b6b;
    white-space: pre;
  }
  .panel {
    position: absolute;
    min-width: 160px;
    min-height: 80px;
    background: #1b1e26;
    border: 1px solid #3a4150;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  .panel.active { border-color: #6f9dff; }
  .panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
    background: #262a33;
    border-bottom: 1px solid #3a4150;
    cursor: move;
    user-select: none;
    font-size: 13px;
  }
  .panel-buttons {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .panel-buttons button {
    background: none;
    border: none;
    color: #d8dee9;
    cursor: pointer;
    font: inherit;
    line-height: 1;
    padding: 0 4px;
  }
  .panel-buttons .minimize:hover,
  .panel-buttons .maximize:hover { background: #3a4150; }
  .panel-buttons .close:hover { color: #ff6b6b; }
  .panel-body {
    flex: 1;
    margin: 0;
    padding: 8px;
    overflow: auto;
    white-space: pre-wrap;
    font-size: 13px;
  }
  /* 原本只有右下角一顆能拉，其他 7 個方向（4 邊 + 另外 3 角）補齊，讓整個
     panel 四周都能調整大小，跟一般桌面視窗系統一致。邊是細長條、角是小
     方塊，彼此不重疊；只有右下角維持原本那個可見的斜線抓手圖示，其餘 7 個
     純粹靠滑鼠移過去游標變成對應方向的樣子（跟大多數桌面視窗系統一樣，
     邊/角本身不畫出來，不然畫面會很雜）。 */
  .resize-handle { position: absolute; z-index: 5; }
  .resize-n { top: -4px; left: 10px; right: 10px; height: 8px; cursor: ns-resize; }
  .resize-s { bottom: -4px; left: 10px; right: 10px; height: 8px; cursor: ns-resize; }
  .resize-e { top: 10px; bottom: 10px; right: -4px; width: 8px; cursor: ew-resize; }
  .resize-w { top: 10px; bottom: 10px; left: -4px; width: 8px; cursor: ew-resize; }
  .resize-ne { top: -4px; right: -4px; width: 14px; height: 14px; cursor: nesw-resize; }
  .resize-nw { top: -4px; left: -4px; width: 14px; height: 14px; cursor: nwse-resize; }
  .resize-sw { bottom: -4px; left: -4px; width: 14px; height: 14px; cursor: nesw-resize; }
  .resize-se { bottom: -4px; right: -4px; width: 14px; height: 14px; cursor: nwse-resize; }
  .resize-se::after {
    content: "";
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 6px;
    height: 6px;
    border-right: 2px solid #5a6272;
    border-bottom: 2px solid #5a6272;
  }
  /* `weather` panel：跟 `player`/`topology` 一樣完全獨立於一般 plugin 的純
     文字 SSE 顯示，改成左側地區清單＋右側大圖（圖示＋動態背景＋現在氣溫，
     下面分「今天」／「未來預報」兩排），資料來自 `/api/weather/list`
     （見 `startWeather` 的說明）。跟 tablet.html 的 `.weather-*` 是同一套
     設計，這裡各自一份（同一種取捨，見 topology 那段的說明）；跟 tablet
     唯一的差異是 `.weather-body` 用 `flex: 1`（這裡是浮動 panel 的
     `.panel-content` flex column 撐開高度，tablet 分頁沒有那層，改用
     `height: 100%`）。 */
  .weather-body { flex: 1; display: flex; overflow: hidden; }
  .weather-sidebar { width: 160px; flex: none; overflow-y: auto; background: #1b1e26; border-right: 1px solid #262a33; }
  .weather-loc-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    cursor: pointer;
    border-bottom: 1px solid #262a33;
    color: #fff;
    font-size: 12px;
  }
  .weather-loc-row.selected { background: #262a33; }
  .weather-loc-icon { width: 22px; height: 22px; flex: none; }
  .weather-loc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .weather-loc-temp { flex: none; color: #9aa4b8; }

  .weather-main { flex: 1; position: relative; overflow: auto; display: flex; flex-direction: column; color: #fff; }
  .weather-bg { position: absolute; inset: 0; overflow: hidden; }
  .weather-bg-dim::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.15); }
  .weather-sun-glow {
    position: absolute;
    top: -15%;
    left: 50%;
    width: 160px;
    height: 160px;
    margin-left: -80px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
    border-radius: 50%;
    animation: weatherSunPulse 6s ease-in-out infinite;
  }
  @keyframes weatherSunPulse {
    0%, 100% { opacity: .7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  .weather-cloud {
    position: absolute;
    left: -30%;
    width: 130px;
    height: 50px;
    background: #fff;
    border-radius: 44px;
    animation-name: weatherCloudDrift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .weather-cloud::before, .weather-cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .weather-cloud::before { width: 50px; height: 50px; top: -22px; left: 14px; }
  .weather-cloud::after { width: 36px; height: 36px; top: -13px; left: 64px; }
  @keyframes weatherCloudDrift {
    from { transform: translateX(0); }
    to { transform: translateX(160vw); }
  }
  .weather-fog-band {
    position: absolute;
    left: -20%;
    width: 140%;
    height: 30px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    animation-name: weatherFogDrift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes weatherFogDrift {
    0%, 100% { transform: translateX(-6%); }
    50% { transform: translateX(6%); }
  }
  .weather-drop {
    position: absolute;
    top: -10%;
    width: 2px;
    height: 12px;
    background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.7));
    animation-name: weatherDropFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes weatherDropFall {
    from { top: -10%; }
    to { top: 110%; }
  }
  .weather-flake {
    position: absolute;
    top: -5%;
    background: #fff;
    border-radius: 50%;
    opacity: .85;
    animation-name: weatherFlakeFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes weatherFlakeFall {
    from { top: -5%; transform: translateX(0); }
    to { top: 110%; transform: translateX(16px); }
  }
  .weather-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    animation: weatherLightning 7s infinite;
  }
  @keyframes weatherLightning {
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: .8; }
    94% { opacity: 0; }
    95% { opacity: .5; }
    96% { opacity: 0; }
  }

  .weather-hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 18px 12px 10px;
    flex: none;
  }
  .weather-hero-icon { width: 84px; height: 84px; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3)); }
  .weather-hero-time { font-size: 13px; opacity: .75; letter-spacing: .05em; }
  .weather-hero-temp { font-size: 34px; font-weight: 600; }
  .weather-hero-desc { font-size: 14px; }
  .weather-hero-sub { font-size: 12px; opacity: .85; }

  .weather-forecast-section { position: relative; z-index: 1; padding: 4px 12px; flex: none; }
  .weather-forecast-label { font-size: 11px; opacity: .75; margin-bottom: 4px; text-align: center; }
  /* `justify-content: center` 直接放在有 `overflow-x: auto` 的 flex
     容器上，內容一旦寬過容器就會出現經典的 flexbox 置中 + overflow 問題：
     瀏覽器預設的 scroll 起點會對齊到「置中排列後」的最左端，視覺上看起來
     跟沒置中一樣是靠左。改成外層 `.weather-forecast-row` 只負責
     `overflow-x: auto`（純捲動容器），真正排列的 `.weather-forecast-track`
     用 `width: max-content` + `margin: 0 auto`：內容比容器窄時 auto margin
     會置中；內容比容器寬時 auto margin 算出來是 0，自動退回靠左＋可捲動，
     不會有一半內容捲不到的問題。 */
  .weather-forecast-row { overflow-x: auto; padding-bottom: 4px; }
  .weather-forecast-track { display: flex; gap: 12px; width: max-content; margin: 0 auto; }
  .weather-forecast-item { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; min-width: 44px; }
  .weather-forecast-icon { width: 28px; height: 28px; }
  .weather-forecast-item .label { font-size: 11px; opacity: .8; }
  .weather-forecast-item .temp { font-size: 12px; }
  .weather-forecast-item .rain { font-size: 10px; opacity: .75; }
  .weather-forecast-empty { font-size: 12px; opacity: .6; padding: 6px 0; text-align: center; }

  .weather-loc-icon svg, .weather-hero-icon svg, .weather-forecast-icon svg { width: 100%; height: 100%; display: block; }
  .weather-icon-sun-rays { transform-box: fill-box; transform-origin: center; animation: weatherIconSunRotate 20s linear infinite; }
  @keyframes weatherIconSunRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* `music-files`/`music-row`… 這幾個類別是 `player` panel 左半邊的檔案清單
     在用的（`renderMusicFiles`），`music` panel 本身現在已經是普通純文字
     panel，不再需要這些——名字沒改是因為兩個 panel 共用同一份清單渲染邏輯。 */
  .music-files {
    flex: 1;
    overflow: auto;
    padding: 0 8px;
  }
  .music-empty {
    color: #5a6272;
    padding: 8px 0;
  }
  .music-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    border-bottom: 1px solid #262a33;
  }
  .music-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .music-row button {
    background: #262a33;
    border: 1px solid #3a4150;
    color: #d8dee9;
    border-radius: 3px;
    padding: 2px 6px;
    font: inherit;
    cursor: pointer;
  }
  .music-row button:hover { background: #323844; }
  .music-row.playing {
    background: #1e2530;
    border-radius: 3px;
  }
  .music-row.playing .music-name { color: #6f9dff; }
  /* `player` panel 是特例：跟任何 plugin 都無關，純粹是前端組出來的
     播放器介面（沒有 SSE 訂閱），左邊檔案清單＋下載列，右邊封面＋播放控制。
     見 `openPanel` 裡 `name === "player"` 的分支。 */
  .player-body {
    flex: 1;
    display: flex;
    overflow: hidden;
    font-size: 13px;
  }
  .player-left {
    flex: 1.3;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid #262a33;
  }
  .player-left .music-files {
    flex: 1;
  }
  .player-download-row {
    display: flex;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #262a33;
  }
  .player-file-count {
    flex: none;
    align-self: center;
    color: #8a92a5;
    white-space: nowrap;
  }
  .player-url-input {
    flex: 1;
    min-width: 0;
    background: #0d0f13;
    border: 1px solid #3a4150;
    color: #d8dee9;
    border-radius: 3px;
    padding: 4px 6px;
    font: inherit;
  }
  .player-download-row button {
    background: #262a33;
    border: 1px solid #3a4150;
    color: #d8dee9;
    border-radius: 3px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  .player-download-row button:hover { background: #323844; }
  .player-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
    overflow: auto;
  }
  /* flex column 底下子元素預設 flex-shrink:1，內容總高度超過可視範圍時
     瀏覽器會把每個子元素（包括歌名這種單行文字）都往下壓縮，看起來像被
     裁切——固定每個子元素維持自己原本的高度，超出的部分交給
     `.player-right` 自己的 `overflow: auto` 捲動。 */
  .player-right > * { flex-shrink: 0; }
  .player-cover-slot {
    width: 100%;
    max-width: 220px;
    aspect-ratio: 1 / 1;

  /* epub 章節內容原封不動渲染，保留書本自己設計的白底——跟其餘介面深色

  .player-controls button.player-playpause-btn {

  /* `shell` panel：跟 `player` 一樣完全獨立於任何 plugin，內容是一個

  .notepad-body {

  .notepad-filename-input {

  /* 檢視/預覽兩邊都會塞進 `renderMarkdown()` 產生的原始 HTML，這幾個標籤的

  .notepad-view h1, .notepad-view h2, .notepad-view h3,

  .notepad-preview h1, .notepad-preview h2, .notepad-preview h3,

  .notepad-view h1, .notepad-view h2,

  .notepad-view p, .notepad-preview p { margin: 0.4em 0; }
  .notepad-view code, .notepad-preview code {
    background: #a0a0a0;
    color: #8b0000;

    padding: 0 4px;

  }
  .notepad-view s, .notepad-preview s { text-decoration: line-through; }
  .notepad-underline { text-decoration: underline; }
  .notepad-highlight { background: #d8dee9; color: #1b1e26; }
  .notepad-view pre, .notepad-preview pre {

    padding: 8px 10px;

  }
  .notepad-view pre code, .notepad-preview pre code { background: none; color: inherit; border: none; padding: 0; }
  /* code fence 語法上色（見 `highlightCodeLine`），跟 GUI 那邊
     `highlight_code_line` 的顏色語意一致：關鍵字藍色粗體、字串黃色、數字
     紫色、註解灰色斜體。 */
  .notepad-view .tok-keyword, .notepad-preview .tok-keyword { color: #5c8ae6; font-weight: bold; }
  .notepad-view .tok-string, .notepad-preview .tok-string { color: #d7ba48; }
  .notepad-view .tok-number, .notepad-preview .tok-number { color: #c678dd; }
  .notepad-view .tok-comment, .notepad-preview .tok-comment { color: #6b7280; font-style: italic; }
  /* ` ```lang= ` 語法（語言後面接一個 `=`）表示要加行號，見

     內容之間用一條直線隔開，是常見的行號欄樣式。 */
  .notepad-view .line-no, .notepad-preview .line-no {

  .notepad-view li.notepad-task, .notepad-preview li.notepad-task {

  .notepad-view table, .notepad-preview table {

  }
  .storage-body {

    border-bottom: 1px solid #3a4150;

  /* `flex: 1`/`overflow: auto` 要放在外面包一層的 `<div>`，不能直接放在

  /* todo panel：跟 storage panel 一樣是 toolbar + 可捲動清單，清單本身一列

  .data-table-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .data-table-empty { padding: 8px; color: #9aa4b8; }
  /* `flex: 1`／`overflow: auto` 掛在這層包住 `<table>` 的 div，不是掛在
     `<table>` 本身——`<table>` 如果直接被撐高到填滿剩下的高度，瀏覽器會把
     多出來的高度分攤到每一列（`<tr>`）上，造成資料筆數少的時候每一列反而
     比筆數多的時候還高。表格本身維持自然高度（每列固定高度），筆數不夠塞滿
     panel 時，多出來的空間留白在下面，不會被攤進每一列。 */
  .data-table-scroll { flex: 1; overflow: auto; }
  .data-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  /* `device` 的 id 欄位（跟表頭）靠 CLI/TUI 那套「`* ` 開頭是自己，`  `
     （兩個空白）開頭不是」的文字前綴對齊，不是靠 CSS 排版——`white-space:
     nowrap` 會把這種前導空白摺疊掉，變成 web 上看不出對齊；`pre` 原樣保留
     空白字元，效果跟 CLI/TUI 一致（頁面本身用等寬字型），同時跟 `nowrap`
     一樣不會自動換行。 */
  .data-table th, .data-table td { padding: 4px 10px; border-top: 1px solid #262a33; white-space: pre; text-align: left; }
  .data-table th { color: #9aa4b8; font-weight: normal; border-top: none; border-bottom: 1px solid #3a4150; }
  .data-table tr.row-offline { color: #8a92a5; }
  @keyframes cellFlash {
    from { background-color: rgba(255, 255, 255, 0.35); }
    to { background-color: transparent; }
  }
  .cell-flash { animation: cellFlash 1s ease-out; }
  .topology-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
  .topology-svg { flex: 1; width: 100%; height: 100%; }
  .topology-node { cursor: default; }
  .topology-node-label { font-size: 10px; fill: #d8dee9; text-anchor: middle; pointer-events: none; }
  .topology-domain-box { fill: none; stroke: #3a4150; stroke-width: 1; stroke-dasharray: 5,3; }
  .topology-domain-label { font-size: 10px; fill: #6b7280; }
  .topology-edge { stroke: #5a6272; stroke-width: 1.5; }
  .topology-broker { fill: #1b1e26; stroke: #d8dee9; stroke-width: 2; }
  .topology-tooltip {
    position: absolute;
    display: none;
    pointer-events: none;
    background: #1b1e26;
    border: 1px solid #3a4150;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    color: #d8dee9;
    white-space: pre;
    z-index: 20;
  }
  .worldclock-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
  .worldclock-svg { flex: 1; width: 100%; height: 100%; background: #131c28; }
  .worldclock-land { fill: #3a4150; stroke: none; }
  .worldclock-night { fill: rgba(0, 0, 0, 0.45); pointer-events: none; }
  .worldclock-city-dot { fill: #6f9dff; stroke: #131c28; stroke-width: 1; }
  .worldclock-city-name { font-size: 10px; fill: #d8dee9; pointer-events: none; }
  .worldclock-city-time { font-size: 10px; fill: #9aa4b8; pointer-events: none; }
</style>

/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm .xterm-scroll-area {
    visibility: hidden;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  user-select: text;
  white-space: pre;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
}

.xterm-decoration-top {
    z-index: 2;
    position: relative;
}

</style>

<script>
(function () {
  "use strict";

  const desk = document.getElementById("desk");
  const hostnameLabel = document.getElementById("hostname-label");
  const versionLabel = document.getElementById("version-label");
  const dockbar = document.getElementById("dockbar");

  // 每個 tab 自己的 panel 版面（位置/大小/疊放順序/開了哪些），只存在這個
  // JS 變數裡，重新整理就消失，也完全不會送回後端——跟後端 `rect`/`show`/
  // `activate` 那一套是兩回事。
  const open = new Map(); // name -> { el, es }
  let zTop = 1;
  let cascade = 0;

  // 前景 panel 對應的 dock icon 也要標成「目前前景」（見 `.dock-item.active`
  // 的 CSS 說明），這裡用反查（`open` 這個 Map 找哪個 name 的 `entry.el`
  // 就是這個 panel）而不是改成傳 `name` 進來——`bringToFront` 被拖曳/
  // resize/點擊等好幾處呼叫，反查一次比每個呼叫端都要多帶一個參數簡單。
  function bringToFront(panel) {
    for (const p of desk.children) p.classList.remove("active");
    panel.style.zIndex = String(++zTop);
    panel.classList.add("active");
    for (const item of dockItems.values()) item.classList.remove("active");
    for (const [name, entry] of open) {
      if (entry.el === panel) {
        const item = dockItems.get(name);
        if (item) item.classList.add("active");
        break;
      }
    }
  }

  function startDrag(panel, evt) {
    evt.preventDefault();
    bringToFront(panel);
    const startX = evt.clientX;
    const startY = evt.clientY;
    const startLeft = panel.offsetLeft;
    const startTop = panel.offsetTop;
    function onMove(e) {
      panel.style.left = `${startLeft + e.clientX - startX}px`;
      panel.style.top = `${startTop + e.clientY - startY}px`;
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  // `dir` 是 "n"/"s"/"e"/"w" 其中 1~2 個字元組成的方向字串（例如 "se"、
  // "n"）：東/南邊只要單純加減滑鼠移動量；西/北邊除了改 width/height，還要
  // 同步把 left/top 往反方向挪，不然畫面上看起來會是「對面那條邊也跟著
  // 動」，不是「拖的這條邊在動」。width/height 先夾到最小值之後才回頭算
  // left/top 該挪多少（用「實際變化量」而不是滑鼠原始位移量），這樣拖到
  // 最小尺寸之後繼續拖，panel 不會整個跟著滑鼠飄走。
  function startResize(panel, evt, dir) {
    evt.preventDefault();
    evt.stopPropagation();
    bringToFront(panel);
    const startX = evt.clientX;
    const startY = evt.clientY;
    const startWidth = panel.offsetWidth;
    const startHeight = panel.offsetHeight;
    const startLeft = panel.offsetLeft;
    const startTop = panel.offsetTop;
    function onMove(e) {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (dir.includes("e")) {
        panel.style.width = `${Math.max(160, startWidth + dx)}px`;
      } else if (dir.includes("w")) {
        const newWidth = Math.max(160, startWidth - dx);
        panel.style.width = `${newWidth}px`;
        panel.style.left = `${startLeft - (newWidth - startWidth)}px`;
      }
      if (dir.includes("s")) {
        panel.style.height = `${Math.max(80, startHeight + dy)}px`;
      } else if (dir.includes("n")) {
        const newHeight = Math.max(80, startHeight - dy);
        panel.style.height = `${newHeight}px`;
        panel.style.top = `${startTop - (newHeight - startHeight)}px`;
      }
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    }
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  function closePanel(name) {
    const entry = open.get(name);
    if (!entry) return;
    if (entry.es) entry.es.close();
    if (entry.musicUi) {
      entry.musicUi.stopPolling();
    }
    if (entry.shellUi) {
      entry.shellUi.resizeObserver.disconnect();
      entry.shellUi.ws.close();
      entry.shellUi.term.dispose();
    }
    if (entry.topologyUi) {
      entry.topologyUi.stop();
    }
    if (entry.weatherUi) {
      entry.weatherUi.stop();
    }
    if (entry.worldclockUi) {
      entry.worldclockUi.stop();
    }
    if (entry.ereaderUi) {
      entry.ereaderUi.stop();
    }
    entry.el.remove();
    open.delete(name);
    setDockOpen(name, false);
  }

  // 跟終端機共用同一個 Shell，這裡送出去的指令（包含 `mode`/`plugin enter`
  // 之類會換 mode 的）會直接影響後端狀態——指令列輸入框跟 `player` panel 的
  // 下載按鈕都靠這個共用函式送指令，不要各自重複一份 fetch 邏輯。
  async function execLine(line) {
    const res = await fetch("/api/exec", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line }),
    });
    return res.json();
  }

  // `music` panel 專用：定期打 `/api/music/files` 拿目前 `music/` 資料夾裡的
  // 檔案清單，畫成一列一列（播放/刪除按鈕），跟其他 panel 純文字顯示不一樣，
  // 是這個 panel 才有的獨立功能——跟後端 `download`/`list` 共用同一個資料夾，
  // 但直接讀寫檔案，不透過 `Shell`（見 `web.rs` 的說明）。
  function startMusicFileBrowser(musicUi) {
    async function refresh() {
      try {
        const res = await fetch("/api/music/files");
        const items = await res.json();
        renderMusicFiles(musicUi, items, refresh);
      } catch (_err) {
        // 這次沒抓到就算了，下一次 poll 再試，不用跳錯誤訊息干擾畫面。
      }
    }
    refresh();
    const timer = setInterval(refresh, 3000);
    musicUi.stopPolling = () => clearInterval(timer);
  }

  // 秒數轉成 "分:秒"（例如 80 -> "1:20"），超過一小時才會多帶一段時
  // （"1:05:00" 這種），一般歌曲長度用不到那一段、不用特別去補前導 0。
  function formatTime(seconds) {
    const total = Number.isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const secs = total % 60;
    const paddedSecs = String(secs).padStart(2, "0");
    if (hours > 0) {
      return `${hours}:${String(minutes).padStart(2, "0")}:${paddedSecs}`;
    }
    return `${minutes}:${paddedSecs}`;
  }

  // 進度條右邊「現在播放時間/這首全部時長」的文字，`timeupdate`（播放中）、
  // `loadedmetadata`（換歌後拿到新的總時長）、拖拉進度條時都要更新，共用
  // 這個函式才不會三個地方各寫一份格式化邏輯。
  function updateTimeLabel(musicUi) {
    if (!musicUi.timeLabel) return;
    musicUi.timeLabel.textContent = `${formatTime(musicUi.player.currentTime)}/${formatTime(musicUi.player.duration)}`;
  }

  // 鎖屏/背景的媒體控制列要顯示「上一首/下一首」而不是預設的快退快進，
  // 關鍵是要有註冊 previoustrack/nexttrack 這兩個 action handler。單獨包
  // try/catch 是因為 MDN 有記載：某些瀏覽器/版本不支援特定 action 時，
  // `setActionHandler` 會直接 throw——不包起來的話，一個不支援的 action
  // 會讓迴圈裡排在後面的 handler 全部註冊不到。`playByName` 每次真的換歌、
  // 更新 `mediaSession.metadata` 時也重新呼叫一次：部分瀏覽器要在
  // 「now playing」session 更新的同時重新確認這些 handler 才會正確反映到
  // 系統的鎖屏/控制中心 UI 上。
  function setMediaSessionActionHandlers(musicUi) {
    if (!("mediaSession" in navigator)) return;
    const handlers = {
      play: () => musicUi.player.play(),
      pause: () => musicUi.player.pause(),
      previoustrack: () => offsetTrack(musicUi, -1),
      nexttrack: () => goToNextTrack(musicUi),
    };
    for (const [action, handler] of Object.entries(handlers)) {
      try {
        navigator.mediaSession.setActionHandler(action, handler);
      } catch {
        // 這個瀏覽器/版本不支援這個 action，跳過即可。
      }
    }
  }

  // 播放清單靠「目前正在播的檔名」而不是數字索引來記位置——清單每 3 秒重新
  // 抓一次，中間如果有檔案被加入/刪除，數字索引會對錯歌，用檔名去查目前
  // 清單裡的位置就不會有這個問題。
  function playByName(musicUi, name) {
    musicUi.currentName = name;
    musicUi.player.src = `/api/music/file/${encodeURIComponent(name)}/audio`;
    musicUi.player.play();
    updateNowPlayingFavButton(musicUi);
    // 隨機播放模式下，接下來要播的那首在清單裡可能離目前捲動位置很遠；換歌時
    // 把目前播放中的那一列捲進可視範圍——`block: "nearest"` 只有真的被捲出
    // 範圍外時才會動，本來就看得到的話不會多此一舉亂捲動。
    const activeRow = highlightPlaying(musicUi);
    if (activeRow) {
      activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    // `cover`/`trackName`/`seekBar` 只有 `player` panel 才有（`music` panel
    // 沒有這些顯示），一般 panel 的 `musicUi` 也不會有這幾個欄位。
    if (musicUi.cover) {
      musicUi.cover.removeAttribute("src");
      musicUi.cover.src = `/api/music/file/${encodeURIComponent(name)}/cover`;
    }
    if (musicUi.trackName) {
      musicUi.trackName.textContent = name;
    }
    // 換歌時同步更新鎖屏畫面/通知列顯示的歌名＋封面，同時重新呼叫一次
    // `setMediaSessionActionHandlers`（見該函式的說明）。
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: name,
        artwork: [{ src: `/api/music/file/${encodeURIComponent(name)}/cover` }],
      });
      setMediaSessionActionHandlers(musicUi);
    }
    if (musicUi.seekBar) {
      // 換歌了，先歸零，不要讓上一首播到一半的進度殘留在畫面上，等新的一首
      // `loadedmetadata`/`timeupdate` 觸發後很快就會被覆蓋成正確的值。
      musicUi.seekBar.max = "0";
      musicUi.seekBar.value = "0";
      updateTimeLabel(musicUi);
    }
    if (musicUi.lyricsEl) {
      // 歌詞是 `download` 順便抓到的 YouTube 字幕轉出來的，不是每首歌都有
      // （404 就是沒有），失敗也當作沒有處理，不要跳錯誤訊息干擾畫面。
      fetch(`/api/music/file/${encodeURIComponent(name)}/lyrics`)
        .then((res) => (res.ok ? res.json() : []))
        .then((lines) => renderLyrics(musicUi, lines))
        .catch(() => renderLyrics(musicUi, []));
    }
  }

  function renderLyrics(musicUi, lines) {
    musicUi.lyricsLines = lines;
    musicUi.lyricsActiveIndex = -1;
    musicUi.lyricsEl.innerHTML = "";
    if (lines.length === 0) {
      const empty = document.createElement("div");
      empty.className = "player-lyrics-empty";
      empty.textContent = "(沒有歌詞)";
      musicUi.lyricsEl.appendChild(empty);
      return;
    }
    for (const line of lines) {
      const div = document.createElement("div");
      div.className = "player-lyric-line";
      div.textContent = line.text;
      musicUi.lyricsEl.appendChild(div);
    }
  }

  // 「目前唱到哪一句」＝開始時間不超過目前播放進度的最後一句；每次 `timeupdate`
  // 都會呼叫，用 `lyricsActiveIndex` 記住上一次反白的是哪一句，沒變就不用重新
  // 操作 DOM（`timeupdate` 一秒觸發好幾次，沒必要每次都全部重畫）。
  // 把目前反白的那一句捲到看得見的地方。歌詞是放播放模式按鈕下面的迷你
  // 小視窗（`.player-lyrics-mini`），只留幾行高度，這個函式負責把它捲到
  // 看得見目前唱到的那一句。
  function scrollActiveLyricIntoView(musicUi) {
    const rows = musicUi.lyricsEl.children;
    const idx = musicUi.lyricsActiveIndex;
    if (idx >= 0 && rows[idx]) {
      rows[idx].scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  function updateLyricsHighlight(musicUi) {
    const lines = musicUi.lyricsLines;
    if (!musicUi.lyricsEl || !lines || lines.length === 0) return;
    const t = musicUi.player.currentTime;
    let idx = -1;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].start <= t) idx = i;
      else break;
    }
    if (idx === musicUi.lyricsActiveIndex) return;
    musicUi.lyricsActiveIndex = idx;
    const rows = musicUi.lyricsEl.children;
    for (let i = 0; i < rows.length; i++) {
      rows[i].classList.toggle("active", i === idx);
    }
    scrollActiveLyricIntoView(musicUi);
  }

  // 換到「下一首」時（不管是照順序還是隨機），只要候選歌曲不是收藏
  // （`musicUi.favorites`，見 `renderMusicFiles`），就有這個機率直接跳過、
  // 繼續找下一個候選——不影響「上一首」，使用者按上一首是明確要聽前一首，
  // 不該被跳過。
  const SKIP_NON_FAVORITE_PROBABILITY = 0.3;

  function isFavoriteTrack(musicUi, name) {
    return musicUi.favorites.has(name);
  }

  function shouldSkipNonFavorite(musicUi, name) {
    return !isFavoriteTrack(musicUi, name) && Math.random() < SKIP_NON_FAVORITE_PROBABILITY;
  }

  // 目前播放這首歌旁邊那顆收藏按鈕（`musicUi.nowPlayingFavBtn`，`music`
  // panel 沒有這個欄位，跟 `cover`/`trackName`/`seekBar` 同一套「只有 `player`
  // panel 才有」的判斷）換歌（`playByName`）、清單重新整理（`renderMusicFiles`
  // 重建 `musicUi.favorites`）、使用者自己按這顆按鈕之後都要呼叫這個更新一次
  // 圖示，三個地方共用才不會各寫一份「有沒有收藏」的判斷邏輯。
  function updateNowPlayingFavButton(musicUi) {
    if (!musicUi.nowPlayingFavBtn) return;
    const isFav = musicUi.currentName ? isFavoriteTrack(musicUi, musicUi.currentName) : false;
    musicUi.nowPlayingFavBtn.disabled = !musicUi.currentName;
    musicUi.nowPlayingFavBtn.textContent = isFav ? "★" : "☆";
    musicUi.nowPlayingFavBtn.title = isFav ? "取消收藏" : "加入收藏（收藏的歌曲換下一首時不會被機率跳過）";
  }

  // `delta` 是 +1（下一首）或 -1（上一首）；找不到目前這首（例如已經被刪除）
  // 就不做事。往「下一首」（`delta > 0`）方向走時，遇到不是收藏的候選歌曲就
  // 依 `shouldSkipNonFavorite` 機率跳過、往後找下一個真的要播的，一路找到
  // 清單尾端都沒有可播的就跟原本一樣不做事；「上一首」維持原本行為，不套用
  // 跳過邏輯。
  function offsetTrack(musicUi, delta) {
    const idx = musicUi.playlist.indexOf(musicUi.currentName);
    if (idx === -1) return;
    if (delta > 0) {
      for (let next = idx + delta; next < musicUi.playlist.length; next++) {
        const name = musicUi.playlist[next];
        if (!shouldSkipNonFavorite(musicUi, name)) {
          playByName(musicUi, name);
          return;
        }
      }
      return;
    }
    const next = idx + delta;
    if (next >= 0 && next < musicUi.playlist.length) {
      playByName(musicUi, musicUi.playlist[next]);
    }
  }

  // 隨機播放模式共用的「隨機挑清單裡別首來播」：清單裡還有別首就隨機挑一首
  // （排除目前這首，不然感覺像沒換），只剩這一首（或清單是空的）就原地重播/
  // 不做事——「隨機播放模式下按下一首」（見 `nextBtn` 的點擊事件）跟「隨機
  // 播放模式下一首歌自然播完」（見 `advanceOnEnded`）都是同一種「换一首」，
  // 共用這個函式才不會兩邊各寫一份邏輯、之後改一邊忘了改另一邊。抽到的候選
  // 一樣要過 `shouldSkipNonFavorite` 這一關，跳過就從候選池裡把它剔除再重抽
  // （候選池每輪至少少一個，最多重抽 `others.length` 次一定會結束，不會卡在
  // 原地空轉）；萬一全部候選都被跳過（候選數愈少愈可能發生），退回不看跳過
  // 機率直接隨機挑一首播——保證一定會換到別首歌。
  function playRandomOther(musicUi) {
    const others = musicUi.playlist.filter((name) => name !== musicUi.currentName);
    if (others.length === 0) {
      if (musicUi.playlist.length > 0) {
        musicUi.player.currentTime = 0;
        musicUi.player.play();
      }
      return;
    }
    let pool = others;
    while (pool.length > 0) {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      if (!shouldSkipNonFavorite(musicUi, pick)) {
        playByName(musicUi, pick);
        return;
      }
      pool = pool.filter((name) => name !== pick);
    }
    playByName(musicUi, others[Math.floor(Math.random() * others.length)]);
  }

  // 「下一首」按鈕跟 Media Session 的 `nexttrack` 動作（見
  // `setMediaSessionActionHandlers`）共用同一個判斷：隨機播放模式下真的
  // 隨機換一首，其餘情況照清單順序走（見上面 `prevBtn`/`nextBtn` 註解的
  // 說明）。
  function goToNextTrack(musicUi) {
    if (musicUi.playMode === "shuffle") {
      playRandomOther(musicUi);
    } else {
      offsetTrack(musicUi, 1);
    }
  }

  // 一首歌自然播完（`ended` 事件）之後接下來要做什麼，依 `musicUi.playMode`
  // （見 player panel 裡 `modeBtn` 的三個狀態）決定：
  // - "single"：原地重播同一首。
  // - "shuffle"：清單裡隨機挑一首（清單只剩一首時就等同 "single"）。
  // - "sequential"（預設）：跟原本的行為一樣，照清單順序播下一首。
  function advanceOnEnded(musicUi) {
    if (musicUi.playMode === "single") {
      musicUi.player.currentTime = 0;
      musicUi.player.play();
      return;
    }
    if (musicUi.playMode === "shuffle") {
      playRandomOther(musicUi);
      return;
    }
    offsetTrack(musicUi, 1);
  }

  // 回傳目前正在播放那一列的 DOM 元素（沒有就是 `null`），讓呼叫端決定要不要
  // 順便捲動——`renderMusicFiles` 每次 poll 都會呼叫這個，捲動與否不該由這裡
  // 決定（不然使用者在清單裡往下滑找別首歌，畫面會一直被拉回目前播放的那首）。
  function highlightPlaying(musicUi) {
    let activeRow = null;
    for (const row of musicUi.fileList.children) {
      const isActive = row.dataset.name === musicUi.currentName;
      row.classList.toggle("playing", isActive);
      if (isActive) activeRow = row;
    }
    return activeRow;
  }

  // `items` 是 `/api/music/files` 回的 `{name, favorite}[]`（見
  // `src/web.rs` 的 `music_files`）。`musicUi.playlist` 仍然維持單純的檔名
  // 陣列（`offsetTrack`/`playRandomOther`/`playByName` 一路以來都是這樣用），
  // 收藏狀態另外放進 `musicUi.favorites`（檔名的 `Set`），兩者都在這裡一起
  // 更新，維持同步。
  function renderMusicFiles(musicUi, items, refresh) {
    musicUi.playlist = items.map((item) => item.name);
    musicUi.favorites = new Set(items.filter((item) => item.favorite).map((item) => item.name));
    updateNowPlayingFavButton(musicUi);
    musicUi.fileList.innerHTML = "";
    musicUi.fileCount.textContent = `共 ${items.length} 首`;
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "music-empty";
      empty.textContent = "(還沒有下載任何檔案)";
      musicUi.fileList.appendChild(empty);
      return;
    }
    for (const item of items) {
      const name = item.name;
      const row = document.createElement("div");
      row.className = "music-row";
      row.dataset.name = name;
      const label = document.createElement("span");
      label.className = "music-name";
      label.textContent = name;
      label.title = name;

      const playBtn = document.createElement("button");
      playBtn.textContent = "▶";
      playBtn.title = "播放";
      playBtn.addEventListener("click", () => playByName(musicUi, name));

      // 收藏標記：換到下一首時（見 `offsetTrack`/`playRandomOther`），沒
      // 收藏的歌曲有機率被跳過，這個按鈕就是使用者標記「這首不要被跳過」
      // 的地方。點下去直接切換、重抓一次清單刷新星星圖示跟 `musicUi.favorites`
      // ——跟 `delBtn` 同一個「送出請求後 `refresh()`」的作法，不用自己在
      // 前端另外維護一份切換後的暫時狀態。
      const favBtn = document.createElement("button");
      favBtn.textContent = item.favorite ? "★" : "☆";
      favBtn.title = item.favorite ? "取消收藏" : "加入收藏（收藏的歌曲換下一首時不會被機率跳過）";
      favBtn.addEventListener("click", async () => {
        await fetch(`/api/music/file/${encodeURIComponent(name)}/favorite`, { method: "POST" });
        refresh();
      });

      const delBtn = document.createElement("button");
      delBtn.textContent = "🗑";
      delBtn.title = "刪除";
      delBtn.addEventListener("click", async () => {
        if (!window.confirm(`刪除「${name}」？`)) return;
        await fetch(`/api/music/file/${encodeURIComponent(name)}`, { method: "DELETE" });
        refresh();
      });

      row.appendChild(label);
      row.appendChild(favBtn);
      row.appendChild(playBtn);
      row.appendChild(delBtn);
      musicUi.fileList.appendChild(row);
    }
    highlightPlaying(musicUi);
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // code fence 的語法上色規則：關鍵字清單、單行註解開頭符號、區塊註解頭尾
  // 符號——跟 `gui.rs` 的 `language_spec` 是同一套規則（維持兩邊一致），不是
  // 完整的詞法分析器，但字串/註解/數字/關鍵字這幾類最常見、最有用的分類
  // 已經涵蓋。
  const CODE_LANGUAGES = {
    rust: {
      keywords: ["fn","let","mut","pub","struct","enum","impl","trait","use","mod","if","else","match","for","while","loop","return","break","continue","const","static","self","Self","super","crate","as","in","move","ref","where","async","await","dyn","unsafe","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    python: {
      keywords: ["def","class","if","elif","else","for","while","return","import","from","as","with","try","except","finally","raise","pass","break","continue","lambda","yield","in","is","not","and","or","None","True","False","self","global","nonlocal","async","await"],
      lineComment: "#",
      blockComment: null,
    },
    javascript: {
      keywords: ["function","const","let","var","if","else","for","while","return","class","extends","new","this","import","export","from","as","try","catch","finally","throw","break","continue","switch","case","default","typeof","instanceof","in","of","async","await","yield","null","undefined","true","false","super"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    c: {
      keywords: ["int","char","float","double","void","if","else","for","while","return","struct","typedef","enum","union","static","const","unsigned","signed","long","short","sizeof","switch","case","default","break","continue","class","public","private","protected","namespace","template","new","delete","this","virtual","override","nullptr","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    java: {
      keywords: ["public","private","protected","class","interface","extends","implements","static","final","void","int","long","float","double","boolean","char","String","if","else","for","while","return","new","this","super","try","catch","finally","throw","throws","import","package","break","continue","switch","case","default","true","false","null"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    go: {
      keywords: ["func","package","import","var","const","type","struct","interface","if","else","for","range","return","go","chan","select","case","default","switch","break","continue","defer","map","nil","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    bash: {
      keywords: ["if","then","else","elif","fi","for","while","do","done","case","esac","function","return","exit","export","local","echo","break","continue","in"],
      lineComment: "#",
      blockComment: null,
    },
    json: { keywords: ["true", "false", "null"], lineComment: null, blockComment: null },
    sql: {
      keywords: ["SELECT","FROM","WHERE","INSERT","INTO","VALUES","UPDATE","SET","DELETE","JOIN","LEFT","RIGHT","INNER","OUTER","ON","GROUP","BY","ORDER","HAVING","AS","AND","OR","NOT","NULL","IS","IN","LIKE","LIMIT","CREATE","TABLE","DROP","ALTER","PRIMARY","KEY","FOREIGN","REFERENCES","DEFAULT","DISTINCT"],
      lineComment: "--",
      blockComment: ["/*", "*/"],
    },
    ruby: {
      keywords: ["def","end","class","module","if","elsif","else","unless","while","until","for","in","do","return","break","next","yield","begin","rescue","ensure","raise","require","true","false","nil","self"],
      lineComment: "#",
      blockComment: null,
    },
    yaml: { keywords: ["true", "false", "null"], lineComment: "#", blockComment: null },
  };
  const CODE_LANG_ALIASES = {
    rs: "rust", py: "python",
    js: "javascript", ts: "javascript", jsx: "javascript", tsx: "javascript", typescript: "javascript",
    cpp: "c", "c++": "c", h: "c", hpp: "c",
    golang: "go",
    sh: "bash", shell: "bash", zsh: "bash",
    rb: "ruby",
    yml: "yaml", toml: "yaml",
  };

  // 依 code fence 開頭標注的語言名稱（例如 ` ```rust ` 的 `rust`）查對應的
  // 語法上色規則；沒標語言或標了但不認得的語言都回傳 `null`，呼叫端在這種
  // 情況下維持原本單一顏色的樣子，不強行套用錯誤的規則。
  function getLanguageSpec(lang) {
    const key = (lang || "").toLowerCase();
    return CODE_LANGUAGES[CODE_LANG_ALIASES[key] || key] || null;
  }

  // 把一行程式碼掃成字串/註解/數字/關鍵字/其餘（plain）幾類，各自包一層
  // `<span class="tok-...">`；不是完整的詞法分析器（不處理跳脫字元、原始
  // 字串、巢狀區塊註解），跟 `gui.rs` 的 `highlight_code_line` 是同一套簡化
  // 規則。`state.inBlockComment` 是跨行狀態（區塊註解可能橫跨好幾行），
  // 呼叫端每個 code block 開頭要重設成 `{ inBlockComment: false }`，同一個
  // code block 內逐行往下傳同一個物件（靠物件參考模擬「傳址」，JS 沒有
  // 像 Rust `&mut bool` 那樣的東西）。
  function highlightCodeLine(line, spec, state) {
    let html = "";
    let plainStart = 0;
    let i = 0;
    const flushPlain = (end) => {
      if (plainStart < end) html += escapeHtml(line.slice(plainStart, end));
    };

    if (state.inBlockComment && spec.blockComment) {
      const idx = line.indexOf(spec.blockComment[1]);
      if (idx === -1) {
        return line ? `<span class="tok-comment">${escapeHtml(line)}</span>` : "";
      }
      const end = idx + spec.blockComment[1].length;
      html += `<span class="tok-comment">${escapeHtml(line.slice(0, end))}</span>`;
      i = end;
      plainStart = end;
      state.inBlockComment = false;
    }

    while (i < line.length) {
      if (spec.blockComment && line.startsWith(spec.blockComment[0], i)) {
        flushPlain(i);
        const idx = line.indexOf(spec.blockComment[1], i + spec.blockComment[0].length);
        if (idx === -1) {
          html += `<span class="tok-comment">${escapeHtml(line.slice(i))}</span>`;
          state.inBlockComment = true;
          i = line.length;
        } else {
          const end = idx + spec.blockComment[1].length;
          html += `<span class="tok-comment">${escapeHtml(line.slice(i, end))}</span>`;
          i = end;
        }
        plainStart = i;
        continue;
      }
      if (spec.lineComment && line.startsWith(spec.lineComment, i)) {
        flushPlain(i);
        html += `<span class="tok-comment">${escapeHtml(line.slice(i))}</span>`;
        plainStart = line.length;
        break;
      }
      const ch = line[i];
      if (ch === '"' || ch === "'") {
        const end = line.indexOf(ch, i + 1);
        if (end !== -1) {
          flushPlain(i);
          html += `<span class="tok-string">${escapeHtml(line.slice(i, end + 1))}</span>`;
          i = end + 1;
          plainStart = i;
          continue;
        }
      }
      if (/[A-Za-z_]/.test(ch)) {
        const word = line.slice(i).match(/^[A-Za-z0-9_]+/)[0];
        if (spec.keywords.includes(word)) {
          flushPlain(i);
          html += `<span class="tok-keyword">${escapeHtml(word)}</span>`;
          i += word.length;
          plainStart = i;
          continue;
        }
        i += word.length;
        continue;
      }
      if (/[0-9]/.test(ch)) {
        const num = line.slice(i).match(/^[0-9.]+/)[0];
        flushPlain(i);
        html += `<span class="tok-number">${escapeHtml(num)}</span>`;
        i += num.length;
        plainStart = i;
        continue;
      }
      i++;
    }
    flushPlain(line.length);
    return html;
  }

  // `notepad` panel 的即時 markdown 預覽用：不是完整的 CommonMark 剖析器
  // （不處理巢狀強調、參照連結、表格這些），只涵蓋最常用的語法，足夠「盡量
  // 還原排版好的樣子」。文字先跳脫過 HTML 特殊字元，使用者打的原始內容
  // 不會被當成標籤解讀、也不會有 HTML injection 的風險。
  function renderInlineMarkdown(text) {
    let s = escapeHtml(text);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    // `***文字***`（粗體兼斜體）要在 `**` 規則之前處理，不然會被 `**` 先
    // 吃掉、多出來的一個 `*` 變成殘留字元。
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`);
    s = s.replace(/~~([^~]+)~~/g, "<s>$1</s>");
    s = s.replace(/\+\+([^+]+)\+\+/g, '<span class="notepad-underline">$1</span>');
    s = s.replace(/==([^=]+)==/g, '<span class="notepad-highlight">$1</span>');
    s = s.replace(/\*([^*]+)\*|_([^_]+)_/g, (_, a, b) => `<em>${a ?? b}</em>`);
    // 圖片語法 `![替代文字](網址)`：不是每個 panel 都需要真的顯示圖片，這裡
    // 只當成連結對待——有些論壇（例如 Discourse）的替代文字會夾帶
    // `|690x460, 50%` 這種縮放/尺寸提示，只取 `|` 前面那段當作顯示文字。
    // 要先處理過圖片語法，才不會被底下的一般連結規則吃到剩一個孤立的 `!`。
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => {
      const label = alt.split("|")[0].trim();
      return `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
    });
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
    // `<br>` 換行標記：原始文字先被 `escapeHtml` 跳脫成 `&lt;br&gt;`，這裡
    // 換回真正的 `<br>` 標籤才會讓瀏覽器實際換行，而不是顯示成字面文字。
    s = s.replace(/&lt;br&gt;/g, "<br>");
    return s;
  }

  function isTableRow(line) {
    return line.includes("|") && line.trim() !== "";
  }

  // table 的分隔列（header 底下那一行，例如 `| --- | :---: | ---: |`）：只由
  // `-`、`:`、`|`、空白組成，且至少要有一個 `-`。
  function isTableSeparator(line) {
    const t = line.trim();
    return t.includes("-") && /^[-:|\s]+$/.test(t);
  }

  // 把一行 table 資料列拆成每一欄內容（已 trim 過前後空白）；行首/行尾的
  // `|` 是可有可無的分隔符號，不當作多一欄空白內容。
  function splitTableRow(line) {
    let t = line.trim();
    if (t.startsWith("|")) t = t.slice(1);
    if (t.endsWith("|")) t = t.slice(0, -1);
    return t.split("|").map((cell) => cell.trim());
  }

  // 逐行處理區塊層級語法（標題/引言/清單/table/code fence/分隔線/段落），
  // 行內語法交給 `renderInlineMarkdown`。清單/code fence 需要跨行的「目前在
  // 哪個區塊裡」狀態，用 `listType`/`inCodeBlock` 這兩個區域變數追蹤；table
  // 則需要往下看一行才能判斷是不是 table（含 `|` 的下一行是不是分隔列），
  // 所以這裡用索引迴圈而不是 `for...of`，才能在判斷完 table 之後直接把
  // 迴圈游標跳到 table 結束的下一行。
  function renderMarkdown(source) {
    const lines = source.split("\n");
    let html = "";
    let inCodeBlock = false;
    let codeSpec = null;
    let codeState = null;
    let codeShowLineNumbers = false;
    let codeLineCounter = 0;
    let listType = null; // "ul" | "ol" | null
    const closeList = () => {
      if (listType) {
        html += `</${listType}>`;
        listType = null;
      }
    };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (line.trim().startsWith("```")) {
        if (!inCodeBlock) {
          closeList();
          // 開頭 fence 標注的語言（例如 ` ```rust ` 的 `rust`）決定語法上色
          // 規則；語言名稱後面接一個 `=`（例如 ` ```rust= `）表示要加行號，
          // 兩者是各自獨立的標注，`=` 拿掉之後剩下的部分才是真正的語言
          // 名稱。`codeState` 是這個 code block 專屬的跨行狀態，每個 code
          // block 都要重新從 `false` 開始，不能沿用上一個 code block 剩下
          // 的狀態。
          const rawLang = line.trim().slice(3).trim();
          codeShowLineNumbers = rawLang.endsWith("=");
          codeSpec = getLanguageSpec(codeShowLineNumbers ? rawLang.slice(0, -1) : rawLang);
          codeState = { inBlockComment: false };
          codeLineCounter = 0;
          html += `<pre data-line="${i}"><code>`;
          inCodeBlock = true;
        } else {
          html += "</code></pre>";
          inCodeBlock = false;
          codeSpec = null;
        }
        continue;
      }
      if (inCodeBlock) {
        if (codeShowLineNumbers) {
          codeLineCounter++;
          html += `<span class="line-no">${codeLineCounter}</span>`;
        }
        html += codeSpec ? highlightCodeLine(line, codeSpec, codeState) : escapeHtml(line);
        html += "\n";
        continue;
      }

      // table：一行含 `|` 的資料列，緊接著一行分隔列，就當作 table 的開頭；
      // 後面連續含 `|` 的行都算資料列，直到遇到不符合的行或內容結尾為止。
      if (isTableRow(line) && !isTableSeparator(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
        closeList();
        const headerCells = splitTableRow(line);
        let j = i + 2;
        const dataRows = [];
        while (j < lines.length && isTableRow(lines[j])) {
          dataRows.push(splitTableRow(lines[j]));
          j++;
        }
        html += `<table data-line="${i}"><thead><tr>`;
        for (const cell of headerCells) html += `<th>${renderInlineMarkdown(cell)}</th>`;
        html += "</tr></thead><tbody>";
        for (const [rowOffset, row] of dataRows.entries()) {
          // 每一列各自帶自己的來源行號（`i + 2` 是資料列的起點，跳過 header
          // 跟分隔列），捲動同步時才能精準對到你正在編輯的那一列，不是整個
          // table 一起跳。
          html += `<tr data-line="${i + 2 + rowOffset}">`;
          for (const cell of row) html += `<td>${renderInlineMarkdown(cell)}</td>`;
          html += "</tr>";
        }
        html += "</tbody></table>";
        i = j - 1; // for 迴圈本身還會再 +1
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        closeList();
        const level = heading[1].length;
        html += `<h${level} data-line="${i}">${renderInlineMarkdown(heading[2])}</h${level}>`;
        continue;
      }
      if (/^\s*>\s?/.test(line)) {
        closeList();
        html += `<blockquote data-line="${i}">${renderInlineMarkdown(line.replace(/^\s*>\s?/, ""))}</blockquote>`;
        continue;
      }
      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul) {
        if (listType !== "ul") {
          closeList();
          html += "<ul>";
          listType = "ul";
        }
        // GFM 風格的 checklist 項目（`- [ ] 內容`／`- [x] 內容`）：畫成一個
        // 唯讀的 checkbox，`disabled` 是因為這裡只是把目前的 markdown 內容
        // 呈現出來，不是要讓使用者直接點擊改變原始檔案。
        const checkbox = ul[1].match(/^\[( |x|X)\]\s+(.*)$/);
        if (checkbox) {
          const checked = checkbox[1].toLowerCase() === "x";
          html += `<li class="notepad-task" data-line="${i}"><input type="checkbox" disabled${checked ? " checked" : ""}> ${renderInlineMarkdown(checkbox[2])}</li>`;
        } else {
          html += `<li data-line="${i}">${renderInlineMarkdown(ul[1])}</li>`;
        }
        continue;
      }
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ol) {
        if (listType !== "ol") {
          closeList();
          html += "<ol>";
          listType = "ol";
        }
        html += `<li data-line="${i}">${renderInlineMarkdown(ol[1])}</li>`;
        continue;
      }
      if (/^\s*(---|\*\*\*)\s*$/.test(line)) {
        closeList();
        html += `<hr data-line="${i}">`;
        continue;
      }
      closeList();
      if (line.trim() !== "") {
        html += `<p data-line="${i}">${renderInlineMarkdown(line)}</p>`;
      }
    }
    closeList();
    if (inCodeBlock) html += "</code></pre>";
    return html;
  }

  // `global`／`device` panel 專用：把後端送來的逐格 snapshot（見 `web.rs` 的
  // `table_snapshot_json`）畫成一個真正的 `<table>`。用 `textContent` 逐格
  // 填值（不是拼 HTML 字串），這樣任何欄位內容（`global` 的資料有一部分是
  // 其他 domain 透過公開 MQTT broker 回報的字串，不能假設乾淨）都會被瀏覽器
  // 自動跳脫，不會被當成 HTML 解析。`thead`/`tbody` 每次都整個重新建立，所以
  // 剛變化的格子掛的 `cell-flash` class 每次都是全新 DOM node——如果單純用
  // `animation-delay: 0s`，每次重建都會把還在播放中的動畫打斷、跳回全白重新
  // 開始，肉眼看起來閃爍時間比設計的 1 秒短很多（後端 300ms 一個 tick 就可能
  // 重建一次）。改用負的 `animation-delay: -Xs`（`X = flash_ms / 1000`），
  // 讓瀏覽器把這個新 node 的動畫直接當成「已經播到第 X 秒」來算，這樣即使
  // node 本身是全新的，淡出效果在視覺上仍然是從變化發生的那一刻算起、連續
  // 播完整整 1 秒，不會被每次 tbody 重建打斷。
  function renderTableSnapshot(ui, snapshot) {
    const hasRows = snapshot.rows.length > 0;
    ui.empty.style.display = hasRows ? "none" : "";
    ui.scroll.style.display = hasRows ? "" : "none";

    ui.thead.innerHTML = "";
    const headRow = document.createElement("tr");
    for (const header of snapshot.headers) {
      const th = document.createElement("th");
      th.textContent = header;
      headRow.appendChild(th);
    }
    ui.thead.appendChild(headRow);

    ui.tbody.innerHTML = "";
    for (const row of snapshot.rows) {
      const tr = document.createElement("tr");
      // alive 永遠是最後一欄（`device.rs`/`global.rs` 的 `rows()` 都把它排在
      // `cells` 最後一個），不是 `*` 就是離線，整排文字調淡一點（不是只淡化
      // alive 那一格），但不要淡到看不清楚。
      const aliveCell = row.cells[row.cells.length - 1];
      if (aliveCell && aliveCell.text !== "*") {
        tr.className = "row-offline";
      }
      for (const cell of row.cells) {
        const td = document.createElement("td");
        td.textContent = cell.text;
        if (cell.flash_ms !== null && cell.flash_ms !== undefined) {
          td.className = "cell-flash";
          td.style.animationDelay = `-${cell.flash_ms / 1000}s`;
        }
        tr.appendChild(td);
      }
      ui.tbody.appendChild(tr);
    }
  }

  // 開一個 panel：畫出可拖拉/縮放的框，並訂閱後端 `/api/panel/<name>/stream`
  // 這個 SSE，內容一有變化後端就會推播過來，不用自己去 poll。
  const SVGNS = "http://www.w3.org/2000/svg";
  // 跟 device.rs/global.rs 的 ALIVE_TTL（REPORT_INTERVAL 10 秒 * 3）保持
  // 一致，這裡沒有對應的 API 可以查，只能寫死並用註解註明依賴關係。
  const TOPOLOGY_ALIVE_TTL_MS = 30000;
  const TOPOLOGY_POLL_MS = 2500;

  // 跟 `sysinfo::format_uptime` 算法一致（秒數 -> "Xd HH:MM:SS" 或
  // "HH:MM:SS"），topology 的 hover tooltip 用——這是目前唯一需要在前端把
  // 原始秒數格式化的地方，其餘表格類 panel 都是後端已經排版好的文字。
  function formatUptimeJs(secs) {
    const days = Math.floor(secs / 86400);
    const hours = Math.floor((secs % 86400) / 3600);
    const minutes = Math.floor((secs % 3600) / 60);
    const seconds = Math.floor(secs % 60);
    const pad = (n) => String(n).padStart(2, "0");
    return days > 0 ? `${days}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}` : `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  // 跟 `sysinfo::format_disk_usage`/`format_bytes_short` 算法一致。
  function formatDiskJs(free, total) {
    if (total === 0) return "N/A";
    const short = (bytes) => {
      const units = ["B", "K", "M", "G", "T"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
      }
      return unit === 0 ? `${bytes}${units[0]}` : `${value.toFixed(0)}${units[unit]}`;
    };
    return `${short(free)}/${short(total)}`;
  }

  // 合併 `/api/device/list`（本地 domain）跟 `/api/global/list`（`domain`
  // 設定過的話包含本地 domain + 其他 domain 透過 MQTT 收到的）成一份節點
  // 清單，key 優先用 `global/list` 給的 `${domain}/${id}`；`device/list`
  // 裡任何 `id` 已經在 `global/list` 出現過的就跳過（同一台機器不畫兩次），
  // 沒出現過的用 `local/${id}` 當 key（代表「不知道 domain 名稱，但本機
  // 看得到」，不畫進任何 domain 外框，見 `render` 對 `domain` 為 null 的
  // 處理）。
  async function fetchTopologyNodes() {
    let deviceList = [];
    let globalList = [];
    try {
      [deviceList, globalList] = await Promise.all([
        fetch("/api/device/list").then((r) => r.json()),
        fetch("/api/global/list").then((r) => r.json()),
      ]);
    } catch (_err) {
      return new Map();
    }
    const nodes = new Map();
    for (const item of globalList) {
      const key = `${item.domain}/${item.report.id}`;
      nodes.set(key, { key, domain: item.domain, report: item.report, ageSecs: item.age_secs });
    }
    const idsFromGlobal = new Set([...nodes.values()].map((n) => n.report.id));
    for (const item of deviceList) {
      if (idsFromGlobal.has(item.report.id)) continue;
      const key = `local/${item.report.id}`;
      nodes.set(key, { key, domain: null, report: item.report, ageSecs: item.age_secs });
    }
    return nodes;
  }

  // 邊代表「設定上的關係」，不即時驗證真的連上：每個 `mode === "server"`
  // 的節點都連去一個共用的 `"broker"` 節點（沒有任何 server 就完全不畫
  // broker，由呼叫端看 `hasServer` 決定）；每個 `report.server_addr` 有值
  // 的節點，連去 ip 等於那個值的節點（找不到就不畫這條線，可能是那台
  // server 還沒被任何清單看到）。
  function computeTopologyEdges(nodes) {
    const byIp = new Map();
    for (const n of nodes.values()) byIp.set(n.report.ip, n.key);
    const edges = [];
    let hasServer = false;
    for (const n of nodes.values()) {
      if (n.report.mode === "server") {
        hasServer = true;
        edges.push({ from: n.key, to: "broker" });
      }
      if (n.report.server_addr) {
        const targetKey = byIp.get(n.report.server_addr);
        if (targetKey && targetKey !== n.key) edges.push({ from: n.key, to: targetKey });
      }
    }
    return { edges, hasServer };
  }

  // weather panel：跟 tablet.html 的 `startWeatherTab` 是同一套邏輯（各自
  // 一份程式碼，理由見 `.weather-body` CSS 的說明），資料來自
  // `/api/weather/list`（見 `src/plugins/weather.rs` 的
  // `WeatherPlugin::snapshot`）。11 種天氣分類（跟 `weather.rs` 的
  // `classify()` 一一對應）各自的中文標籤、背景漸層色、要疊加的動態效果。
  const WEATHER_POLL_MS = 8000;
  const WEATHER_LABELS = {
    sunny: "晴天",
    "partly-cloudy": "多雲時晴",
    cloudy: "多雲",
    overcast: "陰天",
    fog: "有霧",
    showers: "短暫陣雨",
    rain: "下雨",
    snow: "下雪",
    thunderstorm: "雷雨",
    "ice-pellets": "凍雨",
    unknown: "天氣不明",
  };
  const WEATHER_GRADIENTS = {
    sunny: "linear-gradient(160deg, #ffb347 0%, #ff8a3d 55%, #ff6f61 100%)",
    "partly-cloudy": "linear-gradient(160deg, #7fb7e8 0%, #a9c9e8 45%, #f0c869 100%)",
    cloudy: "linear-gradient(160deg, #8a97a8 0%, #6b7789 100%)",
    overcast: "linear-gradient(160deg, #5c6472 0%, #3a4150 100%)",
    fog: "linear-gradient(160deg, #c3c9d1 0%, #9aa2ac 100%)",
    showers: "linear-gradient(160deg, #5c7a9e 0%, #34506b 100%)",
    rain: "linear-gradient(160deg, #44607e 0%, #223245 100%)",
    snow: "linear-gradient(160deg, #d8e6f2 0%, #a9c1d6 100%)",
    thunderstorm: "linear-gradient(160deg, #34364a 0%, #14151f 100%)",
    "ice-pellets": "linear-gradient(160deg, #c3d8e4 0%, #90aabd 100%)",
    unknown: "linear-gradient(160deg, #6b7280 0%, #4a5160 100%)",
  };
  const WEATHER_EFFECTS = {
    sunny: { sun: true },
    "partly-cloudy": { sun: true, clouds: 2 },
    cloudy: { clouds: 3 },
    overcast: { clouds: 4, dim: true },
    fog: { fogBands: 3 },
    showers: { rain: 10 },
    rain: { rain: 20 },
    snow: { snow: 16 },
    thunderstorm: { rain: 16, lightning: true, dim: true },
    "ice-pellets": { snow: 12, fast: true },
    unknown: { clouds: 2 },
  };

  function buildWeatherBackground(category) {
    const bg = document.createElement("div");
    bg.className = "weather-bg" + (WEATHER_EFFECTS[category]?.dim ? " weather-bg-dim" : "");
    bg.style.background = WEATHER_GRADIENTS[category] || WEATHER_GRADIENTS.unknown;
    const effects = WEATHER_EFFECTS[category] || {};

    if (effects.sun) {
      const glow = document.createElement("div");
      glow.className = "weather-sun-glow";
      bg.appendChild(glow);
    }
    if (effects.clouds) {
      for (let i = 0; i < effects.clouds; i++) {
        const cloud = document.createElement("div");
        cloud.className = "weather-cloud";
        cloud.style.top = `${10 + Math.random() * 55}%`;
        cloud.style.transform = `scale(${0.6 + Math.random() * 0.8})`;
        cloud.style.opacity = String(0.3 + Math.random() * 0.35);
        cloud.style.animationDuration = `${40 + Math.random() * 40}s`;
        cloud.style.animationDelay = `-${Math.random() * 40}s`;
        bg.appendChild(cloud);
      }
    }
    if (effects.fogBands) {
      for (let i = 0; i < effects.fogBands; i++) {
        const band = document.createElement("div");
        band.className = "weather-fog-band";
        band.style.top = `${15 + i * 28}%`;
        band.style.animationDuration = `${16 + Math.random() * 10}s`;
        band.style.animationDelay = `-${Math.random() * 20}s`;
        bg.appendChild(band);
      }
    }
    if (effects.rain) {
      for (let i = 0; i < effects.rain; i++) {
        const drop = document.createElement("div");
        drop.className = "weather-drop";
        drop.style.left = `${Math.random() * 100}%`;
        drop.style.animationDuration = `${0.5 + Math.random() * 0.4}s`;
        drop.style.animationDelay = `-${Math.random() * 2}s`;
        bg.appendChild(drop);
      }
    }
    if (effects.snow) {
      for (let i = 0; i < effects.snow; i++) {
        const flake = document.createElement("div");
        flake.className = "weather-flake";
        const dur = effects.fast ? 2 + Math.random() : 4 + Math.random() * 3;
        flake.style.left = `${Math.random() * 100}%`;
        flake.style.width = flake.style.height = `${3 + Math.random() * 3}px`;
        flake.style.animationDuration = `${dur}s`;
        flake.style.animationDelay = `-${Math.random() * dur}s`;
        bg.appendChild(flake);
      }
    }
    if (effects.lightning) {
      const flash = document.createElement("div");
      flash.className = "weather-flash";
      bg.appendChild(flash);
    }
    return bg;
  }

  const WEATHER_CLOUD_SHAPE =
    '<ellipse cx="38" cy="60" rx="24" ry="16"/><circle cx="60" cy="46" r="18"/><circle cx="42" cy="38" r="14"/><rect x="24" y="52" width="52" height="22" rx="11"/>';
  const WEATHER_STROKE_BASE = 'fill="none" stroke="currentColor" stroke-linecap="round"';

  function weatherIconWrap(inner) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }
  function weatherSunRays(count, innerR, outerR, cx, cy) {
    let s = "";
    for (let i = 0; i < count; i++) {
      s += `<line x1="${cx}" y1="${cy - outerR}" x2="${cx}" y2="${cy - innerR}" transform="rotate(${(360 / count) * i} ${cx} ${cy})"/>`;
    }
    return s;
  }
  function weatherRainLines(xs, y1, y2) {
    return xs.map((x) => `<line x1="${x}" y1="${y1}" x2="${x - 6}" y2="${y2}"/>`).join("");
  }
  function weatherSnowflakes(xs, cy, r) {
    let s = "";
    for (const cx of xs) {
      for (let i = 0; i < 3; i++) {
        s += `<line x1="${cx}" y1="${cy - r}" x2="${cx}" y2="${cy + r}" transform="rotate(${i * 60} ${cx} ${cy})"/>`;
      }
    }
    return s;
  }
  function weatherPellets(xs, cy, r) {
    return xs.map((x) => `<circle cx="${x}" cy="${cy}" r="${r}"/>`).join("");
  }

  function weatherIconSvg(category) {
    const cloud = `<g fill="currentColor">${WEATHER_CLOUD_SHAPE}</g>`;
    switch (category) {
      case "sunny":
        return weatherIconWrap(
          `<g class="weather-icon-sun-rays" ${WEATHER_STROKE_BASE} stroke-width="6">${weatherSunRays(8, 26, 38, 50, 50)}</g>` +
            `<circle cx="50" cy="50" r="22" fill="currentColor"/>`,
        );
      case "partly-cloudy":
        return weatherIconWrap(
          `<g class="weather-icon-sun-rays" ${WEATHER_STROKE_BASE} stroke-width="5">${weatherSunRays(8, 16, 26, 40, 38)}</g>` +
            `<circle cx="40" cy="38" r="14" fill="currentColor"/>` +
            `<g fill="currentColor" transform="translate(8,10)">${WEATHER_CLOUD_SHAPE}</g>`,
        );
      case "cloudy":
        return weatherIconWrap(`<g fill="currentColor" opacity="0.55" transform="translate(-10,-14) scale(0.85)">${WEATHER_CLOUD_SHAPE}</g>${cloud}`);
      case "overcast":
        return weatherIconWrap(
          `<g fill="currentColor" opacity="0.5" transform="translate(-12,-16) scale(0.85)">${WEATHER_CLOUD_SHAPE}</g>` +
            `<g fill="currentColor" opacity="0.85">${WEATHER_CLOUD_SHAPE}</g>`,
        );
      case "fog":
        return weatherIconWrap(
          `<g fill="currentColor" opacity="0.7" transform="translate(0,-10) scale(1,0.85)">${WEATHER_CLOUD_SHAPE}</g>` +
            `<g ${WEATHER_STROKE_BASE} stroke-width="4"><line x1="20" y1="82" x2="80" y2="82"/><line x1="26" y1="90" x2="74" y2="90"/></g>`,
        );
      case "showers":
        return weatherIconWrap(`${cloud}<g ${WEATHER_STROKE_BASE} stroke-width="5">${weatherRainLines([40, 60], 76, 90)}</g>`);
      case "rain":
        return weatherIconWrap(`${cloud}<g ${WEATHER_STROKE_BASE} stroke-width="5">${weatherRainLines([32, 50, 68], 76, 92)}</g>`);
      case "snow":
        return weatherIconWrap(`${cloud}<g ${WEATHER_STROKE_BASE} stroke-width="4">${weatherSnowflakes([34, 50, 66], 84, 7)}</g>`);
      case "thunderstorm":
        return weatherIconWrap(
          `<g fill="currentColor" opacity="0.85">${WEATHER_CLOUD_SHAPE}</g>` +
            `<g ${WEATHER_STROKE_BASE} stroke-width="5">${weatherRainLines([30, 68], 76, 90)}</g>` +
            `<path d="M56 58 L42 82 L52 82 L44 100 L68 72 L54 72 Z" fill="currentColor"/>`,
        );
      case "ice-pellets":
        return weatherIconWrap(`${cloud}<g fill="currentColor">${weatherPellets([34, 50, 66], 84, 4)}</g>`);
      default:
        return weatherIconWrap(`${cloud}<text x="50" y="90" font-size="22" text-anchor="middle" fill="currentColor">?</text>`);
    }
  }

  function renderWeatherForecastRow(rowEl, items, kind) {
    rowEl.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "weather-forecast-empty";
      empty.textContent = kind === "hour" ? "(今天沒有更多預報時段)" : "(沒有未來預報資料)";
      rowEl.appendChild(empty);
      return;
    }
    const track = document.createElement("div");
    track.className = "weather-forecast-track";
    for (const item of items) {
      const el = document.createElement("div");
      el.className = "weather-forecast-item";
      const icon = document.createElement("span");
      icon.className = "weather-forecast-icon";
      icon.innerHTML = weatherIconSvg(item.category);
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.label;
      const temp = document.createElement("span");
      temp.className = "temp";
      temp.textContent = kind === "hour" ? `${item.temp_c}°` : `${item.min_c}~${item.max_c}°`;
      const rain = document.createElement("span");
      rain.className = "rain";
      rain.textContent = `${item.chance_of_rain}%`;
      el.appendChild(icon);
      el.appendChild(label);
      el.appendChild(temp);
      el.appendChild(rain);
      track.appendChild(el);
    }
    rowEl.appendChild(track);
  }

  // 建立一個獨立運作的 weather 面板：定期打 `/api/weather/list` 拿目前所有
  // 地點的結構化天氣資料，左側清單點哪個地區、右側大圖就換成那個地區的
  // 圖示／背景／預報。`container` 由呼叫端（`openPanel`）建立好 `sidebar`/
  // `main` 兩個子元素傳進來，這裡只負責填內容跟綁事件。回傳 `{ container,
  // stop }`，`stop()` 給 `closePanel` 呼叫，清掉 interval。
  function startWeather(container, sidebar, main) {
    let stopped = false;
    let locations = [];
    let selectedKey = null;

    function renderSidebar() {
      sidebar.innerHTML = "";
      for (const loc of locations) {
        const row = document.createElement("div");
        row.className = "weather-loc-row" + (loc.key === selectedKey ? " selected" : "");
        const icon = document.createElement("span");
        icon.className = "weather-loc-icon";
        icon.innerHTML = weatherIconSvg(loc.now ? loc.now.category : "unknown");
        const name = document.createElement("span");
        name.className = "weather-loc-name";
        name.textContent = loc.place;
        const temp = document.createElement("span");
        temp.className = "weather-loc-temp";
        temp.textContent = loc.now ? `${loc.now.temp_c}°` : "…";
        row.appendChild(icon);
        row.appendChild(name);
        row.appendChild(temp);
        row.addEventListener("click", () => {
          selectedKey = loc.key;
          renderSidebar();
          renderMain();
        });
        sidebar.appendChild(row);
      }
    }

    function renderMain() {
      main.innerHTML = "";
      const loc = locations.find((l) => l.key === selectedKey);
      if (!loc) return;
      const category = loc.now ? loc.now.category : "unknown";
      main.appendChild(buildWeatherBackground(category));

      const hero = document.createElement("div");
      hero.className = "weather-hero";
      const icon = document.createElement("div");
      icon.className = "weather-hero-icon";
      icon.innerHTML = weatherIconSvg(category);
      hero.appendChild(icon);

      if (loc.status) {
        const desc = document.createElement("div");
        desc.className = "weather-hero-desc";
        desc.textContent = loc.status;
        hero.appendChild(desc);
        main.appendChild(hero);
        return;
      }

      const time = document.createElement("div");
      time.className = "weather-hero-time";
      time.textContent = `當地時間 ${loc.now.local_time}`;
      const temp = document.createElement("div");
      temp.className = "weather-hero-temp";
      temp.textContent = `${loc.now.temp_c}°C`;
      const desc = document.createElement("div");
      desc.className = "weather-hero-desc";
      desc.textContent = WEATHER_LABELS[category] || category;
      const sub = document.createElement("div");
      sub.className = "weather-hero-sub";
      sub.textContent = `體感 ${loc.now.feels_like_c}° · 濕度 ${loc.now.humidity}% · 降雨機率 ${loc.now.chance_of_rain}%`;
      hero.appendChild(time);
      hero.appendChild(temp);
      hero.appendChild(desc);
      hero.appendChild(sub);
      main.appendChild(hero);

      const todaySection = document.createElement("div");
      todaySection.className = "weather-forecast-section";
      const todayLabel = document.createElement("div");
      todayLabel.className = "weather-forecast-label";
      todayLabel.textContent = "今天";
      const todayRow = document.createElement("div");
      todayRow.className = "weather-forecast-row";
      todaySection.appendChild(todayLabel);
      todaySection.appendChild(todayRow);
      main.appendChild(todaySection);
      renderWeatherForecastRow(todayRow, loc.today, "hour");

      const daysSection = document.createElement("div");
      daysSection.className = "weather-forecast-section";
      const daysLabel = document.createElement("div");
      daysLabel.className = "weather-forecast-label";
      daysLabel.textContent = "未來預報";
      const daysRow = document.createElement("div");
      daysRow.className = "weather-forecast-row";
      daysSection.appendChild(daysLabel);
      daysSection.appendChild(daysRow);
      main.appendChild(daysSection);
      renderWeatherForecastRow(daysRow, loc.days, "day");
    }

    async function poll() {
      if (stopped) return;
      try {
        const res = await fetch("/api/weather/list");
        locations = await res.json();
      } catch (_err) {
        return;
      }
      if (selectedKey === null || !locations.some((l) => l.key === selectedKey)) {
        selectedKey = locations.length > 0 ? locations[0].key : null;
      }
      renderSidebar();
      renderMain();
    }

    poll();
    const intervalId = setInterval(poll, WEATHER_POLL_MS);

    return {
      container,
      stop() {
        stopped = true;
        clearInterval(intervalId);
      },
    };
  }

  function worldclockProject(lon, lat) {
    return [((lon + 180) / 360) * WORLDCLOCK_MAP_W, ((90 - lat) / 180) * WORLDCLOCK_MAP_H];
  }

  // 太陽此刻在地球上的直射點（緯度＝太陽赤緯，經度＝正對太陽的經線）。用
  // 簡化公式（忽略地球軌道離心率造成的「時差方程」，最多幾分鐘/幾度的誤差）
  // ——晨昏線只是這個 panel 的視覺效果，不是精確的天文計算，這點誤差在世界
  // 地圖這個尺度上看不出來。
  function worldclockSubsolarPoint(date) {
    const rad = Math.PI / 180;
    const startOfYear = Date.UTC(date.getUTCFullYear(), 0, 0);
    const dayOfYear = Math.floor((date.getTime() - startOfYear) / 86400000);
    const decl = -23.44 * Math.cos(rad * (360 / 365) * (dayOfYear + 10));
    const utcHours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
    let lon = 180 - utcHours * 15;
    lon = (((lon + 180) % 360) + 360) % 360 - 180;
    return { decl, lon };
  }

  // 這一刻的夜間區域路徑（SVG path `d`）：每一欄經度算出晨昏線所在的緯度
  // （由 `sin(lat)sin(decl) + cos(lat)cos(decl)cos(lon-lonSun) = 0` 解出
  // `tan(lat) = -cos(lon-lonSun) / tan(decl)`），再往南極或北極補滿剩下的
  // 夜間區域。「哪一極是白天」在同一時刻對所有經度都一樣——兩極的日照公式
  // 在 `cos(lat)=0` 時跟經度無關，直接是 `±sin(decl)`，所以不用像晨昏線緯度
  // 那樣逐欄各自判斷，整張圖固定往同一側補。
  function worldclockNightPath(date) {
    const { decl, lon: lonSun } = worldclockSubsolarPoint(date);
    const rad = Math.PI / 180;
    const tanDecl = Math.tan(decl * rad);
    const nightIsSouth = decl >= 0;
    const step = 4;
    const edgeY = nightIsSouth ? WORLDCLOCK_MAP_H : 0;
    // 單一條連續的子路徑：`(0,edgeY)` -> 沿晨昏線 -> `(mapW,edgeY)` -> `Z`
    // 收回起點。之前這裡在迴圈裡又下了一個 `M`，變成兩條獨立子路徑，`Z`
    // 只會收回「目前這條子路徑」自己的起點，不是整條路徑最開頭的
    // `(0,edgeY)`——結果收尾那筆直接從終點斜線拉回迴圈的起點，畫面上看到
    // 一條左上到右下（或右上到左下）的斜線，不是晨昏線本身的形狀。
    let d = `M0,${edgeY}`;
    for (let x = 0; x <= WORLDCLOCK_MAP_W; x += step) {
      const lon = (x / WORLDCLOCK_MAP_W) * 360 - 180;
      const dLon = (lon - lonSun) * rad;
      let latBoundary;
      if (Math.abs(tanDecl) < 1e-6) {
        latBoundary = Math.cos(dLon) >= 0 ? 90 : -90;
      } else {
        latBoundary = Math.atan(-Math.cos(dLon) / tanDecl) / rad;
      }
      const y = ((90 - latBoundary) / 180) * WORLDCLOCK_MAP_H;
      d += ` L${x},${y}`;
    }
    d += ` L${WORLDCLOCK_MAP_W},${edgeY} Z`;
    return d;
  }

  // 建立一個獨立運作的 worldclock 面板：世界地圖是一次性畫好的靜態圖層，
  // 晨昏線每 30 秒重算一次（太陽直射點移動很慢，這個間隔看起來仍然是連續
  // 的），每個城市的當地時間每秒在前端用 `offset_secs` 自己算、持續跳動
  // （不用每秒重打後端），城市清單本身（`add`/`remove` 造成的變化、還沒
  // 抓到座標的城市之後補上）用跟 `weather` 一樣的 `poll()` 間隔重抓一次。
  // 回傳 `{ container, stop }`，`stop()` 給 `closePanel` 呼叫，清掉三個
  // interval，不留背景在跑。
  function startWorldClock(container, svg, landLayer, nightPath, cityLayer) {
    let stopped = false;
    let markers = []; // { offsetSecs, timeEl }

    for (const ring of WORLD_LAND_RINGS) {
      const points = ring.map(([lon, lat]) => worldclockProject(lon, lat).join(",")).join(" ");
      const polygon = document.createElementNS(SVGNS, "polygon");
      polygon.setAttribute("points", points);
      polygon.setAttribute("class", "worldclock-land");
      landLayer.appendChild(polygon);
    }

    function formatLocalTime(offsetSecs) {
      const local = new Date(Date.now() + offsetSecs * 1000);
      const hh = String(local.getUTCHours()).padStart(2, "0");
      const mm = String(local.getUTCMinutes()).padStart(2, "0");
      const ss = String(local.getUTCSeconds()).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }

    function tickClocks() {
      for (const m of markers) {
        m.timeEl.textContent = formatLocalTime(m.offsetSecs);
      }
    }

    // 城市名稱＋時間兩個 `<text>` 合起來的實際外框（`getBBox()` 量文字真正
    // 畫出來的寬度，不是猜字元數×字寬——城市名稱長短不一，猜的話寬窄不準）。
    function worldclockLabelBox(nameEl, timeEl) {
      const a = nameEl.getBBox();
      const b = timeEl.getBBox();
      const x = Math.min(a.x, b.x);
      const y = Math.min(a.y, b.y);
      return { x, y, right: Math.max(a.x + a.width, b.x + b.width), bottom: Math.max(a.y + a.height, b.y + b.height) };
    }

    function worldclockBoxesOverlap(a, b, pad) {
      return a.x - pad < b.right && a.right + pad > b.x && a.y - pad < b.bottom && a.bottom + pad > b.y;
    }

    function worldclockWithinMap(box) {
      return box.x >= 0 && box.right <= WORLDCLOCK_MAP_W && box.y >= 0 && box.bottom <= WORLDCLOCK_MAP_H;
    }

    function worldclockApplyPlacement(nameEl, timeEl, anchor, textX, nameY, timeY) {
      nameEl.setAttribute("text-anchor", anchor);
      timeEl.setAttribute("text-anchor", anchor);
      nameEl.setAttribute("x", textX);
      timeEl.setAttribute("x", textX);
      nameEl.setAttribute("y", nameY);
      timeEl.setAttribute("y", timeY);
    }

    // 依優先順序試的四個候選位置：右邊、上面、左邊、下面（都以點為基準，
    // `gap` 是點跟文字之間留的間距）。右/左是貼著點的高度左右延伸；上/下是
    // 兩行文字（名稱＋時間）疊在點的正上方/正下方、置中對齊，`lineH` 是
    // 兩行之間的間距。
    function worldclockPlacements(x, y) {
      const gap = 6;
      const lineH = 13;
      return [
        { anchor: "start", textX: x + gap, nameY: y - 4, timeY: y + 9 },
        { anchor: "middle", textX: x, nameY: y - gap - lineH, timeY: y - gap },
        { anchor: "end", textX: x - gap, nameY: y - 4, timeY: y + 9 },
        { anchor: "middle", textX: x, nameY: y + gap + 9, timeY: y + gap + 9 + lineH },
      ];
    }
