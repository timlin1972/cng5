          row.className = "ereader-toc-row" + (entry.chapter === meta.current_chapter ? " ereader-toc-row-current" : "");
          row.textContent = entry.label;
          row.addEventListener("click", () => {
            hideToc();
            if (entry.chapter !== meta.current_chapter) loadChapterAtPage(entry.chapter, 0);
          });
          tocList.appendChild(row);
        }
      }

      function showToc() {
        renderToc();
        tocOverlay.style.display = "flex";
      }

      function hideToc() {
        tocOverlay.style.display = "none";
      }

      function toggleToc() {
        if (tocOverlay.style.display === "none") showToc();
        else hideToc();
      }

      // 滑動翻頁：往左滑＝往後一頁（LTR 書），跟 tap zone 同一套方向對調
      // 邏輯。滑動距離太短當成點擊，交給上面兩塊 tap zone 的 click 處理，
      // 不要兩邊都觸發翻頁。
      frameWrap.addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.touches[0].clientX;
        },
        { passive: true }
      );
      frameWrap.addEventListener(
        "touchend",
        (e) => {
          if (touchStartX === null) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          touchStartX = null;
          if (Math.abs(dx) < 40) return;
          suppressNextClick = true;
          // 手指往左滑（`dx < 0`）在 LTR 書等同「點右側」＝往後一頁，RTL 書
          // 方向相反，跟 tap zone 同一套 `forwardOnRight` 判斷。
          const forward = forwardOnRight ? dx < 0 : dx > 0;
          turnPage(forward ? 1 : -1);
        },
        { passive: true }
      );

      readerView.appendChild(toolbar);
      readerView.appendChild(frameWrap);

      // `renderReader` 不只換章節會呼叫（回書架再開別本書也會再呼叫一次），
      // 每次都要先把上一次的 observer 斷開，不然會一直疊加、觀察著已經被
      // `readerView.innerHTML = ""` 移除的舊 `frameWrap`。
      if (resizeObserver) resizeObserver.disconnect();
      resizeObserver = new ResizeObserver(recomputeAfterResize);
      resizeObserver.observe(frameWrap);

      const entry = meta.spine[meta.current_chapter];
      frameEl.dataset.landing = "0";
      frameEl.src = entry ? resourceUrl(name, entry.href) : "about:blank";
      updateToolbarText();
    }

    showShelf();
    refreshShelf();
    const intervalId = setInterval(refreshShelf, 15000);

    return function stop() {
      stopped = true;
      clearInterval(intervalId);
      if (resizeObserver) resizeObserver.disconnect();
    };
  }

  const SVGNS = "http://www.w3.org/2000/svg";
  const TOPOLOGY_POLL_MS = 2500;

  // 合併 `/api/device/list`（本地 domain）跟 `/api/global/list`（`domain`
  // 設定過的話包含本地 domain + 其他 domain 透過 MQTT 收到的）成一份節點
  // 清單，跟桌面版 frontend.html 的 `fetchTopologyNodes` 同一份邏輯（這裡
  // 各自一份，見 spec 的取捨說明）。
  async function fetchTopologyNodes() {
    let deviceList = [];
    let globalList = [];
    try {
      [deviceList, globalList] = await Promise.all([
        fetch("/api/device/list").then((r) => r.json()),
        fetch("/api/global/list").then((r) => r.json()),
      ]);
    } catch (_err) {
      return new Map();
    }
    const nodes = new Map();
    for (const item of globalList) {
      const key = `${item.domain}/${item.report.id}`;
      nodes.set(key, { key, domain: item.domain, report: item.report, ageSecs: item.age_secs });
    }
    const idsFromGlobal = new Set([...nodes.values()].map((n) => n.report.id));
    for (const item of deviceList) {
      if (idsFromGlobal.has(item.report.id)) continue;
      const key = `local/${item.report.id}`;
      nodes.set(key, { key, domain: null, report: item.report, ageSecs: item.age_secs });
    }
    return nodes;
  }

  // 邊代表「設定上的關係」，不即時驗證真的連上：每個 `mode === "server"`
  // 的節點都連去一個共用的 `"broker"` 節點；每個 `report.server_addr` 有值
  // 的節點，連去 ip 等於那個值的節點（找不到就不畫這條線）。
  function computeTopologyEdges(nodes) {
    const byIp = new Map();
    for (const n of nodes.values()) byIp.set(n.report.ip, n.key);
    const edges = [];
    let hasServer = false;
    for (const n of nodes.values()) {
      if (n.report.mode === "server") {
        hasServer = true;
        edges.push({ from: n.key, to: "broker" });
      }
      if (n.report.server_addr) {
        const targetKey = byIp.get(n.report.server_addr);
        if (targetKey && targetKey !== n.key) edges.push({ from: n.key, to: targetKey });
      }
    }
    return { edges, hasServer };
  }

  // 建立 topology 分頁：定期 poll 上面兩個端點合併節點、依角色（broker/
  // server/client）＋ domain 直接算出固定座標（見 `computeLayout`），跟
  // 桌面版 topology panel 同一套演算法（各自一份程式碼，不共用模組）。
  // 回傳 `stop` 函式，切分頁時呼叫，清掉 interval，不留背景在跑。
  function startTopologyTab(container) {
    const wrap = document.createElement("div");
    wrap.id = "topology-wrap";
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("class", "topology-svg");
    const domainLayer = document.createElementNS(SVGNS, "g");
    const edgeLayer = document.createElementNS(SVGNS, "g");
    const nodeLayer = document.createElementNS(SVGNS, "g");
    svg.appendChild(domainLayer);
    svg.appendChild(edgeLayer);
    svg.appendChild(nodeLayer);
    const tooltip = document.createElement("div");
    tooltip.className = "topology-tooltip";
    wrap.appendChild(svg);
    wrap.appendChild(tooltip);
    container.appendChild(wrap);

    const sim = { nodes: new Map(), edges: [] };
    const domainEls = new Map();
    const edgeEls = new Map();
    const nodeEls = new Map();

    function panelSize() {
      const rect = svg.getBoundingClientRect();
      return { width: rect.width || 400, height: rect.height || 300 };
    }

    // 依角色＋domain 算出每個節點的固定座標：broker 置中最上排；具名 domain
    // 依名稱排序由左到右各佔一欄，不知道 domain 名稱的節點（`local/${id}`）
    // 另成一欄排在最後；欄內 server 排在上、client（含 standalone）排在下，
    // 同排多個節點在欄寬內水平等距展開。回傳 `Map<key, {x, y}>`（`key` 是
    // 節點 key 或 `"broker"`）。
    function computeLayout(nodesData, hasServer, width, height) {
      const domainOrder = [];
      const domainMembers = new Map();
      const localMembers = [];
      for (const n of nodesData.values()) {
        if (n.domain) {
          if (!domainMembers.has(n.domain)) {
            domainMembers.set(n.domain, []);
            domainOrder.push(n.domain);
          }
          domainMembers.get(n.domain).push(n);
        } else {
          localMembers.push(n);
        }
      }
      domainOrder.sort();
      const columns = domainOrder.map((d) => domainMembers.get(d));
      if (localMembers.length > 0) columns.push(localMembers);

      const positions = new Map();
      const brokerY = height * 0.2;
      const serverRowY = height * 0.5;
      const clientRowY = height * 0.8;

      if (hasServer) positions.set("broker", { x: width / 2, y: brokerY });

      const colWidth = columns.length > 0 ? width / columns.length : width;
      columns.forEach((members, colIndex) => {
        const colCenterX = colWidth * (colIndex + 0.5);
        const servers = members.filter((n) => n.report.mode === "server");
        const clients = members.filter((n) => n.report.mode !== "server");
        const spread = (list, y) => {
          const step = list.length > 1 ? Math.min(70, (colWidth - 44) / (list.length - 1)) : 0;
          list.forEach((n, i) => {
            const offset = (i - (list.length - 1) / 2) * step;
            positions.set(n.key, { x: colCenterX + offset, y });
          });
        };
        spread(servers, serverRowY);
        spread(clients, clientRowY);
      });

      return positions;
    }

    // 把 poll 拿到的節點集合套進 `sim.nodes`：消失的節點移除，新出現的節點
    // 用 `computeLayout` 算出的座標建立，本來就有的節點座標也用最新算出的
    // 值覆蓋（固定佈局每次 poll 都是同一套規則重算，不保留舊座標）。
    function applyPoll(nodesData, hasServer, width, height) {
      const layout = computeLayout(nodesData, hasServer, width, height);
      const wanted = new Set(nodesData.keys());
      if (hasServer) wanted.add("broker");
      for (const key of [...sim.nodes.keys()]) {
        if (!wanted.has(key)) sim.nodes.delete(key);
      }
      for (const key of wanted) {
        const pos = layout.get(key) || { x: width / 2, y: height / 2 };
        let n = sim.nodes.get(key);
        if (!n) {
          n = { x: pos.x, y: pos.y, isBroker: key === "broker", data: null };
          sim.nodes.set(key, n);
        } else {
          n.x = pos.x;
          n.y = pos.y;
        }
        if (key !== "broker") n.data = nodesData.get(key);
      }
    }

    function isAlive(n) {
      return !!n.data && n.data.ageSecs * 1000 < ALIVE_TTL_MS;
    }

    function roleColor(mode) {
      if (mode === "server") return "#6f9dff";
      if (mode === "client") return "#4caf7d";
      return "#5a6272";
    }

    function showTooltip(key) {
      const n = sim.nodes.get(key);
      if (!n || n.isBroker || !n.data) {
        tooltip.style.display = "none";
        return;
      }
      const r = n.data.report;
      const alive = isAlive(n) ? "是" : "否";
      tooltip.textContent =
        `id: ${r.id}\nip: ${r.ip}\nos: ${r.os}\nversion: ${r.version}\nmode: ${r.mode}\n` +
        `device uptime: ${formatUptimeJs(r.device_uptime_secs)}\napp uptime: ${formatUptimeJs(r.app_uptime_secs)}\n` +
        `disk: ${formatDiskJs(r.disk_free_bytes, r.disk_total_bytes)}\nalive: ${alive}`;
      tooltip.style.display = "block";
    }

    function positionTooltip(e) {
      if (tooltip.style.display !== "block") return;
      const rect = wrap.getBoundingClientRect();
      tooltip.style.left = `${e.clientX - rect.left + 12}px`;
      tooltip.style.top = `${e.clientY - rect.top + 12}px`;
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    function buildNodeEl(key, n) {
      const group = document.createElementNS(SVGNS, "g");
      group.setAttribute("class", "topology-node");
      let shape;
      if (n.isBroker) {
        shape = document.createElementNS(SVGNS, "polygon");
        shape.setAttribute("class", "topology-broker");
        shape.setAttribute("points", "0,-20 17,-10 17,10 0,20 -17,10 -17,-10");
      } else {
        shape = document.createElementNS(SVGNS, "circle");
        shape.setAttribute("r", "18");
      }
      group.appendChild(shape);
      const label = document.createElementNS(SVGNS, "text");
      label.setAttribute("class", "topology-node-label");
      label.setAttribute("y", "32");
      group.appendChild(label);
      nodeLayer.appendChild(group);
      group.addEventListener("mouseenter", () => showTooltip(key));
      group.addEventListener("mousemove", positionTooltip);
      group.addEventListener("mouseleave", hideTooltip);
      return { group, shape, label };
    }

    function render() {
      const groups = new Map();
      for (const [, n] of sim.nodes) {
        if (n.isBroker || !n.data || !n.data.domain) continue;
        if (!groups.has(n.data.domain)) groups.set(n.data.domain, []);
        groups.get(n.data.domain).push(n);
      }
      const seenDomains = new Set();
      for (const [domain, members] of groups) {
        seenDomains.add(domain);
        const pad = 30;
        const xs = members.map((m) => m.x);
        const ys = members.map((m) => m.y);
        const x = Math.min(...xs) - pad;
        const y = Math.min(...ys) - pad;
        const w = Math.max(...xs) - Math.min(...xs) + pad * 2;
        const h = Math.max(...ys) - Math.min(...ys) + pad * 2;
        let box = domainEls.get(domain);
        if (!box) {
          box = { rect: document.createElementNS(SVGNS, "rect"), label: document.createElementNS(SVGNS, "text") };
          box.rect.setAttribute("class", "topology-domain-box");
          box.label.setAttribute("class", "topology-domain-label");
          domainLayer.appendChild(box.rect);
          domainLayer.appendChild(box.label);
          domainEls.set(domain, box);
        }
        box.rect.setAttribute("x", x);
        box.rect.setAttribute("y", y);
        box.rect.setAttribute("width", w);
        box.rect.setAttribute("height", h);
        box.rect.setAttribute("rx", 12);
        box.label.setAttribute("x", x + 8);
        box.label.setAttribute("y", y + 16);
        box.label.textContent = domain;
      }
      for (const [domain, box] of [...domainEls]) {
        if (!seenDomains.has(domain)) {
          box.rect.remove();
          box.label.remove();
          domainEls.delete(domain);
        }
      }

      const seenEdges = new Set();
      for (const edge of sim.edges) {
        const a = sim.nodes.get(edge.from);
        const b = sim.nodes.get(edge.to);
        if (!a || !b) continue;
        const ekey = `${edge.from}|${edge.to}`;
        seenEdges.add(ekey);
        let line = edgeEls.get(ekey);
        if (!line) {
          line = document.createElementNS(SVGNS, "line");
          line.setAttribute("class", "topology-edge");
          edgeLayer.appendChild(line);
          edgeEls.set(ekey, line);
        }
        line.setAttribute("x1", a.x);
        line.setAttribute("y1", a.y);
        line.setAttribute("x2", b.x);
        line.setAttribute("y2", b.y);
      }
      for (const [ekey, line] of [...edgeEls]) {
        if (!seenEdges.has(ekey)) {
          line.remove();
          edgeEls.delete(ekey);
        }
      }

      const seenNodes = new Set();
      for (const [key, n] of sim.nodes) {
        seenNodes.add(key);
        let el = nodeEls.get(key);
        if (!el) {
          el = buildNodeEl(key, n);
          nodeEls.set(key, el);
        }
        el.group.setAttribute("transform", `translate(${n.x},${n.y})`);
        if (n.isBroker) {
          el.label.textContent = "MQTT broker";
        } else if (n.data) {
          const alive = isAlive(n);
          el.shape.setAttribute("fill", alive ? roleColor(n.data.report.mode) : "#3a4150");
          el.shape.setAttribute("stroke", alive ? "none" : "#6b7280");
          el.shape.setAttribute("stroke-width", alive ? "0" : "2");
          el.shape.setAttribute("stroke-dasharray", alive ? "0" : "3,3");
          el.label.textContent = n.data.report.id;
        }
      }
      for (const [key, el] of [...nodeEls]) {
        if (!seenNodes.has(key)) {
          el.group.remove();
          nodeEls.delete(key);
        }
      }
    }

    // 上一次 poll 拿到的節點資料，給 `onResize` 在不打網路請求的情況下
    // 重算佈局用（見下面 `onResize` 的說明）。
    let lastNodesData = null;
    let lastHasServer = false;

    async function pollOnce() {
      const nodesData = await fetchTopologyNodes();
      const { edges, hasServer } = computeTopologyEdges(nodesData);
      lastNodesData = nodesData;
      lastHasServer = hasServer;
      const { width, height } = panelSize();
      applyPoll(nodesData, hasServer, width, height);
      sim.edges = edges;
      render();
    }

    // panel 大小改變（旋轉螢幕、視窗縮放……）時，固定式佈局是依目前尺寸
    // 算出來的，尺寸一變就該立刻重新排版，不用等到下一次 poll（最長
    // `TOPOLOGY_POLL_MS`，約 2.5 秒）才跟上——用上一次 poll 拿到的節點
    // 資料重算座標、重繪即可，不需要為了單純的版面調整重新打一次網路
    // 請求。跟桌面版 topology panel 同一套 ResizeObserver 模式（各自一份
    // 程式碼，不共用模組）。
    function onResize() {
      if (!lastNodesData) return;
      const { width, height } = panelSize();
      applyPoll(lastNodesData, lastHasServer, width, height);
      render();
    }
    const resizeObserver = new ResizeObserver(onResize);
    resizeObserver.observe(svg);

    pollOnce();
    const intervalId = setInterval(pollOnce, TOPOLOGY_POLL_MS);

    return function stop() {
      clearInterval(intervalId);
      resizeObserver.disconnect();
    };
  }

  // player 分頁跟桌面版 frontend.html 的 player panel 共用同一套邏輯，這裡
  // 各自一份（同一種取捨，見 topology 那段的說明）：檔案清單＋刪除＋
  // YouTube 網址下載、封面/歌詞/頻譜/放射狀頻譜循環顯示、播放模式（依序/
  // 隨機/單曲）、Media Session。跟終端機共用同一個 Shell，下載按鈕送出去
  // 的指令（`plugin enter music` -> `download ...` -> `~`）會直接影響後端
  // 狀態，跟指令列輸入框共用這個函式，不要各自重複一份 fetch 邏輯。
  async function execLine(line) {
    const res = await fetch("/api/exec", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ line }),
    });
    return res.json();
  }

  // 定期打 `/api/music/files` 拿目前 `music/` 資料夾裡的檔案清單，畫成一列
  // 一列（播放/刪除按鈕）。
  function startMusicFileBrowser(musicUi) {
    async function refresh() {
      try {
        const res = await fetch("/api/music/files");
        const items = await res.json();
        renderMusicFiles(musicUi, items, refresh);
      } catch (_err) {
        // 這次沒抓到就算了，下一次 poll 再試，不用跳錯誤訊息干擾畫面。
      }
    }
    refresh();
    const timer = setInterval(refresh, 3000);
    musicUi.stopPolling = () => clearInterval(timer);
  }

  // 秒數轉成「分:秒」，超過一小時才會多帶一段（"1:05:00"）。
  function formatTime(seconds) {
    const total = Number.isFinite(seconds) && seconds > 0 ? Math.floor(seconds) : 0;
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const secs = total % 60;
    const paddedSecs = String(secs).padStart(2, "0");
    if (hours > 0) {
      return `${hours}:${String(minutes).padStart(2, "0")}:${paddedSecs}`;
    }
    return `${minutes}:${paddedSecs}`;
  }

  function updateTimeLabel(musicUi) {
    if (!musicUi.timeLabel) return;
    musicUi.timeLabel.textContent = `${formatTime(musicUi.player.currentTime)}/${formatTime(musicUi.player.duration)}`;
  }

  // 播放清單靠「目前正在播的檔名」而不是數字索引記位置，清單每 3 秒重新
  // 抓一次，中間有檔案被加入/刪除也不會對錯歌。
  function playByName(musicUi, name) {
    musicUi.currentName = name;
    musicUi.player.src = `/api/music/file/${encodeURIComponent(name)}/audio`;
    musicUi.player.play();
    updateNowPlayingFavButton(musicUi);
    const activeRow = highlightPlaying(musicUi);
    if (activeRow) {
      activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    if (musicUi.cover) {
      musicUi.cover.removeAttribute("src");
      musicUi.cover.src = `/api/music/file/${encodeURIComponent(name)}/cover`;
    }
    if (musicUi.trackName) {
      musicUi.trackName.textContent = name;
    }
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: name,
        artwork: [{ src: `/api/music/file/${encodeURIComponent(name)}/cover` }],
      });
      setMediaSessionActionHandlers();
    }
    if (musicUi.seekBar) {
      musicUi.seekBar.max = "0";
      musicUi.seekBar.value = "0";
      updateTimeLabel(musicUi);
    }
    if (musicUi.lyricsEl) {
      fetch(`/api/music/file/${encodeURIComponent(name)}/lyrics`)
        .then((res) => (res.ok ? res.json() : []))
        .then((lines) => renderLyrics(musicUi, lines))
        .catch(() => renderLyrics(musicUi, []));
    }
  }

  function renderLyrics(musicUi, lines) {
    musicUi.lyricsLines = lines;
    musicUi.lyricsActiveIndex = -1;
    musicUi.lyricsEl.innerHTML = "";
    if (lines.length === 0) {
      const empty = document.createElement("div");
      empty.className = "player-lyrics-empty";
      empty.textContent = "(沒有歌詞)";
      musicUi.lyricsEl.appendChild(empty);
      return;
    }
    for (const line of lines) {
      const div = document.createElement("div");
      div.className = "player-lyric-line";
      div.textContent = line.text;
      musicUi.lyricsEl.appendChild(div);
    }
  }

  function scrollActiveLyricIntoView(musicUi) {
    const rows = musicUi.lyricsEl.children;
    const idx = musicUi.lyricsActiveIndex;
    if (idx >= 0 && rows[idx]) {
      rows[idx].scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  function updateLyricsHighlight(musicUi) {
    const lines = musicUi.lyricsLines;
    if (!musicUi.lyricsEl || !lines || lines.length === 0) return;
    const t = musicUi.player.currentTime;
    let idx = -1;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].start <= t) idx = i;
      else break;
    }
    if (idx === musicUi.lyricsActiveIndex) return;
    musicUi.lyricsActiveIndex = idx;
    const rows = musicUi.lyricsEl.children;
    for (let i = 0; i < rows.length; i++) {
      rows[i].classList.toggle("active", i === idx);
    }
    scrollActiveLyricIntoView(musicUi);
  }

  // 換到「下一首」時（不管是照順序還是隨機），只要候選歌曲不是收藏
  // （`musicUi.favorites`，見 `renderMusicFiles`），就有這個機率直接跳過、
  // 繼續找下一個候選——不影響「上一首」。跟 frontend.html 的
  // `SKIP_NON_FAVORITE_PROBABILITY`/`isFavoriteTrack`/`shouldSkipNonFavorite`/
  // `offsetTrack`/`playRandomOther` 是同一套邏輯，各自一份程式碼（見這個
  // panel 整體「跟 frontend.html 各自獨立一份」的慣例），必須維持兩邊行為
  // 一致，改一邊要記得改另一邊。
  const SKIP_NON_FAVORITE_PROBABILITY = 0.3;

  function isFavoriteTrack(musicUi, name) {
    return musicUi.favorites.has(name);
  }

  function shouldSkipNonFavorite(musicUi, name) {
    return !isFavoriteTrack(musicUi, name) && Math.random() < SKIP_NON_FAVORITE_PROBABILITY;
  }

  // 目前播放這首歌旁邊那顆收藏按鈕（`musicUi.nowPlayingFavBtn`——player 分頁
  // 沒開著時是 `undefined`）換歌、清單重新整理、使用者自己按這顆按鈕之後都
  // 要呼叫這個更新一次圖示，三個地方共用才不會各寫一份「有沒有收藏」的
  // 判斷邏輯。
  function updateNowPlayingFavButton(musicUi) {
    if (!musicUi.nowPlayingFavBtn) return;
    const isFav = musicUi.currentName ? isFavoriteTrack(musicUi, musicUi.currentName) : false;
    musicUi.nowPlayingFavBtn.disabled = !musicUi.currentName;
    musicUi.nowPlayingFavBtn.textContent = isFav ? "★" : "☆";
    musicUi.nowPlayingFavBtn.title = isFav ? "取消收藏" : "加入收藏（收藏的歌曲換下一首時不會被機率跳過）";
  }

  function offsetTrack(musicUi, delta) {
    const idx = musicUi.playlist.indexOf(musicUi.currentName);
    if (idx === -1) return;
    if (delta > 0) {
      for (let next = idx + delta; next < musicUi.playlist.length; next++) {
        const name = musicUi.playlist[next];
        if (!shouldSkipNonFavorite(musicUi, name)) {
          playByName(musicUi, name);
          return;
        }
      }
      return;
    }
    const next = idx + delta;
    if (next >= 0 && next < musicUi.playlist.length) {
      playByName(musicUi, musicUi.playlist[next]);
    }
  }

  function playRandomOther(musicUi) {
    const others = musicUi.playlist.filter((name) => name !== musicUi.currentName);
    if (others.length === 0) {
      if (musicUi.playlist.length > 0) {
        musicUi.player.currentTime = 0;
        musicUi.player.play();
      }
      return;
    }
    let pool = others;
    while (pool.length > 0) {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      if (!shouldSkipNonFavorite(musicUi, pick)) {
        playByName(musicUi, pick);
        return;
      }
      pool = pool.filter((name) => name !== pick);
    }
    playByName(musicUi, others[Math.floor(Math.random() * others.length)]);
  }

  function goToNextTrack(musicUi) {
    if (musicUi.playMode === "shuffle") {
      playRandomOther(musicUi);
    } else {
      offsetTrack(musicUi, 1);
    }
  }

  function advanceOnEnded(musicUi) {
    if (musicUi.playMode === "single") {
      musicUi.player.currentTime = 0;
      musicUi.player.play();
      return;
    }
    if (musicUi.playMode === "shuffle") {
      playRandomOther(musicUi);
      return;
    }
    offsetTrack(musicUi, 1);
  }

  function highlightPlaying(musicUi) {
    // player 分頁沒開著的時候 `musicUi.fileList` 是 `null`（見
    // `startPlayerTab`/`stopPlayerVisuals` 的說明）——播放狀態（`ended`
    // 自動接歌、Media Session 的上一首/下一首）在分頁沒開著時一樣會呼叫
    // 到這裡，這時候沒有清單 DOM 可以反白，直接跳過。
    if (!musicUi.fileList) return null;
    let activeRow = null;
    for (const row of musicUi.fileList.children) {
      const isActive = row.dataset.name === musicUi.currentName;
      row.classList.toggle("playing", isActive);
      if (isActive) activeRow = row;
    }
    return activeRow;
  }

  // `items` 是 `/api/music/files` 回的 `{name, favorite}[]`。`musicUi.playlist`
  // 仍然維持單純的檔名陣列（`offsetTrack`/`playRandomOther`/`playByName` 一路
  // 以來都是這樣用），收藏狀態另外放進 `musicUi.favorites`（檔名的 `Set`）。
  function renderMusicFiles(musicUi, items, refresh) {
    musicUi.playlist = items.map((item) => item.name);
    musicUi.favorites = new Set(items.filter((item) => item.favorite).map((item) => item.name));
    updateNowPlayingFavButton(musicUi);
    musicUi.fileList.innerHTML = "";
    musicUi.fileCount.textContent = `共 ${items.length} 首`;
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "music-empty";
      empty.textContent = "(還沒有下載任何檔案)";
      musicUi.fileList.appendChild(empty);
      return;
    }
    for (const item of items) {
      const name = item.name;
      const row = document.createElement("div");
      row.className = "music-row";
      row.dataset.name = name;
      const label = document.createElement("span");
      label.className = "music-name";
      label.textContent = name;
      label.title = name;

      const playBtn = document.createElement("button");
      playBtn.textContent = "▶";
      playBtn.title = "播放";
      playBtn.addEventListener("click", () => playByName(musicUi, name));

      // 收藏標記：換到下一首時（見 `offsetTrack`/`playRandomOther`），沒
      // 收藏的歌曲有機率被跳過，這個按鈕就是使用者標記「這首不要被跳過」
      // 的地方。
      const favBtn = document.createElement("button");
      favBtn.textContent = item.favorite ? "★" : "☆";
      favBtn.title = item.favorite ? "取消收藏" : "加入收藏（收藏的歌曲換下一首時不會被機率跳過）";
      favBtn.addEventListener("click", async () => {
        await fetch(`/api/music/file/${encodeURIComponent(name)}/favorite`, { method: "POST" });
        refresh();
      });

      const delBtn = document.createElement("button");
      delBtn.textContent = "🗑";
      delBtn.title = "刪除";
      delBtn.addEventListener("click", async () => {
        if (!window.confirm(`刪除「${name}」？`)) return;
        await fetch(`/api/music/file/${encodeURIComponent(name)}`, { method: "DELETE" });
        refresh();
      });

      row.appendChild(label);
      row.appendChild(favBtn);
      row.appendChild(playBtn);
      row.appendChild(delBtn);
      musicUi.fileList.appendChild(row);
    }
    highlightPlaying(musicUi);
  }

  // player 的核心播放狀態（`<audio>` 元素本身、播放清單、目前播放中的檔名、
  // 播放模式）建立一次、掛在 `document.body` 底下，不隨分頁切換而重建或
  // 移除——切到 device/global/… 時 `switchTo` 會把 `#content` 整個清空，
  // 如果 `<audio>` 元素也在裡面，會被當成從文件移除，播放跟著停掉（這正是
  // 「切分頁音樂就停」這個問題的根源）。只有畫面用的部分（檔案清單/封面/
  // 歌詞/頻譜/按鈕……）才隨分頁切換建立/拆掉，`musicUi.player`/`.playlist`/
  // `.currentName`/`.playMode` 這幾個欄位跨分頁切換持續有效，`musicUi` 上的
  // 畫面元素欄位（`fileList`/`cover`/…）在分頁沒開著時是 `null`——`playByName`
  // 等函式本來就會檢查這些欄位存不存在才更新畫面，null 的時候自然跳過。
  const PLAYER_SHUFFLE_ICON =
    '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em">' +
    '<path d="M4 7 L9 7 C12 7 12 17 15 17 L17 17"></path>' +
    '<path d="M17 14 L21 17 L17 20"></path>' +
    '<path d="M4 17 L9 17 C12 17 12 7 15 7 L17 7"></path>' +
    '<path d="M17 4 L21 7 L17 10"></path>' +
    "</svg>";
  const PLAY_MODES = [
    { mode: "sequential", icon: "⇉", title: "依序播放" },
    { mode: "shuffle", icon: PLAYER_SHUFFLE_ICON, title: "隨機播放" },
    { mode: "single", icon: "↻", title: "播放單首" },
  ];
  const PLAYER_TEXT_STYLE = "︎";

  const player = document.createElement("audio");
  // 沒有 `controls` 屬性的 `<audio>` 正常不會佔版面，但 `body` 是
  // `display: flex; flex-direction: column`，這裡明講 `display: none`
  // 保險一點，不要讓它變成一個多出來的 flex item 影響版面。
  player.style.display = "none";
  document.body.appendChild(player);
  const musicUi = {
    fileList: null,
    fileCount: null,
    player,
    cover: null,
    trackName: null,
    seekBar: null,
    timeLabel: null,
    lyricsEl: null,
    lyricsLines: [],
    lyricsActiveIndex: -1,
    playlist: [],
    favorites: new Set(),
    currentName: null,
    playMode: PLAY_MODES[0].mode,
    stopPolling: () => {},
  };

  // 自然播完、Media Session 的上一首/下一首/播放/暫停都是跟播放本身有關
  // 的邏輯，不管 player 分頁有沒有開著都該生效。
  player.addEventListener("ended", () => advanceOnEnded(musicUi));
  // 鎖屏/背景的媒體控制列要顯示「上一首/下一首」而不是預設的快退快進，
  // 關鍵是要有註冊 `previoustrack`/`nexttrack` 這兩個 action handler。
  // 單獨包 try/catch 是因為 MDN 有記載：某些瀏覽器/版本不支援特定 action
  // 時，`setActionHandler` 會直接 throw——不包起來的話，一個不支援的
  // action 會讓迴圈裡排在後面的 handler 全部註冊不到。另外在 `playByName`
  // 每次真的換歌、更新 `mediaSession.metadata` 時也重新呼叫一次：部分
  // 瀏覽器要在「now playing」session 更新的同時重新確認這些 handler 才會
  // 正確反映到系統的鎖屏/控制中心 UI 上。
  function setMediaSessionActionHandlers() {
    if (!("mediaSession" in navigator)) return;
    const handlers = {
      play: () => player.play(),
      pause: () => player.pause(),
      previoustrack: () => offsetTrack(musicUi, -1),
      nexttrack: () => goToNextTrack(musicUi),
    };
    for (const [action, handler] of Object.entries(handlers)) {
      try {
        navigator.mediaSession.setActionHandler(action, handler);
      } catch {
        // 這個瀏覽器/版本不支援這個 action，跳過即可。
      }
    }
  }
  setMediaSessionActionHandlers();
  if ("mediaSession" in navigator) {
    player.addEventListener("play", () => { navigator.mediaSession.playbackState = "playing"; });
    player.addEventListener("pause", () => { navigator.mediaSession.playbackState = "paused"; });
  }

  // 建立 player 分頁：跟桌面版 player panel 類似邏輯（檔案清單＋刪除＋
  // YouTube 下載、封面顯示、迷你歌詞、播放模式、Media Session），只是不用
  // 桌面版浮動 panel 那層，直接把 `.player-body` 塞進分頁的 `container`。
  // 詳細畫面刻意比舊版簡化：不用 Web Audio API 做即時頻譜/放射狀頻譜
  // 視覺化——接上 `createMediaElementSource` 之後聲音輸出永久改道經過
  // Web Audio，App 被切到背景/鎖屏時系統幾乎必定會暫停那個
  // `AudioContext`（跟一般 `<audio>` 元素靠 Media Session 能穩定在背景
  // 播放是兩種不同的機制）。聲音品質優先：只用普通 `<audio>` 元素播放，
  // 不建立任何 Web Audio 的 graph。切走這個分頁時 `stop()` 只停檔案清單
  // poll，不會暫停播放——音樂會在切到其他分頁（device/global/…）時繼續
  // 放，Media Session 的鎖屏控制也才有意義。
  function startPlayerTab(container) {
    const wrap = document.createElement("div");
    wrap.className = "player-body";

    const left = document.createElement("div");
    left.className = "player-left";
    const fileList = document.createElement("div");
    fileList.className = "music-files";
    const downloadRow = document.createElement("div");
    downloadRow.className = "player-download-row";
    const fileCount = document.createElement("span");
    fileCount.className = "player-file-count";
    const urlInput = document.createElement("input");
    urlInput.type = "text";
    urlInput.placeholder = "YouTube 連結...";
    urlInput.className = "player-url-input";
    const downloadBtn = document.createElement("button");
    downloadBtn.textContent = "Download";
    downloadRow.appendChild(fileCount);
    downloadRow.appendChild(urlInput);
    downloadRow.appendChild(downloadBtn);
    left.appendChild(fileList);
    left.appendChild(downloadRow);

    const right = document.createElement("div");
    right.className = "player-right";
    const cover = document.createElement("img");
    cover.className = "player-cover-slot player-cover";
    cover.alt = "";
    cover.addEventListener("error", () => cover.removeAttribute("src"));
    const seekRow = document.createElement("div");
    seekRow.className = "player-seek-row";
    const seekBar = document.createElement("input");
    seekBar.type = "range";
    seekBar.className = "player-seek";
    seekBar.min = "0";
    seekBar.max = "0";
    seekBar.value = "0";
    seekBar.step = "0.1";
    const timeLabel = document.createElement("span");
    timeLabel.className = "player-time";
    timeLabel.textContent = "0:00/0:00";
    seekRow.appendChild(seekBar);
    seekRow.appendChild(timeLabel);
    const trackName = document.createElement("div");
    trackName.className = "player-track-name";
    trackName.textContent = "(尚未播放)";
    // 目前播放這首歌旁邊也放一顆收藏按鈕，跟檔案清單那顆是同一個開關（見
    // `updateNowPlayingFavButton`）。
    const trackNameRow = document.createElement("div");
    trackNameRow.className = "player-track-name-row";
    const nowPlayingFavBtn = document.createElement("button");
    nowPlayingFavBtn.className = "player-now-playing-fav-btn";
    nowPlayingFavBtn.disabled = true;
    nowPlayingFavBtn.textContent = "☆";
    nowPlayingFavBtn.addEventListener("click", async () => {
      if (!musicUi.currentName) return;
      const res = await fetch(`/api/music/file/${encodeURIComponent(musicUi.currentName)}/favorite`, { method: "POST" });
      const body = await res.json();
      if (body.favorite) {
        musicUi.favorites.add(musicUi.currentName);
      } else {
        musicUi.favorites.delete(musicUi.currentName);
      }
      updateNowPlayingFavButton(musicUi);
    });
    trackNameRow.appendChild(nowPlayingFavBtn);
    trackNameRow.appendChild(trackName);
    const rightControls = document.createElement("div");
    rightControls.className = "player-controls";
    const currentMode = PLAY_MODES.find((m) => m.mode === musicUi.playMode) || PLAY_MODES[0];
    const modeBtn = document.createElement("button");
    modeBtn.className = "player-mode-btn";
    modeBtn.innerHTML = currentMode.icon;
    modeBtn.title = currentMode.title;
    modeBtn.addEventListener("click", () => {
      const idx = PLAY_MODES.findIndex((m) => m.mode === musicUi.playMode);
      const next = PLAY_MODES[(idx + 1) % PLAY_MODES.length];
      musicUi.playMode = next.mode;
      modeBtn.innerHTML = next.icon;
      modeBtn.title = next.title;
    });
    const prevBtn = document.createElement("button");
    prevBtn.textContent = "⏮" + PLAYER_TEXT_STYLE;
    prevBtn.title = "上一首";
    const playPauseBtn = document.createElement("button");
    playPauseBtn.className = "player-playpause-btn";
    function setPlayPauseIcon(paused) {
      playPauseBtn.textContent = (paused ? "▶" : "⏸") + PLAYER_TEXT_STYLE;
      playPauseBtn.classList.toggle("is-play-icon", paused);
    }
    setPlayPauseIcon(player.paused);
    playPauseBtn.title = "播放/暫停";
    const nextBtn = document.createElement("button");
    nextBtn.textContent = "⏭" + PLAYER_TEXT_STYLE;
    nextBtn.title = "下一首";
    const transport = document.createElement("div");
    transport.className = "player-transport";
    transport.appendChild(prevBtn);
    transport.appendChild(playPauseBtn);
    transport.appendChild(nextBtn);
    // 播放模式自己一排，放在上一首/播放/下一首那排下面，兩排都置中。
    const modeRow = document.createElement("div");
    modeRow.className = "player-mode-row";
    modeRow.appendChild(modeBtn);
    rightControls.appendChild(transport);
    rightControls.appendChild(modeRow);
    // 迷你歌詞：放在播放模式按鈕下面，只留幾行高度，自動捲動讓目前唱到
    // 的那一行維持在可視範圍內。
    const lyricsMini = document.createElement("div");
    lyricsMini.className = "player-lyrics-mini";
    right.appendChild(cover);
    right.appendChild(seekRow);
    right.appendChild(trackNameRow);
    right.appendChild(rightControls);
    right.appendChild(lyricsMini);

    wrap.appendChild(left);
    wrap.appendChild(right);
    container.appendChild(wrap);

    // 接回模組層級的持久 `musicUi`：播放狀態（playlist/currentName/
    // playMode）維持原樣，只換上這次畫面用的 DOM 元素。
    musicUi.fileList = fileList;
    musicUi.fileCount = fileCount;
    musicUi.cover = cover;
    musicUi.trackName = trackName;
    musicUi.nowPlayingFavBtn = nowPlayingFavBtn;
    musicUi.seekBar = seekBar;
    musicUi.timeLabel = timeLabel;
    musicUi.lyricsEl = lyricsMini;

    // 音樂可能是在其他分頁時就已經開始播放/換歌了，剛打開這個分頁要把畫面
    // 立刻同步成目前的實際播放狀態，不要空等下一次 `timeupdate`/檔案清單
    // poll 才更新。
    if (musicUi.currentName) {
      trackName.textContent = musicUi.currentName;
      cover.removeAttribute("src");
      cover.src = `/api/music/file/${encodeURIComponent(musicUi.currentName)}/cover`;
      renderLyrics(musicUi, musicUi.lyricsLines);
    }
    updateNowPlayingFavButton(musicUi);
    seekBar.max = String(player.duration || 0);
    seekBar.value = String(player.currentTime || 0);
    updateTimeLabel(musicUi);

    prevBtn.addEventListener("click", () => offsetTrack(musicUi, -1));
    nextBtn.addEventListener("click", () => goToNextTrack(musicUi));
    playPauseBtn.addEventListener("click", () => {
      if (player.paused) {
        if (!musicUi.currentName && musicUi.playlist.length > 0) {
          playByName(musicUi, musicUi.playlist[0]);
        } else {
          player.play();
        }
      } else {
        player.pause();
      }
    });

    // 這幾個都是「畫面」層級的更新（按鈕圖示、進度條、歌詞反白），掛在
    // 模組層級的持久 `player` 上，切走分頁時要記得解除，不然每次重新打開
    // player 分頁都會疊加一組新的 listener，同一個更新動作會被觸發好幾次
    // （`stop()` 會呼叫 `removeEventListener`，見下面）。
    let seeking = false;
    function onPlay() {
      setPlayPauseIcon(false);
    }
    function onPause() {
      setPlayPauseIcon(true);
    }
    function onLoadedMetadata() {
      seekBar.max = String(player.duration || 0);
      updateTimeLabel(musicUi);
    }
    function onTimeUpdate() {
      if (!seeking) seekBar.value = String(player.currentTime);
      updateLyricsHighlight(musicUi);
      updateTimeLabel(musicUi);
    }
    player.addEventListener("play", onPlay);
    player.addEventListener("pause", onPause);
    player.addEventListener("loadedmetadata", onLoadedMetadata);
    player.addEventListener("timeupdate", onTimeUpdate);
    seekBar.addEventListener("input", () => {
      seeking = true;
      player.currentTime = Number(seekBar.value);
      updateTimeLabel(musicUi);
    });
    seekBar.addEventListener("change", () => {
      seeking = false;
    });

    downloadBtn.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      urlInput.value = "";
      await execLine("~");
      await execLine("plugin enter music");
      const result = await execLine(`download "${url}"`);
      await execLine("~");
      if (result.error) {
        window.alert(`下載失敗: ${result.error}`);
      }
    });

    startMusicFileBrowser(musicUi);

    return function stop() {
      musicUi.stopPolling();
      player.removeEventListener("play", onPlay);
      player.removeEventListener("pause", onPause);
      player.removeEventListener("loadedmetadata", onLoadedMetadata);
      player.removeEventListener("timeupdate", onTimeUpdate);
      // 注意：不暫停 `player`——音樂繼續在背景播放（見上面模組層級那段的
      // 說明）。畫面欄位清成 `null`，讓 `playByName` 等函式在分頁沒開著時
      // 正確跳過畫面更新。
      musicUi.fileList = null;
      musicUi.fileCount = null;
      musicUi.cover = null;
      musicUi.trackName = null;
      musicUi.nowPlayingFavBtn = null;
      musicUi.seekBar = null;
      musicUi.timeLabel = null;
      musicUi.lyricsEl = null;
    };
  }

  // notepad 分頁的即時 markdown 預覽用，跟桌面版 frontend.html 的
  // `renderMarkdown` 是同一套規則（各自一份，理由見 topology 那段的說明）：
  // 不是完整的 CommonMark 剖析器，只涵蓋標題/引言/清單/table/code fence/
  // 分隔線/段落跟行內強調語法，足夠「盡量還原排版好的樣子」。文字先跳脫過
  // HTML 特殊字元，使用者打的原始內容不會被當成標籤解讀。
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // code fence 的語法上色規則：關鍵字清單、單行註解開頭符號、區塊註解頭尾
  // 符號——跟 `gui.rs` 的 `language_spec` 是同一套規則（維持兩邊一致），不是
  // 完整的詞法分析器，但字串/註解/數字/關鍵字這幾類最常見、最有用的分類
  // 已經涵蓋。
  const CODE_LANGUAGES = {
    rust: {
      keywords: ["fn","let","mut","pub","struct","enum","impl","trait","use","mod","if","else","match","for","while","loop","return","break","continue","const","static","self","Self","super","crate","as","in","move","ref","where","async","await","dyn","unsafe","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    python: {
      keywords: ["def","class","if","elif","else","for","while","return","import","from","as","with","try","except","finally","raise","pass","break","continue","lambda","yield","in","is","not","and","or","None","True","False","self","global","nonlocal","async","await"],
      lineComment: "#",
      blockComment: null,
    },
    javascript: {
      keywords: ["function","const","let","var","if","else","for","while","return","class","extends","new","this","import","export","from","as","try","catch","finally","throw","break","continue","switch","case","default","typeof","instanceof","in","of","async","await","yield","null","undefined","true","false","super"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    c: {
      keywords: ["int","char","float","double","void","if","else","for","while","return","struct","typedef","enum","union","static","const","unsigned","signed","long","short","sizeof","switch","case","default","break","continue","class","public","private","protected","namespace","template","new","delete","this","virtual","override","nullptr","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    java: {
      keywords: ["public","private","protected","class","interface","extends","implements","static","final","void","int","long","float","double","boolean","char","String","if","else","for","while","return","new","this","super","try","catch","finally","throw","throws","import","package","break","continue","switch","case","default","true","false","null"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    go: {
      keywords: ["func","package","import","var","const","type","struct","interface","if","else","for","range","return","go","chan","select","case","default","switch","break","continue","defer","map","nil","true","false"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
    },
    bash: {
      keywords: ["if","then","else","elif","fi","for","while","do","done","case","esac","function","return","exit","export","local","echo","break","continue","in"],
      lineComment: "#",
      blockComment: null,
    },
    json: { keywords: ["true", "false", "null"], lineComment: null, blockComment: null },
    sql: {
      keywords: ["SELECT","FROM","WHERE","INSERT","INTO","VALUES","UPDATE","SET","DELETE","JOIN","LEFT","RIGHT","INNER","OUTER","ON","GROUP","BY","ORDER","HAVING","AS","AND","OR","NOT","NULL","IS","IN","LIKE","LIMIT","CREATE","TABLE","DROP","ALTER","PRIMARY","KEY","FOREIGN","REFERENCES","DEFAULT","DISTINCT"],
      lineComment: "--",
      blockComment: ["/*", "*/"],
    },
    ruby: {
      keywords: ["def","end","class","module","if","elsif","else","unless","while","until","for","in","do","return","break","next","yield","begin","rescue","ensure","raise","require","true","false","nil","self"],
      lineComment: "#",
      blockComment: null,
    },
    yaml: { keywords: ["true", "false", "null"], lineComment: "#", blockComment: null },
  };
  const CODE_LANG_ALIASES = {
    rs: "rust", py: "python",
    js: "javascript", ts: "javascript", jsx: "javascript", tsx: "javascript", typescript: "javascript",
    cpp: "c", "c++": "c", h: "c", hpp: "c",
    golang: "go",
    sh: "bash", shell: "bash", zsh: "bash",
    rb: "ruby",
    yml: "yaml", toml: "yaml",
  };

  // 依 code fence 開頭標注的語言名稱（例如 ` ```rust ` 的 `rust`）查對應的
  // 語法上色規則；沒標語言或標了但不認得的語言都回傳 `null`，呼叫端在這種
  // 情況下維持原本單一顏色的樣子，不強行套用錯誤的規則。
  function getLanguageSpec(lang) {
    const key = (lang || "").toLowerCase();
    return CODE_LANGUAGES[CODE_LANG_ALIASES[key] || key] || null;
  }

  // 把一行程式碼掃成字串/註解/數字/關鍵字/其餘（plain）幾類，各自包一層
  // `<span class="tok-...">`；不是完整的詞法分析器（不處理跳脫字元、原始
  // 字串、巢狀區塊註解），跟 `gui.rs` 的 `highlight_code_line` 是同一套簡化
  // 規則。`state.inBlockComment` 是跨行狀態（區塊註解可能橫跨好幾行），
  // 呼叫端每個 code block 開頭要重設成 `{ inBlockComment: false }`，同一個
  // code block 內逐行往下傳同一個物件（靠物件參考模擬「傳址」，JS 沒有
  // 像 Rust `&mut bool` 那樣的東西）。
  function highlightCodeLine(line, spec, state) {
    let html = "";
    let plainStart = 0;
    let i = 0;
    const flushPlain = (end) => {
      if (plainStart < end) html += escapeHtml(line.slice(plainStart, end));
    };

    if (state.inBlockComment && spec.blockComment) {
      const idx = line.indexOf(spec.blockComment[1]);
      if (idx === -1) {
        return line ? `<span class="tok-comment">${escapeHtml(line)}</span>` : "";
      }
      const end = idx + spec.blockComment[1].length;
      html += `<span class="tok-comment">${escapeHtml(line.slice(0, end))}</span>`;
      i = end;
      plainStart = end;
      state.inBlockComment = false;
    }

    while (i < line.length) {
      if (spec.blockComment && line.startsWith(spec.blockComment[0], i)) {
        flushPlain(i);
        const idx = line.indexOf(spec.blockComment[1], i + spec.blockComment[0].length);
        if (idx === -1) {
          html += `<span class="tok-comment">${escapeHtml(line.slice(i))}</span>`;
          state.inBlockComment = true;
          i = line.length;
        } else {
          const end = idx + spec.blockComment[1].length;
          html += `<span class="tok-comment">${escapeHtml(line.slice(i, end))}</span>`;
          i = end;
        }
        plainStart = i;
        continue;
      }
      if (spec.lineComment && line.startsWith(spec.lineComment, i)) {
        flushPlain(i);
        html += `<span class="tok-comment">${escapeHtml(line.slice(i))}</span>`;
        plainStart = line.length;
        break;
      }
      const ch = line[i];
      if (ch === '"' || ch === "'") {
        const end = line.indexOf(ch, i + 1);
        if (end !== -1) {
          flushPlain(i);
          html += `<span class="tok-string">${escapeHtml(line.slice(i, end + 1))}</span>`;
          i = end + 1;
          plainStart = i;
          continue;
        }
      }
      if (/[A-Za-z_]/.test(ch)) {
        const word = line.slice(i).match(/^[A-Za-z0-9_]+/)[0];
        if (spec.keywords.includes(word)) {
          flushPlain(i);
          html += `<span class="tok-keyword">${escapeHtml(word)}</span>`;
          i += word.length;
          plainStart = i;
          continue;
        }
        i += word.length;
        continue;
      }
      if (/[0-9]/.test(ch)) {
        const num = line.slice(i).match(/^[0-9.]+/)[0];
        flushPlain(i);
        html += `<span class="tok-number">${escapeHtml(num)}</span>`;
        i += num.length;
        plainStart = i;
        continue;
      }
      i++;
    }
    flushPlain(line.length);
    return html;
  }

  function renderInlineMarkdown(text) {
    let s = escapeHtml(text);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    // `***文字***`（粗體兼斜體）要在 `**` 規則之前處理，不然會被 `**` 先
    // 吃掉、多出來的一個 `*` 變成殘留字元。
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, (_, a, b) => `<strong>${a ?? b}</strong>`);
    s = s.replace(/~~([^~]+)~~/g, "<s>$1</s>");
    s = s.replace(/\+\+([^+]+)\+\+/g, '<span class="notepad-underline">$1</span>');
    s = s.replace(/==([^=]+)==/g, '<span class="notepad-highlight">$1</span>');
    s = s.replace(/\*([^*]+)\*|_([^_]+)_/g, (_, a, b) => `<em>${a ?? b}</em>`);
    // 圖片語法 `![替代文字](網址)`：不是每個 panel 都需要真的顯示圖片，這裡
    // 只當成連結對待——有些論壇（例如 Discourse）的替代文字會夾帶
    // `|690x460, 50%` 這種縮放/尺寸提示，只取 `|` 前面那段當作顯示文字。
    // 要先處理過圖片語法，才不會被底下的一般連結規則吃到剩一個孤立的 `!`。
    s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => {
      const label = alt.split("|")[0].trim();
      return `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
    });
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
    // `<br>` 換行標記：原始文字先被 `escapeHtml` 跳脫成 `&lt;br&gt;`，這裡
    // 換回真正的 `<br>` 標籤才會讓瀏覽器實際換行，而不是顯示成字面文字。
    s = s.replace(/&lt;br&gt;/g, "<br>");
    return s;
  }

  function isTableRow(line) {
    return line.includes("|") && line.trim() !== "";
  }

  // table 的分隔列（header 底下那一行，例如 `| --- | :---: | ---: |`）：只由
  // `-`、`:`、`|`、空白組成，且至少要有一個 `-`。
  function isTableSeparator(line) {
    const t = line.trim();
    return t.includes("-") && /^[-:|\s]+$/.test(t);
  }

  // 把一行 table 資料列拆成每一欄內容（已 trim 過前後空白）；行首/行尾的
  // `|` 是可有可無的分隔符號，不當作多一欄空白內容。
  function splitTableRow(line) {
    let t = line.trim();
    if (t.startsWith("|")) t = t.slice(1);
    if (t.endsWith("|")) t = t.slice(0, -1);
    return t.split("|").map((cell) => cell.trim());
  }

  // 逐行處理區塊層級語法（標題/引言/清單/table/code fence/分隔線/段落），
  // 行內語法交給 `renderInlineMarkdown`。清單/code fence 需要跨行的「目前在
  // 哪個區塊裡」狀態，用 `listType`/`inCodeBlock` 這兩個區域變數追蹤；table
  // 則需要往下看一行才能判斷是不是 table（含 `|` 的下一行是不是分隔列），
  // 所以這裡用索引迴圈而不是 `for...of`，才能在判斷完 table 之後直接把
  // 迴圈游標跳到 table 結束的下一行。
  function renderMarkdown(source) {
    const lines = source.split("\n");
    let html = "";
    let inCodeBlock = false;
    let codeSpec = null;
    let codeState = null;
    let codeShowLineNumbers = false;
    let codeLineCounter = 0;
    let listType = null; // "ul" | "ol" | null
    const closeList = () => {
      if (listType) {
        html += `</${listType}>`;
        listType = null;
      }
    };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (line.trim().startsWith("```")) {
        if (!inCodeBlock) {
          closeList();
          // 開頭 fence 標注的語言（例如 ` ```rust ` 的 `rust`）決定語法上色
          // 規則；語言名稱後面接一個 `=`（例如 ` ```rust= `）表示要加行號，
          // 兩者是各自獨立的標注，`=` 拿掉之後剩下的部分才是真正的語言
          // 名稱。`codeState` 是這個 code block 專屬的跨行狀態，每個 code
          // block 都要重新從 `false` 開始，不能沿用上一個 code block 剩下
          // 的狀態。
          const rawLang = line.trim().slice(3).trim();
          codeShowLineNumbers = rawLang.endsWith("=");
          codeSpec = getLanguageSpec(codeShowLineNumbers ? rawLang.slice(0, -1) : rawLang);
          codeState = { inBlockComment: false };
          codeLineCounter = 0;
          html += `<pre data-line="${i}"><code>`;
          inCodeBlock = true;
        } else {
          html += "</code></pre>";
          inCodeBlock = false;
          codeSpec = null;
        }
        continue;
      }
      if (inCodeBlock) {
        if (codeShowLineNumbers) {
          codeLineCounter++;
          html += `<span class="line-no">${codeLineCounter}</span>`;
        }
        html += codeSpec ? highlightCodeLine(line, codeSpec, codeState) : escapeHtml(line);
        html += "\n";
        continue;
      }

      // table：一行含 `|` 的資料列，緊接著一行分隔列，就當作 table 的開頭；
      // 後面連續含 `|` 的行都算資料列，直到遇到不符合的行或內容結尾為止。
      if (isTableRow(line) && !isTableSeparator(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
        closeList();
        const headerCells = splitTableRow(line);
        let j = i + 2;
        const dataRows = [];
        while (j < lines.length && isTableRow(lines[j])) {
          dataRows.push(splitTableRow(lines[j]));
          j++;
        }
        html += `<table data-line="${i}"><thead><tr>`;
        for (const cell of headerCells) html += `<th>${renderInlineMarkdown(cell)}</th>`;
        html += "</tr></thead><tbody>";
        for (const [rowOffset, row] of dataRows.entries()) {
          // 每一列各自帶自己的來源行號（`i + 2` 是資料列的起點，跳過 header
          // 跟分隔列），捲動同步時才能精準對到你正在編輯的那一列，不是整個
          // table 一起跳。
          html += `<tr data-line="${i + 2 + rowOffset}">`;
          for (const cell of row) html += `<td>${renderInlineMarkdown(cell)}</td>`;
          html += "</tr>";
        }
        html += "</tbody></table>";
        i = j - 1; // for 迴圈本身還會再 +1
        continue;
      }

      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        closeList();
        const level = heading[1].length;
        html += `<h${level} data-line="${i}">${renderInlineMarkdown(heading[2])}</h${level}>`;
        continue;
      }
      if (/^\s*>\s?/.test(line)) {
        closeList();
        html += `<blockquote data-line="${i}">${renderInlineMarkdown(line.replace(/^\s*>\s?/, ""))}</blockquote>`;
        continue;
      }
      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      if (ul) {
        if (listType !== "ul") {
          closeList();
          html += "<ul>";
          listType = "ul";
        }
        // GFM 風格的 checklist 項目（`- [ ] 內容`／`- [x] 內容`）：畫成一個
        // 唯讀的 checkbox，`disabled` 是因為這裡只是把目前的 markdown 內容
        // 呈現出來，不是要讓使用者直接點擊改變原始檔案。
        const checkbox = ul[1].match(/^\[( |x|X)\]\s+(.*)$/);
        if (checkbox) {
          const checked = checkbox[1].toLowerCase() === "x";
          html += `<li class="notepad-task" data-line="${i}"><input type="checkbox" disabled${checked ? " checked" : ""}> ${renderInlineMarkdown(checkbox[2])}</li>`;
        } else {
          html += `<li data-line="${i}">${renderInlineMarkdown(ul[1])}</li>`;
        }
        continue;
      }
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);
      if (ol) {
        if (listType !== "ol") {
          closeList();
          html += "<ol>";
          listType = "ol";
        }
        html += `<li data-line="${i}">${renderInlineMarkdown(ol[1])}</li>`;
        continue;
      }
      if (/^\s*(---|\*\*\*)\s*$/.test(line)) {
        closeList();
        html += `<hr data-line="${i}">`;
        continue;
      }
      closeList();
      if (line.trim() !== "") {
        html += `<p data-line="${i}">${renderInlineMarkdown(line)}</p>`;
      }
    }
    closeList();
    if (inCodeBlock) html += "</code></pre>";
    return html;
  }

  // storage 分頁點 `notepad/` 資料夾底下的檔名要切去 notepad 分頁並顯示
  // 那個檔案：tablet 是單頁分頁（不像桌面版可以同時開好幾個浮動 panel），
  // 沒有「panel 已經開著就直接呼叫它的 loadFile」這種機制，改成用一個
  // 模組層級變數記住「下次開 notepad 分頁要先載入哪個檔案」，`startNotepadTab`
  // 每次啟動都會讀這個值；notepad 分頁自己切換檔案時也會回寫這個值，這樣
  // 切到別的分頁再切回來還是顯示同一個檔案，不會每次都跳回預設的
  // `notepad.md`。
  let notepadInitialFile = "notepad.md";
  function openNotepadFile(name) {
    notepadInitialFile = name;
    switchTo("notepad");
  }

  // 建立 storage 分頁：跟桌面版 storage panel 完全同一套功能（瀏覽資料夾／
  // 上傳／新資料夾／下載／刪除／重新命名），只是不用桌面版浮動 panel 那層，
  // 直接把 `.storage-body` 塞進分頁的 `container`。沒有 EventSource/interval
  // 需要清，`stop()` 是空函式。
  function startStorageTab(container) {
    const wrap = document.createElement("div");
    wrap.className = "storage-body";

    const toolbar = document.createElement("div");
    toolbar.className = "storage-toolbar";
    const breadcrumb = document.createElement("span");
    breadcrumb.className = "storage-breadcrumb";
    const uploadBtn = document.createElement("button");
    uploadBtn.textContent = "⬆ 上傳";
    const uploadInput = document.createElement("input");
    uploadInput.type = "file";
    uploadInput.style.display = "none";
    const mkdirBtn = document.createElement("button");
    mkdirBtn.textContent = "＋ 新資料夾";
    toolbar.appendChild(breadcrumb);
    toolbar.appendChild(uploadBtn);
    toolbar.appendChild(uploadInput);
    toolbar.appendChild(mkdirBtn);

    const table = document.createElement("table");
    table.className = "storage-table";
    const tbody = document.createElement("tbody");
    table.appendChild(tbody);
    const tableScroll = document.createElement("div");
    tableScroll.className = "storage-table-scroll";
    tableScroll.appendChild(table);

    wrap.appendChild(toolbar);
    wrap.appendChild(tableScroll);
    container.appendChild(wrap);

    const state = { currentPath: "" };

    const joinPath = (base, name2) => (base ? `${base}/${name2}` : name2);

    function formatSize(bytes) {
      if (bytes === 0) return "—";
      const units = ["B", "K", "M", "G", "T"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
      }
      return unit === 0 ? `${bytes}${units[0]}` : `${value.toFixed(1)}${units[unit]}`;
    }

    function renderBreadcrumb() {
      breadcrumb.innerHTML = "";
      const rootSeg = document.createElement("a");
      rootSeg.href = "#";
      rootSeg.textContent = "/";
      rootSeg.addEventListener("click", (e) => {
        e.preventDefault();
        navigate("");
      });
      breadcrumb.appendChild(rootSeg);
      if (!state.currentPath) return;
      const parts = state.currentPath.split("/");
      let acc = "";
      for (const part of parts) {
        acc = acc ? `${acc}/${part}` : part;
        const seg = document.createElement("a");
        seg.href = "#";
        seg.textContent = ` ${part}`;
        const target = acc;
        seg.addEventListener("click", (e) => {
          e.preventDefault();
          navigate(target);
        });
        breadcrumb.appendChild(seg);
      }
    }

    async function refresh() {
      const path = state.currentPath;
      let entries;
      try {
        const res = await fetch(`/api/storage/list?path=${encodeURIComponent(path)}`);
        entries = await res.json();
      } catch (_err) {
        return; // 這次沒抓到就算了，使用者可以再手動切換一次路徑重試。
      }
      if (path !== state.currentPath) return; // 等待期間使用者又切了路徑，這次回應過期了，不要蓋掉新畫面。
      renderBreadcrumb();
      tbody.innerHTML = "";
      for (const entry of entries) {
        const row = document.createElement("tr");
        const nameCell = document.createElement("td");
        if (entry.is_dir) {
          const link = document.createElement("a");
          link.href = "#";
          link.textContent = `📁 ${entry.name}`;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            navigate(joinPath(state.currentPath, entry.name));
          });
          nameCell.appendChild(link);
        } else if (state.currentPath === "notepad") {
          // notepad 分頁的 `/api/notepad/content` 只接單一裸檔名（見
          // `web.rs` 的 `safe_notepad_path`，不能帶路徑），只有目前瀏覽到
          // `storage/notepad/` 這一層時，`entry.name` 才剛好對應 notepad
          // 能開的同一個檔案——其他路徑下的檔案沒有對應的 notepad 檔名，
          // 不能這樣接，維持純文字不可點。
          const link = document.createElement("a");
          link.href = "#";
          link.textContent = `📄 ${entry.name}`;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            openNotepadFile(entry.name);
          });
          nameCell.appendChild(link);
        } else {
          nameCell.textContent = `📄 ${entry.name}`;
        }
        const sizeCell = document.createElement("td");
        sizeCell.textContent = entry.is_dir ? "—" : formatSize(entry.size);
        const modifiedCell = document.createElement("td");
        modifiedCell.textContent = new Date(entry.modified * 1000).toLocaleString();
        const actionsCell = document.createElement("td");
        if (!entry.is_dir) {
          const dlBtn = document.createElement("a");
          dlBtn.href = `/api/storage/download?path=${encodeURIComponent(joinPath(state.currentPath, entry.name))}`;
          dlBtn.textContent = "⬇";
          actionsCell.appendChild(dlBtn);
        }
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑";
        delBtn.addEventListener("click", async () => {
          const full = joinPath(state.currentPath, entry.name);
          if (entry.is_dir) {
            let itemCount = 0;
            try {
              const res = await fetch(`/api/storage/list?path=${encodeURIComponent(full)}`);
              const children = await res.json();
              itemCount = children.length;
            } catch (_err) {
              // 查不到子項目數量就當作非空、用比較保守的措辭，不影響後面還是照樣送
              // recursive=true 的刪除請求。
            }
            const message = itemCount > 0
              ? `確定要刪除「${entry.name}」嗎？裡面還有 ${itemCount} 個項目，會一併刪除`
              : `確定要刪除「${entry.name}」（空資料夾）嗎？`;
            if (!window.confirm(message)) return;
            await fetch(`/api/storage/delete?path=${encodeURIComponent(full)}&recursive=true`, { method: "POST" });
          } else {
            if (!window.confirm(`確定要刪除「${entry.name}」嗎？`)) return;
            await fetch(`/api/storage/delete?path=${encodeURIComponent(full)}`, { method: "POST" });
          }
          refresh();
        });
        const renameBtn = document.createElement("button");
        renameBtn.textContent = "✎";
        renameBtn.addEventListener("click", async () => {
          const newName = window.prompt("新名稱", entry.name);
          if (!newName || newName === entry.name) return;
          const from = joinPath(state.currentPath, entry.name);
          const to = joinPath(state.currentPath, newName);
          await fetch(`/api/storage/rename?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`, {
            method: "POST",
          });
          refresh();
        });
        actionsCell.appendChild(delBtn);
        actionsCell.appendChild(renameBtn);
        row.appendChild(nameCell);
        row.appendChild(sizeCell);
        row.appendChild(modifiedCell);
        row.appendChild(actionsCell);
        tbody.appendChild(row);
      }
    }

    function navigate(path) {
      state.currentPath = path;
      refresh();
    }

    uploadBtn.addEventListener("click", () => uploadInput.click());
    uploadInput.addEventListener("change", async () => {
      const file = uploadInput.files[0];
      if (!file) return;
      const dest = joinPath(state.currentPath, file.name);
      await fetch(`/api/storage/upload?path=${encodeURIComponent(dest)}`, { method: "POST", body: file });
      uploadInput.value = "";
      refresh();
    });

    mkdirBtn.addEventListener("click", async () => {
      const dirName = window.prompt("新資料夾名稱");
      if (!dirName) return;
      const dest = joinPath(state.currentPath, dirName);
      await fetch(`/api/storage/mkdir?path=${encodeURIComponent(dest)}`, { method: "POST" });
      refresh();
    });

    refresh();

    return function stop() {};
  }

  // 建立 todo 分頁：toolbar 一個輸入框＋新增按鈕，下面是可捲動的待辦清單，
  // 每列勾選框切換完成/未完成、右邊垃圾桶刪除。跟 storage 分頁一樣，新增/
  // 勾選/刪除都是打完 API 就整份 `refresh()` 重新抓，不用自己維護本地
  // state 跟伺服器對不對得上。
  function startTodoTab(container) {
    const wrap = document.createElement("div");
    wrap.className = "todo-body";

    const toolbar = document.createElement("div");
    toolbar.className = "todo-toolbar";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "新增待辦事項...";
    const addBtn = document.createElement("button");
    addBtn.textContent = "＋ 新增";
    toolbar.appendChild(input);
    toolbar.appendChild(addBtn);

    const list = document.createElement("div");
    list.className = "todo-list";

    wrap.appendChild(toolbar);
    wrap.appendChild(list);
    container.appendChild(wrap);

    async function refresh() {
      let items;
      try {
        const res = await fetch("/api/todo/list");
        items = await res.json();
      } catch (_err) {
        return; // 這次沒抓到就算了，使用者下一次操作會再觸發一次 refresh。
      }
      list.innerHTML = "";
      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "todo-empty";
        empty.textContent = "（沒有待辦事項）";
        list.appendChild(empty);
        return;
      }
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "todo-row" + (item.done ? " done" : "");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = item.done;
        checkbox.addEventListener("change", async () => {
          await fetch(`/api/todo/toggle?id=${item.id}`, { method: "POST" });
          refresh();
        });
        const text = document.createElement("span");
        text.className = "todo-text";
        text.textContent = item.text;
        const delBtn = document.createElement("button");
        delBtn.textContent = "🗑";
        delBtn.addEventListener("click", async () => {
          await fetch(`/api/todo/remove?id=${item.id}`, { method: "POST" });
          refresh();
        });
        row.appendChild(checkbox);
        row.appendChild(text);
        row.appendChild(delBtn);
        list.appendChild(row);
      }
    }

    async function addItem() {
      const text = input.value.trim();
      if (!text) return;
      await fetch(`/api/todo/add?text=${encodeURIComponent(text)}`, { method: "POST" });
      input.value = "";
      refresh();
    }

    addBtn.addEventListener("click", addItem);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addItem();
    });

    refresh();

    return function stop() {};
  }

  // 建立 notepad 分頁：跟桌面版 notepad panel 同一套檢視/編輯/切換檔案
  // 功能，但編輯（原本 Ctrl-E）／切換檔案（原本 Ctrl-F）／儲存（Ctrl-S）／
  // 取消（Ctrl-X）全部改成按鈕——平板很難按這種組合鍵。切換檔案的輸入框
  // 保留 Enter/Esc（純文字輸入框用 Enter/Esc 很自然，跟「組合鍵」不是同一
  // 個問題），但另外補上「確認」/「取消」兩顆按鈕，觸控操作更直覺。
  function startNotepadTab(container) {
    const wrap = document.createElement("div");
    wrap.className = "notepad-body";

    const viewEl = document.createElement("div");
    viewEl.className = "notepad-view";

    const editEl = document.createElement("div");
    editEl.className = "notepad-edit";
    editEl.style.display = "none";
    const textarea = document.createElement("textarea");
    textarea.className = "notepad-textarea";
    textarea.spellcheck = false;
    const previewEl = document.createElement("div");
    previewEl.className = "notepad-preview";
    editEl.appendChild(textarea);
    editEl.appendChild(previewEl);

    const hint = document.createElement("div");
    hint.className = "notepad-hint";
    const hintActions = document.createElement("div");
    hintActions.className = "notepad-hint-actions";
    const editBtn = document.createElement("button");
    editBtn.textContent = "編輯";
    const switchBtn = document.createElement("button");
    switchBtn.textContent = "切換檔案";
    const saveBtn = document.createElement("button");
    saveBtn.textContent = "儲存";
    const cancelBtn = document.createElement("button");
    cancelBtn.textContent = "取消";
    hintActions.appendChild(editBtn);
    hintActions.appendChild(switchBtn);
    hintActions.appendChild(saveBtn);
    hintActions.appendChild(cancelBtn);
    const hintName = document.createElement("span");
    hintName.className = "notepad-hint-name";
    hint.appendChild(hintActions);
    hint.appendChild(hintName);

    const filenameRow = document.createElement("div");
    filenameRow.className = "notepad-filename-row";
    filenameRow.style.display = "none";
    const filenameInput = document.createElement("input");
    filenameInput.type = "text";
    filenameInput.className = "notepad-filename-input";
    filenameInput.spellcheck = false;
    const filenameConfirmBtn = document.createElement("button");
    filenameConfirmBtn.textContent = "確認";
    const filenameCancelBtn = document.createElement("button");
    filenameCancelBtn.textContent = "取消";
    filenameRow.appendChild(filenameInput);
    filenameRow.appendChild(filenameConfirmBtn);
    filenameRow.appendChild(filenameCancelBtn);

    wrap.appendChild(viewEl);
    wrap.appendChild(editEl);
    wrap.appendChild(hint);
    wrap.appendChild(filenameRow);
    container.appendChild(wrap);

    const state = { savedContent: "", editing: false, promptingFile: false, name: notepadInitialFile };

    function updateHint() {
      hintName.textContent = state.name;
      editBtn.style.display = state.editing ? "none" : "";
      switchBtn.style.display = state.editing ? "none" : "";
      saveBtn.style.display = state.editing ? "" : "none";
      cancelBtn.style.display = state.editing ? "" : "none";
    }

    function renderView() {
      viewEl.innerHTML = state.savedContent.trim()
        ? renderMarkdown(state.savedContent)
        : '<span class="notepad-empty">(空白，按「編輯」開始輸入)</span>';
      updateHint();
    }

    function enterEdit() {
      state.editing = true;
      textarea.value = state.savedContent;
      previewEl.innerHTML = renderMarkdown(state.savedContent);
      viewEl.style.display = "none";
      editEl.style.display = "flex";
      updateHint();
      textarea.focus();
    }

    function exitEdit() {
      state.editing = false;
      viewEl.style.display = "";
      editEl.style.display = "none";
      renderView();
    }

    async function save() {
      await fetch("/api/notepad/content", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: state.name, content: textarea.value }),
      });
      state.savedContent = textarea.value;
      exitEdit();
    }

    async function loadFile(fileName) {
      const res = await fetch(`/api/notepad/content?name=${encodeURIComponent(fileName)}`);
      const d = await res.json();
      state.name = d.name;
      state.savedContent = d.content;
      notepadInitialFile = d.name;
      renderView();
    }

    function startFilePrompt() {
      state.promptingFile = true;
      filenameInput.value = state.name;
      hint.style.display = "none";
      filenameRow.style.display = "flex";
      filenameInput.focus();
      filenameInput.select();
    }

    function endFilePrompt() {
      state.promptingFile = false;
      filenameRow.style.display = "none";
      hint.style.display = "";
    }

    function confirmFilePrompt() {
      const fileName = filenameInput.value.trim();
      endFilePrompt();
      if (fileName) loadFile(fileName);
    }

    filenameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        confirmFilePrompt();
      } else if (e.key === "Escape") {
        e.preventDefault();
        endFilePrompt();
      }
    });
    filenameConfirmBtn.addEventListener("click", confirmFilePrompt);
    filenameCancelBtn.addEventListener("click", endFilePrompt);

    function scrollPreviewToCursor() {
      const currentLine = textarea.value.slice(0, textarea.selectionStart).split("\n").length - 1;
      const marks = previewEl.querySelectorAll("[data-line]");
      let target = null;
      for (const el of marks) {
        if (Number(el.dataset.line) <= currentLine) {
          target = el;
        } else {
          break;
        }
      }
      if (target) {
        target.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    textarea.addEventListener("input", () => {
      previewEl.innerHTML = renderMarkdown(textarea.value);
      scrollPreviewToCursor();
    });
    textarea.addEventListener("keyup", scrollPreviewToCursor);
    textarea.addEventListener("click", scrollPreviewToCursor);

    editBtn.addEventListener("click", enterEdit);
    switchBtn.addEventListener("click", startFilePrompt);
    saveBtn.addEventListener("click", save);
    cancelBtn.addEventListener("click", exitEdit);

    loadFile(state.name);

    return function stop() {};
  }

  const TABS = [
    { name: "device", icon: "📟", label: "device" },
    { name: "global", icon: "🌍", label: "global" },
    { name: "topology", icon: "🌐", label: "topology" },
    { name: "weather", icon: "🌤️", label: "weather" },
    { name: "system", icon: "⚙️", label: "system" },
    { name: "player", icon: "🎵", label: "player" },
    { name: "ereader", icon: "📖", label: "ereader" },
    { name: "storage", icon: "🗂️", label: "storage" },
    { name: "notepad", icon: "📝", label: "notepad" },
    { name: "todo", icon: "✅", label: "todo" },
  ];

  // `TAB_MODULES` 把每個分頁名稱對應到一個模組：`start(container)` 掛上
  // 內容並回傳 `stopFn`，切分頁時呼叫該 `stopFn` 清掉 interval／EventSource
  // ／animation frame，不留背景在跑。
  const TAB_MODULES = {
    device: { start: makeSnapshotTab("device") },
    global: { start: makeSnapshotTab("global") },
    topology: { start: startTopologyTab },
    weather: { start: startWeatherTab },
    system: { start: makePlainPanelTab("system") },
    player: { start: startPlayerTab },
    ereader: { start: startEreaderTab },
    storage: { start: startStorageTab },
    notepad: { start: startNotepadTab },
    todo: { start: startTodoTab },
  };

  const content = document.getElementById("content");
  const tabbar = document.getElementById("tabbar");
  let activeName = null;
  let activeStop = null;

  function switchTo(name) {
    if (activeName === name) return;
    if (activeStop) {
      activeStop();
      activeStop = null;
    }
    content.innerHTML = "";
    activeStop = TAB_MODULES[name].start(content);
    activeName = name;
    for (const btn of tabbar.querySelectorAll("button")) {
      btn.classList.toggle("active", btn.dataset.name === name);
    }
  }

  for (const t of TABS) {
    const btn = document.createElement("button");
    btn.dataset.name = t.name;
    const icon = document.createElement("div");
    icon.className = "tab-icon";
    icon.textContent = t.icon;
    const label = document.createElement("div");
    label.className = "tab-label";
    label.textContent = t.label;
    btn.appendChild(icon);
    btn.appendChild(label);
    btn.addEventListener("click", () => switchTo(t.name));
    tabbar.appendChild(btn);
  }

  switchTo("device");
})();
</script>
</body>
</html>
