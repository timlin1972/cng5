<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cng5 tablet</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Sarasa Term SC", "Sarasa Term TC", "Sarasa Mono SC", "Sarasa Mono TC", "Noto Sans Mono CJK SC",
      "Noto Sans Mono CJK TC", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    background: #111318;
    color: #d8dee9;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #content { flex: 1; overflow: auto; padding: 16px; }
  #tabbar { display: flex; background: #1b1e26; border-top: 1px solid #3a4150; flex: none; }
  #tabbar button {
    flex: 1;
    background: none;
    border: none;
    color: #9aa4b8;
    font: inherit;
    padding: 14px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  #tabbar button.active { color: #6f9dff; background: #262a33; }
  .tab-icon { font-size: 22px; }
  .tab-label { font-size: 13px; }

  .data-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .data-table th, .data-table td { padding: 10px 12px; border-top: 1px solid #262a33; white-space: pre; text-align: left; }
  .data-table th { color: #9aa4b8; font-weight: normal; border-top: none; border-bottom: 1px solid #3a4150; }
  .data-table tr.row-offline { color: #8a92a5; }
  @keyframes cellFlash {
    from { background-color: rgba(255, 255, 255, 0.35); }
    to { background-color: transparent; }
  }
  .cell-flash { animation: cellFlash 1s ease-out; }
  .plain-panel { white-space: pre-wrap; font-size: 15px; line-height: 1.6; }
  .empty-hint { color: #9aa4b8; padding: 16px; font-size: 15px; }

  /* weather 分頁：左側地區清單＋右側大圖（圖示＋動態背景＋現在氣溫／今天／
     未來預報），見 `startWeatherTab` 的說明。 */
  .weather-body { height: 100%; display: flex; overflow: hidden; }
  .weather-sidebar { width: 180px; flex: none; overflow-y: auto; background: #1b1e26; border-right: 1px solid #262a33; }
  .weather-loc-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    cursor: pointer;
    border-bottom: 1px solid #262a33;
    color: #fff;
  }
  .weather-loc-row.selected { background: #262a33; }
  .weather-loc-icon { width: 28px; height: 28px; flex: none; }
  .weather-loc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .weather-loc-temp { flex: none; font-size: 14px; color: #9aa4b8; }

  .weather-main { flex: 1; position: relative; overflow: auto; display: flex; flex-direction: column; color: #fff; }
  /* 動態背景層：漸層色＋依天氣分類疊加的雲/霧/雨/雪/太陽光暈/閃電效果，
     `position: absolute; inset: 0` 蓋滿 `.weather-main`，前景內容（`.weather-
     hero`/`.weather-forecast-section`）用 `z-index: 1` 疊在上面。 */
  .weather-bg { position: absolute; inset: 0; overflow: hidden; }
  .weather-bg-dim::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.15); }
  .weather-sun-glow {
    position: absolute;
    top: -15%;
    left: 50%;
    width: 220px;
    height: 220px;
    margin-left: -110px;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
    border-radius: 50%;
    animation: weatherSunPulse 6s ease-in-out infinite;
  }
  @keyframes weatherSunPulse {
    0%, 100% { opacity: .7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  .weather-cloud {
    position: absolute;
    left: -30%;
    width: 180px;
    height: 70px;
    background: #fff;
    border-radius: 60px;
    animation-name: weatherCloudDrift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .weather-cloud::before, .weather-cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .weather-cloud::before { width: 70px; height: 70px; top: -30px; left: 20px; }
  .weather-cloud::after { width: 50px; height: 50px; top: -18px; left: 90px; }
  @keyframes weatherCloudDrift {
    from { transform: translateX(0); }
    to { transform: translateX(160vw); }
  }
  .weather-fog-band {
    position: absolute;
    left: -20%;
    width: 140%;
    height: 40px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    animation-name: weatherFogDrift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes weatherFogDrift {
    0%, 100% { transform: translateX(-6%); }
    50% { transform: translateX(6%); }
  }
  .weather-drop {
    position: absolute;
    top: -10%;
    width: 2px;
    height: 16px;
    background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.7));
    animation-name: weatherDropFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes weatherDropFall {
    from { top: -10%; }
    to { top: 110%; }
  }
  .weather-flake {
    position: absolute;
    top: -5%;
    background: #fff;
    border-radius: 50%;
    opacity: .85;
    animation-name: weatherFlakeFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes weatherFlakeFall {
    from { top: -5%; transform: translateX(0); }
    to { top: 110%; transform: translateX(20px); }
  }
  .weather-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    animation: weatherLightning 7s infinite;
  }
  @keyframes weatherLightning {
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: .8; }
    94% { opacity: 0; }
    95% { opacity: .5; }
    96% { opacity: 0; }
  }

  .weather-hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 32px 16px 16px;
    flex: none;
  }
  .weather-hero-icon { width: 120px; height: 120px; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3)); }
  .weather-hero-time { font-size: 15px; opacity: .75; letter-spacing: .05em; }
  .weather-hero-temp { font-size: 48px; font-weight: 600; }
  .weather-hero-desc { font-size: 18px; }
  .weather-hero-sub { font-size: 13px; opacity: .85; }

  .weather-forecast-section { position: relative; z-index: 1; padding: 8px 16px; flex: none; }
  .weather-forecast-label { font-size: 13px; opacity: .75; margin-bottom: 6px; text-align: center; }
  /* `justify-content: center` 直接放在有 `overflow-x: auto` 的 flex
     容器上，內容一旦寬過容器就會出現經典的 flexbox 置中 + overflow 問題：
     瀏覽器預設的 scroll 起點會對齊到「置中排列後」的最左端，視覺上看起來
     跟沒置中一樣是靠左。改成外層 `.weather-forecast-row` 只負責
     `overflow-x: auto`（純捲動容器），真正排列的 `.weather-forecast-track`
     用 `width: max-content` + `margin: 0 auto`：內容比容器窄時 auto margin
     會置中；內容比容器寬時 auto margin 算出來是 0，自動退回靠左＋可捲動，
     不會有一半內容捲不到的問題。 */
  .weather-forecast-row { overflow-x: auto; padding-bottom: 4px; }
  .weather-forecast-track { display: flex; gap: 16px; width: max-content; margin: 0 auto; }
  .weather-forecast-item { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; min-width: 56px; }
  .weather-forecast-icon { width: 36px; height: 36px; }
  .weather-forecast-item .label { font-size: 12px; opacity: .8; }
  .weather-forecast-item .temp { font-size: 13px; }
  .weather-forecast-item .rain { font-size: 11px; opacity: .75; }
  .weather-forecast-empty { font-size: 13px; opacity: .6; padding: 8px 0; text-align: center; }

  .weather-loc-icon svg, .weather-hero-icon svg, .weather-forecast-icon svg { width: 100%; height: 100%; display: block; }
  .weather-icon-sun-rays { transform-box: fill-box; transform-origin: center; animation: weatherIconSunRotate 20s linear infinite; }
  @keyframes weatherIconSunRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* topology 分頁專用，跟桌面版 frontend.html 的 `.topology-*` 是同一套
     設計，這裡各自一份（這次刻意不共用 JS/CSS 模組，見 spec 的取捨說明）。 */
  #topology-wrap { position: relative; height: 100%; }
  .topology-svg { width: 100%; height: 100%; }
  .topology-node { cursor: default; }
  .topology-node-label { font-size: 12px; fill: #d8dee9; text-anchor: middle; pointer-events: none; }
  .topology-domain-box { fill: none; stroke: #3a4150; stroke-width: 1; stroke-dasharray: 5,3; }
  .topology-domain-label { font-size: 11px; fill: #6b7280; }
  .topology-edge { stroke: #5a6272; stroke-width: 1.5; }
  .topology-broker { fill: #1b1e26; stroke: #d8dee9; stroke-width: 2; }
  .topology-tooltip {
    position: absolute;
    display: none;
    pointer-events: none;
    background: #1b1e26;
    border: 1px solid #3a4150;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 13px;
    color: #d8dee9;
    white-space: pre;
    z-index: 20;
  }

  /* player 分頁：跟桌面版 frontend.html 的 player panel（`.music-*`/
     `.player-*`）是同一套設計，這裡各自一份（同一種取捨，見 topology 那段
     的說明）。跟桌面版唯一的差異是 `.player-body` 用 `height: 100%`
     （桌面版靠浮動 panel 的固定 `width`/`height` 撐開，tablet 分頁沒有那層,
     直接吃滿 `#content`）。 */
  .music-files { flex: 1; overflow: auto; padding: 0 8px; }
  .music-empty { color: #5a6272; padding: 8px 0; }
  .music-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #262a33; }
  .music-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .music-row button {
    background: #262a33;
    border: 1px solid #3a4150;
    color: #d8dee9;
    border-radius: 3px;
    padding: 2px 6px;
    font: inherit;
    cursor: pointer;
  }
  .music-row button:hover { background: #323844; }
  .music-row.playing { background: #1e2530; border-radius: 3px; }
  .music-row.playing .music-name { color: #6f9dff; }
  .player-body { height: 100%; display: flex; overflow: hidden; font-size: 15px; }
  .player-left { flex: 1.3; display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid #262a33; }
  .player-left .music-files { flex: 1; }
  .player-download-row { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #262a33; }
  .player-file-count { flex: none; align-self: center; color: #8a92a5; white-space: nowrap; }
  .player-url-input {
    flex: 1;
    min-width: 0;
    background: #0d0f13;
    border: 1px solid #3a4150;
    color: #d8dee9;
    border-radius: 3px;
    padding: 4px 6px;
    font: inherit;
  }
  .player-download-row button {
    background: #262a33;
    border: 1px solid #3a4150;
    color: #d8dee9;
    border-radius: 3px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  .player-download-row button:hover { background: #323844; }
  .player-right { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; overflow: auto; }
  /* flex column 底下子元素預設 flex-shrink:1，內容總高度超過可視範圍時
     瀏覽器會把每個子元素（包括歌名這種單行文字）都往下壓縮，看起來像被
     裁切——固定每個子元素維持自己原本的高度，超出的部分交給
     `.player-right` 自己的 `overflow: auto` 捲動。 */
  .player-right > * { flex-shrink: 0; }
  .player-cover-slot {
    width: 100%;
    max-width: 220px;
    aspect-ratio: 1 / 1;
    background: #0d0f13;
    border: 1px solid #3a4150;
    border-radius: 4px;
  }
  .player-cover { object-fit: cover; }
  .player-seek-row { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 220px; }
  .player-seek { flex: 1; min-width: 0; accent-color: #6f9dff; }
  .player-time { flex-shrink: 0; font-size: 12px; color: #9aa3b2; white-space: nowrap; }
  .player-track-name {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #d8dee9;
    text-align: center;
    line-height: 1.6;
    padding: 4px 0;
  }
  .player-track-name-row { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; max-width: 100%; }
  .player-track-name-row .player-track-name { min-width: 0; }
  .player-now-playing-fav-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: #d8dee9;
    font-size: 15px;
    line-height: 1;
    padding: 2px;
    cursor: pointer;
  }
  .player-now-playing-fav-btn:hover { opacity: 0.75; }
  .player-now-playing-fav-btn:disabled { opacity: 0.3; cursor: default; }
  .ereader-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .ereader-shelf-toolbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #262a33; flex-wrap: wrap; }
  .ereader-shelf-toolbar button { background: #232833; color: #d8dee9; border: 1px solid #3a4150; border-radius: 4px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .ereader-shelf-toolbar button:hover { background: #2b3140; }
  .ereader-shelf-toolbar input[type="text"] { flex: 1; min-width: 120px; background: #1b1f27; color: #d8dee9; border: 1px solid #3a4150; border-radius: 4px; padding: 3px 8px; font: inherit; font-size: 12px; }
  .ereader-haodoo-status { flex: none; font-size: 12px; color: #6a7383; }
  .ereader-haodoo { display: flex; flex-direction: column; height: 100%; }
  .ereader-haodoo-frame-wrap { flex: 1; position: relative; overflow: hidden; }
  .ereader-haodoo-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #fff; }
  .ereader-shelf { flex: 1; overflow-y: auto; padding: 4px; }
  .ereader-empty { padding: 16px; text-align: center; color: #6a7383; }
  .ereader-book-row { display: flex; gap: 10px; padding: 8px 6px; border-bottom: 1px solid #262a33; cursor: pointer; align-items: center; }
  .ereader-book-row:hover { background: #1e2530; }
  .ereader-book-cover { width: 40px; height: 56px; object-fit: cover; background: #262a33; border-radius: 2px; flex-shrink: 0; }
  .ereader-book-info { flex: 1; overflow: hidden; }
  .ereader-book-title { color: #d8dee9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ereader-book-author { color: #9aa4b8; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ereader-book-progress { color: #6f9dff; font-size: 12px; }
  .ereader-reader { display: flex; flex-direction: column; height: 100%; }
  .ereader-toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #262a33; flex: none; }
  .ereader-toolbar button {
    background: #262a33;
    border: 1px solid #3a4150;
    color: #d8dee9;
    border-radius: 3px;
    padding: 4px 8px;
    cursor: pointer;
    font: inherit;
  }
  .ereader-toolbar button:hover { background: #323844; }
  .ereader-toolbar-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d8dee9; font-size: 13px; }
  .ereader-frame-wrap { flex: 1; position: relative; overflow: hidden; }
  .ereader-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #fff; }
  .ereader-tap-zone { position: absolute; top: 0; bottom: 0; width: 18%; cursor: pointer; }
  .ereader-tap-left { left: 0; }
  .ereader-tap-right { right: 0; }
  .ereader-toc-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: flex-end; z-index: 5; }
  .ereader-toc-list { width: min(320px, 80%); background: #1b1f27; overflow-y: auto; padding: 6px 0; }
  .ereader-toc-row { padding: 10px 16px; color: #d8dee9; cursor: pointer; border-bottom: 1px solid #262a33; font-size: 13px; }
  .ereader-toc-row:hover { background: #232833; }
  .ereader-toc-row-current { color: #6f9dff; font-weight: bold; }
  /* 迷你歌詞：放在播放模式按鈕下面，固定只留幾行的高度（不是像封面那樣
     佔滿整個方框），`scrollActiveLyricIntoView` 會捲動這個小視窗讓目前
     唱到的那一行保持在可視範圍內。 */
  .player-lyrics-mini {
    width: 100%;
    max-width: 220px;
    max-height: 5em;
    overflow-y: auto;
    text-align: center;
    color: #6a7383;
    font-size: 14px;
    line-height: 1.5em;
  }
  .player-lyric-line { padding: 3px 0; }
  .player-lyric-line.active { color: #6f9dff; font-weight: bold; }
  .player-lyrics-empty { color: #5a6272; padding: 8px 0; }
  .player-controls { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .player-transport { display: flex; align-items: center; gap: 18px; }
  .player-mode-row { display: flex; justify-content: center; width: 100%; }
  .player-controls button {
    background: none;
    border: none;
    color: #d8dee9;
    padding: 6px;
    font: inherit;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
  }
  .player-controls button:hover { opacity: 0.75; }
  /* 播放/暫停跟其他三顆（模式/上一首/下一首）不一樣：自己放大一階、圓形
     外框、反白（淺底深 icon），視覺上當成整排的主按鈕。用
     `.player-controls button.player-playpause-btn` 拉高 CSS 優先度，
     不然單純 `.player-playpause-btn`（1 個 class）會被上面
     `.player-controls button`（1 個 class + 1 個 element）蓋掉。 */
  .player-controls button.player-playpause-btn {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 50%;
    background: #d8dee9;
    color: #111318;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  /* `▶`（play，暫停中顯示）這個字符在等寬字型裡的視覺墨色偏左下，跟
     `⏸`（正在播放時顯示）不對稱，額外補一點不對稱的 padding 推回圓心。 */
  .player-controls button.player-playpause-btn.is-play-icon {
    padding: 0 0 0.1em 0.12em;
  }

  /* storage 分頁：跟桌面版 frontend.html 的 storage panel 是同一套設計，
     這裡各自一份（同一種取捨，見 topology 那段的說明）。 */
  .storage-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .storage-toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid #3a4150;
  }
  .storage-breadcrumb { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  .storage-breadcrumb a { color: #6f9dff; text-decoration: none; margin-right: 4px; }
  .storage-breadcrumb a:hover { text-decoration: underline; }
  .storage-toolbar button {
    background: #232833;
    color: #d8dee9;
    border: 1px solid #3a4150;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
  }
  .storage-toolbar button:hover { background: #2b3140; }
  /* `flex: 1`/`overflow: auto` 要放在外面包一層的 `<div>`，不能直接放在
     `<table>` 本身，不然檔案數一少、每列高度會被平分撐開（HTML table 排版
     演算法的行為），見桌面版同一段註解的完整說明。 */
  .storage-table-scroll { flex: 1; overflow: auto; }
  .storage-table { border-collapse: collapse; width: 100%; font-size: 15px; }
  .storage-table td { height: 40px; padding: 6px 14px; border-top: 1px solid #262a33; white-space: nowrap; vertical-align: top; }
  .storage-table a { color: #6f9dff; text-decoration: none; }
  .storage-table a:hover { text-decoration: underline; }
  .storage-table button {
    background: none;
    border: none;
    color: #9aa4b8;
    cursor: pointer;
    font-size: 16px;
    margin-left: 10px;
    padding: 4px;
  }
  .storage-table button:hover { color: #d8dee9; }

  /* todo 分頁：跟 storage 分頁一樣是 toolbar + 可捲動清單，但清單本身一列
     一個 `<div>`（不是 `<table>`）——每列欄位只有勾選/文字/刪除三個，不需要
     表格排版，`<div>` 加 `flex` 更好排文字自動換行（待辦內容可能很長）。 */
  .todo-body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .todo-toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid #3a4150;
  }
  .todo-toolbar input[type="text"] {
    flex: 1;
    background: #1b1e26;
    color: #d8dee9;
    border: 1px solid #3a4150;
    border-radius: 4px;
    padding: 8px 10px;
    font: inherit;
    font-size: 15px;
  }
  .todo-toolbar button {
    background: #232833;
    color: #d8dee9;
    border: 1px solid #3a4150;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
  }
  .todo-toolbar button:hover { background: #2b3140; }
  .todo-list { flex: 1; overflow: auto; padding: 4px 0; }
  .todo-empty { padding: 20px 14px; color: #9aa4b8; font-size: 15px; }
  .todo-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid #262a33; }
  .todo-row input[type="checkbox"] { width: 20px; height: 20px; flex: none; }
  .todo-text { flex: 1; font-size: 15px; overflow-wrap: anywhere; }
  .todo-row.done .todo-text { color: #6c7280; text-decoration: line-through; }
  .todo-row button { background: none; border: none; color: #9aa4b8; cursor: pointer; font-size: 16px; padding: 4px; }
  .todo-row button:hover { color: #d8dee9; }

  /* notepad 分頁：跟桌面版一樣，但 Ctrl-E／Ctrl-F／Ctrl-S／Ctrl-X 這幾個
     組合鍵全部換成按鈕（見 `startNotepadTab` 開頭的說明）。 */
  .notepad-body { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .notepad-view { flex: 1; overflow: auto; padding: 14px 16px; font-size: 15px; }
  .notepad-edit { flex: 1; display: flex; overflow: hidden; }
  .notepad-textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    background: #0d0f13;
    border: none;
    border-right: 1px solid #262a33;
    color: #d8dee9;
    padding: 14px 16px;
    font: inherit;
    font-size: 15px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    outline: none;
  }
  .notepad-preview { flex: 1; min-width: 0; overflow: auto; padding: 14px 16px; font-size: 15px; }
  .notepad-hint {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid #262a33;
    color: #6b7280;
    font-size: 13px;
  }
  .notepad-hint-actions { display: flex; gap: 8px; }
  .notepad-hint button, .notepad-filename-row button {
    background: #262a33;
    border: 1px solid #3a4150;
    color: #d8dee9;
    border-radius: 4px;
    padding: 8px 14px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .notepad-hint button:hover, .notepad-filename-row button:hover { background: #323844; }
  .notepad-hint-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .notepad-filename-row {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid #262a33;
    background: #0d0f13;
  }
  .notepad-filename-input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid #3a4150;
    border-radius: 4px;
    background: #1b1e26;
    color: #d8dee9;
    font: inherit;
    font-size: 15px;
    outline: none;
  }
  .notepad-empty { color: #5a6272; }
  .notepad-view h1, .notepad-view h2, .notepad-view h3,
  .notepad-view h4, .notepad-view h5, .notepad-view h6,
  .notepad-preview h1, .notepad-preview h2, .notepad-preview h3,
  .notepad-preview h4, .notepad-preview h5, .notepad-preview h6 {
    color: #6f9dff;
    margin: 0.6em 0 0.3em;
  }
  .notepad-view h1, .notepad-view h2,
  .notepad-preview h1, .notepad-preview h2 {
    border-bottom: 1px solid #3a4150;
    padding-bottom: 0.2em;
  }
  .notepad-view p, .notepad-preview p { margin: 0.4em 0; }
  .notepad-view code, .notepad-preview code {
    background: #a0a0a0;
    color: #8b0000;
    border-radius: 3px;
    padding: 0 4px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  .notepad-view s, .notepad-preview s { text-decoration: line-through; }
  .notepad-underline { text-decoration: underline; }
  .notepad-highlight { background: #d8dee9; color: #1b1e26; }
  .notepad-view pre, .notepad-preview pre {
    background: #0d0f13;
    border: 1px solid #262a33;
    border-radius: 4px;
    padding: 8px 10px;
    overflow: auto;
  }
  .notepad-view pre code, .notepad-preview pre code { background: none; color: inherit; border: none; padding: 0; }
  .notepad-view .tok-keyword, .notepad-preview .tok-keyword { color: #5c8ae6; font-weight: bold; }
  .notepad-view .tok-string, .notepad-preview .tok-string { color: #d7ba48; }
  .notepad-view .tok-number, .notepad-preview .tok-number { color: #c678dd; }
  .notepad-view .tok-comment, .notepad-preview .tok-comment { color: #6b7280; font-style: italic; }
  .notepad-view .line-no, .notepad-preview .line-no {
    display: inline-block;
    width: 2.5em;
    margin-right: 0.8em;
    padding-right: 0.4em;
    border-right: 1px solid #3a4150;
    text-align: right;
    color: #6b7280;
    user-select: none;
  }
  .notepad-view blockquote, .notepad-preview blockquote {
    margin: 0.4em 0;
    padding-left: 10px;
    border-left: 3px solid #3a4150;
    color: #8a92a5;
    font-style: italic;
  }
  .notepad-view ul, .notepad-preview ul,
  .notepad-view ol, .notepad-preview ol {
    margin: 0.3em 0;
    padding-left: 1.6em;
  }
  .notepad-view li.notepad-task, .notepad-preview li.notepad-task {
    list-style: none;
    margin-left: -1.6em;
  }
  .notepad-view li.notepad-task input, .notepad-preview li.notepad-task input {
    margin-right: 4px;
  }
  .notepad-view hr, .notepad-preview hr {
    border: none;
    border-top: 1px solid #3a4150;
    margin: 0.6em 0;
  }
  .notepad-view a, .notepad-preview a { color: #6f9dff; font-weight: bold; text-decoration: underline; }
  .notepad-view table, .notepad-preview table {
    border-collapse: collapse;
    margin: 0.4em 0;
  }
  .notepad-view th, .notepad-preview th {
    font-weight: bold;
    text-align: left;
    padding: 3px 10px;
    border-bottom: 2px solid #3a4150;
  }
  .notepad-view td, .notepad-preview td { padding: 3px 10px; }
  .notepad-view tbody tr:not(:first-child) td,
  .notepad-preview tbody tr:not(:first-child) td {
    border-top: 1px solid #262a33;
  }
</style>
</head>
<body>
<div id="content"></div>
<div id="tabbar"></div>

<script>
(function () {
  "use strict";

  // 跟後端 device.rs/global.rs 的 ALIVE_TTL（REPORT_INTERVAL 10 秒 * 3）保持
  // 一致——這裡沒有對應的 API 可以查，只能寫死並用註解註明依賴關係。跟桌面版
  // frontend.html 的 TOPOLOGY_ALIVE_TTL_MS 是同一個值，這裡各自一份常數。
  // topology 分頁還在用這個值算 alive（它走的是原始 `/api/device/list`／
  // `/api/global/list`，不是下面 `device`／`global` 分頁改用的 snapshot）。
  const ALIVE_TTL_MS = 30000;

  // 跟 `sysinfo::format_uptime` 算法一致。
  function formatUptimeJs(secs) {
    const days = Math.floor(secs / 86400);
    const hours = Math.floor((secs % 86400) / 3600);
    const minutes = Math.floor((secs % 3600) / 60);
    const seconds = Math.floor(secs % 60);
    const pad = (n) => String(n).padStart(2, "0");
    return days > 0 ? `${days}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}` : `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }

  // 跟 `sysinfo::format_disk_usage`/`format_bytes_short` 算法一致。
  function formatDiskJs(free, total) {
    if (total === 0) return "N/A";
    const short = (bytes) => {
      const units = ["B", "K", "M", "G", "T"];
      let value = bytes;
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit++;
      }
      return unit === 0 ? `${bytes}${units[0]}` : `${value.toFixed(0)}${units[unit]}`;
    };
    return `${short(free)}/${short(total)}`;
  }

  // `device`／`global` 兩個分頁共用：把後端 `web.rs` 的 `table_snapshot_json`
  // 送來的逐格 snapshot 畫成一個簡單表格，跟桌面版 frontend.html 的
  // `renderTableSnapshot` 是同一份資料源（`/api/panel/<name>/snapshot-stream`），
  // 「目前控制的機器」前面的 `* ` 前綴跟 alive 欄的 `*`/空白都是後端算好、
  // 原封不動顯示，前端不用重算。用 `textContent` 逐格填值（不是拼 HTML
  // 字串），跟桌面版同一個理由——`global` 的資料有一部分是其他 domain 透過
  // 公開 MQTT broker 回報的字串，不能假設乾淨。
  function renderTableSnapshot(container, snapshot) {
    container.innerHTML = "";
    if (snapshot.rows.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-hint";
      empty.textContent = "(還沒有任何裝置資料)";
      container.appendChild(empty);
      return;
    }
    const table = document.createElement("table");
    table.className = "data-table";
    const thead = document.createElement("thead");
    const headRow = document.createElement("tr");
    for (const header of snapshot.headers) {
      const th = document.createElement("th");
      th.textContent = header;
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    const tbody = document.createElement("tbody");
    for (const row of snapshot.rows) {
      const tr = document.createElement("tr");
      // alive 永遠是最後一欄（`device.rs`/`global.rs` 的 `rows()` 都把它排在
      // `cells` 最後一個），不是 `*` 就是離線，整排文字調淡一點（不是只淡化
      // alive 那一格），但不要淡到看不清楚。
      const aliveCell = row.cells[row.cells.length - 1];
      if (aliveCell && aliveCell.text !== "*") {
        tr.className = "row-offline";
      }
      for (const cell of row.cells) {
        const td = document.createElement("td");
        td.textContent = cell.text;
        // 跟桌面版 frontend.html 的 `renderTableSnapshot` 同一套逐格閃爍
        // 效果：`<tbody>` 每次 poll 都整個重建，剛變化的格子用負的
        // `animation-delay`（`flash_ms` 已經過去的毫秒數）讓瀏覽器把這個
        // 全新 DOM node 的動畫接續當成「已經播到第 X 秒」，不會被每次重建
        // 打斷、跳回全白重新開始。
        if (cell.flash_ms !== null && cell.flash_ms !== undefined) {
          td.className = "cell-flash";
          td.style.animationDelay = `-${cell.flash_ms / 1000}s`;
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(thead);
    table.appendChild(tbody);
    container.appendChild(table);
  }

  // 通用的「訂閱 `/api/panel/<name>/snapshot-stream`，收到就整個重繪表格」
  // 分頁工廠，`device`／`global` 分頁共用同一份邏輯，只是端點不同。跟桌面版
  // frontend.html 一樣要解兩層 JSON——`table_snapshot_json` 送的是「JSON 物件
  // 字串」，經過 `sse_frame` 又整個包了一層 JSON 字串編碼。
  function makeSnapshotTab(name) {
    return function start(container) {
      const es = new EventSource(`/api/panel/${encodeURIComponent(name)}/snapshot-stream`);
      es.onmessage = (e) => {
        let snapshot;
        try {
          snapshot = JSON.parse(JSON.parse(e.data));
        } catch (_err) {
          return;
        }
        renderTableSnapshot(container, snapshot);
      };
      return function stop() {
        es.close();
      };
    };
  }

  // `system` 分頁沿用桌面版既有的純文字 panel 機制
  // （`/api/panel/<name>/stream`），內容原樣顯示。`weather` 分頁改成自己的
  // 圖示化版面（見下面 `startWeatherTab`），不再共用這個函式。
  function makePlainPanelTab(panelName) {
    return function start(container) {
      const pre = document.createElement("pre");
      pre.className = "plain-panel";
      pre.textContent = "(等待資料...)";
      container.appendChild(pre);
      const es = new EventSource(`/api/panel/${encodeURIComponent(panelName)}/stream`);
      es.onmessage = (e) => {
        try {
          pre.textContent = JSON.parse(e.data);
        } catch (_err) {
          pre.textContent = e.data;
        }
      };
      return function stop() {
        es.close();
      };
    };
  }

  // weather 分頁：左側地區清單＋右側大圖（圖示＋動態背景＋現在氣溫，下面分
  // 「今天」／「未來預報」兩排），資料來自 `/api/weather/list`（見
  // `src/plugins/weather.rs` 的 `WeatherPlugin::snapshot`），跟桌面版的純文字
  // panel（`/api/panel/weather/stream`）是兩條獨立的路——桌面版刻意維持純
  // ASCII 等寬表格（見 `weather.rs` `classify()` 的說明：emoji 寬度在終端機/
  // 瀏覽器不保證一致），tablet 是獨立頁面，不受這個限制，可以放心用圖示／
  // CSS 動畫。
  const WEATHER_POLL_MS = 8000;

  // 11 種天氣分類（跟 `weather.rs` 的 `classify()` 一一對應）各自的中文標籤、
  // 背景漸層色、跟要疊加的動態效果（`buildWeatherBackground` 用）。
  const WEATHER_LABELS = {
    sunny: "晴天",
    "partly-cloudy": "多雲時晴",
    cloudy: "多雲",
    overcast: "陰天",
    fog: "有霧",
    showers: "短暫陣雨",
    rain: "下雨",
    snow: "下雪",
    thunderstorm: "雷雨",
    "ice-pellets": "凍雨",
    unknown: "天氣不明",
  };
  const WEATHER_GRADIENTS = {
    sunny: "linear-gradient(160deg, #ffb347 0%, #ff8a3d 55%, #ff6f61 100%)",
    "partly-cloudy": "linear-gradient(160deg, #7fb7e8 0%, #a9c9e8 45%, #f0c869 100%)",
    cloudy: "linear-gradient(160deg, #8a97a8 0%, #6b7789 100%)",
    overcast: "linear-gradient(160deg, #5c6472 0%, #3a4150 100%)",
    fog: "linear-gradient(160deg, #c3c9d1 0%, #9aa2ac 100%)",
    showers: "linear-gradient(160deg, #5c7a9e 0%, #34506b 100%)",
    rain: "linear-gradient(160deg, #44607e 0%, #223245 100%)",
    snow: "linear-gradient(160deg, #d8e6f2 0%, #a9c1d6 100%)",
    thunderstorm: "linear-gradient(160deg, #34364a 0%, #14151f 100%)",
    "ice-pellets": "linear-gradient(160deg, #c3d8e4 0%, #90aabd 100%)",
    unknown: "linear-gradient(160deg, #6b7280 0%, #4a5160 100%)",
  };
  const WEATHER_EFFECTS = {
    sunny: { sun: true },
    "partly-cloudy": { sun: true, clouds: 2 },
    cloudy: { clouds: 3 },
    overcast: { clouds: 4, dim: true },
    fog: { fogBands: 3 },
    showers: { rain: 12 },
    rain: { rain: 24 },
    snow: { snow: 20 },
    thunderstorm: { rain: 20, lightning: true, dim: true },
    "ice-pellets": { snow: 14, fast: true },
    unknown: { clouds: 2 },
  };

  // 疊加在 `.weather-bg` 上的動態效果：雲飄移／霧飄移／雨滴落下／雪花飄落／
  // 太陽光暈脈動／雷雨閃光，都是純 CSS `@keyframes` 動畫，這裡只負責依
  // `WEATHER_EFFECTS[category]` 決定要不要建立、建幾個，每個粒子的位置/
  // 速度/延遲用 `Math.random()` 錯開，才不會所有雨滴/雪花同步落下看起來
  // 假假的。
  function buildWeatherBackground(category) {
    const bg = document.createElement("div");
    bg.className = "weather-bg" + (WEATHER_EFFECTS[category]?.dim ? " weather-bg-dim" : "");
    bg.style.background = WEATHER_GRADIENTS[category] || WEATHER_GRADIENTS.unknown;
    const effects = WEATHER_EFFECTS[category] || {};

    if (effects.sun) {
      const glow = document.createElement("div");
      glow.className = "weather-sun-glow";
      bg.appendChild(glow);
    }
    if (effects.clouds) {
      for (let i = 0; i < effects.clouds; i++) {
        const cloud = document.createElement("div");
        cloud.className = "weather-cloud";
        cloud.style.top = `${10 + Math.random() * 55}%`;
        cloud.style.transform = `scale(${0.6 + Math.random() * 0.8})`;
        cloud.style.opacity = String(0.3 + Math.random() * 0.35);
        cloud.style.animationDuration = `${40 + Math.random() * 40}s`;
        cloud.style.animationDelay = `-${Math.random() * 40}s`;
        bg.appendChild(cloud);
      }
    }
    if (effects.fogBands) {
      for (let i = 0; i < effects.fogBands; i++) {
        const band = document.createElement("div");
        band.className = "weather-fog-band";
        band.style.top = `${15 + i * 28}%`;
        band.style.animationDuration = `${16 + Math.random() * 10}s`;
        band.style.animationDelay = `-${Math.random() * 20}s`;
        bg.appendChild(band);
      }
    }
    if (effects.rain) {
      for (let i = 0; i < effects.rain; i++) {
        const drop = document.createElement("div");
        drop.className = "weather-drop";
        drop.style.left = `${Math.random() * 100}%`;
        drop.style.animationDuration = `${0.5 + Math.random() * 0.4}s`;
        drop.style.animationDelay = `-${Math.random() * 2}s`;
        bg.appendChild(drop);
      }
    }
    if (effects.snow) {
      for (let i = 0; i < effects.snow; i++) {
        const flake = document.createElement("div");
        flake.className = "weather-flake";
        const dur = effects.fast ? 2 + Math.random() : 4 + Math.random() * 3;
        flake.style.left = `${Math.random() * 100}%`;
        flake.style.width = flake.style.height = `${3 + Math.random() * 3}px`;
        flake.style.animationDuration = `${dur}s`;
        flake.style.animationDelay = `-${Math.random() * dur}s`;
        bg.appendChild(flake);
      }
    }
    if (effects.lightning) {
      const flash = document.createElement("div");
      flash.className = "weather-flash";
      bg.appendChild(flash);
    }
    return bg;
  }

  // 11 種天氣分類的圖示，統一用 `0 0 100 100` viewBox、單色（`currentColor`，
  // 由外層 CSS 的 `color` 決定），共用一個「雲」形狀（幾個橢圓/圓形疊在一起，
  // 同色填滿看起來就是一整片雲，不用刻真正的雲朵貝茲曲線）。
  const WEATHER_CLOUD_SHAPE =
    '<ellipse cx="38" cy="60" rx="24" ry="16"/><circle cx="60" cy="46" r="18"/><circle cx="42" cy="38" r="14"/><rect x="24" y="52" width="52" height="22" rx="11"/>';
  const WEATHER_STROKE_BASE = 'fill="none" stroke="currentColor" stroke-linecap="round"';

  function weatherIconWrap(inner) {
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }
  function weatherSunRays(count, innerR, outerR, cx, cy) {
    let s = "";
    for (let i = 0; i < count; i++) {
      s += `<line x1="${cx}" y1="${cy - outerR}" x2="${cx}" y2="${cy - innerR}" transform="rotate(${(360 / count) * i} ${cx} ${cy})"/>`;
    }
    return s;
  }
  function weatherRainLines(xs, y1, y2) {
    return xs.map((x) => `<line x1="${x}" y1="${y1}" x2="${x - 6}" y2="${y2}"/>`).join("");
  }
  function weatherSnowflakes(xs, cy, r) {
    let s = "";
    for (const cx of xs) {
      for (let i = 0; i < 3; i++) {
        s += `<line x1="${cx}" y1="${cy - r}" x2="${cx}" y2="${cy + r}" transform="rotate(${i * 60} ${cx} ${cy})"/>`;
      }
    }
    return s;
  }
  function weatherPellets(xs, cy, r) {
    return xs.map((x) => `<circle cx="${x}" cy="${cy}" r="${r}"/>`).join("");
  }

  function weatherIconSvg(category) {
    const cloud = `<g fill="currentColor">${WEATHER_CLOUD_SHAPE}</g>`;
    switch (category) {
      case "sunny":
        return weatherIconWrap(
          `<g class="weather-icon-sun-rays" ${WEATHER_STROKE_BASE} stroke-width="6">${weatherSunRays(8, 26, 38, 50, 50)}</g>` +
            `<circle cx="50" cy="50" r="22" fill="currentColor"/>`,
        );
      case "partly-cloudy":
        return weatherIconWrap(
          `<g class="weather-icon-sun-rays" ${WEATHER_STROKE_BASE} stroke-width="5">${weatherSunRays(8, 16, 26, 40, 38)}</g>` +
            `<circle cx="40" cy="38" r="14" fill="currentColor"/>` +
            `<g fill="currentColor" transform="translate(8,10)">${WEATHER_CLOUD_SHAPE}</g>`,
        );
      case "cloudy":
        return weatherIconWrap(`<g fill="currentColor" opacity="0.55" transform="translate(-10,-14) scale(0.85)">${WEATHER_CLOUD_SHAPE}</g>${cloud}`);
      case "overcast":
        return weatherIconWrap(
          `<g fill="currentColor" opacity="0.5" transform="translate(-12,-16) scale(0.85)">${WEATHER_CLOUD_SHAPE}</g>` +
            `<g fill="currentColor" opacity="0.85">${WEATHER_CLOUD_SHAPE}</g>`,
        );
      case "fog":
        return weatherIconWrap(
          `<g fill="currentColor" opacity="0.7" transform="translate(0,-10) scale(1,0.85)">${WEATHER_CLOUD_SHAPE}</g>` +
            `<g ${WEATHER_STROKE_BASE} stroke-width="4"><line x1="20" y1="82" x2="80" y2="82"/><line x1="26" y1="90" x2="74" y2="90"/></g>`,
        );
      case "showers":
        return weatherIconWrap(`${cloud}<g ${WEATHER_STROKE_BASE} stroke-width="5">${weatherRainLines([40, 60], 76, 90)}</g>`);
      case "rain":
        return weatherIconWrap(`${cloud}<g ${WEATHER_STROKE_BASE} stroke-width="5">${weatherRainLines([32, 50, 68], 76, 92)}</g>`);
      case "snow":
        return weatherIconWrap(`${cloud}<g ${WEATHER_STROKE_BASE} stroke-width="4">${weatherSnowflakes([34, 50, 66], 84, 7)}</g>`);
      case "thunderstorm":
        return weatherIconWrap(
          `<g fill="currentColor" opacity="0.85">${WEATHER_CLOUD_SHAPE}</g>` +
            `<g ${WEATHER_STROKE_BASE} stroke-width="5">${weatherRainLines([30, 68], 76, 90)}</g>` +
            `<path d="M56 58 L42 82 L52 82 L44 100 L68 72 L54 72 Z" fill="currentColor"/>`,
        );
      case "ice-pellets":
        return weatherIconWrap(`${cloud}<g fill="currentColor">${weatherPellets([34, 50, 66], 84, 4)}</g>`);
      default:
        return weatherIconWrap(`${cloud}<text x="50" y="90" font-size="22" text-anchor="middle" fill="currentColor">?</text>`);
    }
  }

  // 一排小圖示（今天剩下的時段／未來預報），`kind` 決定溫度怎麼顯示
  // （單一氣溫 vs 氣溫範圍）跟沒有資料時的提示文字。
  function renderWeatherForecastRow(rowEl, items, kind) {
    rowEl.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "weather-forecast-empty";
      empty.textContent = kind === "hour" ? "(今天沒有更多預報時段)" : "(沒有未來預報資料)";
      rowEl.appendChild(empty);
      return;
    }
    const track = document.createElement("div");
    track.className = "weather-forecast-track";
    for (const item of items) {
      const el = document.createElement("div");
      el.className = "weather-forecast-item";
      const icon = document.createElement("span");
      icon.className = "weather-forecast-icon";
      icon.innerHTML = weatherIconSvg(item.category);
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.label;
      const temp = document.createElement("span");
      temp.className = "temp";
      temp.textContent = kind === "hour" ? `${item.temp_c}°` : `${item.min_c}~${item.max_c}°`;
      const rain = document.createElement("span");
      rain.className = "rain";
      rain.textContent = `${item.chance_of_rain}%`;
      el.appendChild(icon);
      el.appendChild(label);
      el.appendChild(temp);
      el.appendChild(rain);
      track.appendChild(el);
    }
    rowEl.appendChild(track);
  }

  // 建立 weather 分頁：定期打 `/api/weather/list` 拿目前所有地點的結構化天氣
  // 資料，左側清單點哪個地區、右側大圖就換成那個地區的圖示／背景／預報，
  // `selectedKey` 跨每一輪 poll 保留（除非那個地區被移除了才退回清單第一個）。
  // 回傳 `stop` 函式，切分頁時清掉 interval。
  function startWeatherTab(container) {
    const wrap = document.createElement("div");
    wrap.className = "weather-body";
    const sidebar = document.createElement("div");
    sidebar.className = "weather-sidebar";
    const main = document.createElement("div");
    main.className = "weather-main";
    wrap.appendChild(sidebar);
    wrap.appendChild(main);
    container.appendChild(wrap);

    let stopped = false;
    let locations = [];
    let selectedKey = null;

    function renderSidebar() {
      sidebar.innerHTML = "";
      for (const loc of locations) {
        const row = document.createElement("div");
        row.className = "weather-loc-row" + (loc.key === selectedKey ? " selected" : "");
        const icon = document.createElement("span");
        icon.className = "weather-loc-icon";
        icon.innerHTML = weatherIconSvg(loc.now ? loc.now.category : "unknown");
        const name = document.createElement("span");
        name.className = "weather-loc-name";
        name.textContent = loc.place;
        const temp = document.createElement("span");
        temp.className = "weather-loc-temp";
        temp.textContent = loc.now ? `${loc.now.temp_c}°` : "…";
        row.appendChild(icon);
        row.appendChild(name);
        row.appendChild(temp);
        row.addEventListener("click", () => {
          selectedKey = loc.key;
          renderSidebar();
          renderMain();
        });
        sidebar.appendChild(row);
      }
    }

    function renderMain() {
      main.innerHTML = "";
      const loc = locations.find((l) => l.key === selectedKey);
      if (!loc) return;
      const category = loc.now ? loc.now.category : "unknown";
      main.appendChild(buildWeatherBackground(category));

      const hero = document.createElement("div");
      hero.className = "weather-hero";
      const icon = document.createElement("div");
      icon.className = "weather-hero-icon";
      icon.innerHTML = weatherIconSvg(category);
      hero.appendChild(icon);

      if (loc.status) {
        const desc = document.createElement("div");
        desc.className = "weather-hero-desc";
        desc.textContent = loc.status;
        hero.appendChild(desc);
        main.appendChild(hero);
        return;
      }

      const time = document.createElement("div");
      time.className = "weather-hero-time";
      time.textContent = `當地時間 ${loc.now.local_time}`;
      const temp = document.createElement("div");
      temp.className = "weather-hero-temp";
      temp.textContent = `${loc.now.temp_c}°C`;
      const desc = document.createElement("div");
      desc.className = "weather-hero-desc";
      desc.textContent = WEATHER_LABELS[category] || category;
      const sub = document.createElement("div");
      sub.className = "weather-hero-sub";
      sub.textContent = `體感 ${loc.now.feels_like_c}° · 濕度 ${loc.now.humidity}% · 降雨機率 ${loc.now.chance_of_rain}%`;
      hero.appendChild(time);
      hero.appendChild(temp);
      hero.appendChild(desc);
      hero.appendChild(sub);
      main.appendChild(hero);

      const todaySection = document.createElement("div");
      todaySection.className = "weather-forecast-section";
      const todayLabel = document.createElement("div");
      todayLabel.className = "weather-forecast-label";
      todayLabel.textContent = "今天";
      const todayRow = document.createElement("div");
      todayRow.className = "weather-forecast-row";
      todaySection.appendChild(todayLabel);
      todaySection.appendChild(todayRow);
      main.appendChild(todaySection);
      renderWeatherForecastRow(todayRow, loc.today, "hour");

      const daysSection = document.createElement("div");
      daysSection.className = "weather-forecast-section";
      const daysLabel = document.createElement("div");
      daysLabel.className = "weather-forecast-label";
      daysLabel.textContent = "未來預報";
      const daysRow = document.createElement("div");
      daysRow.className = "weather-forecast-row";
      daysSection.appendChild(daysLabel);
      daysSection.appendChild(daysRow);
      main.appendChild(daysSection);
      renderWeatherForecastRow(daysRow, loc.days, "day");
    }

    async function poll() {
      if (stopped) return;
      try {
        const res = await fetch("/api/weather/list");
        locations = await res.json();
      } catch (_err) {
        return; // 這次沒抓到就算了，下一輪 poll 再試。
      }
      if (selectedKey === null || !locations.some((l) => l.key === selectedKey)) {
        selectedKey = locations.length > 0 ? locations[0].key : null;
      }
      renderSidebar();
      renderMain();
    }

    poll();
    const intervalId = setInterval(poll, WEATHER_POLL_MS);

    return function stop() {
      stopped = true;
      clearInterval(intervalId);
    };
  }

  // 建立 ereader 分頁：書架（`GET /api/ereader/books`）跟閱讀畫面
  // （`<iframe>` 直接指向 `GET /api/ereader/book/{name}/resource/{章節內部
  // 路徑}`）用同一個容器裡的兩個 div 切換顯示/隱藏，不是像 weather 分頁
  // 那樣側欄＋主畫面並排——閱讀需要的是全部寬度，側欄常駐反而浪費空間。
  // 章節 XHTML 裡原有的相對路徑（圖片/CSS/字型）瀏覽器會自動解析到對應的
  // `/resource/...` URL（因為這個端點的 URL 路徑刻意跟 epub 內部路徑一樣，
  // 見 `src/plugins/ereader.rs` 的說明），完全不需要改寫 HTML 內容，直式書
  // 的 `writing-mode: vertical-rl` 因此也天然就會生效。跟桌面版
  // `startEreader` 是同一套邏輯（各自一份程式碼，不共用模組），回傳 `stop`
  // 函式，切分頁時呼叫，清掉 interval，不留背景在跑。
  function startEreaderTab(container) {
    const wrap = document.createElement("div");
    wrap.className = "ereader-body";
    // 「好讀下載」開一個內嵌 `<iframe>` 連到 haodoo.net（該站沒有擋
    // X-Frame-Options/CSP frame-ancestors，實測可以內嵌），使用者可以在
    // 這個 panel 裡直接瀏覽/搜尋書籍；但好讀的下載按鈕是
    // `<input onClick="DownloadEpub(...)">`，不是普通連結，而且它是跨
    // 網域的 iframe，瀏覽器的 same-origin policy 完全不允許我們的 JS 讀取
    // 或監聽 iframe 內部的任何點擊/網址變化，所以沒辦法真的做到「使用者在
    // iframe 裡按下載、我們自動攔截」。折衷做法：使用者在好讀裡找到書籍後
    // 把該書「詳細頁」的網址複製貼上到下面的欄位（那是一般 `<a href>`
    // 連結，iframe 裡右鍵一樣能複製連結網址），按下「下載」由後端
    // （`crate::plugins::haodoo_import`）直接抓 epub 存進
    // `storage/ebooks/`，不用自己先存到本機再手動上傳一輪。「上傳電子書」
    // 保留給不是從好讀來的檔案（例如其他來源的 epub），走本機檔案選擇 +
    // fetch，跟 storage 分頁的上傳是同一套模式。
    const toolbar = document.createElement("div");
    toolbar.className = "ereader-shelf-toolbar";
    const haodooBtn = document.createElement("button");
    haodooBtn.textContent = "🌐 好讀下載";
    haodooBtn.title = "在這個 panel 裡瀏覽好讀（haodoo.net），貼上書籍網址直接下載進書架";
    const uploadBtn = document.createElement("button");
    uploadBtn.textContent = "⬆ 上傳電子書";
    const uploadInput = document.createElement("input");
    uploadInput.type = "file";
    uploadInput.accept = ".epub";
    uploadInput.style.display = "none";
    uploadBtn.addEventListener("click", () => uploadInput.click());
    uploadInput.addEventListener("change", async () => {
      const file = uploadInput.files[0];
      if (!file) return;
      await fetch(`/api/ereader/upload/${encodeURIComponent(file.name)}`, { method: "POST", body: file });
      uploadInput.value = "";
      refreshShelf();
    });
    toolbar.appendChild(haodooBtn);
    toolbar.appendChild(uploadBtn);
    toolbar.appendChild(uploadInput);

    const shelf = document.createElement("div");
    shelf.className = "ereader-shelf";
    const readerView = document.createElement("div");
    readerView.className = "ereader-reader";
    readerView.style.display = "none";

    const haodooView = document.createElement("div");
    haodooView.className = "ereader-haodoo";
    haodooView.style.display = "none";
    const haodooBar = document.createElement("div");
    haodooBar.className = "ereader-shelf-toolbar";
    const haodooBackBtn = document.createElement("button");
    haodooBackBtn.textContent = "‹ 返回書架";
    const haodooUrlInput = document.createElement("input");
    haodooUrlInput.type = "text";
    haodooUrlInput.placeholder = "貼上好讀書籍詳細頁網址（https://haodoo.net/?M=book&P=...）";
    const haodooVerticalLabel = document.createElement("label");
    const haodooVerticalCheckbox = document.createElement("input");
    haodooVerticalCheckbox.type = "checkbox";
    haodooVerticalLabel.appendChild(haodooVerticalCheckbox);
    haodooVerticalLabel.appendChild(document.createTextNode(" 直式"));
    const haodooDownloadBtn = document.createElement("button");
    haodooDownloadBtn.textContent = "下載";
    const haodooStatus = document.createElement("span");
    haodooStatus.className = "ereader-haodoo-status";
    haodooBar.appendChild(haodooBackBtn);
    haodooBar.appendChild(haodooUrlInput);
    haodooBar.appendChild(haodooVerticalLabel);
    haodooBar.appendChild(haodooDownloadBtn);
    haodooBar.appendChild(haodooStatus);
    const haodooFrameWrap = document.createElement("div");
    haodooFrameWrap.className = "ereader-haodoo-frame-wrap";
    const haodooFrame = document.createElement("iframe");
    haodooFrame.className = "ereader-haodoo-frame";
    haodooFrameWrap.appendChild(haodooFrame);
    haodooView.appendChild(haodooBar);
    haodooView.appendChild(haodooFrameWrap);

    wrap.appendChild(toolbar);
    wrap.appendChild(shelf);
    wrap.appendChild(readerView);
    wrap.appendChild(haodooView);
    container.appendChild(wrap);

    let stopped = false;
    let current = null; // { name, meta }

    function showShelf() {
      current = null;
      readerView.style.display = "none";
      haodooView.style.display = "none";
      shelf.style.display = "";
    }

    function showReader() {
      shelf.style.display = "none";
      haodooView.style.display = "none";
      readerView.style.display = "flex";
    }

    function showHaodoo() {
      shelf.style.display = "none";
      readerView.style.display = "none";
      haodooView.style.display = "flex";
      // 第一次點才真的載入 iframe，不然使用者從沒用過這個功能也要背景載入
      // haodoo.net（拖慢 ereader panel 開啟速度、浪費對方頻寬）。
      if (!haodooFrame.src) {
        haodooFrame.src = "https://haodoo.net/";
      }
    }

    haodooBtn.addEventListener("click", showHaodoo);
    haodooBackBtn.addEventListener("click", showShelf);
    haodooDownloadBtn.addEventListener("click", async () => {
      const url = haodooUrlInput.value.trim();
      if (!url) return;
      haodooDownloadBtn.disabled = true;
      haodooStatus.textContent = "下載中…";
      try {
        const res = await fetch("/api/ereader/haodoo-import", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, vertical: haodooVerticalCheckbox.checked }),
        });
        if (res.ok) {
          const data = await res.json();
          haodooStatus.textContent = `已加入書架：${data.name}`;
          haodooUrlInput.value = "";
          refreshShelf();
        } else {
          haodooStatus.textContent = await res.text();
        }
      } catch (_err) {
        haodooStatus.textContent = "下載失敗，確認網路連線後再試一次";
      } finally {
        haodooDownloadBtn.disabled = false;
      }
    });

    function renderShelf(books) {
      shelf.innerHTML = "";
      if (books.length === 0) {
        const empty = document.createElement("div");
        empty.className = "ereader-empty";
        empty.textContent = "(storage/ebooks/ 底下還沒有任何 .epub 檔案，用上面的「上傳電子書」加一本進來)";
        shelf.appendChild(empty);
        return;
      }
      for (const b of books) {
        const row = document.createElement("div");
        row.className = "ereader-book-row";
        const cover = document.createElement("img");
        cover.className = "ereader-book-cover";
        cover.src = `/api/ereader/book/${encodeURIComponent(b.name)}/cover`;
        cover.addEventListener("error", () => {
          cover.style.visibility = "hidden";
        });
        const info = document.createElement("div");
        info.className = "ereader-book-info";
        const title = document.createElement("div");
        title.className = "ereader-book-title";
        title.textContent = b.title;
        const author = document.createElement("div");
        author.className = "ereader-book-author";
        author.textContent = b.author || "";
        const progress = document.createElement("div");
        progress.className = "ereader-book-progress";
        progress.textContent = `${b.progress_percent}%`;
        info.appendChild(title);
        info.appendChild(author);
        info.appendChild(progress);
        row.appendChild(cover);
        row.appendChild(info);
        row.addEventListener("click", () => openBook(b.name));
        shelf.appendChild(row);
      }
    }

    async function refreshShelf() {
      if (stopped) return;
      try {
        const res = await fetch("/api/ereader/books");
        renderShelf(await res.json());
      } catch (_err) {
        // 這次沒抓到就算了，下一輪 poll 再試。
      }
    }

    function resourceUrl(name, href) {
      const encodedPath = href.split("/").map(encodeURIComponent).join("/");
      return `/api/ereader/book/${encodeURIComponent(name)}/resource/${encodedPath}`;
    }

    async function openBook(name) {
      try {
        const res = await fetch(`/api/ereader/book/${encodeURIComponent(name)}/meta`);
        if (!res.ok) return;
        current = { name, meta: await res.json() };
        renderReader();
        showReader();
      } catch (_err) {
        // 打不開就留在書架，不用特別報錯干擾畫面。
      }
    }

    // 章節內的分頁狀態：後端的章節內容已經被 `inject_pagination_style`
    // （見 `src/plugins/ereader.rs`）插入多欄排版 CSS，瀏覽器會自動把整章
    // 內容依視窗大小切成一頁一頁；這裡只負責「捲到第幾頁」跟「量出這一章
    // 總共幾頁」，不用自己計算怎麼分頁。跟桌面版 `startEreader` 是同一套
    // 邏輯（各自一份程式碼，不共用模組）。
    let pageIndex = 0;
    let pageCount = 1;
    let pageStep = 1;
    let chapterVertical = false;
    let pageMarkers = null;
    let verticalPageTarget = null;
    let measurementToken = 0;
    let chapterLoadInFlight = false;
    let frameEl = null;
    let titleEl = null;
    let resizeObserver = null;
    let touchStartX = null;
    let suppressNextClick = false;

    // 字級調整：存在 `localStorage`（不是伺服器端），關掉分頁/重新整理
    // 瀏覽器都還記得上次調到多大，跟這本書、這一章都無關，是使用者對這個
    // 瀏覽器/裝置的個人偏好。
    const FONT_SCALE_STORAGE_KEY = "cng5-ereader-font-scale";
    const FONT_SCALE_MIN = 0.7;
    const FONT_SCALE_MAX = 2;
    const FONT_SCALE_STEP = 0.1;
    let fontScale = (() => {
      const stored = parseFloat(localStorage.getItem(FONT_SCALE_STORAGE_KEY));
      return Number.isFinite(stored) && stored >= FONT_SCALE_MIN && stored <= FONT_SCALE_MAX ? stored : 1;
    })();

    function pageWidth() {
      return (frameEl && frameEl.contentWindow && frameEl.contentWindow.innerWidth) || frameEl.clientWidth || 1;
    }

    // 章節每次都是全新的 iframe 文件（換章節等於整份文件重新載入），這裡
    // 先把「這份文件原本、還沒被我們動過」的字級記在 `body` 的
    // `data-` 屬性上（只在文件第一次套用時量一次），之後不管字級調整幾次
    // 都是以這個原始值為基準乘上目前的縮放倍率，不會因為連續調整而複合
    // 疊加（例如放大兩次不會變成 1.1 x 1.1，而是單純的 1 + 2 * 0.1）。
    function applyFontScale(doc) {
      const body = doc.body;
      if (!body) return;
      if (!body.dataset.cng5BaseFontSize) {
        const natural = parseFloat(doc.defaultView.getComputedStyle(body).fontSize);
        body.dataset.cng5BaseFontSize = String(Number.isFinite(natural) && natural > 0 ? natural : 16);
      }
      const base = parseFloat(body.dataset.cng5BaseFontSize);
      body.style.setProperty("font-size", `${base * fontScale}px`, "important");
    }

    // 字級改變會動到每行能放幾個字/欄裡能塞幾行，分頁邊界整個要重算——跟
    // 面板拖拉縮放大小是同一種情況，直接借用 `recomputeAfterResize`
    // 「保留目前讀到大概幾成的位置、重新分頁」那套邏輯，不用重複寫一次。
    function changeFontScale(delta) {
      const next = Math.min(FONT_SCALE_MAX, Math.max(FONT_SCALE_MIN, Math.round((fontScale + delta) * 10) / 10));
      if (next === fontScale) return;
      fontScale = next;
      localStorage.setItem(FONT_SCALE_STORAGE_KEY, String(fontScale));
      const doc = frameEl && frameEl.contentDocument;
      if (!doc || !doc.body) return;
      applyFontScale(doc);
      recomputeAfterResize();
    }

    function updateToolbarText() {
      if (!titleEl || !current) return;
      const { meta } = current;
      titleEl.textContent =
        `${meta.title} · 第 ${meta.current_chapter + 1}/${meta.spine.length} 章 · ` +
        `第 ${pageIndex + 1}/${pageCount} 頁 · ${meta.progress_percent}%`;
    }

    // 依 `writing-mode` 判斷這一章是橫式還是直式，套用完全不同的量測方式
    // （見 `measureHorizontalChapter`/`measureVerticalChapter` 各自的說明，
    // 兩者不能共用同一套邏輯——`inject_pagination_style` 對兩種書套用的
    // CSS 完全不同）。回傳 `{ pageStep, pageCount }`：`pageStep` 是捲一頁要
    // 移動多少像素，`pageCount` 是這一章總共幾頁。
    function measureChapter(doc) {
      const cs = doc.defaultView.getComputedStyle(doc.body);
      const writingMode = cs.writingMode || "";
      const vertical = writingMode.indexOf("vertical") === 0;
      const result = vertical ? measureVerticalChapter(doc) : measureHorizontalChapter(doc, cs);
      return Object.assign({ vertical }, result);
    }

    // 換頁/換章節/resize 之後捲到指定頁的共用邏輯：直式書不能用
    // `window.scrollTo()`/`scrollIntoView`——這兩個都是在操作
    // `document.scrollingElement`（通常是 `<html>`），但直式書真正溢位的
    // 元素是 `body`（`body` 自己被設成 `overflow:hidden`，它自己的內容比
    // 自己的版面寬，這個溢位是 `body` 自己局部的捲動範圍，不是傳到最外層
    // 視窗），橫式書能用 `window.scrollTo()` 是因為那是多欄排版
    // （`column-width`）的溢位，多欄排版的欄位溢位規則本來就會傳到最外層
    // 視窗，跟這裡的一般區塊排版溢位是不同機制——這是實測畫面截圖才抓到
    // 的：console 印出來的 `scrollX`／算出來的頁碼都對，畫面卻還是停在
    // 第一頁沒有動，代表 `window.scrollTo()` 根本沒捲到真正在溢位、真正
    // 決定畫面顯示什麼的那個元素。改成直接設 `body.scrollLeft`（順便也設
    // `documentElement.scrollLeft`，兩個都設，不用猜到底哪一個才是真正
    // 生效的那個）。量出標記目前實際顯示在畫面的哪個位置
    // （`getBoundingClientRect()`，這一定準，不受任何捲動座標系正負號慣例
    // 影響），量出「應該對齊到視窗右邊」（這是量出來的——整章一開始完全
    // 沒捲動過的預設狀態，內容右邊界本來就跟視窗右邊界切齊，見
    // `measureVerticalChapter` 的討論）的距離，套用那個差值；如果套用後
    // 方向反了（不同瀏覽器對 `scrollLeft` 正負號的慣例本來就不統一），再
    // 往反方向修正一次——全部基於量出來的相對距離，不假設任何特定瀏覽器的
    // 正負號慣例。橫式書維持原本用 `window.scrollTo()`（CSS 多欄排版本身
    // 保證欄界對齊整行，見 `measureHorizontalChapter` 的說明，而且已經
    // 確認橫式書這樣做是正確的）。
    function scrollToPage(doc, index) {
      if (chapterVertical) {
        const marker = pageMarkers && pageMarkers[index];
        if (marker) {
          const html = doc.documentElement;
          const body = doc.body;
          const setScroll = (value) => {
            html.scrollLeft = value;
            body.scrollLeft = value;
          };
          // 最後一頁不能比照其他頁「把標記對齊到 target」：實測過，這一頁
          // 剩下的內容常常不到一整頁寬，硬要把標記對齊到跟其他頁一樣的
          // 位置，會逼近（甚至超過）瀏覽器真正可以捲動的最大範圍，捲動
          // 幅度卡在半路就不再前進，導致這一章最後一小段內容整個露在畫面
          // 外看不到（不是分頁算錯，是捲動幅度不夠遠）。改成直接把
          // `body` 自己的左邊界（也就是整章真正結尾的位置）貼齊畫面左邊
          // （目標 0），這樣最後一頁永遠看得到整章結尾，代價最多是跟前一
          // 頁多疊一點點內容——寧可多看幾行重複，也不要漏掉結尾。
          const isLastPage = index === pageCount - 1;
          const target = isLastPage ? 0 : verticalPageTarget !== null ? verticalPageTarget : pageWidth();
          const readPos = () => (isLastPage ? body.getBoundingClientRect().left : marker.getBoundingClientRect().right);
          // 一次量測、套用就結束不夠準——實測連續兩頁之間會殘留幾行重複
          // 內容，代表捲動落點跟量出來的目標差了一點點（可能是瀏覽器剛
          // 套用捲動位置那一刻，geometry 還沒完全跟捲動同步）。改成反覆
          // 量測、修正最多幾次，每次都重新讀當下實際位置，直到誤差小到
          // 可以接受、或是已經修正到位置不再變化為止。
          for (let i = 0; i < 6; i++) {
            const before = readPos();
            const diff = before - target;
            if (Math.abs(diff) < 1) break;
            const startX = html.scrollLeft || body.scrollLeft || 0;
            setScroll(startX + diff);
            const after = readPos();
            if (Math.abs(after - before) < 0.5) {
              // 完全沒反應：這個正負號被夾住了（不同瀏覽器對 scrollLeft
              // 正負號慣例不一致），換相反方向再試一次。
              setScroll(startX - diff);
            }
          }
        }
        return;
      }
      doc.defaultView.scrollTo({ left: index * pageStep, top: 0 });
      // 防禦性補強：`window.scrollTo()` 操作的是 `document.scrollingElement`
      // （通常是 `<html>`），但實測抓到有些書的 `<html>` 自己完全沒有可
      // 捲動範圍（`scrollWidth` 等於 `clientWidth`），真正因為多欄排版而
      // 溢位、需要捲動的其實是 `body` 自己（`body` 自己就有
      // `overflow:hidden`，形成獨立、局部的捲動範圍，不會往外傳給
      // `<html>`）——這種情況下 `window.scrollTo()` 完全捲不動（陷面碼
      // 照樣往前算，畫面卻停在原地不動，翻到下一章才會變）。直接設
      // `body.scrollLeft`（同時也設 `html.scrollLeft`，以防某些書是後者
      // 才有效）。這裡驗證要讀 `body.scrollLeft` 本身，不能像量直式書那樣
      // 讀某個子元素的 `getBoundingClientRect()`——`body` 自己的
      // `getBoundingClientRect()` 反映的是它在外層（`<html>`）裡的位置，
      // 捲動 `body` 自己內部的內容並不會改變這個位置，之前這裡量錯元素，
      // 才會誤判成「怎麼設都沒反應」。
      const html = doc.documentElement;
      const body = doc.body;
      const target = index * pageStep;
      if (Math.abs(body.scrollLeft - target) > 0.5) {
        body.scrollLeft = target;
      }
      if (Math.abs(html.scrollLeft - target) > 0.5) {
        html.scrollLeft = target;
      }
    }

    // 橫式書：`inject_pagination_style` 插入的多欄排版 CSS 讓每一欄本來就
    // 剛好是一個畫面寬（`column-width: 100vw`），欄與欄的邊界一定落在整行
    // 文字的邊界上（多欄排版的換行機制保證），捲一頁固定是整個畫面寬
    // （`pageWidth()`），不需要額外取整。但「一欄裡塞了幾行」不保證剛好
    // 用滿整個畫面高，這裡要另外算出往下取整到整數倍行高的 `pageHeight`，
    // 設回 `<html>`/`<body>`（inline style 加 `!important`，蓋過
    // `inject_pagination_style` 插入的 `height: 100vh !important`，同源
    // `!important` inline style 的優先度比外部/內嵌樣式表高），不然版面
    // 最下面會卡進一行只露出上半截的文字。
    //
    // 算總共幾頁不能直接量已經分欄後的 `body.scrollWidth`：多欄排版遇到
    // 內容比一個畫面高時要「長」出額外欄位才能繼續往下排，這件事依賴
    // body 自己的寬度不能被釘死（見 `inject_pagination_style` 的說明），
    // 一旦欄位長不出來，`scrollWidth` 量到的永遠是「只有一頁」。改成暫時
    // 關掉多欄排版，量攤平單欄版面的 `scrollHeight`——這是最基本的區塊
    // 排版，不牽涉任何多欄溢位的實作細節，各瀏覽器算出來的數字完全一致，
    // 可靠得多；量完立刻把多欄排版接回來（`removeProperty` 讓
    // `inject_pagination_style` 插入的 stylesheet 規則重新生效），中間
    // 量測那一瞬間畫面會閃過一次單欄版面，但只有一個畫面更新週期，肉眼
    // 看不出來。
    // `line-height` 沒被書本身的 CSS 明確設成數字時（很多 epub 根本沒設這
    // 個屬性），`getComputedStyle` 回傳的是字面上的 `"normal"` 字串，不是
    // 解析過的像素數字，`parseFloat("normal")` 會得到 `NaN`，導致量測整個
    // 失敗、退回「當作只有一頁」——這正是直式書明明 `scrollWidth` 量得到
    // 一大堆內容、卻還是判斷成只有一頁的真正原因。用一個隱藏的探測元素撐
    // 出「一行文字」實際佔用的像素間接量出來：`writing-mode` 是會繼承的
    // 屬性，探測元素接在 `body` 底下自然套用同一份樣式，量橫式書要看它的
    // 高度、量直式書要看它的寬度（直式書的行進方向是垂直，一行文字佔用的
    // 是水平方向的寬度）。
    function resolveLineHeightPx(doc, cs, vertical) {
      const raw = parseFloat(cs.lineHeight);
      if (!Number.isNaN(raw) && raw > 0) {
        return raw;
      }
      const probe = doc.createElement("span");
      probe.textContent = "永";
      probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;margin:0;padding:0;border:0;";
      doc.body.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      probe.remove();
      return vertical ? rect.width : rect.height;
    }

    function measureHorizontalChapter(doc, cs) {
      const body = doc.body;
      const lineHeight = resolveLineHeightPx(doc, cs, false);
      const paddingTop = parseFloat(cs.paddingTop) || 0;
      const paddingBottom = parseFloat(cs.paddingBottom) || 0;
      const paddingLeft = parseFloat(cs.paddingLeft) || 0;
      const paddingRight = parseFloat(cs.paddingRight) || 0;
      const columnGap = parseFloat(cs.columnGap) || 0;
      const totalHeight = frameEl.clientHeight || 1;
      const usable = totalHeight - paddingTop - paddingBottom;
      // `column-width` 是 `box-sizing: border-box` 底下算的，`body` 自己
      // 又有左右 padding，實際能塞欄位內容的寬度比整個視窗窄（padding
      // 兩側的量）。`column-width` 設的是「理想」欄寬，比實際可用寬度還寬
      // 時，瀏覽器只能生出一欄剛好填滿實際可用寬度——也就是說每一欄真正
      // 的寬度其實是「視窗寬 - 左右 padding」，不是整個視窗寬。`padding`
      // 只加在整段欄位排版的最前/最後，不會每一欄之間重複出現，所以下一欄
      // 緊接著這一欄開始，若 `column-gap` 沒補上這段間距，下一欄的內容會
      // 提早露出來、疊在畫面右邊，造成「跑字」現象（CSS 端已把 `column-gap`
      // 設成跟 padding 一樣寬來擋住這個縫隙，這裡捲頁距離要一併算上這段
      // 間距，不然每次捲動的距離會少了這一截，翻頁會對不準）。
      const step = Math.max(1, pageWidth() - paddingLeft - paddingRight + columnGap);
      if (!lineHeight || Number.isNaN(lineHeight) || lineHeight <= 0 || usable <= 0) {
        return { pageStep: step, pageCount: 1 };
      }
      const linesPerPage = Math.max(1, Math.floor(usable / lineHeight));
      const pageHeight = linesPerPage * lineHeight + paddingTop + paddingBottom;

      body.style.setProperty("column-width", "auto", "important");
      body.style.setProperty("height", "auto", "important");
      const naturalHeight = body.scrollHeight;
      body.style.removeProperty("column-width");

      body.style.setProperty("height", `${pageHeight}px`, "important");
      doc.documentElement.style.setProperty("height", `${pageHeight}px`, "important");

      // 減一點點是為了吸收次像素等級的誤差，不會讓剛好整除的內容被誤判多
      // 算一頁空白頁；用 `ceil` 不是 `round`，多出來的一小段內容一定要算成
      // 獨立一頁，不能被捨去。
      const pageCount = Math.max(1, Math.ceil((naturalHeight - 0.5) / pageHeight));
      return { pageStep: step, pageCount };
    }

    // 捲一頁的距離不能靠「假設全章每一行等寬」去猜：章節內文常常混雜標題
    // （字比較大）跟內文（字比較小），統一行寬只是概算，跟瀏覽器實際排出
    // 來的行界有落差，而且這個落差是累加的——愈後面的頁面誤差愈大，最後
    // 甚至會整行、整段文字被跳過去（頁面邊界算得比實際內容還遠，捲動位置
    // 直接超過去，中間內容看不到）。改成直接用 `Range.getClientRects()`
    // 量出瀏覽器真正排出來的每一行（每個文字節點可能跨好幾個 rect，一個
    // rect 就是一行），依可用寬度把連續的行分組成一頁一頁，在每一頁的
    // 起點插入一個看不見的標記元素，翻頁時呼叫該標記的
    // `scrollIntoView()`——完全用瀏覽器自己量出來的真實幾何跟原生捲動
    // 邏輯，不會累積誤差，也不用另外處理 `scrollLeft` 方向慣例的問題（見
    // `scrollToPage` 的說明）。
    function clearPageMarkers() {
      if (!pageMarkers) return;
      for (const marker of pageMarkers) {
        const parent = marker && marker.parentNode;
        if (parent) {
          parent.removeChild(marker);
          parent.normalize();
        }
      }
      pageMarkers = null;
    }

    function collectVerticalLineSegments(doc) {
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
        acceptNode: (n) => (n.nodeValue && n.nodeValue.trim().length > 0 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP),
      });
      const segments = [];
      const range = doc.createRange();
      let node = walker.nextNode();
      while (node) {
        range.selectNodeContents(node);
        const rects = range.getClientRects();
        for (let i = 0; i < rects.length; i++) {
          const r = rects[i];
          if (r.width > 0 && r.height > 0) {
            segments.push({ node, rect: r });
          }
        }
        node = walker.nextNode();
      }
      // 由大到小：vertical-rl 的行進方向是由右到左，右邊界比較大的行在
      // 閱讀順序上比較前面。
      segments.sort((a, b) => b.rect.right - a.rect.right);
      return segments;
    }

    // 在指定文字節點裡二分搜尋，找出目標 rect（某一行）實際從第幾個字元
    // 開始——`getClientRects()` 只給幾何位置，不會直接告訴我們字元位移。
    // 不能用 caret 的 `top` 座標判斷：`top` 每次換行都會重置回接近 0，
    // 一個文字節點如果橫跨好幾行，`top` 不是全域單調遞增，二分搜尋依它
    // 找會找錯位置（這是這次翻頁「同一頁按下一頁卻幾乎沒動、後來又漏掉
    // 最後一頁」的真正原因）。直式書的行進方向是由右到左，`right` 座標
    // 才是全域單調遞減（同一行內不變，換到下一行才會變小），改用這個當
    // 比較依據。
    function findLineStartOffset(doc, node, rect) {
      const length = node.nodeValue.length;
      const probe = doc.createRange();
      const rectAt = (offset) => {
        probe.setStart(node, offset);
        probe.setEnd(node, offset);
        return probe.getClientRects()[0] || null;
      };
      const startRect = rectAt(0);
      if (startRect && Math.abs(startRect.right - rect.right) < 1) {
        return 0;
      }
      let lo = 0;
      let hi = length;
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        const r = rectAt(mid);
        if (!r) {
          hi = mid;
          continue;
        }
        if (r.right <= rect.right + 0.5) {
          hi = mid;
        } else {
          lo = mid + 1;
        }
      }
      return lo;
    }

    function computeVerticalPageBoundaries(doc, budget) {
      const segments = collectVerticalLineSegments(doc);
      if (segments.length === 0) return [];
      const boundarySegments = [segments[0]];
      let pageStartRight = segments[0].rect.right;
      for (let i = 1; i < segments.length; i++) {
        if (pageStartRight - segments[i].rect.right > budget) {
          boundarySegments.push(segments[i]);
          pageStartRight = segments[i].rect.right;
        }
      }
      // 先把每個邊界的字元位移都算好，再「從最後一頁往回」插標記：同一個
      // 文字節點如果橫跨好幾個頁面邊界（沒有段落分隔的長段落），
      // `Range.insertNode` 會把文字節點從插入點切成兩半，只影響插入點
      // 之後的部分，從比較後面的位移開始插，前面算好的位移才不會因為節點
      // 被切開而錯位。
      const offsets = boundarySegments.map((seg) => findLineStartOffset(doc, seg.node, seg.rect));
      const markers = new Array(boundarySegments.length);
      for (let i = boundarySegments.length - 1; i >= 0; i--) {
        const seg = boundarySegments[i];
        const marker = doc.createElement("span");
        marker.style.cssText = "display:inline-block;width:0;height:0;overflow:hidden;";
        const markerRange = doc.createRange();
        markerRange.setStart(seg.node, offsets[i]);
        markerRange.collapse(true);
        markerRange.insertNode(marker);
        markers[i] = marker;
      }
      return markers;
    }

    function measureVerticalChapter(doc) {
      clearPageMarkers();
      const cs = doc.defaultView.getComputedStyle(doc.body);
      const paddingLeft = parseFloat(cs.paddingLeft) || 0;
      const paddingRight = parseFloat(cs.paddingRight) || 0;
      const totalWidth = pageWidth();
      // 分組門檻不能直接用整個畫面寬：`body` 自己有 `padding`，內容真正能
      // 用的寬度要扣掉左右 padding，另外再扣一點點安全邊界（次像素捨入、
      // `scrollIntoView` 對齊時的些微誤差）——寧可讓某幾頁最後多留一點點
      // 空白，也不要讓分組塞進比畫面裝得下還多的內容，那樣會變成「翻頁
      // 翻到一半」還要再翻一次才是真的下一頁，最後一頁也會因為多出來的
      // 內容沒有下一個標記可以顯示，直接被跳過去。
      const budget = Math.max(1, totalWidth - paddingLeft - paddingRight - 4);
      pageMarkers = computeVerticalPageBoundaries(doc, budget);
      // 每一頁該對齊到畫面的哪個位置，不能直接用 `pageWidth()`（整個視窗
      // 寬）：章節一開始完全沒捲動過的預設狀態，第一行文字（含標題本身的
      // 字級/margin）本來就不是剛好切齊在視窗最右邊，而是內縮一段距離
      // （padding、標題自己的樣式）。這個「原本第一頁自然停在哪裡」的
      // 位置，才是其他每一頁都該對齊過去的目標——這裡趁章節剛載入、還沒
      // 被捲動過的這一刻量下來，直接用 `pageWidth()` 當目標，每一頁都會
      // 比正確位置多幾行的落差（少對齊到 padding／標題造成的內縮量）。
      verticalPageTarget = pageMarkers.length > 0 ? pageMarkers[0].getBoundingClientRect().right : pageWidth();
      return { pageCount: Math.max(1, pageMarkers.length) };
    }

    // iframe 換了新章節、真正排版完成之後才量得到正確的尺寸（`load` 事件
    // 本身可能早於樣式套用完成），用 `requestAnimationFrame` 保險等一個
    // 畫面週期；`measureHorizontalChapter` 改高度本身又會觸發一次新的
    // layout，所以再等一個畫面週期才捲到指定頁，不然捲動用的還是改高度
    // 之前的舊版面。`landing` 是這次要停在第幾頁：數字就直接用，`"last"`
    // 表示停在這章的最後一頁（從下一章往回翻的情境）。
    // 有些 epub 的 CSS 會用 app 專用的 `res://` 字型路徑（例如
    // `url(res:///system/fonts/...)`），瀏覽器根本讀不到，會先等一段字型
    // 載入逾時的時間才 fallback 回下一個字型；這段時間內量到的文字幾何
    // （`getClientRects()`）可能是還沒套用最終字型前的暫時排版，算出來的
    // 分頁邊界會不準——這正是「第一次開某一章分頁算錯，但重複測過的章節
    // 又正常」的原因（重複測過的章節，字型 fallback 早就穩定了）。用
    // `document.fonts.ready`（所有字型不管成功或失敗都確定下來才 resolve）
    // 卡住量測，等字型狀態穩定再排版，不能只靠 `requestAnimationFrame`
    // （那只保證畫面更新週期，不保證字型已經 fallback 完成）。
    //
    // `fonts.ready` 可能要等很久（`res://` 這種讀不到的字型，瀏覽器要等到
    // 逾時才 fallback，可能好幾秒），這段等待期間使用者很可能已經翻頁/換
    // 章節了——用 `measurementToken` 幫每一次呼叫編號，等到 promise/rAF
    // resolve 時如果編號已經跟目前最新的不一樣，就代表章節換過了，這次
    // 量測結果作廢，不能再拿舊章節（甚至已經被瀏覽器拆掉的舊 document）
    // 量出來的錯誤數字去蓋掉新章節剛設好的正確狀態，這正是「回上一章
    // 卻卡在只有一頁」的真正原因。
    function onFrameLoaded(landing) {
      const doc = frameEl.contentDocument;
      if (!doc || !doc.body) return;
      // 新章節是全新文件，套用目前的字級偏好，不然每換一章字級都會被
      // book 自己的原始 CSS 重設回去。
      applyFontScale(doc);
      const myToken = ++measurementToken;
      // 換章節這段期間（等字型穩定為止）標記起來，`recomputeAfterResize`
      // 看到這個標記就整個跳過，不會拿 `loadChapterAtPage` 剛重置、還沒被
      // 這裡填回正確答案的 `pageIndex=0`／`pageCount=1` 去算出錯誤的目標
      // 頁碼、搶著把捲動位置改回第一頁——這正是「回上一章卻卡在第一頁，
      // 不是最後一頁」的真正原因：`ResizeObserver` 觀察的容器（工具列文字
      // 長度改變、`updateToolbarText` 造成的版面微調）在換章節的過程中很
      // 容易被觸發，這個 resize 事件如果在字型穩定前就搶著跑完，就會用
      // 還沒設好的暫存值把正確結果蓋掉。
      chapterLoadInFlight = true;
      const fontsReady = (doc.fonts && doc.fonts.ready) || Promise.resolve();
      fontsReady.then(() => {
        if (myToken !== measurementToken) return;
        requestAnimationFrame(() => {
          if (myToken !== measurementToken) return;
          const measured = measureChapter(doc);
          requestAnimationFrame(async () => {
            if (myToken !== measurementToken) return;
            pageCount = measured.pageCount;
            pageStep = measured.pageStep || 1;
            chapterVertical = measured.vertical;
            pageIndex = landing === "last" ? pageCount - 1 : Math.min(Math.max(0, landing), pageCount - 1);
            // 實測過：剛載入章節直接跳到後面的頁碼（例如從下一章往回翻，
            // 落在這一章最後一頁）畫面會卡在第一頁不動，但同一章節內
            // 循序漸進按下一頁完全正常——代表問題不是分頁算錯或捲動方向
            // 錯，是瀏覽器對「剛載入的文件」的可捲動範圍判斷還沒跟上一次
            // 大跳躍的捲動（即使 `getBoundingClientRect()`/`scrollWidth`
            // 當下已經回報正確數字）。改成模擬使用者實際翻頁的路徑：先
            // 真的停在第一頁，一頁一頁循序捲到目標頁，讓瀏覽器逐步跟上。
            if (chapterVertical && pageIndex > 0) {
              scrollToPage(doc, 0);
              for (let i = 1; i <= pageIndex; i++) {
                await new Promise((resolve) => requestAnimationFrame(resolve));
                if (myToken !== measurementToken) return;
                scrollToPage(doc, i);
              }
            } else {
              scrollToPage(doc, pageIndex);
            }
            updateToolbarText();
            chapterLoadInFlight = false;
          });
        });
      });
    }

    // 面板被拖拉縮放時，`vw`/`vh` 單位讓瀏覽器自己重新排版（不需要我們
    // 插入任何新 CSS），但 `pageStep`／分頁數量／目前頁碼都是我們自己
    // 快取、依舊尺寸算出來的，要跟著重新算一次（`measureChapter`），並
    // 盡量停在同一個「讀到大概幾成」的位置（用比例換算到新的頁數，不是
    // 每次都跳回第一頁）。
    function recomputeAfterResize() {
      if (chapterLoadInFlight) return;
      const doc = frameEl && frameEl.contentDocument;
      if (!doc || !doc.body) return;
      const fraction = pageCount > 0 ? pageIndex / pageCount : 0;
      const measured = measureChapter(doc);
      requestAnimationFrame(() => {
        pageCount = measured.pageCount;
        pageStep = measured.pageStep || 1;
        chapterVertical = measured.vertical;
        pageIndex = Math.min(Math.round(fraction * pageCount), pageCount - 1);
        scrollToPage(doc, pageIndex);
        updateToolbarText();
      });
    }

    async function saveProgress(chapterIndex) {
      try {
        await fetch(`/api/ereader/book/${encodeURIComponent(current.name)}/progress`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chapter: chapterIndex }),
        });
      } catch (_err) {
        // 存進度失敗不影響當下閱讀，最多下次重開這本書時進度沒更新到最新。
      }
    }

    // `landing` 同 `onFrameLoaded` 的說明：換章節時要停在第幾頁。
    function loadChapterAtPage(chapterIndex, landing) {
      const { meta } = current;
      if (chapterIndex < 0 || chapterIndex >= meta.spine.length) return;
      meta.current_chapter = chapterIndex;
      meta.progress_percent = Math.round(((chapterIndex + 1) / meta.spine.length) * 100);
      pageIndex = 0;
      pageCount = 1;
      pageMarkers = null;
      verticalPageTarget = null;
      frameEl.dataset.landing = landing;
      frameEl.src = resourceUrl(current.name, meta.spine[chapterIndex].href);
      updateToolbarText();
      saveProgress(chapterIndex);
    }

    // 換頁：`direction` 是 +1（往後一頁）或 -1（往前一頁），絕對方向（跟畫面
    // 上哪顆按鈕/哪一側對應到這個方向是分開的兩件事，見 `renderReader`／
    // 分頁 tap zone 的說明）。超出這一章的頁面範圍就換到下一章／上一章，
    // 分別停在該章的第一頁／最後一頁，翻頁翻到章節邊界時感覺是連續的。
    function turnPage(direction) {
      if (!current) return;
      const next = pageIndex + direction;
      if (next >= 0 && next < pageCount) {
        pageIndex = next;
        const doc = frameEl.contentDocument;
        if (doc && doc.defaultView) {
          scrollToPage(doc, pageIndex);
        }
        updateToolbarText();
        return;
      }
      const nextChapter = current.meta.current_chapter + direction;
      loadChapterAtPage(nextChapter, direction > 0 ? 0 : "last");
    }

    function handleZoneClick(direction) {
      if (suppressNextClick) {
        suppressNextClick = false;
        return;
      }
      turnPage(direction);
    }

    function renderReader() {
      readerView.innerHTML = "";
      const { name, meta } = current;
      const toolbar = document.createElement("div");
      toolbar.className = "ereader-toolbar";
      const backBtn = document.createElement("button");
      backBtn.textContent = "← 書架";
      backBtn.addEventListener("click", showShelf);
      titleEl = document.createElement("span");
      titleEl.className = "ereader-toolbar-title";
      const fontMinusBtn = document.createElement("button");
      fontMinusBtn.textContent = "A-";
      fontMinusBtn.title = "縮小字體";
      fontMinusBtn.addEventListener("click", () => changeFontScale(-FONT_SCALE_STEP));
      const fontPlusBtn = document.createElement("button");
      fontPlusBtn.textContent = "A+";
      fontPlusBtn.title = "放大字體";
      fontPlusBtn.addEventListener("click", () => changeFontScale(FONT_SCALE_STEP));
      const tocBtn = document.createElement("button");
      tocBtn.textContent = "目錄";
      tocBtn.title = "選擇章節";
      tocBtn.addEventListener("click", () => toggleToc());
      const prevBtn = document.createElement("button");
      prevBtn.title = "上一頁";
      prevBtn.addEventListener("click", () => turnPage(-1));
      const nextBtn = document.createElement("button");
      nextBtn.title = "下一頁";
      nextBtn.addEventListener("click", () => turnPage(1));
      toolbar.appendChild(backBtn);
      toolbar.appendChild(titleEl);
      toolbar.appendChild(fontMinusBtn);
      toolbar.appendChild(fontPlusBtn);
      toolbar.appendChild(tocBtn);
      // 直式（rtl）書翻頁習慣是從右到左，上一頁/下一頁按鈕的左右順序跟著
      // 對調（語意不變，還是「往前一頁」/「往後一頁」，只是哪個按鈕畫在
      // 左邊變了，符合直式書讀者的翻頁直覺）。符號故意不跟著「往前/往後」
      // 的語意走，而是跟著「畫面位置」走：不管橫式直式，畫在左邊的按鈕都
      // 用 `‹`、畫在右邊的都用 `›`，使用者單純憑左右位置操作，不用去記
      // 哪個符號對應哪個功能。
      if (meta.direction === "rtl") {
        nextBtn.textContent = "‹";
        prevBtn.textContent = "›";
        toolbar.appendChild(nextBtn);
        toolbar.appendChild(prevBtn);
      } else {
        prevBtn.textContent = "‹";
        nextBtn.textContent = "›";
        toolbar.appendChild(prevBtn);
        toolbar.appendChild(nextBtn);
      }

      const frameWrap = document.createElement("div");
      frameWrap.className = "ereader-frame-wrap";
      frameEl = document.createElement("iframe");
      frameEl.className = "ereader-frame";
      frameEl.setAttribute("sandbox", "allow-same-origin");
      frameEl.addEventListener("load", () => {
        const landing = frameEl.dataset.landing;
        onFrameLoaded(landing === "last" ? "last" : Number(landing) || 0);
      });
      // 點兩側翻頁：不用伸進 iframe 內部掛事件（每次換章節文件都會重來，
      // 而且 iframe 沒開 `allow-scripts`），疊在 iframe 上面兩塊透明區塊接
      // click 就好。方向跟按鈕一樣依 `direction` 對調，靠右/靠左要對應到
      // 「往後一頁」還是「往前一頁」。
      const leftZone = document.createElement("div");
      leftZone.className = "ereader-tap-zone ereader-tap-left";
      const rightZone = document.createElement("div");
      rightZone.className = "ereader-tap-zone ereader-tap-right";
      const forwardOnRight = meta.direction !== "rtl";
      leftZone.addEventListener("click", () => handleZoneClick(forwardOnRight ? -1 : 1));
      rightZone.addEventListener("click", () => handleZoneClick(forwardOnRight ? 1 : -1));
      frameWrap.appendChild(frameEl);
      frameWrap.appendChild(leftZone);
      frameWrap.appendChild(rightZone);

      // 目錄：`meta.toc`（見 `crate::plugins::ereader::build_toc`）是後端
      // 已經把 epub 自己的 `toc.ncx` 轉成「顯示名稱 + 對應到 spine 第幾章」
      // 的清單，這裡不用自己解析，直接渲染成可點的列表。疊在 `frameWrap`
      // 上面（不是整個 `readerView`），工具列本身不會被蓋住，點列表外的
      // 暗色背景可以直接關掉，不用特地找關閉鈕。
      const tocOverlay = document.createElement("div");
      tocOverlay.className = "ereader-toc-overlay";
      tocOverlay.style.display = "none";
      const tocList = document.createElement("div");
      tocList.className = "ereader-toc-list";
      tocOverlay.appendChild(tocList);
      tocOverlay.addEventListener("click", (e) => {
        if (e.target === tocOverlay) hideToc();
      });
      frameWrap.appendChild(tocOverlay);

      function renderToc() {
        tocList.innerHTML = "";
        for (const entry of meta.toc) {
          const row = document.createElement("div");
